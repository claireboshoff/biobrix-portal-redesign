<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Jobs to FreedomHub · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'jobs', back:'index.html' });
var d = BB.data, u = BB.user;
var css=''+
'.jobs-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px;align-items:start;}'+
'@media(min-width:1000px){.jobs-grid{grid-template-columns:380px minmax(0,1fr);}}'+
'.band-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 20px;background:var(--panel-2);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}'+
'.band-h:first-child{border-top:0;}'+
'.band-h b{font-size:.68rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);}'+
'.band-h span{font-size:.72rem;color:var(--faint);}'+
'.job{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 20px;border-top:1px solid var(--line-soft);cursor:pointer;transition:background .12s;border-left:3px solid transparent;}'+
'.band-h + .job{border-top:0;}'+
'.job:hover{background:#fafcf7;} .job.on{background:#f3f8ec;border-left-color:var(--green-bright);}'+
'.job .t{font-weight:600;color:var(--green-darkest);font-size:.9rem;line-height:1.35;} .job .m{font-size:.74rem;color:var(--faint);margin-top:3px;}'+
'.band-none{padding:10px 20px;font-size:.8rem;color:var(--faint);}'+
'.thread{display:flex;flex-direction:column;gap:10px;padding:18px 20px;background:var(--panel-2);}'+
'.bub{max-width:78%;padding:10px 13px;border-radius:14px;font-size:.9rem;line-height:1.5;position:relative;}'+
'.bub.me{align-self:flex-end;background:var(--green-dark);color:#eaf4d8;border-bottom-right-radius:4px;}'+
'.bub.fh{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}'+
'.bub .who{font-size:.68rem;font-weight:700;letter-spacing:.3px;opacity:.75;margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}'+
'.bub .av{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:#fff;}'+
'.sys{align-self:center;font-size:.7rem;color:var(--faint);padding:2px 10px;border-radius:20px;background:#eef2e7;}'+
'.result{align-self:stretch;border:1px solid var(--green-bright);background:#f7fbf0;border-radius:12px;padding:12px 14px;}'+
'.result .eyebrow{margin-bottom:3px;display:flex;align-items:center;gap:6px;} .result .eyebrow .ico{width:14px;height:14px;}'+
'.composer{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);border-radius:0 0 var(--radius) var(--radius);align-items:flex-end;}'+
'@media(max-width:900px){.composer{bottom:76px;}}'+
'.composer textarea{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.9rem;resize:vertical;outline:none;}'+
'.composer textarea:focus{border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(104,165,62,.15);}'+
'.pane-empty{padding:56px 20px;text-align:center;color:var(--faint);font-size:.88rem;}'+
'.pane-empty .ico{width:30px;height:30px;margin-bottom:10px;color:var(--green-mid);}'+
'@media(max-width:560px){.job,.band-h,.band-none{padding-left:14px;padding-right:14px;} .thread{padding:14px;} .composer{padding:10px 14px;} .bub{max-width:90%;}}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

var openId = null, composing=false;
function av(id){ var p=d.person(id); return '<span class="av" style="background:'+p.colour+';">'+String(p.name||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase()+'</span>'+BB.esc(p.name); }
function render(){
  var jobs=d.all('jobs').slice().sort(function(a,b){ return (b.created||'').localeCompare(a.created||''); });
  var bands=[ {k:'needs', t:'Needs you', hint:'waiting on your answer'}, {k:'flight', t:'In flight', hint:'being built now'}, {k:'shipped', t:'Shipped', hint:'done and live'} ];
  var cnt=function(k){ return jobs.filter(function(j){return j.band===k;}).length; };
  var html='';
  html+='<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Requests &amp; changes</div><h1>Jobs to FreedomHub</h1><p>Anything you want changed, fixed or added — a button, a report, a whole new section — write it here. The team builds it, keeps you posted in the thread, and it ships into this portal.</p></div>'+
    '<div class="row"><button class="btn" id="newJob">'+BB.icon('plus')+'New job</button></div></div>';
  html+='<div class="grid g3" style="margin-top:14px;">'+
    '<div class="stat'+(cnt('needs')?' warn':'')+'"><div class="l">Needs you</div><div class="v">'+cnt('needs')+'</div><div class="s">a question from the team</div></div>'+
    '<div class="stat"><div class="l">In flight</div><div class="v">'+cnt('flight')+'</div><div class="s">being built now</div></div>'+
    '<div class="stat"><div class="l">Shipped</div><div class="v">'+cnt('shipped')+'</div><div class="s">done and live</div></div>'+
  '</div>';
  html+='<div class="jobs-grid"><div class="card"><div class="card-h"><div><h3>Requests</h3><div class="sub">tap one to open its thread</div></div><span class="badge b-grey">'+jobs.length+'</span></div>';
  bands.forEach(function(b){
    var list=jobs.filter(function(j){return j.band===b.k;});
    html+='<div class="band-h"><b>'+b.t+' · '+list.length+'</b><span>'+b.hint+'</span></div>';
    if(!list.length) html+='<div class="band-none">Nothing here.</div>';
    list.forEach(function(j){ html+='<div class="job'+(openId===j.id?' on':'')+'" data-job="'+j.id+'" role="button" tabindex="0"><div style="min-width:0;"><div class="t">'+BB.esc(j.title)+'</div><div class="m">'+BB.esc(d.person(j.by).name)+' · '+BB.date(j.created)+' · '+j.msgs.length+' message'+(j.msgs.length===1?'':'s')+'</div></div>'+BB.statusBadge(j.status)+'</div>'; });
  });
  html+='</div><div id="pane">';
  if(composing){
    html+='<div class="card"><div class="card-h"><div><h3>New job</h3><div class="sub">one job is one conversation with the team</div></div></div><div class="card-p">'+
      '<div class="fld"><label for="jTitle">What do you need?</label><input id="jTitle" placeholder="e.g. Add a column for delivery cost on the orders page"></div>'+
      '<div class="fld"><label for="jBrief">Tell us a bit more</label><textarea id="jBrief" rows="5" placeholder="What should it do, who uses it, what does it need to show…"></textarea></div>'+
      '<div class="row" style="gap:8px;"><button class="btn" id="sendJob">'+BB.icon('check')+'Send to FreedomHub</button><button class="btn ghost" id="cancelJob">Cancel</button></div>'+
      '<div class="faint" style="font-size:.76rem;margin-top:10px;">You’ll get a reply in the thread; we only ping you when we need an answer.</div></div></div>';
  } else if(openId){
    var j=d.by('jobs', openId);
    if(j){
      html+='<div class="card"><div class="card-h" style="align-items:flex-start;"><div style="min-width:0;flex:1;"><h3 style="font-size:1.05rem;">'+BB.esc(j.title)+'</h3><div class="sub" style="font-size:.8rem;margin-top:3px;">'+BB.esc(j.brief)+'</div></div>'+BB.statusBadge(j.status)+'</div>';
      html+='<div class="thread">';
      html+='<div class="sys">job opened · '+BB.date(j.created)+'</div>';
      j.msgs.forEach(function(m){ var mine=m.from!=='fh'; html+='<div class="bub '+(mine?'me':'fh')+'"><div class="who">'+av(m.from)+' · '+BB.esc(m.at)+'</div>'+BB.esc(m.text)+'</div>'; });
      if(j.result) html+='<div class="result"><div class="eyebrow">'+BB.icon('check')+'What you got</div><div style="font-size:.9rem;">'+BB.esc(j.result)+'</div></div>';
      if(j.band==='shipped') html+='<div class="sys">shipped · reply to reopen this job</div>';
      html+='</div>';
      html+='<div class="composer"><textarea id="reply" aria-label="Reply" placeholder="'+(j.band==='needs'?'Answer the team…':'Add to this job…')+'"></textarea><button class="btn" id="sendReply">Send</button></div></div>';
    }
  } else {
    html+='<div class="card"><div class="pane-empty">'+BB.icon('message')+'<div>Pick a job on the left, or start a new one.</div></div></div>';
  }
  html+='</div></div><div style="height:24px;"></div>';
  document.querySelector('main.wrap').innerHTML=html; wire();
}
// On a phone the pane sits below the list — bring it into view when it changes.
function toPane(){ try{ if(window.matchMedia('(max-width:999px)').matches){ var p=document.getElementById('pane'); if(p) p.scrollIntoView({behavior:'smooth',block:'start'}); } }catch(e){} }
function stamp(){ var n=new Date(); return n.toISOString().slice(0,10)+' '+n.toTimeString().slice(0,5); }
function wire(){
  document.querySelectorAll('.job[data-job]').forEach(function(el){ el.onclick=function(){ openId=this.dataset.job; composing=false; render(); toPane(); }; el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.click(); } }; });
  var nb=document.getElementById('newJob'); if(nb) nb.onclick=function(){ composing=true; openId=null; render(); toPane(); setTimeout(function(){ var t=document.getElementById('jTitle'); if(t) t.focus(); },50); };
  var cj=document.getElementById('cancelJob'); if(cj) cj.onclick=function(){ composing=false; render(); };
  var sj=document.getElementById('sendJob'); if(sj) sj.onclick=function(){
    var t=document.getElementById('jTitle').value.trim(), b=document.getElementById('jBrief').value.trim(); if(!t){ BB.toast('Give the job a title'); return; }
    var rec=d.add('jobs',{ title:t, brief:b, by:u.id, created:new Date().toISOString().slice(0,10), status:'In flight', band:'flight', result:null, msgs:[{ from:u.id, at:stamp(), text:b||t }, { from:'fh', at:stamp(), text:'Got it — picked up. We’ll reply here if we need anything, and again when it ships.' }] });
    composing=false; openId=rec.id; BB.toast('Sent to FreedomHub — it’s in flight'); render();
  };
  var sr=document.getElementById('sendReply'); if(sr) sr.onclick=function(){
    var j=d.by('jobs', openId); var txt=document.getElementById('reply').value.trim(); if(!j||!txt) return;
    var msgs=j.msgs.slice(); msgs.push({ from:u.id, at:stamp(), text:txt });
    var patch={ msgs:msgs }; if(j.band==='needs'){ patch.band='flight'; patch.status='In flight'; msgs.push({ from:'fh', at:stamp(), text:'Thanks — that’s what we needed. Back in flight.' }); } if(j.band==='shipped'){ patch.band='flight'; patch.status='In flight'; }
    d.update('jobs', j.id, patch); BB.toast('Sent'); render();
  };
}
document.body.insertAdjacentHTML('beforeend','<main class="wrap"></main>');
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
