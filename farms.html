<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Farms &amp; farmers · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign4"></script><script src="guard.js?v=redesign4"></script>
<script src="bb-data.js?v=redesign4"></script>
<script src="bb-shell.js?v=redesign4"></script>
<style>
/* Farms register — page-scoped */
.wa{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:8px;background:#e9f9ef;color:#128C4A;border:1px solid #bfe8cf;white-space:nowrap;}
.wa .ico{width:15px;height:15px;}
.wa:hover{filter:brightness(.96);}
table.bb td.farm .cell{display:block;font-size:.72rem;white-space:nowrap;}
.wa.tel{background:#eef2e7;color:var(--muted);border-color:var(--line);font-weight:600;}
.cropchip{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef6dc;color:var(--green-mid);font-size:.68rem;font-weight:600;margin:1px 2px 1px 0;white-space:nowrap;}
.repchip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;white-space:nowrap;background:none !important;border:0;color:var(--ink) !important;}
.repdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.tb-l{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 4px;}
.filterbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;}
.filterbar .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.backline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;}
.backline .btn .ico{transform:rotate(180deg);}
table.bb td.farm{min-width:160px;}
table.bb td.farm b{display:block;}
table.bb td.crops{min-width:120px;}
table.bb td.drive{min-width:170px;}
table.bb th,table.bb td{padding-left:12px;padding-right:12px;}
table.bb td.drive .badge{white-space:normal;line-height:1.35;}
.scroll.tall{max-height:760px;}
table.bb .bar-cell{justify-content:flex-end;min-width:110px;}
table.bb .bar-cell .trk{max-width:44px;}
table.bb .bar-cell{min-width:90px;}
table.bb .bar-cell span:last-child{min-width:42px;text-align:right;}
.over{color:var(--red);font-weight:700;}
.empty .big .ico{width:30px;height:30px;color:var(--faint);}
/* popups: a farm's record over the page */
.pp-res{font-size:.76rem;line-height:1.35;}
.bbp-meta .mwa{margin-left:10px;display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;background:#e9f9ef;color:#128C4A !important;border:1px solid #bfe8cf;font-size:.72rem;font-weight:600;}
.bbp-meta .mwa .ico{width:12px;height:12px;}
@media(max-width:560px){ .tb-sep{display:none;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';

var all = d.all('farmers');

// advisor defaults to their own farms; can flip to all
var scope = isAdvisor ? 'mine' : 'all';
// Region and rep used to be chips above the register; the funnel on those columns does that now.

function esc(s){ return BB.esc(s); }
function repChip(r){
  return '<span class="repchip" style="background:'+r.colour+'18;border-color:'+r.colour+';color:'+r.colour+';">'+
    '<span class="repdot" style="background:'+r.colour+';"></span>'+esc(r.name)+'</span>';
}

// ---- popups: a farm's record, its account and its blocks, over the page ----
function canGo(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } }
function farmHref(id){ return 'farm-detail.html?farmer='+encodeURIComponent(id); }
function owingOf(i){ return i.outstanding!=null ? (+i.outstanding||0) : (+i.amount||0); }
function openInvoices(id){
  return d.where('invoices', function(i){ return i.farmer===id && i.status!=='Paid' && owingOf(i)!==0; })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
}
// a small table inside a popup; rows with href open that page
function ppTable(cols, rows, num, foot){
  num=num||[];
  var td=function(c,i){ return '<td'+(num.indexOf(i)>=0?' class="num"':'')+'>'+c+'</td>'; };
  return '<div class="scroll"><table class="bb" data-nofilter="1"><thead><tr>'+cols.map(function(c,i){ return '<th'+(num.indexOf(i)>=0?' class="num"':'')+'>'+esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr'+(r.href?' class="click" data-href="'+esc(r.href)+'"':'')+'>'+r.cells.map(td).join('')+'</tr>'; }).join('')+
    '</tbody>'+(foot?'<tfoot><tr>'+foot.map(td).join('')+'</tr></tfoot>':'')+'</table></div>';
}
// ---- record cards (CONVENTIONS: "Record popups: the card pattern") ----
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
function waHref(f){ return 'https://wa.me/'+String(f.cell).replace(/\D/g,'').replace(/^0/,'27')+'?text='+encodeURIComponent('Hi '+String(f.name).split(' ')[0]+', it\'s '+String(u.name).split(' ')[0]+' from BioBrix — '); }
// the phone line: the number calls, the pill opens WhatsApp
function phoneMeta(f){
  if(!f.cell) return { icon:'phone', text:'No number on the account', muted:true, tip:'Phone' };
  return { icon:'phone', tip:'Phone', html:'<a href="tel:'+esc(String(f.cell).replace(/\s/g,''))+'">'+esc(f.cell)+'</a><a class="mwa" target="_blank" rel="noopener" href="'+esc(waHref(f))+'">'+BB.icon('message')+'WhatsApp</a>' };
}
function repMeta(f){
  if(!f.rep) return { icon:'user', text:'No rep allocated', muted:true, tip:'Rep' };
  if(isAdvisor && f.rep===u.rep) return null;
  var r=d.rep(f.rep); return { initials:initialsOf(r.name), color:r.colour, text:r.name, tip:'Rep' };
}
function invoicesHtml(id){
  var inv=openInvoices(id), f=d.farmer(id);
  if(!inv.length) return '<div class="bbp-tt">Open invoices</div><div class="faint" style="font-size:.82rem;">'+
    (f.sageBalance!=null && f.sageBalance>0 ? 'No open invoice lines here — the balance is as your accounting system reports it.' : 'No open invoices.')+'</div>';
  var tot=inv.reduce(function(t,i){ return t+owingOf(i); },0);
  return '<div class="bbp-tt">Open invoices · '+inv.length+'</div>'+ppTable(['Invoice','Due','Status','Owing'],
    inv.slice(0,8).map(function(i){ return { cells:['<b style="white-space:nowrap;">'+esc(i.label||i.ref||'—')+'</b>'+(i.description && i.description!==(i.label||i.ref)?'<div class="faint" style="font-size:.72rem;">'+esc(i.description)+'</div>':''),
      i.dueDate?'<span style="white-space:nowrap;">'+BB.shortDate(i.dueDate)+'</span>':'—', BB.statusBadge(i.status||'Outstanding'), BB.money(owingOf(i))] }; }), [3],
    inv.length>1? [inv.length>8?'All '+inv.length:'Total','','','<b>'+BB.money(tot)+'</b>'] : null);
}
function blocksHtml(id){
  var blocks=d.where('blocks', function(b){ return b.farmer===id; });
  if(!blocks.length) return '<div class="bbp-tt">Blocks</div><div class="faint" style="font-size:.82rem;">No blocks captured yet.</div>';
  var latest=function(t,bid){ return d.where(t, function(x){ return x.block===bid; }).sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); })[0]; };
  return '<div class="bbp-tt">Blocks · latest results</div>'+ppTable(['Block','Ha','Soil','Leaf'], blocks.map(function(b){
    var s=latest('soil',b.id), l=latest('leaf',b.id);
    var res=function(x){ return x ? '<div class="pp-res">'+(x.status==='Interpreted'? esc(x.flag||'Interpreted') : '<span class="faint">'+esc(String(x.status||'').toLowerCase())+'</span>')+'</div>' : '<span class="faint">—</span>'; };
    return { cells:['<b>'+esc(b.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.crop||'')+'</div>', BB.num(b.ha||0), res(s), res(l)],
      href: canGo('bioanalyze-soil.html') ? 'bioanalyze-soil.html?block='+encodeURIComponent(b.id) : null };
  }), [1]);
}
// one farm as a record card: who and where on the left with the account in four figures; invoices and blocks on the right
function farmPreview(id){
  var f=d.by('farmers', id); if(!f) return null;
  var ti=d.tripInsight(id);
  var nBlocks=d.where('blocks', function(b){ return b.farmer===id; }).length;
  var place=[f.town, f.region].filter(function(x){ return x && String(x).trim(); }).join(', ');
  var alert=(ti.sev==='bad'||ti.sev==='warn')? '<div class="bbp-alert'+(ti.sev==='bad'?'':' warn')+'">'+BB.icon('alert')+esc(ti.verdict)+'</div>' : '';
  return {
    wide:true, layout:'split', color:null, sub:null, eyebrow:'Farm', title:f.farm, tags:BB.farmBadge(f)+BB.sampleChip(f),
    meta:[
      f.name && f.name!==f.farm? { icon:'user', text:f.name, tip:'Farmer' } : null,
      phoneMeta(f),
      place? { icon:'map', text:place, tip:'Town · region' } : null,
      (f.crops||[]).length? { icon:'sprout', text:f.crops.join(', '), tip:'Crops' } : null,
      repMeta(f)
    ],
    stats:[
      { l:'Balance', v:BB.money(ti.balance), s:ti.limit? 'limit '+BB.money(ti.limit) : 'no limit set', cls:ti.overdue?'bad':(ti.sev==='warn'?'warn':'') },
      { l:'Credit open', v:ti.limit? BB.money(Math.max(0,ti.available)) : '—', s:ti.limit? Math.min(999,Math.round(Math.max(0,ti.balance)/ti.limit*100))+'% used' : 'no credit terms' },
      { l:'Pipeline', v:BB.money(ti.openPipeline), s:'forecast + pending' },
      { l:'Hectares', v:f.ha? BB.num(f.ha) : '—', s:nBlocks+' block'+(nBlocks===1?'':'s') }
    ],
    html: alert+invoicesHtml(id)+blocksHtml(id),
    actions: canGo('farm-detail.html') ? [{ label:'Farm record', href:farmHref(id), primary:true }] : []
  };
}
function openFarm(id){ var p=farmPreview(id); if(p) BB.popup(p); }
function toRegister(){ BB.closePopup(); var el=document.getElementById('farmReg'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
// the farms behind a figure, as a popup table (a row opens that farm's card)
function farmList(list, cols, cellsOf, num){
  return { sub:null, table:{ columns:cols, rows:list.map(function(f){ return { cells:cellsOf(f), onClick:function(){ openFarm(f.id); } }; }), num:num||[] } };
}
var TILE = {};
BB.statDetail('farmsOwed', function(){
  var list=(TILE.owed||[]).slice().sort(function(a,b){ return (d.accountBalance(b.id)||0)-(d.accountBalance(a.id)||0); });
  var tot=list.reduce(function(t,f){ return t+Math.max(0,d.accountBalance(f.id)||0); },0);
  var over=list.filter(function(f){ return d.creditLimit(f.id)>0 && d.accountBalance(f.id)>d.creditLimit(f.id); }).length;
  var acts=[{ label:'Open the full list', primary:true, onClick:toRegister }];
  if(over && BB.sageLive() && new URLSearchParams(location.search).get('show')!=='overlimit') acts.push({ label:'Over their limit', href:'farms.html?show=overlimit' });
  return Object.assign(farmList(list, ['Farm','Limit','Balance'], function(f){
      var bal=d.accountBalance(f.id)||0, lim=d.creditLimit(f.id)||0;
      return [{ html:'<b>'+esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+esc(f.name)+'</div>' }, lim? BB.money(lim) : '—', { html:'<span class="'+(lim&&bal>lim?'over':'')+'">'+BB.money(bal)+'</span>' }];
    }, [1,2]), { stats:[{ l:'Outstanding', v:BB.money(tot), s:list.length+' farm'+(list.length===1?'':'s') }, { l:'Over their limit', v:String(over), cls:over?'warn':'' }], actions:acts });
});
BB.statDetail('farmsCall', function(){
  var list=TILE.call||[];
  return Object.assign(farmList(list, ['Farm','Before you drive','Balance'], function(f){
      var t=d.tripInsight(f.id);
      return [{ html:'<b>'+esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+esc(f.name)+(f.cell?' · '+esc(f.cell):'')+'</div>' }, { html:'<span class="badge b-'+t.sev+'">'+esc(t.verdict)+'</span>' }, BB.money(t.balance)];
    }, [2]), { actions:[{ label:'Open the full list', primary:true, onClick:toRegister }] });
});

function visible(){
  var rows = all.slice();
  if(isAdvisor && scope==='mine') rows = rows.filter(function(f){ return f.rep===u.rep; });
  return rows.sort(function(a,b){ return String(a.farm).localeCompare(String(b.farm)); });
}

function statBar(rows){
  var active = rows.filter(function(f){ return f.status==='Active'; }).length;
  var prospect = rows.filter(function(f){ return f.status==='Prospect'; }).length;
  var ha = rows.reduce(function(s,f){ return s+(f.ha||0); },0);
  var withHa = rows.filter(function(f){ return f.ha; }).length;
  var owed = rows.reduce(function(s,f){ return s+Math.max(0, d.accountBalance(f.id)||0); },0);
  var over = rows.filter(function(f){ return d.creditLimit(f.id)>0 && d.accountBalance(f.id) > d.creditLimit(f.id); }).length;
  var callList = rows.filter(function(f){ var t=d.tripInsight(f.id); return t.sev==='bad' || t.sev==='warn'; }), callFirst = callList.length;
  TILE = { owed: rows.filter(function(f){ return (d.accountBalance(f.id)||0)>0; }), call: callList };
  var html='<div class="grid g4" style="margin-top:12px;">';
  html += '<div class="stat"><div class="l">Farms shown</div><div class="v">'+rows.length+'</div><div class="s">'+active+' active · '+prospect+' prospect</div></div>';
  html += '<div class="stat"><div class="l">Hectares</div><div class="v">'+BB.num(ha)+'</div><div class="s">'+(withHa? 'under management · '+withHa+' farm'+(withHa===1?'':'s')+' captured' : 'not captured yet')+'</div></div>';
  html += '<a class="stat tap'+(over?' warn':'')+'" href="#farmReg" data-detail="farmsOwed"><div class="l">Outstanding</div><div class="v">'+BB.money(owed)+'</div><div class="s">'+over+' over their credit limit</div></a>';
  html += '<a class="stat tap'+(callFirst?' warn':'')+'" href="#farmReg" data-detail="farmsCall"><div class="l">Call before you drive</div><div class="v">'+callFirst+'</div><div class="s">overdue, over or near the limit</div></a>';
  html += '</div>';
  return html;
}

function render(){
  var rows = visible();
  // deep links from the home screen tiles
  var show=(new URLSearchParams(location.search).get('show')||'').toLowerCase();
  if(show==='overlimit') rows = rows.filter(function(f){ return d.creditLimit(f.id)>0 && d.accountBalance(f.id) > d.creditLimit(f.id); });
  else if(show==='accounts') rows = rows.filter(function(f){ return !BB.isSample(f); });
  var nSample = rows.filter(function(f){ return BB.isSample(f); }).length;
  // twelve months of invoicing per customer, straight from the ledger
  function invoiced12(farmerId){
    var since=new Date(); since.setMonth(since.getMonth()-12); var cut=since.toISOString().slice(0,10);
    return d.where('invoices', function(i){ return i.farmer===farmerId && i.kind!=='opening' && (i.date||'')>=cut; })
            .reduce(function(t,i){ return t+(i.amount||0); },0);
  }
  var html='';
  if(show) html += '<div class="backline"><a class="btn ghost sm" href="farms.html">'+BB.icon('chevron')+'All farms &amp; customers</a><span class="faint" style="font-size:.8rem;">'+(show==='overlimit'?'Showing accounts over their credit limit':'Showing customers from your accounting system')+' — '+rows.length+'</span></div>';
  html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">BioServices · Register</div><h1>Farms &amp; farmers</h1><p>'+
    (isAdvisor?'Your farms — tap through to a farmer to see their blocks, soil, leaf and programmes.'
              :'Every farm under management. Tap a farmer to open their record: blocks, diagnostics and programmes.')+'</p></div>'+
    '<div class="row" style="gap:8px;"><a class="btn ghost" href="bioservices.html">'+BB.icon('sprout')+'BioServices</a>'+
    (BB.sageLive()?'<a class="btn ghost" href="farms.html?show=overlimit">'+BB.icon('alert')+'Over their limit</a>':'')+'</div></div>';
  // Say plainly which of these are the client's own records and which are ours.
  if(BB.sageLive()){
    html += '<div class="bb-sample"><span class="t">Read this first</span><div>The customer records here come straight from <b>your accounting system</b> — names, towns and account balances are yours and are refreshed three times a day. '+
      'Crops, hectares, blocks, soil and leaf results are <b>not</b> in your accounting system, so they are blank until they are captured here. '+
      (nSample? 'The '+nSample+' rows marked <span class="chip-sample">Sample</span> are our demonstration farms, not yours.' : '')+'</div></div>';
  }

  html += statBar(rows);

  // The picture: who is using their credit, and where the farms are
  var credRows = rows.map(function(f){ return { f:f, bal:d.accountBalance(f.id)||0, lim:d.creditLimit(f.id)||0 }; })
    .filter(function(x){ return x.bal>0 || x.lim>0; })
    .sort(function(a,b){ return b.bal-a.bal || b.lim-a.lim; }).slice(0,8);
  var regCount = {};
  rows.forEach(function(f){ var k=f.region||'Region not captured'; regCount[k]=(regCount[k]||0)+1; });
  var regKeys = Object.keys(regCount).sort(function(a,b){ return regCount[b]-regCount[a]; });
  var regRows = regKeys.slice(0,5).map(function(k){ return {label:k, value:regCount[k], keys:[k]}; });
  if(regKeys.length>5) regRows.push({ label:'Other regions', value:regKeys.slice(5).reduce(function(t,k){ return t+regCount[k]; },0), keys:regKeys.slice(5) });
  var COLS = ['#3f6b28','#c77d17','#2f6f9e','#7d4f9a','#68a53e','#a3533f'];
  regRows.forEach(function(r,i){ r.color=COLS[i%COLS.length]; });
  // one region is not a breakdown — show the farms' hectares instead
  var byRegion = regRows.length>=2;
  var haRows = rows.filter(function(f){ return f.ha; }).sort(function(a,b){ return b.ha-a.ha; }).slice(0,8);

  if(rows.length){
    html += '<div class="split" style="margin-top:16px;">'+
      '<div class="card"><div class="card-h"><div><h3>Balances against credit limit</h3><div class="sub">largest balances in view · what is owed, what is still open'+(credRows.length===8?' · top 8':'')+'</div></div>'+BB.liveChip()+'</div>'+
        '<div class="card-p">'+(credRows.length?'<div id="chCredit"></div>':'<div class="empty" style="padding:20px;">No balances or credit limits on these accounts.</div>')+'</div></div>'+
      (byRegion
        ? '<div class="card"><div class="card-h"><div><h3>Farms by region</h3><div class="sub">'+rows.length+' in view</div></div></div><div class="card-p"><div id="chRegion"></div></div></div>'
        : '<div class="card"><div class="card-h"><div><h3>Hectares by farm</h3><div class="sub">'+(haRows.length?'captured hectares · '+rows.length+' in view':'not captured yet')+'</div></div></div><div class="card-p">'+(haRows.length?'<div id="chRegion"></div>':'<div class="empty" style="padding:20px;">Hectares are captured on the farm record.</div>')+'</div></div>')+
    '</div>';
  }

  // scope — an advisor's own farms or everyone's; region, rep, status… are the funnels on the register.
  // A seat that can only ever see its own farms gets no toggle: both sides would show the same list.
  if(isAdvisor && d.all('farmers').some(function(f){ return f.rep!==u.rep; })){
    html += '<div class="toolbar"><div class="filterbar"><div class="seg">'+
      '<button class="'+(scope==='mine'?'on':'')+'" data-scope="mine">My farms</button>'+
      '<button class="'+(scope==='all'?'on':'')+'" data-scope="all">All farms</button>'+
    '</div></div></div>';
  }

  // table
  var maxHa = Math.max.apply(null, rows.map(function(f){ return f.ha||0; }).concat([1]));
  // The 12-month invoiced figure only exists for customers out of the accounting system.
  var hasLedger = rows.some(function(f){ return f.sageId!=null; });
  var nCols = hasLedger ? 11 : 10;
  var totHa = rows.reduce(function(s,f){ return s+(f.ha||0); },0);
  html += '<div class="card" id="farmReg" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>'+(show==='overlimit'?'Over their credit limit':show==='accounts'?'Customer accounts':'Farm register')+'</h3><div class="sub">tap a row for the farm at a glance · filter any column with its funnel</div></div><span class="badge b-grey">'+rows.length+' farm'+(rows.length===1?'':'s')+'</span></div>'+
    '<div class="scroll tall"><table class="bb"><thead><tr>'+
    '<th>Farm / farmer</th><th>Contact</th><th>Town</th><th>Region</th><th>Crops</th><th class="num">Ha</th>'+(hasLedger?'<th class="num">Invoiced</th>':'')+'<th class="num">Balance</th><th>Rep</th><th>Status</th><th>Before you drive</th></tr></thead><tbody>';

  if(!rows.length){
    // An advisor with nothing allocated is the common case here, and "no match" would be a lie.
    var sgF = d.sage && d.sage(), noneAllocated = sgF && sgF.live && !(sgF.customers||[]).length && BB.user.roleKey==='advisor';
    html += '<tr><td colspan="'+nCols+'"><div class="empty"><div class="big">'+BB.icon('farm')+'</div>'+
      (noneAllocated
        ? '<b>No accounts are allocated to you yet.</b><br>Your accounting system is connected, but none of its customers are marked as yours. Whoever looks after the accounts can allocate them in <b>Sales → By customer</b>.'
        : 'No farms match these filters.')+'</div></td></tr>';
  }

  rows.forEach(function(f){
    var r=d.rep(f.rep);
    var crops=(f.crops||[]).map(function(c){ return '<span class="cropchip">'+esc(c)+'</span>'; }).join('');
    var bal=d.accountBalance(f.id)||0, lim=d.creditLimit(f.id)||0, isOver = lim>0 && bal>lim;
    html += '<tr class="click" data-id="'+esc(f.id)+'">'+
      '<td class="farm"><b>'+esc(f.farm)+BB.sampleChip(f)+'</b><span class="faint" style="font-size:.78rem;">'+esc(f.name)+'</span>'+(f.cell?'<span class="faint cell">'+esc(f.cell)+'</span>':'')+'</td>'+
      '<td><div class="row" style="gap:6px;flex-wrap:nowrap;">'+(f.cell?'<a class="wa" href="https://wa.me/'+esc(String(f.cell).replace(/\D/g,'').replace(/^0/,'27'))+'?text='+encodeURIComponent('Hi '+String(f.name).split(' ')[0]+', it\'s '+String(u.name).split(' ')[0]+' from BioBrix — ')+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="WhatsApp '+esc(f.name)+'" aria-label="WhatsApp '+esc(f.name)+'">'+BB.icon('message')+'</a><a class="wa tel" href="tel:'+esc(String(f.cell).replace(/\s/g,''))+'" onclick="event.stopPropagation()" title="Call '+esc(f.cell)+'" aria-label="Call '+esc(f.name)+'">'+BB.icon('phone')+'</a>':'<span class="faint">no number</span>')+'</div></td>'+
      '<td>'+(f.town? esc(f.town) : '<span class="faint">—</span>')+'</td>'+
      '<td>'+(f.region? esc(f.region) : '<span class="faint">—</span>')+'</td>'+
      '<td class="crops">'+(crops||(f.sageId? '<span class="faint">not captured</span>':'<span class="faint">—</span>'))+'</td>'+
      '<td class="num">'+(f.ha? '<div class="bar-cell"><span class="trk"><i style="width:'+Math.round(f.ha/maxHa*100)+'%"></i></span><span>'+BB.num(f.ha)+'</span></div>' : '<span class="faint">—</span>')+'</td>'+
      // for a customer out of the accounting system, what they are worth is the useful column
      (hasLedger? '<td class="num">'+(f.sageId!=null ? '<b>'+BB.money(invoiced12(f.id))+'</b><div class="faint" style="font-size:.7rem;">last 12 months</div>' : '<span class="faint">—</span>')+'</td>' : '')+
      '<td class="num">'+(bal||lim ? '<span class="'+(isOver?'over':'')+'">'+BB.money(bal)+'</span>'+(lim?'<div class="faint" style="font-size:.7rem;">limit '+BB.money(lim)+'</div>':'') : '<span class="faint">—</span>')+'</td>'+
      '<td>'+(f.rep? repChip(r) : '<span class="faint">not allocated</span>')+'</td>'+
      '<td>'+BB.farmBadge(f)+'</td>'+
      (function(){ var t=d.tripInsight(f.id); return '<td class="drive"><span class="badge b-'+t.sev+'" title="Balance '+BB.money(t.balance)+' · limit '+BB.money(t.limit)+'">'+esc(t.verdict)+'</span>'+(t.limit?'<div class="faint" style="font-size:.7rem;margin-top:3px;">'+BB.money(Math.max(0,t.available))+' credit open'+(t.openPipeline?' · '+BB.money(t.openPipeline)+' in pipeline':'')+'</div>':'')+'</td>'; })()+
    '</tr>';
  });

  html += '</tbody>';
  if(rows.length>1) html += '<tfoot><tr><td colspan="5">'+rows.length+' farms</td><td class="num">'+(totHa?BB.num(totHa):'—')+'</td>'+(hasLedger?'<td></td>':'')+'<td class="num">'+BB.money(rows.reduce(function(s,f){ return s+Math.max(0,d.accountBalance(f.id)||0); },0))+'</td><td colspan="3"></td></tr></tfoot>';
  html += '</table></div></div>';
  html += '<div style="height:20px;"></div>';

  document.getElementById('farmMain').innerHTML=html;
  bind();

  // charts — balances and limits as the store reports them; counts by region
  try{
    if(credRows.length) BB.chart.hbar('#chCredit', { money:true,
      rows: credRows.map(function(x){
        var owedIn = x.lim? Math.min(x.bal, x.lim) : x.bal, overBy = x.lim? Math.max(0, x.bal-x.lim) : 0, open = x.lim? Math.max(0, x.lim-x.bal) : 0;
        return { id:x.f.id, label:x.f.farm, sub:x.lim? 'limit '+BB.money(x.lim) : 'no limit set', href:'farm-detail.html?farmer='+encodeURIComponent(x.f.id),
          display: BB.money(x.bal)+(overBy? ' · '+BB.money(overBy)+' over' : ''),
          parts:[{name:'Owed', value:owedIn, color:'#3f6b28'},{name:'Over the limit', value:overBy, color:'#b8382a'},{name:'Credit still open', value:open, color:'#cfe0b8'}] };
      }),
      legend:[{name:'Owed', color:'#3f6b28'},{name:'Over the limit', color:'#b8382a'},{name:'Credit still open', color:'#cfe0b8'}],
      openLabel:'Open full record',
      // that customer's card: the account, the invoices still open on it
      detail:function(ctx){ return farmPreview(ctx.row.id); } });
  }catch(e){ console.warn('chart', e); }
  try{
    if(rows.length && byRegion) BB.chart.donut('#chRegion', { rows:regRows, centreLabel:'farms', valueLabel:'Farms',
      // the farms in that region
      detail:function(ctx){
        var keys=ctx.row.keys||[ctx.row.label];
        var list=rows.filter(function(f){ return keys.indexOf(f.region||'Region not captured')>=0; });
        var bal=list.reduce(function(t,f){ return t+Math.max(0,d.accountBalance(f.id)||0); },0), ha=list.reduce(function(t,f){ return t+(f.ha||0); },0);
        return Object.assign(farmList(list, ['Farm','Town','Status','Balance'], function(f){
            return [{ html:'<b>'+esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+esc(f.name)+'</div>' }, f.town||'—', { html:BB.farmBadge(f) }, BB.money(d.accountBalance(f.id)||0)];
          }, [3]), { sub:keys.length>1? keys.join(' · ') : null, color:null,
          stats:[{ l:'Farms', v:String(list.length), s:Math.round(list.length/(rows.length||1)*100)+'% of '+rows.length+' in view' }, { l:'Hectares', v:ha? BB.num(ha) : '—' }, { l:'Outstanding', v:BB.money(bal) }] });
      } });
    else if(rows.length && haRows.length) BB.chart.hbar('#chRegion', { fmt:function(v){ return BB.num(v)+' ha'; }, valueLabel:'Hectares', openLabel:'Open full record',
      rows: haRows.map(function(f){ return { id:f.id, label:f.farm, value:f.ha, color:'#68a53e', href:'farm-detail.html?farmer='+encodeURIComponent(f.id) }; }),
      detail:function(ctx){ return farmPreview(ctx.row.id); } });
  }catch(e){ console.warn('chart', e); }
}

function bind(){
  var main=document.getElementById('farmMain');
  Array.prototype.forEach.call(main.querySelectorAll('[data-scope]'), function(c){
    c.onclick=function(){ scope=this.dataset.scope; render(); };
  });
  // a row shows the farm at a glance; the full record is one tap further
  Array.prototype.forEach.call(main.querySelectorAll('tr.click[data-id]'), function(row){
    row.onclick=function(e){ if(e.target.closest('a,button')) return; var p=farmPreview(this.dataset.id); if(p) BB.popup(p); else location.href=farmHref(this.dataset.id); };
  });
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="farmMain"></div></main>');
render();
window.addEventListener('bb:sage', function(){ render(); });

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
