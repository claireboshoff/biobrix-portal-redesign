<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Orders · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'sales', back:'index.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';
var canAdvance = u.roleKey==='director' || u.roleKey==='operations';

var css=''+
'.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px;}'+
'.op-badges{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;}'+
'.op-meta{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0 2px;font-size:.8rem;color:var(--faint);}'+
'.op-adv{display:flex;align-items:center;gap:8px;} .op-adv .bb-sel{min-width:170px;}'+
'.op-hold{font-size:.8rem;color:var(--red);margin:-4px 0 10px;}'+
'.qp{margin-top:12px;padding:12px 14px;border-radius:11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--green-bright);}'+
'.qp .row.between{gap:12px;} .qp .btn{white-space:nowrap;}'+
'.card-h .chips{margin:0;gap:6px;}'+
'.rep{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;white-space:nowrap;} .rep i{width:8px;height:8px;border-radius:50%;flex:none;}'+
'@media(max-width:700px){#ordMain table.bb tbody td{white-space:nowrap;}}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

var STATUSES = ['Forecast','Pending','Confirmed','Awaiting stock','Delivered'];
var canInvoiceRole = u.roleKey==='director' || u.roleKey==='operations';
var canInvoice = true; // decided per order in quotePanel/invoice block
var isDirector = u.roleKey==='director';
function canInvoiceOrder(o){ return canInvoiceRole || (isAdvisor && d.quoteStatus(o)==='Farmer approved'); }
function quoteChip(o){
  var q=d.quoteStatus(o); if(!q) return '';
  var ic = q==='Farmer approved'?'check': q==='Declined'?'alert':'file';
  return '<span class="tag tag-quote" title="Quote stage">'+BB.icon(ic)+BB.esc(q==='Awaiting approval'?'Quote · awaiting '+(isDirector?'you':'Rudie'):'Quote · '+q.toLowerCase())+'</span>';
}
function farmerWA(o, msg){
  var f=d.farmer(o.farmer); var cell=String(f.cell||'').replace(/\D/g,'').replace(/^0/,'27');
  return 'https://wa.me/'+cell+'?text='+encodeURIComponent('Hi '+String(f.name).split(' ')[0]+', '+msg);
}
// The quote → approval → margin → farmer → invoice chain, rendered per order.
function quotePanel(o){
  if(d.orderInvoiced(o.id)) return '';
  var q=d.quoteStatus(o), r=d.rep(o.rep), f=d.farmer(o.farmer);
  var list=d.orderValue(o), tot=d.quoteTotal(o), margin=d.agentMargin(o), pct=d.quotePct(o);
  var h='<div class="qp">';
  h+='<div class="row between" style="align-items:flex-start;"><div><div class="eyebrow">Quote &amp; approval</div>';
  if(!q){
    h+='<div style="font-size:.86rem;margin-top:3px;">No quote yet. List value <b>'+BB.money(list)+'</b>. '+(isAdvisor||isDirector?'Create the quote and it goes to Rudie for approval.':'')+'</div></div>';
    if(isAdvisor||isDirector) h+='<button class="btn sm" data-q="create" data-oid="'+o.id+'">Create quote</button>';
    h+='</div>';
  } else if(q==='Awaiting approval'){
    h+='<div style="font-size:.86rem;margin-top:3px;">Quoted by <b>'+BB.esc(r.name)+'</b> · list <b>'+BB.money(list)+'</b> · preset margin '+pct+'% → <b>'+BB.money(tot)+'</b> to the farmer.</div></div>';
    if(isDirector) h+='<div class="row" style="gap:8px;"><button class="btn sm" data-q="approve" data-oid="'+o.id+'">'+BB.icon('check')+'Approve quote</button><button class="btn ghost sm" data-q="decline" data-oid="'+o.id+'">Decline</button></div>';
    else h+='<span class="badge b-warn">Waiting for Rudie</span>';
    h+='</div>';
  } else if(q==='Approved'){
    h+='<div style="font-size:.86rem;margin-top:3px;">Approved by <b>'+BB.esc(o.quote.approvedBy||'Rudie')+'</b>. Set your margin, then send it to '+BB.esc(String(f.name).split(' ')[0])+'.</div></div></div>';
    h+='<div class="row" style="gap:12px;margin-top:10px;flex-wrap:wrap;align-items:flex-end;">'+
      '<div class="fld" style="margin:0;"><label>My margin %</label><input type="number" min="0" max="50" step="0.5" value="'+pct+'" data-pct="'+o.id+'" style="width:110px;"></div>'+
      '<div style="font-size:.84rem;"><div class="faint" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;">Farmer pays</div><b data-tot="'+o.id+'" style="font-family:var(--display);font-size:1.1rem;color:var(--green-dark);">'+BB.money(tot)+'</b></div>'+
      '<div style="font-size:.84rem;"><div class="faint" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;">My margin</div><b data-margin="'+o.id+'" style="color:var(--green-mid);">'+BB.money(margin)+'</b></div>'+
      '<span style="flex:1;"></span>'+
      '<button class="btn sm" data-q="send" data-oid="'+o.id+'">Send quote to farmer'+BB.icon('chevron')+'</button></div>';
    return h+'</div>';
  } else if(q==='Sent to farmer'){
    h+='<div style="font-size:.86rem;margin-top:3px;">Quote of <b>'+BB.money(tot)+'</b> is in <b>'+BB.esc(String(f.name).split(' ')[0])+'\u2019s portal</b> for approval (your margin '+BB.money(margin)+', '+pct+'%).</div></div>';
    h+='<div class="row" style="gap:8px;"><a class="btn ghost sm" target="_blank" rel="noopener" href="'+farmerWA(o,'your BioBrix quote for '+BB.money(tot)+' is ready in your portal — tap Approve and we get it moving.')+'">'+BB.icon('message')+'WhatsApp '+BB.esc(String(f.name).split(' ')[0])+'</a>'+
       '<button class="btn sm" data-q="farmerok" data-oid="'+o.id+'" title="Farmer said yes on WhatsApp / phone">'+BB.icon('check')+'Farmer approved</button></div>';
    h+='</div>';
  } else if(q==='Farmer approved'){
    h+='<div style="font-size:.86rem;margin-top:3px;"><b>'+BB.esc(f.name)+' approved</b> '+BB.money(tot)+(o.quote.farmerApprovedAt?' on '+BB.date(o.quote.farmerApprovedAt):'')+'. Invoice it and it becomes actual revenue; your margin '+BB.money(margin)+' is in the invoice.</div></div>';
    h+='<button class="btn sm" data-inv="'+o.id+'">'+BB.icon('receipt')+'Generate invoice</button>';
    h+='</div>';
  } else if(q==='Declined'){
    h+='<div style="font-size:.86rem;margin-top:3px;">Quote declined by '+BB.esc(o.quote.declinedBy||'Rudie')+'. Adjust and re-quote.</div></div>';
    if(isAdvisor||isDirector) h+='<button class="btn ghost sm" data-q="create" data-oid="'+o.id+'">Re-quote</button>';
    h+='</div>';
  }
  return h+'</div>';
}

// Due date is ALWAYS the 25th — of the month AFTER the invoice date.
function nextMonth25(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1; // next month, 0-indexed
  if(m > 11){ m = 0; y += 1; }
  return y + '-' + String(m + 1).padStart(2, '0') + '-25';
}

// Invoicing indicator: green once actually invoiced, amber when a
// delivered/confirmed order is still counted as a sale but NOT yet invoiced.
function invoiceBadge(o){
  if(d.orderInvoiced(o.id)) return '<span class="tag tag-inv" title="An invoice exists — counts as actual revenue">'+BB.icon('receipt')+'Invoiced</span>';
  if(o.status==='Delivered' || o.status==='Confirmed') return '<span class="tag tag-uninv" title="Counted as a sale, not yet invoiced">'+BB.icon('receipt')+'Not invoiced</span>';
  return '';
}

function holdBadge(o){
  var h = d.deliveryHold(o);
  if(!h) return '';
  return '<span class="tag tag-hold'+(h.sev==='high'?'':' med')+'" title="'+BB.esc(h.reason)+'">'+BB.icon('alert')+'HOLD</span>';
}

function allOrders(){
  var o = d.all('orders');
  if(isAdvisor) o = o.filter(function(x){ return x.rep===u.rep; });
  return o;
}

// Each order opens in its own popup: lines, status, quote and invoice — the list stays where it was.
function showOrder(id){ BB.closePopup(); setTimeout(function(){ openOrder(id); }, 160); }
function toList(){ BB.closePopup(); var el=document.getElementById('ordList'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
function orderDetail(list, opts){
  opts=opts||{};
  list=list.slice().sort(function(a,b){ return d.orderValue(b)-d.orderValue(a); });
  var cols=['Ref','Farmer'].concat(isAdvisor?[]:['Rep']).concat(['Delivery','Status','Value']);
  var tot=0;
  var rows=list.map(function(o){
    var f=d.farmer(o.farmer), r=d.rep(o.rep), v=d.orderValue(o); tot+=v;
    return { cells:[{ html:'<b style="white-space:nowrap">'+BB.esc(o.ref)+'</b>' }, f.name].concat(isAdvisor?[]:[r.name]).concat([BB.monthName(o.deliverMonth), { html:BB.statusBadge(o.status)+(opts.extra?' '+opts.extra(o):'') }, BB.money(v)]) };
  });
  if(list.length>1) rows.push({ cells:[{ html:'<b style="white-space:nowrap">'+list.length+' orders</b>' }].concat(cols.slice(1,-1).map(function(){ return ''; })).concat([{ html:'<b>'+BB.money(tot)+'</b>' }]) });
  return {
    wide:!isAdvisor, table:{ columns:cols, rows:rows, num:[cols.length-1] },
    note: list.length? 'Tap an order to open it.' : null,
    onOpen:function(body){
      body.querySelectorAll('tbody tr').forEach(function(tr,i){ var o=list[i]; if(!o) return;
        tr.classList.add('click'); tr.title='Open '+o.ref; tr.onclick=function(){ showOrder(o.id); }; });
    },
    total:tot, count:list.length
  };
}
function merge(a,b){ Object.keys(b).forEach(function(k){ a[k]=b[k]; }); return a; }
function canGo(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } }
var TILE = {};   // key → { list, sub } filled by statBar on every render
['ordOpen','ordConf','ordAwait','ordUninv','ordQuotes'].forEach(function(k){
  BB.statDetail(k, function(){
    var t=TILE[k]; if(!t) return null; var x=orderDetail(t.list, { extra:t.extra });
    var acts=[{ label:'Open the full list', primary:true, onClick:toList }];
    if(t.more && canGo(t.more.href)) acts.push({ label:t.more.label, href:t.more.href });
    return merge(x, { sub:t.sub, stats:[{ l:'Orders', v:BB.num(x.count) }, { l:'Value', v:BB.money(x.total), s:'list value' }], actions:acts });
  });
});

function statBar(orders){
  var openL = orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
  var confL = orders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; });
  var open = openL.reduce(function(s,o){ return s+d.orderValue(o); },0);
  var conf = confL.reduce(function(s,o){ return s+d.orderValue(o); },0);
  var awaitL = orders.filter(function(o){ return o.status==='Awaiting stock'; }), awaiting = awaitL.length;
  var uninv = orders.filter(function(o){ return (o.status==='Delivered'||o.status==='Confirmed') && !d.orderInvoiced(o.id); });
  var quoteL = orders.filter(function(o){ return d.quoteStatus(o)==='Awaiting approval'; }), quotes = quoteL.length;
  TILE = {
    ordOpen:{ list:openL, sub:'forecast and pending, not yet confirmed' },
    ordConf:{ list:confL, sub:'confirmed and delivered', extra:invoiceBadge },
    ordAwait:{ list:awaitL, sub:'held until the stock is in', extra:holdBadge, more:{ label:'Stock', href:'stock.html' } },
    ordUninv:{ list:uninv, sub:'counted as sales, not yet billed', more:{ label:'Finance', href:'finance.html' } },
    ordQuotes:{ list:quoteL, sub:isDirector?'quotes waiting for your approval':'quotes waiting for Rudie' }
  };
  var tile=function(key, cls, l, v, s){ return '<a class="stat tap'+(cls?' '+cls:'')+'" href="#ordList" data-detail="'+key+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></a>'; };
  var html='<div class="grid g5" style="margin-top:16px;">';
  html += tile('ordOpen', '', 'Open pipeline', BB.money(open), 'forecast + pending');
  html += tile('ordConf', '', 'Confirmed value', BB.money(conf), 'confirmed + delivered');
  html += tile('ordAwait', awaiting>0?'warn':'', 'Awaiting stock', awaiting, 'order'+(awaiting===1?'':'s')+' held on stock');
  html += tile('ordUninv', uninv.length?'warn':'', 'Uninvoiced', uninv.length, 'counted as sales, not yet billed');
  html += tile('ordQuotes', quotes?'warn':'', 'Quotes to approve', quotes, isDirector?'waiting for you':'waiting for Rudie');
  html += '</div>';
  return html;
}

var STATUS_COL = { 'Forecast':'#6b7d8f', 'Pending':'#c77d17', 'Confirmed':'#2b7d39', 'Awaiting stock':'#a3463a', 'Delivered':'#4b5bb0' };   // same hues as the status pills

function render(){
  var orders = allOrders();
  var shown = orders.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var cols = isAdvisor?5:6;

  var html='';
  html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Sales</div><h1>Orders</h1><p>'+
    (isAdvisor?'Every order you have captured, and where each one is.'
              :'The full pipeline across every rep. Click an order for its products; advance the status as it moves.')+'</p></div>'+
    '<div class="row" style="gap:8px;"><a class="btn" href="voice-order.html">'+BB.icon('mic')+'Capture an order</a><a class="btn ghost" href="forecast.html">'+BB.icon('chart')+'Forecast</a></div></div>';

  html += statBar(orders);

  // the picture: the book by delivery month beside the status mix
  html += '<div class="split" style="margin-top:16px;">'+
    '<div class="card"><div class="card-h"><div><h3>Order book by delivery month</h3><div class="sub">'+(isAdvisor?'your orders':'all reps')+' · confirmed and still in the pipeline</div></div></div><div class="card-p"><div id="chBook"></div></div></div>'+
    '<div class="card"><div class="card-h"><div><h3>Where the value sits</h3><div class="sub">order value by status</div></div></div><div class="card-p"><div id="chStatus"></div></div></div>'+
  '</div>';

  // the work: every order (filter by status, rep, month… with the funnel on each column)
  html += '<div class="card" id="ordList" style="margin-top:16px;"><div class="card-h"><div><h3>'+(isAdvisor?'Your orders':'All orders')+'</h3><div class="sub">newest first · click an order for its products, quote and invoice</div></div>'+
    '<span class="badge b-grey">'+orders.length+'</span></div>';

  html += '<div class="scroll"><table class="bb"><thead><tr>'+
    '<th>Ref</th><th>Farmer</th>'+(isAdvisor?'':'<th>Rep</th>')+'<th>Delivery</th><th class="num">Value</th><th>Status</th></tr></thead><tbody>';

  if(!shown.length){
    html += '<tr><td colspan="'+cols+'"><div class="empty">No orders here yet.</div></td></tr>';
  }

  var shownTot = 0;
  shown.forEach(function(o){
    var f=d.farmer(o.farmer), r=d.rep(o.rep);
    var val = d.quoteStatus(o)?d.quoteTotal(o):d.orderValue(o); shownTot += val;
    html += '<tr class="click" data-id="'+o.id+'" title="Open '+BB.esc(o.ref)+'">'+
      '<td><b style="white-space:nowrap;">'+BB.esc(o.ref)+'</b></td>'+
      '<td>'+BB.esc(f.name)+'<div class="faint" style="font-size:.72rem;">'+BB.esc(f.farm)+'</div></td>'+
      (isAdvisor?'':'<td><span class="rep"><i style="background:'+r.colour+';"></i>'+BB.esc(r.name)+'</span></td>')+
      '<td>'+BB.monthName(o.deliverMonth)+(function(){ var dl=d.where('deliveries',function(x){return x.order===o.id;})[0]; if(!dl) return o.status==='Delivered'?'<div class="faint" style="font-size:.72rem;">delivered</div>':''; return '<div class="faint" style="font-size:.72rem;">'+(dl.status==='Delivered'?'delivered ':BB.esc(dl.status)+' · ETA ')+BB.date(dl.eta)+'</div>'; })()+'</td>'+
      '<td class="num"><b>'+BB.money(val)+'</b>'+(d.quoteStatus(o)&&d.quotePct(o)?'<div class="faint" style="font-size:.7rem;font-weight:400;">incl. '+d.quotePct(o)+'% margin</div>':'')+'</td>'+
      '<td><div class="tags">'+BB.statusBadge(o.status)+quoteChip(o)+invoiceBadge(o)+holdBadge(o)+'</div></td>'+
    '</tr>';
  });

  html += '</tbody>';
  if(shown.length) html += '<tfoot><tr><td colspan="'+(cols-2)+'">'+shown.length+' order'+(shown.length===1?'':'s')+'</td><td class="num">'+BB.money(shownTot)+'</td><td></td></tr></tfoot>';
  html += '</table></div>'+
    '<div class="card-f tags" style="gap:6px 10px;"><span>Beside the status:</span><span class="tag tag-quote">'+BB.icon('file')+'Quote stage</span><span class="tag tag-inv">'+BB.icon('receipt')+'Invoiced</span><span class="tag tag-uninv">'+BB.icon('receipt')+'Not invoiced</span><span class="tag tag-hold">'+BB.icon('alert')+'HOLD · overdue</span><span class="tag tag-hold med">'+BB.icon('alert')+'HOLD · over limit</span></div></div>';

  document.getElementById('ordMain').innerHTML=html;
  drawCharts(orders);
  bind();
}

function drawCharts(orders){
  try{
    var used = orders.map(function(o){ return o.deliverMonth; }).filter(function(m){ return m!=null && m>=0 && m<12; });
    var lo = used.length?Math.min.apply(null,used):new Date().getMonth(), hi = used.length?Math.max.apply(null,used):lo+5;
    if(hi-lo<5) hi=Math.min(11, lo+5);
    if(hi-lo<5) lo=Math.max(0, hi-5);
    var span=[]; for(var mi=lo; mi<=hi; mi++) span.push(mi);
    var won = function(o){ return o.status==='Confirmed'||o.status==='Delivered'; };
    var sumWhere = function(test){ return span.map(function(mi){ return orders.filter(function(o){ return o.deliverMonth===mi && test(o); }).reduce(function(t,o){ return t+d.orderValue(o); },0); }); };
    BB.chart.bar('#chBook',{ labels:span.map(BB.monthName), money:true, stacked:true, height:230, table:true,
      series:[{name:'Confirmed',values:sumWhere(won),color:'#22431a'},{name:'Pipeline',values:sumWhere(function(o){ return !won(o); }),color:'#68a53e'}],
      detail:function(ctx){
        var list=orders.filter(function(o){ return o.deliverMonth===span[ctx.index]; });
        var x=orderDetail(list);
        return merge(x, { sub:list.length? list.length+' order'+(list.length===1?'':'s')+' for delivery in '+ctx.label : 'No orders for delivery in '+ctx.label });
      } });
    var st={}; orders.forEach(function(o){ st[o.status]=(st[o.status]||0)+d.orderValue(o); });
    var rows = STATUSES.filter(function(k){ return st[k]; }).map(function(k){ return {label:k, value:st[k], color:STATUS_COL[k]}; });
    if(rows.length) BB.chart.donut('#chStatus',{ money:true, centreLabel:'order value', rows:rows,
      detail:function(ctx){
        var list=orders.filter(function(o){ return o.status===ctx.row.label; });
        var x=orderDetail(list, { extra:function(o){ return invoiceBadge(o)+holdBadge(o); } });
        return merge(x, { sub:list.length+' order'+(list.length===1?'':'s')+' at '+ctx.row.label.toLowerCase() });
      } });
    else document.getElementById('chStatus').innerHTML='<div class="empty">No orders yet.</div>';
  }catch(e){ console.warn('chart', e); }
}

function bind(){
  var main=document.getElementById('ordMain');
  Array.prototype.forEach.call(main.querySelectorAll('tr.click[data-id]'), function(row){
    row.onclick=function(){ openOrder(this.dataset.id); };
  });
}

// ---- the actions: status, invoice, quote chain. Each one saves, redraws the list and refreshes the popup.
function afterAction(id){ render(); if(BB.closePopup) BB.closePopup(); setTimeout(function(){ openOrder(id); }, 170); }
function doAdvance(id, val){ d.update('orders', id, { status:val }); BB.toast('Status updated to '+val); afterAction(id); }
function doInvoice(id){
  var o=d.by('orders', id);
  if(!o || d.orderInvoiced(o.id)) return;
  d.add('invoices', { ref:'INV-'+(1046+Math.floor(Math.random()*900)), farmer:o.farmer, order:o.id, date:new Date().toISOString().slice(0,10),
    dueDate:nextMonth25(), description:'Order '+o.ref, amount:d.quoteTotal(o), status:'Outstanding', paidDate:null });
  BB.toast('Invoice generated — now counts as actual');
  afterAction(id);
}
function doQuote(id, act, root){
  var o=d.by('orders', id); if(!o) return;
  var f=d.farmer(o.farmer), r=d.rep(o.rep), today=new Date().toISOString().slice(0,10);
  var q=Object.assign({}, o.quote||{});
  if(act==='create'){ q={ status:'Awaiting approval', markupPct:(r.markupPct!=null?r.markupPct:0), createdBy:u.rep||u.id, createdAt:today }; BB.toast('Quote created — sent to Rudie for approval'); }
  if(act==='approve'){ q.status='Approved'; q.approvedBy=u.name; q.approvedAt=today; BB.toast('Quote approved — back to '+String(r.name).split(' ')[0]+' to send'); }
  if(act==='decline'){ q.status='Declined'; q.declinedBy=u.name; BB.toast('Quote declined'); }
  if(act==='send'){ var inp=root && root.querySelector('input[data-pct="'+o.id+'"]'); if(inp){ q.markupPct=Math.max(0,Math.min(50,Number(inp.value)||0)); } q.status='Sent to farmer'; q.sentAt=today; BB.toast('Quote sent — '+String(f.name).split(' ')[0]+' sees it in the portal'); }
  if(act==='farmerok'){ q.status='Farmer approved'; q.farmerApprovedAt=today; BB.toast(String(f.name).split(' ')[0]+' approved — ready to invoice'); }
  var patch={ quote:q };
  if(act==='farmerok' && (o.status==='Forecast'||o.status==='Pending')) patch.status='Confirmed';
  d.update('orders', o.id, patch);
  if(act==='create') d.add('feed', { from:u.rep||u.id, date:today, kind:'Order', farmer:o.farmer, ref:o.ref, text:'Quote for '+f.farm+' ('+BB.money(d.quoteTotal(Object.assign({},o,{quote:q})))+') needs approval.' });
  afterAction(id);
}

// ---- one order, in a popup ----
function openOrder(id){
  var o=d.by('orders', id); if(!o) return;
  var f=d.farmer(o.farmer), r=d.rep(o.rep), dep=d.depot(o.depot);
  var val=d.quoteStatus(o)?d.quoteTotal(o):d.orderValue(o);
  var dl=d.where('deliveries',function(x){return x.order===o.id;})[0];
  var hold=d.deliveryHold(o);
  var inv=d.orderInvoiced(o.id);
  var lines='<div class="bbp-tt">Products</div><div class="scroll"><table class="bb" data-nofilter="1"><thead><tr><th>Product</th><th>Pack</th><th class="num">Qty</th><th class="num">Line value</th></tr></thead><tbody>'+
    (o.lines||[]).map(function(l){ var p=d.product(l.prod); return '<tr><td><b>'+BB.esc(p.name)+'</b></td><td>'+BB.esc(p.pack)+'</td><td class="num">'+BB.num(l.qty)+'</td><td class="num">'+BB.money((p.price||0)*l.qty)+'</td></tr>'; }).join('')+
    '</tbody><tfoot><tr><td colspan="3">List value</td><td class="num">'+BB.money(d.orderValue(o))+'</td></tr></tfoot></table></div>';
  var badges=[quoteChip(o), invoiceBadge(o), holdBadge(o)].filter(Boolean).join('');
  var html=(badges?'<div class="op-badges">'+badges+'</div>':'')+
    (hold?'<div class="op-hold">'+BB.icon('alert')+' '+BB.esc(hold.reason)+'</div>':'')+
    lines+
    '<div class="op-meta"><span>Captured '+BB.date(o.date)+' · '+BB.esc(o.source||'Portal')+' · depot '+BB.esc(dep.name)+'</span>'+
      (canAdvance? '<span class="op-adv"><span>Status</span><select data-adv="'+o.id+'" aria-label="Order status">'+STATUSES.map(function(st){ return '<option value="'+st+'"'+(o.status===st?' selected':'')+'>'+st+'</option>'; }).join('')+'</select></span>' : '')+
    '</div>'+
    quotePanel(o)+
    (canInvoiceRole && d.quoteStatus(o)!=='Farmer approved' && !inv && (o.status==='Delivered'||o.status==='Confirmed')
      ? '<div class="qp"><div class="row between"><span style="font-size:.86rem;">Counted as a sale but not yet invoiced. Invoice it to count as actual revenue.</span><button class="btn sm" data-inv="'+o.id+'">'+BB.icon('receipt')+'Generate invoice</button></div></div>' : '')+
    (inv? '<div class="qp"><span class="badge b-ok">Invoiced</span> <span class="faint" style="font-size:.8rem;">This order counts as actual revenue.</span></div>' : '');
  var acts=[];
  if(canGo('farm-detail.html')) acts.push({ label:'Farm record', href:'farm-detail.html?farmer='+encodeURIComponent(o.farmer) });
  BB.popup({ wide:true, eyebrow:'Order · '+BB.esc(o.source||'Portal'), title:o.ref, sub:f.name+' · '+f.farm+(isAdvisor?'':' · '+r.name),
    stats:[
      { l:'Value', v:BB.money(val), s:(d.quoteStatus(o)&&d.quotePct(o)? 'incl. '+d.quotePct(o)+'% margin' : 'list value') },
      { l:'Status', html:BB.statusBadge(o.status) },
      { l:'Delivery', v:BB.monthName(o.deliverMonth), s:dl? (dl.status==='Delivered'?'delivered '+BB.date(dl.eta):dl.status+' · ETA '+BB.date(dl.eta)) : (o.status==='Delivered'?'delivered':'no delivery booked') },
      { l:'Invoice', v:inv?'Invoiced':((o.status==='Delivered'||o.status==='Confirmed')?'Not yet':'—') }
    ],
    html:html, actions:acts,
    onOpen:function(body){
      body.querySelectorAll('select[data-adv]').forEach(function(sel){ sel.addEventListener('change', function(){ doAdvance(sel.dataset.adv, sel.value); }); });
      body.querySelectorAll('button[data-inv]').forEach(function(b){ b.onclick=function(){ doInvoice(b.dataset.inv); }; });
      body.querySelectorAll('button[data-q]').forEach(function(b){ b.onclick=function(){ doQuote(b.dataset.oid, b.dataset.q, body); }; });
      body.querySelectorAll('input[data-pct]').forEach(function(inp){ inp.oninput=function(){
        var pct=Math.max(0,Math.min(50,Number(this.value)||0)), list=d.orderValue(o), tot=Math.round(list*(1+pct/100));
        var t=body.querySelector('b[data-tot="'+o.id+'"]'), m=body.querySelector('b[data-margin="'+o.id+'"]');
        if(t) t.textContent=BB.money(tot); if(m) m.textContent=BB.money(tot-list); }; });
    } });
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="ordMain"></div></main>');
// ?open=<order id>: another page sent you to one order — open it in its popup
var openId = new URLSearchParams(location.search).get('open');
render();
if(openId && d.by('orders', openId)) setTimeout(function(){ openOrder(openId); }, 200);

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
