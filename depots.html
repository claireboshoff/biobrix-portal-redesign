<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Depots · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
  .dep-ic{width:44px;height:44px;border-radius:11px;background:#eef4e4;color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex:none;}
  .dep-ic.sm{width:36px;height:36px;border-radius:9px;}
  .dep-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-top:3px solid var(--green-bright);flex-wrap:wrap;}
  .dep-head h2{font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--green-darkest);}
  .depot-card{cursor:pointer;padding:16px 18px;border-left:3px solid var(--green-bright);transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:14px;}
  .depot-card.bad{border-left-color:var(--red);}
  .depot-card:hover{box-shadow:0 4px 18px -6px rgba(18,33,12,.18);}
  .depot-card.on{border-color:var(--green-bright);box-shadow:var(--shadow-lg);}
  .depot-card.on.bad{border-left-color:var(--red);}
  .dc-top{display:flex;gap:12px;align-items:flex-start;}
  .dc-name{font-family:var(--display);font-weight:600;color:var(--green-darkest);font-size:.98rem;}
  .dc-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
  .dc-nums b{display:block;font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--green-darkest);line-height:1.15;}
  .dc-nums span{font-size:.7rem;color:var(--faint);}
  .dc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.74rem;}
  .dc-go{display:inline-flex;align-items:center;gap:2px;color:var(--green-dark);font-weight:600;flex:none;}
  .dc-go .ico{width:14px;height:14px;}
  .depot-card.on .dc-go .ico{transform:rotate(90deg);}
  .lvl .trk{position:relative;overflow:visible;height:7px;}
  .lvl .trk i{border-radius:4px;}
  .lvl .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--green-darkest);opacity:.45;}
  .task-add{display:flex;gap:8px;flex-wrap:wrap;}
  .task-add input{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:.88rem;background:#fff;}
  .task-add input[type=date]{flex:0 1 150px;}
  .task-add input:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(104,165,62,.15);}
  .task{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line-soft);}
  .task .tt{font-size:.9rem;}
  .task.done{opacity:.55;} .task.done .tt{text-decoration:line-through;}
  @media(max-width:560px){ .lvl-col{display:none;} .task{padding:10px 14px;} .dep-head{padding:14px;} .dep-head > .dep-ic{display:none;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;
// Warehouse seat sees only its own depot (auto-opened). Directors / ops see all 3.
var scopeDepot = (BB.user && BB.user.roleKey==='warehouse' && BB.user.depot) ? BB.user.depot : null;
var depots = scopeDepot ? d.all('depots').filter(function(x){ return x.id===scopeDepot; }) : d.all('depots');
var selected = scopeDepot || null;

function depotSummary(id){
  var inv = d.where('inventory', function(i){ return i.depot===id; });
  var low = inv.filter(function(i){ return i.qty<i.reorder; });
  var jobs = d.where('blending', function(b){ return b.depot===id; });
  var dels = d.where('deliveries', function(x){ return x.depot===id; });
  return { inv:inv, low:low, jobs:jobs, dels:dels };
}

// stock level against reorder: the reorder level sits at the midpoint of the track
function levelCell(qty, reorder){
  var cap = Math.max(1, (reorder||0)*2), pct = Math.max(0, Math.min(100, qty/cap*100));
  var col = qty<=0 ? 'var(--red)' : (qty<reorder ? 'var(--amber)' : 'var(--green-bright)');
  return '<div class="bar-cell lvl"><div class="trk"><i style="width:'+pct+'%;background:'+col+'"></i><b title="reorder level"></b></div></div>';
}
function panel(title, sub, actions, body){
  return '<div class="card"><div class="card-h"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(actions||'')+'</div>'+body+'</div>';
}

function renderDetail(id){
  var dep = d.depot(id);
  var s = depotSummary(id);

  var html = '';
  html += '<div class="card dep-head" style="margin-top:16px;">'+
    '<div class="dep-ic">'+BB.icon('warehouse')+'</div>'+
    '<div style="min-width:0;flex:1;"><div class="eyebrow" style="margin-bottom:2px;">Depot detail</div>'+
      '<div class="row" style="gap:10px;"><h2>'+BB.esc(dep.name)+'</h2>'+BB.statusBadge(dep.status)+'</div>'+
      '<p class="muted" style="font-size:.82rem;margin-top:2px;">'+BB.esc(dep.region)+' · '+BB.esc(dep.address)+'</p>'+
      '<p class="faint" style="font-size:.78rem;">Warehouse manager <b style="color:var(--green-mid);">'+BB.esc(dep.manager)+'</b> runs stock and the mixing / blending floor here.</p></div>'+
    ((BB.auth && BB.auth.canPage && BB.auth.canPage('stock.html')) ? '<a class="btn ghost sm" href="stock.html">'+BB.icon('package')+'Count stock</a>' : '')+
  '</div>';

  // top stock lines
  var stockBody;
  if(!s.inv.length){
    stockBody = '<div class="empty">No stock lines at this depot yet.</div>';
  } else {
    stockBody = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th class="num">On hand</th><th class="num">Reorder</th><th class="lvl-col" style="min-width:110px;">Level</th><th class="num">Status</th></tr></thead><tbody>';
    s.inv.slice().sort(function(a,b){ return (a.qty/a.reorder)-(b.qty/b.reorder); }).slice(0,6).forEach(function(i){
      var p = d.product(i.prod);
      var st = i.qty<=0?'Out of stock':(i.qty<i.reorder?'Low stock':'In stock');
      stockBody += '<tr>'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(p.name)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(p.code)+'</div></td>'+
        '<td class="num">'+BB.num(i.qty)+' <span class="faint" style="font-size:.72rem;">'+BB.esc(p.unit||'')+'</span></td>'+
        '<td class="num muted">'+BB.num(i.reorder)+'</td>'+
        '<td class="lvl-col">'+levelCell(i.qty, i.reorder)+'</td>'+
        '<td class="num">'+BB.statusBadge(st)+'</td>'+
      '</tr>';
    });
    stockBody += '</tbody></table></div>';
  }

  // blending / mixing jobs
  var blendBody;
  if(!s.jobs.length){
    blendBody = '<div class="empty">No blending jobs on the floor.</div>';
  } else {
    blendBody = '<div class="scroll"><table class="bb"><thead><tr><th>Recipe</th><th class="num">Batch</th><th>For</th><th>Due</th><th class="num">Status</th></tr></thead><tbody>';
    s.jobs.forEach(function(b){
      blendBody += '<tr>'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(b.recipe)+'</b></td>'+
        '<td class="num">'+BB.esc(b.batch)+'</td>'+
        '<td>'+BB.esc(d.farmer(b['for']).name)+'</td>'+
        '<td class="muted" style="white-space:nowrap;">'+BB.date(b.due)+'</td>'+
        '<td class="num">'+BB.statusBadge(b.status)+'</td>'+
      '</tr>';
    });
    blendBody += '</tbody></table></div>';
  }

  html += '<div class="grid g2" style="margin-top:16px;">'+
    panel('Stock on hand', s.inv.length+' lines · '+s.low.length+' low · lowest first', '', stockBody)+
    panel('Mixing &amp; blending', s.jobs.length+' job'+(s.jobs.length===1?'':'s')+' on the floor', '', blendBody)+
  '</div>';

  // deliveries
  var delBody;
  if(!s.dels.length){
    delBody = '<div class="empty">Nothing dispatching from here.</div>';
  } else {
    delBody = '<div class="scroll"><table class="bb"><thead><tr><th>Farmer</th><th>Transport</th><th>ETA</th><th class="num">Status</th></tr></thead><tbody>';
    s.dels.forEach(function(x){
      delBody += '<tr>'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(d.farmer(x.farmer).name)+'</b></td>'+
        '<td class="muted">'+BB.esc(x.transport)+'</td>'+
        '<td class="muted" style="white-space:nowrap;">'+BB.date(x.eta)+'</td>'+
        '<td class="num">'+BB.statusBadge(x.status)+'</td>'+
      '</tr>';
    });
    delBody += '</tbody></table></div>';
  }

  // ---- depot tasks & messages (mirrors the depot's Telegram group) ----
  var tasks = d.where('depotTasks', function(t){ return t.depot===id; }).sort(function(a,b){ return (a.status==='Done')-(b.status==='Done') || (a.due||'').localeCompare(b.due||''); });
  var openTasks = tasks.filter(function(t){return t.status!=='Done';});
  var shareText = dep.name+' — today: '+openTasks.map(function(t){return '• '+t.text;}).join(' ');
  var taskBody = '<div class="card-p" style="padding-bottom:6px;">'+
    '<div class="task-add"><input id="newTask" placeholder="e.g. Blend 800 L Pome Cal Foliar — due Thu"><input id="newTaskDue" type="date"><button class="btn sm" id="addTask" data-depot="'+id+'">'+BB.icon('plus')+'Add task</button></div></div>';
  if(!tasks.length) taskBody += '<div class="empty">No tasks yet — add the first one above.</div>';
  else {
    taskBody += '<div>';
    tasks.forEach(function(t){
      var who=d.person(t.by);
      taskBody += '<div class="task'+(t.status==='Done'?' done':'')+'">'+
        '<div style="min-width:0;"><div class="tt">'+BB.esc(t.text)+'</div><div class="faint" style="font-size:.72rem;">'+BB.esc(who.name)+(t.due?' · due '+BB.date(t.due):'')+'</div></div>'+
        (t.status==='Done'?'<span class="badge b-ok">Done</span>':'<button class="btn ghost sm" data-taskdone="'+t.id+'">'+BB.icon('check')+'Done</button>')+'</div>';
    });
    taskBody += '</div>';
  }
  var shareBtns = '<div class="row" style="gap:6px;">'+
    '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(location.origin+location.pathname)+'&text='+encodeURIComponent(shareText)+'" title="Post today’s list to the depot Telegram group">'+BB.icon('message')+'Telegram</a>'+
    '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(shareText)+'">'+BB.icon('phone')+'WhatsApp</a></div>';

  html += '<div class="grid g2" style="margin-top:16px;">'+
    panel('Deliveries', s.dels.length+' from this depot', '', delBody)+
    panel('Depot tasks &amp; messages', openTasks.length+' open · the depot’s own group', shareBtns, taskBody)+
  '</div>';
  return html;
}

function render(){
  var html = '';
  html += '<section class="page-head">'+
    '<div class="eyebrow">Operations · Depots</div>'+
    '<h1>'+(scopeDepot?BB.esc(d.depot(scopeDepot).name):'The depot network')+'</h1>'+
    '<p>'+(scopeDepot
      ?'Your depot — stock on hand, the mixing / blending floor, and everything dispatching from here.'
      :'George, Ballito and Tzaneen. Each warehouse manager runs stock and the mixing / blending floor from here. Tap a depot to see its stock, jobs and deliveries.')+'</p>'+
  '</section>';

  // network totals (or the one depot's, for a depot seat)
  var tot = { inv:0, low:0, jobs:0, dels:0 }, sums = {};
  depots.forEach(function(dep){ var s=depotSummary(dep.id); sums[dep.id]=s; tot.inv+=s.inv.length; tot.low+=s.low.length; tot.jobs+=s.jobs.length; tot.dels+=s.dels.filter(function(x){ return x.status!=='Delivered'; }).length; });
  html += '<div class="grid g4" style="margin-top:14px;">'+
    '<div class="stat"><div class="l">Stock lines</div><div class="v">'+tot.inv+'</div><div class="s">'+(scopeDepot?'at this depot':'across '+depots.length+' depots')+'</div></div>'+
    '<div class="stat'+(tot.low?' bad':'')+'"><div class="l">Below reorder</div><div class="v">'+tot.low+'</div><div class="s">lines to reorder</div></div>'+
    '<div class="stat"><div class="l">Blending jobs</div><div class="v">'+tot.jobs+'</div><div class="s">on the floor</div></div>'+
    '<div class="stat"><div class="l">Deliveries open</div><div class="v">'+tot.dels+'</div><div class="s">not yet at the farm</div></div>'+
  '</div>';

  // A depot seat has one depot, always open: its detail header says everything the card would.
  if(!scopeDepot) html += '<div class="grid g3" style="margin-top:16px;">';
  if(!scopeDepot) depots.forEach(function(dep){
    var s = sums[dep.id];
    var bad = s.low.length>0;
    var on = selected===dep.id;
    html += '<div class="card depot-card'+(on?' on':'')+(bad?' bad':'')+'" data-depot="'+dep.id+'" role="button" tabindex="0" aria-pressed="'+(on?'true':'false')+'">'+
      '<div class="dc-top"><div class="dep-ic sm">'+BB.icon('warehouse')+'</div><div style="min-width:0;flex:1;"><b class="dc-name">'+BB.esc(dep.name)+'</b>'+
        '<div class="faint" style="font-size:.74rem;">'+BB.esc(dep.region)+' · '+BB.esc(dep.manager)+'</div></div>'+BB.statusBadge(dep.status)+'</div>'+
      '<div class="dc-nums">'+
        '<div><b>'+s.inv.length+'</b><span>in stock</span></div>'+
        '<div><b style="'+(bad?'color:var(--red);':'')+'">'+s.low.length+'</b><span>low</span></div>'+
        '<div><b>'+s.jobs.length+'</b><span>blending</span></div>'+
        '<div><b>'+s.dels.length+'</b><span>deliveries</span></div>'+
      '</div>'+
      '<div class="dc-foot faint">'+BB.esc(dep.address)+'<span class="dc-go">'+(on?'Close':'Open')+BB.icon('chevron')+'</span></div>'+
    '</div>';
  });
  if(!scopeDepot) html += '</div>';

  var nothing = '';
  if(!selected){
    if(!scopeDepot && depots.length>=3){
      nothing = '<div class="card" style="margin-top:16px;"><div class="card-h"><div><h3>Depots side by side</h3><div class="sub">tap a depot above to open it</div></div></div><div class="card-p"><div id="chNet"></div></div></div>';
    } else {
      nothing = '<div class="card" style="margin-top:16px;"><div class="empty"><div class="big">'+BB.icon('warehouse')+'</div>Tap a depot above to open it.</div></div>';
    }
  }
  html += '<div id="detail">'+(selected?renderDetail(selected):nothing)+'</div>';

  html += '<div style="height:24px;"></div>';

  var main = document.querySelector('main.wrap');
  main.innerHTML = html;
  wire();

  if(document.getElementById('chNet')){
    try{
      var cMax = Math.max(4, Math.ceil(Math.max.apply(null, depots.map(function(x){ return sums[x.id].inv.length; }).concat([0]))/4)*4);
      BB.chart.bar('#chNet', { labels:depots.map(function(x){ return x.name.replace(/ Depot$/,''); }), height:220, table:true, max:cMax,
        series:[
          {name:'Stock lines', values:depots.map(function(x){ return sums[x.id].inv.length; }), color:'#3f6b28'},
          {name:'Below reorder', values:depots.map(function(x){ return sums[x.id].low.length; }), color:'#b8382a'},
          {name:'Blending jobs', values:depots.map(function(x){ return sums[x.id].jobs.length; }), color:'#c77d17'},
          {name:'Deliveries', values:depots.map(function(x){ return sums[x.id].dels.length; }), color:'#2f6f9e'}] });
    }catch(e){ console.warn('chart', e); }
  }
}

function wire(){
  var at=document.getElementById('addTask'); if(at) at.onclick=function(){ var txt=document.getElementById('newTask').value.trim(); if(!txt){ BB.toast('Type the task first'); return; } d.add('depotTasks',{ depot:this.dataset.depot, text:txt, by:BB.user.id, due:document.getElementById('newTaskDue').value||null, status:'Open' }); BB.toast('Task added · depot group updated'); render(); };
  Array.prototype.forEach.call(document.querySelectorAll('button[data-taskdone]'), function(b){ b.onclick=function(e){ e.stopPropagation(); d.update('depotTasks', this.dataset.taskdone, { status:'Done', doneAt:new Date().toISOString().slice(0,10) }); BB.toast('Done'); render(); }; });
  var nt=document.getElementById('newTask'); if(nt) nt.onclick=function(e){ e.stopPropagation(); };
  Array.prototype.forEach.call(document.querySelectorAll('.depot-card[data-depot]'), function(card){
    card.onclick = function(){
      var id = card.getAttribute('data-depot');
      selected = (selected===id) ? null : id;
      render();
    };
    card.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); card.onclick(); } };
  });
}

document.body.insertAdjacentHTML('beforeend', '<main class="wrap"></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
