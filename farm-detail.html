<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Farm record · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign7"></script><script src="guard.js?v=redesign7"></script>
<script src="bb-data.js?v=redesign7"></script>
<script src="bb-shell.js?v=redesign7"></script>
<style>
/* Farm record — page-scoped */
.cropchip{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef6dc;color:var(--green-mid);font-size:.7rem;font-weight:600;margin:1px 2px 1px 0;}
.repchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:600;border:1px solid;white-space:nowrap;}
.repdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:.82rem;align-items:center;}
.facts .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--faint);margin-right:6px;}
.h1row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem;}
.kvl .k{color:var(--faint);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding-top:2px;}
.kvl .v{text-align:right;font-variant-numeric:tabular-nums;}
.verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-family:var(--display);font-weight:600;font-size:1.02rem;}
.verdict .ico{width:18px;height:18px;}
.verdict.ok{background:var(--ok-bg);color:var(--ok);} .verdict.warn{background:var(--amber-bg);color:var(--amber);}
.verdict.bad{background:var(--red-bg);color:var(--red);} .verdict.grey{background:#eef1ea;color:var(--muted);}
.flag{display:flex;gap:6px;align-items:flex-start;font-size:.76rem;line-height:1.35;color:var(--amber);margin-top:3px;}
.flag:first-child{margin-top:0;}
.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;margin-top:4px;}
.flag.ok{color:var(--ok);}
.flag b{font-weight:700;}
table.bb .bar-cell{justify-content:flex-end;min-width:100px;}
table.bb .bar-cell .trk{max-width:50px;}
.blinks{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;}
.prep h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--green-mid);margin:0 0 6px;}
.prep ol{margin:0 0 14px 18px;line-height:1.6;font-size:.86rem;}
.empty .big .ico{width:30px;height:30px;color:var(--faint);}
.card .empty{padding:26px 20px;}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0;}
td.dt{white-space:nowrap;}
/* popups */
.bbp .bbp-bar.interp{margin-top:8px;} .bbp .bbp-bar.interp.ok{background:var(--ok-bg);border-color:transparent;}
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'farms.html' });

var d = BB.data, u = BB.user;
function esc(s){ return BB.esc(s); }

var id = new URLSearchParams(location.search).get('farmer');
var f = id ? d.by('farmers', id) : null;

var html='';

if(!f){
  html += '<div class="page-head"><h1>Farm not found</h1><p>We could not open that farmer record.</p></div>'+
    '<div class="card"><div class="empty"><div class="big">'+BB.icon('farm')+'</div>No farmer for that link.<div style="margin-top:14px;"><a class="btn ghost" href="farms.html">Back to farms</a></div></div></div>';
  document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');
} else {
  var r = d.rep(f.rep);
  var blocks = d.where('blocks', function(b){ return b.farmer===id; });
  var programs = d.where('programs', function(p){ return p.farmer===id; });
  var orders = d.where('orders', function(o){ return o.farmer===id; })
    .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  var files = d.where('files', function(x){ return x.farmer===id; })
    .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  var soil = d.where('soil', function(s){ return s.farmer===id; });
  var leaf = d.where('leaf', function(l){ return l.farmer===id; });

  function crops(){ return (f.crops||[]).map(function(c){ return '<span class="cropchip">'+esc(c)+'</span>'; }).join(''); }
  function repChip(rp){
    return '<span class="repchip" style="background:'+rp.colour+'18;border-color:'+rp.colour+';color:'+rp.colour+';">'+
      '<span class="repdot" style="background:'+rp.colour+';"></span>'+esc(rp.name)+'</span>';
  }

  // header
  // A customer straight from the accounting system has a name and a town and nothing else yet —
  // show that honestly instead of a trailing comma and a row of zeros.
  var place = [f.town, f.region].filter(function(x){ return x && String(x).trim(); }).join(', ');
  var sub = [f.name, place].filter(Boolean).join(' · ');
  var tel = f.cell ? String(f.cell).replace(/\s/g,'') : '';
  var wa = f.cell ? String(f.cell).replace(/\D/g,'').replace(/^0/,'27') : '';
  html += '<div class="page-head row between" style="gap:16px;">'+
    '<div style="min-width:0;"><div class="eyebrow">Farm record'+(f.region?' · '+esc(f.region):'')+'</div>'+
      '<div class="h1row"><h1>'+esc(f.farm)+'</h1>'+BB.farmBadge(f)+BB.sampleChip(f)+'</div>'+
      '<p>'+esc(sub)+'</p>'+
      '<div class="facts">'+
        '<span><span class="k">Crops</span>'+(crops()||'<span class="faint">not captured yet</span>')+'</span>'+
        '<span><span class="k">Contact</span>'+(f.cell? esc(f.cell) : '<span class="faint">no number on the account</span>')+'</span>'+
        '<span><span class="k">Assigned rep</span>'+(f.rep? repChip(r) : '<span class="faint">not allocated</span>')+'</span>'+
      '</div></div>'+
    '<div class="row" style="gap:8px;">'+
      (f.cell?'<a class="btn ghost" href="tel:'+esc(tel)+'">'+BB.icon('phone')+'Call</a><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/'+esc(wa)+'">'+BB.icon('message')+'WhatsApp</a>':'')+
      '<a class="btn" href="voice-order.html">'+BB.icon('mic')+'Capture order</a>'+
    '</div>'+
  '</div>';

  // KPI strip — only what this record holds
  var ti=d.tripInsight(f.id);
  var blockHa = blocks.reduce(function(t,b){ return t+(b.ha||0); },0);
  var openOrders = orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
  var toInterp = soil.concat(leaf).filter(function(x){ return x.status!=='Interpreted'; }).length;
  html += '<div class="grid g5" style="margin-top:12px;">'+
    '<div class="stat"><div class="l">Hectares</div><div class="v">'+(f.ha? BB.num(f.ha) : '—')+'</div><div class="s">'+(f.ha?'on the farm':'not captured yet')+'</div></div>'+
    '<div class="stat"><div class="l">Blocks</div><div class="v">'+blocks.length+'</div><div class="s">'+(blocks.length? BB.num(blockHa)+' ha mapped' : 'none recorded')+'</div></div>'+
    '<a class="stat tap'+(ti.overdue?' bad':(ti.sev==='warn'?' warn':''))+'" href="#acct" data-detail="fdOwed"><div class="l">Outstanding</div><div class="v">'+BB.money(ti.balance)+'</div><div class="s">'+(ti.overdue?'overdue':(ti.limit?'of '+BB.money(ti.limit)+' limit':'no credit limit set'))+'</div></a>'+
    '<a class="stat tap" href="#ords" data-detail="fdPipe"><div class="l">In the pipeline</div><div class="v">'+BB.money(ti.openPipeline)+'</div><div class="s">'+openOrders.length+' open order'+(openOrders.length===1?'':'s')+'</div></a>'+
    '<a class="stat tap'+(toInterp?' warn':'')+'" href="#blks" data-detail="fdSamples"><div class="l">Samples</div><div class="v">'+(soil.length+leaf.length)+'</div><div class="s">'+soil.length+' soil · '+leaf.length+' leaf'+(toInterp?' · '+toInterp+' to interpret':'')+'</div></a>'+
  '</div>';

  // blocks beside the account insight
  html += '<div class="split" style="margin-top:16px;align-items:start;">';
  html += '<div class="card" id="blks" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Blocks</h3><div class="sub">latest soil and leaf reading per block · tap one for its readings</div></div><span class="badge b-grey">'+blocks.length+'</span></div>';
  if(!blocks.length){
    html += '<div class="empty">No blocks recorded for this farm yet.</div>';
  } else {
    var maxHa = Math.max.apply(null, blocks.map(function(b){ return b.ha||0; }).concat([1]));
    html += '<div class="scroll"><table class="bb"><thead><tr><th>Block</th><th class="num">Ha</th><th>Latest results</th><th class="num">Open</th></tr></thead><tbody>';
    blocks.forEach(function(b){
      var bSoil = soil.filter(function(s){ return s.block===b.id; })
        .sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); })[0];
      var bLeaf = leaf.filter(function(l){ return l.block===b.id; })
        .sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); })[0];
      var res = '';
      if(bSoil && bSoil.status==='Interpreted' && bSoil.flag){
        var soilOk = /improv|maintain|balanced|good|hold/i.test(bSoil.flag);
        res += '<div class="flag'+(soilOk?' ok':'')+'"><span><b>Soil:</b> '+esc(bSoil.flag)+'</span></div>';
      }
      if(bLeaf && bLeaf.status==='Interpreted' && bLeaf.flag){
        var leafOk = /balanced|hold|good/i.test(bLeaf.flag);
        res += '<div class="flag'+(leafOk?' ok':'')+'"><span><b>Leaf:</b> '+esc(bLeaf.flag)+'</span></div>';
      }
      if(!res){
        var pend = [bSoil&&bSoil.status!=='Interpreted'?'soil '+bSoil.status.toLowerCase():'', bLeaf&&bLeaf.status!=='Interpreted'?'leaf '+bLeaf.status.toLowerCase():''].filter(Boolean).join(' · ');
        res = '<span class="faint" style="font-size:.78rem;">'+(pend? esc(pend) : 'no results yet')+'</span>';
      }
      html += '<tr class="click" data-block="'+esc(b.id)+'">'+
        '<td style="min-width:190px;"><b>'+esc(b.name)+'</b><div class="faint" style="font-size:.74rem;">'+esc(b.crop)+' · planted '+esc(b.planted)+'</div></td>'+
        '<td class="num"><div class="bar-cell"><span class="trk"><i style="width:'+Math.round((b.ha||0)/maxHa*100)+'%"></i></span><span>'+BB.num(b.ha)+'</span></div></td>'+
        '<td style="min-width:200px;">'+res+'</td>'+
        '<td class="num"><div class="blinks">'+
          '<a class="btn ghost sm" href="bioanalyze-soil.html?block='+encodeURIComponent(b.id)+'">Soil</a>'+
          '<a class="btn ghost sm" href="bioanalyze-leaf.html?block='+encodeURIComponent(b.id)+'">Leaf</a>'+
          '<a class="btn ghost sm" href="biowatch.html?block='+encodeURIComponent(b.id)+'">Monitor</a>'+
        '</div></td>'+
      '</tr>';
    });
    html += '</tbody>'+(blocks.length>1?'<tfoot><tr><td>'+blocks.length+' blocks</td><td class="num">'+BB.num(blockHa)+'</td><td colspan="2"></td></tr></tfoot>':'')+'</table></div>';
  }
  html += '</div>';

  // before you drive — the financial insight
  var sevIc = ti.sev==='ok'?'check':(ti.sev==='grey'?'user':'alert');
  html += '<div class="card" id="acct" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Before you drive</h3><div class="sub">is the trip worth it</div></div>'+BB.liveChip()+'</div><div class="card-p">'+
    '<div class="verdict '+esc(ti.sev)+'">'+BB.icon(sevIc)+esc(ti.verdict)+'</div>'+
    (ti.limit?'<div id="chCred" style="margin-bottom:14px;"></div>':'')+
    '<div class="kvl">'+
      '<span class="k">Credit limit</span><span class="v">'+(ti.limit?BB.money(ti.limit):'not set')+'</span>'+
      '<span class="k">Outstanding</span><span class="v"'+(ti.overdue?' style="color:var(--red);font-weight:700;"':'')+'>'+BB.money(ti.balance)+(ti.overdue?' · overdue':'')+'</span>'+
      '<span class="k">Credit open</span><span class="v">'+(ti.limit?BB.money(Math.max(0,ti.available)):'—')+'</span>'+
      '<span class="k">In the pipeline</span><span class="v">'+BB.money(ti.openPipeline)+'</span>'+
    '</div>'+
    // Call / WhatsApp / Capture order sit in the page head, one tap away from here.
  '</div></div>';
  html += '</div>';

  // left: the right questions, then programmes · right: orders, then files
  html += '<div class="grid g2" style="margin-top:16px;align-items:start;"><div class="stack">';
  var prep=(f.crops||[]).map(function(c){return d.cropPrep(c);}).filter(Boolean)[0];
  if(prep){
    html += '<div class="card"><div class="card-h"><div><h3>Ask the right questions</h3><div class="sub">'+esc(prep.crop)+(f.region?' in '+esc(f.region):'')+' · what this crop battles with, and what to ask before you recommend anything</div></div></div>'+
      '<div class="card-p prep"><h4>Watch for</h4><div class="row" style="gap:6px;margin-bottom:14px;">'+prep.problems.map(function(x){return '<span class="chip" style="cursor:default;">'+esc(x)+'</span>';}).join('')+'</div>'+
      '<h4>Ask</h4><ol>'+prep.questions.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ol>'+
      '<h4>BioBrix answer</h4><div class="row" style="gap:6px;">'+prep.products.map(function(pid){var pd=d.product(pid);return '<span class="chip" style="background:#eef6dc;cursor:default;">'+esc(pd.name)+'</span>';}).join('')+'</div></div></div>';
  } else {
    html += '<div class="card"><div class="card-h"><div><h3>Ask the right questions</h3></div></div><div class="card-p"><div class="muted" style="font-size:.86rem;">Crop prep notes land here once BioBrix’s crop data sets are loaded.</div></div></div>';
  }

  // BioConsult programmes
  html += '<div class="card"><div class="card-h"><div><h3>BioConsult programmes</h3><div class="sub">built from this farm’s soil and leaf results</div></div>'+
    '<a class="btn ghost sm" href="bioconsult.html?farmer='+encodeURIComponent(id)+'">Open BioConsult '+BB.icon('chevron')+'</a></div>';
  if(!programs.length){
    html += '<div class="empty">No programme built yet — start one from a soil or leaf result.</div>';
  } else {
    html += '<div class="scroll"><table class="bb"><thead><tr>'+
      '<th>Crop</th><th>Goal</th><th>Season</th><th>Status</th></tr></thead><tbody>';
    programs.forEach(function(p){
      html += '<tr class="click" data-prog="'+esc(p.id)+'">'+
        '<td><b>'+esc(p.crop)+'</b></td>'+
        '<td>'+esc(p.goal)+'</td>'+
        '<td>'+esc(p.season)+'</td>'+
        '<td>'+BB.statusBadge(p.status)+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div></div><div class="stack">';
  html += '<div class="card" id="ords" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Recent orders</h3><div class="sub">'+(orders.length>6?'latest 6 of '+orders.length:orders.length+' on record')+'</div></div>'+
    '<a class="btn ghost sm" href="orders.html">All orders '+BB.icon('chevron')+'</a></div>';
  if(!orders.length){
    html += '<div class="empty">No orders captured for this farm yet.</div>';
  } else {
    html += '<div class="scroll"><table class="bb"><thead><tr>'+
      '<th>Ref</th><th>Date</th><th>Delivery</th><th class="num">Value</th><th>Status</th></tr></thead><tbody>';
    orders.slice(0,6).forEach(function(o){
      html += '<tr class="click" data-order="'+esc(o.id)+'">'+
        '<td><b>'+esc(o.ref)+'</b></td>'+
        '<td class="dt">'+BB.date(o.date)+'</td>'+
        '<td>'+BB.monthName(o.deliverMonth)+'</td>'+
        '<td class="num">'+BB.money(d.orderValue(o))+'</td>'+
        '<td>'+BB.statusBadge(o.status)+'</td>'+
      '</tr>';
    });
    html += '</tbody>'+(orders.length>1?'<tfoot><tr><td colspan="3">Total'+(orders.length>6?' (shown)':'')+'</td><td class="num">'+BB.money(orders.slice(0,6).reduce(function(t,o){ return t+d.orderValue(o); },0))+'</td><td></td></tr></tfoot>':'')+'</table></div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-h"><div><h3>Farm files</h3><div class="sub">reports, programmes and delivery notes</div></div>'+
    '<a class="btn ghost sm" href="farm-files.html?farmer='+encodeURIComponent(id)+'">All files '+BB.icon('chevron')+'</a></div>';
  if(!files.length){
    html += '<div class="empty">No files stored for this farm yet.</div>';
  } else {
    html += '<div class="scroll"><table class="bb"><thead><tr>'+
      '<th>Document</th><th>Kind</th><th>Date</th><th class="num">Size</th></tr></thead><tbody>';
    files.forEach(function(x){
      html += '<tr class="click" data-file="'+esc(x.id)+'">'+
        '<td>'+esc(x.name)+'</td>'+
        '<td><span class="badge b-grey">'+esc(x.kind)+'</span></td>'+
        '<td class="dt">'+BB.date(x.date)+'</td>'+
        '<td class="num faint">'+esc(x.size)+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div></div></div>';

  html += '<div class="divider" style="margin-top:24px;"></div><div class="row" style="padding-bottom:20px;">'+
    '<a class="btn ghost" href="farms.html">Back to farms</a>'+
    '<a class="btn ghost" href="voice-order.html">'+BB.icon('mic')+'Capture an order</a>'+
  '</div>';

  document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');

  // credit used against the limit — straight from the account figures above
  try{
    if(ti.limit){
      var owedIn=Math.min(Math.max(0,ti.balance), ti.limit), overBy=Math.max(0, ti.balance-ti.limit), open=Math.max(0, ti.limit-ti.balance);
      BB.chart.hbar('#chCred', { money:true, rows:[{ label:'Credit used', display:Math.round(Math.max(0,ti.balance)/ti.limit*100)+'%',
        parts:[{name:'Owed', value:owedIn, color:'#3f6b28'},{name:'Over the limit', value:overBy, color:'#b8382a'},{name:'Credit still open', value:open, color:'#cfe0b8'}] }],
        legend:[{name:'Owed', color:'#3f6b28'},{name:'Over the limit', color:'#b8382a'},{name:'Still open', color:'#cfe0b8'}],
        // the account behind the bar: what is open, and what came in lately
        detail:function(){ return accountCard(); } });
    }
  }catch(e){ console.warn('chart', e); }

  // ---- popups: each row and figure shows its record over the page; the page it belongs to is a button ----
  var farmerId = id;
  function canGo(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } }
  function byDate(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); }
  function owingOf(i){ return i.outstanding!=null ? (+i.outstanding||0) : (+i.amount||0); }
  function ppTable(cols, rows, num, foot){
    num=num||[];
    var td=function(c,i){ return '<td'+(num.indexOf(i)>=0?' class="num"':'')+'>'+c+'</td>'; };
    return '<div class="scroll"><table class="bb" data-nofilter="1"><thead><tr>'+cols.map(function(c,i){ return '<th'+(num.indexOf(i)>=0?' class="num"':'')+'>'+esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr'+(r.href?' class="click" data-href="'+esc(r.href)+'"':'')+'>'+r.cells.map(td).join('')+'</tr>'; }).join('')+
      '</tbody>'+(foot?'<tfoot><tr>'+foot.map(td).join('')+'</tr></tfoot>':'')+'</table></div>';
  }
  function nw(t){ return '<span style="white-space:nowrap;">'+t+'</span>'; }
  function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
  function personMeta(rid, tip){ if(!rid || (u.roleKey==='advisor' && rid===u.rep)) return null; var rp=d.rep(rid); return rp&&rp.name? { initials:initialsOf(rp.name), color:rp.colour, text:rp.name, tip:tip } : null; }
  function openInv(){ return d.where('invoices', function(i){ return i.farmer===id && i.status!=='Paid' && owingOf(i)!==0; }).sort(byDate); }
  function invoicesHtml(){
    var inv=openInv();
    if(!inv.length) return '<div class="bbp-tt">Open invoices</div><div class="faint" style="font-size:.82rem;">'+
      (f.sageBalance!=null && f.sageBalance>0 ? 'No open invoice lines here — the balance is as your accounting system reports it.' : 'No open invoices.')+'</div>';
    var tot=inv.reduce(function(t,i){ return t+owingOf(i); },0);
    return '<div class="bbp-tt">Open invoices · '+inv.length+'</div>'+ppTable(['Invoice','Due','Status','Owing'],
      inv.slice(0,10).map(function(i){ return { cells:['<b style="white-space:nowrap;">'+esc(i.label||i.ref||'—')+'</b>'+(i.description && i.description!==(i.label||i.ref)?'<div class="faint" style="font-size:.72rem;">'+esc(i.description)+'</div>':''),
        i.dueDate?nw(BB.shortDate(i.dueDate)):'—', BB.statusBadge(i.status||'Outstanding'), BB.money(owingOf(i))] }; }), [3],
      inv.length>1? [inv.length>10?'All '+inv.length:'Total','','','<b>'+BB.money(tot)+'</b>'] : null);
  }
  // payments straight from the ledger when it is connected; otherwise the invoices marked paid
  function paymentsHtml(){
    var pays=d.where('payments', function(p){ return p.farmer===id; }).sort(byDate).slice(0,5)
      .map(function(p){ return { date:p.date, ref:p.ref||p.description||'Payment', amt:+p.amount||0 }; });
    if(!pays.length) pays=d.where('invoices', function(i){ return i.farmer===id && i.status==='Paid'; })
      .map(function(i){ return { date:i.paidDate||i.date, ref:(i.label||i.ref||'')+(i.description?' — '+i.description:''), amt:+i.amount||0 }; }).sort(byDate).slice(0,5);
    if(!pays.length) return '';
    return '<div class="bbp-tt">Recently paid</div>'+ppTable(['Date','Reference','Amount'], pays.map(function(p){ return { cells:[p.date?nw(BB.shortDate(p.date)):'—', esc(p.ref), BB.money(p.amt)] }; }), [2]);
  }
  function financeActs(){ return canGo('finance.html') ? [{ label:'Open in Finance', href:'finance.html' }] : []; }
  function toCard(sel){ return function(){ BB.closePopup(); var el=document.getElementById(sel); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }; }
  // the farm's account as a card: four figures, the verdict as one line, then what is open and what came in
  function accountCard(){
    var inv=openInv(), od=inv.filter(function(i){ return i.status==='Overdue'; });
    return { wide:true, layout:'split', color:null, sub:null, eyebrow:'Account', title:f.farm,
      meta:[ f.name && f.name!==f.farm? { icon:'user', text:f.name, tip:'Farmer' } : null, f.cell? { icon:'phone', tip:'Phone', html:'<a href="tel:'+esc(tel)+'">'+esc(f.cell)+'</a>' } : null ],
      stats:[{ l:'Outstanding', v:BB.money(ti.balance), s:ti.limit?'of '+BB.money(ti.limit)+' limit':'no credit limit set', cls:ti.overdue?'bad':(ti.sev==='warn'?'warn':'') },
        { l:'Overdue', v:BB.money(od.reduce(function(t,i){ return t+owingOf(i); },0)), s:od.length+' invoice'+(od.length===1?'':'s'), cls:od.length?'bad':'' },
        { l:'Credit open', v:ti.limit?BB.money(Math.max(0,ti.available)):'—', s:ti.limit? Math.min(999,Math.round(Math.max(0,ti.balance)/ti.limit*100))+'% used' : null },
        { l:'Pipeline', v:BB.money(ti.openPipeline), s:'forecast + pending' }],
      html:((ti.sev==='bad'||ti.sev==='warn')? '<div class="bbp-alert'+(ti.sev==='bad'?'':' warn')+'">'+BB.icon('alert')+esc(ti.verdict)+'</div>' : '')+invoicesHtml()+paymentsHtml(),
      actions:financeActs().concat([{ label:'Before you drive', primary:true, onClick:toCard('acct') }]) };
  }
  BB.statDetail('fdOwed', function(){ return accountCard(); });
  function orderHref(o){ return canGo('orders.html') ? 'orders.html?open='+encodeURIComponent(o.id) : null; }
  BB.statDetail('fdPipe', function(){
    var open=orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
    return { color:null, stats:[{ l:'In the pipeline', v:BB.money(ti.openPipeline), s:open.length+' open order'+(open.length===1?'':'s') }],
      table:{ columns:['Ref','Date','Delivery','Status','Value'], rows:open.map(function(o){ return { cells:[{ html:'<b>'+esc(o.ref)+'</b>' }, BB.shortDate(o.date), BB.monthName(o.deliverMonth), { html:BB.statusBadge(o.status) }, BB.money(d.orderValue(o))], href:orderHref(o) }; }), num:[4] },
      actions:[{ label:'Recent orders', onClick:toCard('ords') }].concat(canGo('orders.html')?[{ label:'All orders', href:'orders.html', primary:true }]:[]) };
  });
  // a sample row opens that sample's card on its own page
  function sampleRows(list){
    return list.slice().sort(byDate).map(function(x){ var b=d.by('blocks',x.block)||{name:'—'}, pg=x.kind==='Soil'?'bioanalyze-soil.html':'bioanalyze-leaf.html';
      return { cells:[esc(x.kind), '<b>'+esc(b.name)+'</b>', x.date?nw(BB.shortDate(x.date)):'—', BB.statusBadge(x.status), '<span style="font-size:.78rem;">'+esc(x.flag||'—')+'</span>'].map(function(h){ return { html:h }; }),
        href: canGo(pg) ? pg+'?open='+encodeURIComponent(x.id) : null }; });
  }
  BB.statDetail('fdSamples', function(){
    var list=soil.map(function(s){ return Object.assign({ kind:'Soil' }, s); }).concat(leaf.map(function(l){ return Object.assign({ kind:'Leaf' }, l); }));
    var open=list.filter(function(x){ return x.status!=='Interpreted'; }).length;
    return { color:null, stats:[{ l:'Samples', v:String(list.length), s:soil.length+' soil · '+leaf.length+' leaf' }, { l:'To interpret', v:String(open), cls:open?'warn':'' }],
      table:{ columns:['Type','Block','Sampled','Status','Reading'], rows:sampleRows(list) },
      actions:[{ label:'Blocks', primary:true, onClick:toCard('blks') }] };
  });
  // a block: its latest soil and leaf readings, the last walk and the programme on it
  function blockPopup(bid){
    var b=d.by('blocks',bid); if(!b) return;
    var s=soil.filter(function(x){ return x.block===bid; }).sort(byDate)[0], l=leaf.filter(function(x){ return x.block===bid; }).sort(byDate)[0];
    var w=d.where('watch', function(x){ return x.block===bid; }).sort(byDate)[0], pr=programs.filter(function(x){ return x.block===bid; })[0];
    var reading=function(x, kind, fields){
      if(!x) return '<div class="bbp-tt">'+kind+'</div><div class="faint" style="font-size:.82rem;">No '+kind.toLowerCase()+' sample yet.</div>';
      var h='<div class="bbp-tt">'+kind+' · '+BB.date(x.date)+'</div>';
      if(x.status!=='Interpreted') return h+'<div class="bbp-bar" style="margin-top:0;">'+BB.statusBadge(x.status)+'<span class="faint">'+esc(x.flag||'Readings appear once interpreted.')+'</span></div>';
      h+=ppTable(fields.map(function(q){ return q[0]; }), [{ cells:fields.map(function(q){ return x[q[1]]!=null? esc(x[q[1]]) : '—'; }) }]);
      var ok=/improv|maintain|balanced|good|hold/i.test(x.flag||'');
      return h+'<div class="bbp-bar interp'+(ok?' ok':'')+'"><span><b>Interpretation:</b> '+esc(x.flag||'—')+'</span></div>';
    };
    var low=s && s.status==='Interpreted' && /low/i.test(s.microbial||'') && !/biology/i.test(s.flag||'');
    var html=(low?'<div class="bbp-alert warn">'+BB.icon('alert')+'Low biology on the last soil read — feed the soil life first</div>':'')+
      reading(s,'Soil',[['pH','ph'],['OM','om'],['Ca:Mg','ca_mg'],['Microbial','microbial'],['P','p']])+
      reading(l,'Leaf',[['N','n'],['K','k'],['Ca','ca']]);
    if(w) html+='<div class="bbp-tt">Last field check · '+BB.date(w.date)+'</div><div style="font-size:.84rem;">'+esc(w.stage||'Field check')+(w.pest?' · '+esc(w.pest):'')+(w.note?'<div class="faint" style="margin-top:3px;">'+esc(w.note)+'</div>':'')+'</div>';
    var acts=[];
    if(canGo('biowatch.html')) acts.push({ label:'Monitor', href:'biowatch.html?block='+encodeURIComponent(bid) });
    if(canGo('bioanalyze-soil.html')) acts.push({ label:'Soil & leaf results', href:'bioanalyze-soil.html?block='+encodeURIComponent(bid), primary:true });
    var nS=soil.filter(function(x){ return x.block===bid; }).length, nL=leaf.filter(function(x){ return x.block===bid; }).length;
    var vig={Excellent:'',Good:'',Fair:'warn',Poor:'bad'};
    BB.popup({ wide:true, layout:'split', eyebrow:'Block', title:b.name,
      meta:[ { icon:'farm', text:f.farm, tip:'Farm' }, b.crop? { icon:'sprout', text:b.crop, tip:'Crop' } : null, b.planted? { icon:'calendar', text:'Planted '+b.planted, tip:'Planted' } : null,
        pr? { icon:'clipboard', text:pr.goal||'Programme', tip:'Programme', href:canGo('bioconsult.html')?'bioconsult.html?open='+encodeURIComponent(pr.id):null } : { icon:'clipboard', text:'No programme yet', muted:true, tip:'Programme' } ],
      stats:[{ l:'Area', v:b.ha? BB.num(b.ha)+' ha' : '—' }, { l:'Samples', v:String(nS+nL), s:nS+' soil · '+nL+' leaf' },
        { l:'Programme', html:pr? BB.statusBadge(pr.status) : '<span class="faint">None</span>', s:pr? pr.season : null },
        { l:'Vigour', v:w? (w.vigour||'—') : '—', s:w? 'walked '+BB.shortDate(w.date) : 'not walked yet', cls:w? (vig[w.vigour]||'') : '' }],
      html:html, actions:acts });
  }
  function progPopup(pid){
    var p=d.by('programs',pid); if(!p) return;
    var b=d.by('blocks',p.block)||{name:'—'}, v=(p.lines||[]).reduce(function(t,l){ return t+(l.cost||0); },0);
    BB.popup({ wide:true, layout:'split', eyebrow:'Programme', title:p.goal||(p.crop+' programme'),
      meta:[ { icon:'leaf', text:b.name, tip:'Block' }, p.crop? { icon:'sprout', text:p.crop, tip:'Crop' } : null, p.season? { icon:'calendar', text:'Season '+p.season, tip:'Season' } : null, personMeta(p.advisor, 'Advisor') ],
      stats:[{ l:'Status', html:BB.statusBadge(p.status) }, { l:'Value', v:BB.money(v), s:'the season' }, { l:'Per hectare', v:b.ha? BB.money(Math.round(v/b.ha)) : '—', s:b.ha? BB.num(b.ha)+' ha' : null }, { l:'Lines', v:String((p.lines||[]).length), s:'products' }],
      html:'<div class="bbp-tt">Products</div>',
      table:{ columns:['Product','Rate','Timing','Cost'], rows:(p.lines||[]).map(function(l){ var pr=d.product(l.prod); return [{ html:'<b>'+esc(pr.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(pr.lever||'')+'</div>' }, l.rate||'—', l.timing||'—', BB.money(l.cost||0)]; }), num:[3], foot:['Total',{ html:'' },{ html:'' },BB.money(v)] },
      actions: canGo('bioconsult.html') ? [{ label:'Open programme', href:'bioconsult.html?open='+encodeURIComponent(p.id), primary:true }] : [] });
  }
  // an order opens its own card on the Orders page; a seat without Orders gets the order in brief here
  function orderPopup(oid){
    var o=d.by('orders',oid); if(!o) return;
    if(canGo('orders.html')){ location.href='orders.html?open='+encodeURIComponent(o.id); return; }
    var del=d.where('deliveries', function(x){ return x.order===o.id; })[0];
    BB.popup({ eyebrow:'Order · '+(o.source||'Portal'), title:o.ref,
      meta:[ { icon:'calendar', text:'Captured '+BB.date(o.date), tip:'Captured' }, personMeta(o.rep, 'Rep') ],
      stats:[{ l:'Value', v:BB.money(d.quoteStatus(o)?d.quoteTotal(o):d.orderValue(o)) }, { l:'Status', html:BB.statusBadge(o.status) }, { l:'Delivery', v:BB.monthName(o.deliverMonth), s:del? del.status.toLowerCase() : 'not booked' }],
      table:{ columns:['Product','Qty','Value'], rows:(o.lines||[]).map(function(l){ var pr=d.product(l.prod); return [{ html:'<b>'+esc(pr.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(pr.pack||'')+'</div>' }, BB.num(l.qty), BB.money((pr.price||0)*(l.qty||0))]; }), num:[1,2] } });
  }
  function filePopup(fid){
    var x=d.by('files',fid); if(!x) return;
    var docHref='document.html?farmer='+encodeURIComponent(farmerId)+'&kind='+encodeURIComponent(x.kind||'Document')+'&name='+encodeURIComponent(x.name||'');
    BB.popup({ eyebrow:'Farm file · '+(x.kind||'Document'), title:x.name,
      meta:[ { icon:'farm', text:f.farm, tip:'Farm' }, x.date? { icon:'calendar', text:'Filed '+BB.date(x.date), tip:'Filed' } : null, x.size&&x.size!=='—'? { icon:'file', text:x.size, tip:'Size' } : null ],
      actions:(canGo('farm-files.html')?[{ label:'All files for this farm', href:'farm-files.html?farmer='+encodeURIComponent(farmerId) }]:[]).concat([{ label:'Open document', href:docHref, primary:true }]) });
  }
  function rowClick(attr, fn){
    Array.prototype.forEach.call(document.querySelectorAll('tr['+attr+']'), function(row){
      row.onclick=function(e){ if(e.target.closest('a,button')) return; fn(row.getAttribute(attr)); };
    });
  }
  rowClick('data-block', blockPopup);
  rowClick('data-prog', progPopup);
  rowClick('data-order', orderPopup);
  rowClick('data-file', filePopup);
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
