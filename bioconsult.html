<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioConsult · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign6"></script><script src="guard.js?v=redesign6"></script>
<script src="bb-data.js?v=redesign6"></script>
<script src="bb-shell.js?v=redesign6"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var params = new URLSearchParams(location.search);
var preFarmer = params.get('farmer') || '';
var preBlock = params.get('block') || '';
var preOpen = params.get('open') || '';   // a programme opened from a popup elsewhere (farm record)

var css=''+
'.prog{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}'+
'.prog .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);}'+
'.prog .pb{padding:18px 22px 6px;}'+
'.prog .pf{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line-soft);font-size:.76rem;color:var(--faint);}'+
'.goal{padding:14px 16px;border-left:3px solid var(--green-bright);background:#f7faf1;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:6px;}'+
'.klabel{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);}'+
'.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;}'+
'.facts .v{font-family:var(--display);font-weight:600;font-size:1.02rem;color:var(--green-darkest);margin-top:2px;}'+
'.line-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line-soft);}'+
'.line-row:first-child{border-top:0;padding-top:0;}'+
'@media(max-width:640px){.line-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}.line-row .fld:first-child{grid-column:1/-1;}}'+
'.tot{font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--green-darkest);letter-spacing:-.4px;}'+
'@media print{#bbNav,.bb-top,.bb-nav,.bb-scope,.noprint{display:none!important;}body{padding:0!important;}.split{display:block!important;}}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

function inMyScope(p){
  if(u.roleKey==='director' || !u.rep) return true;
  return p.advisor===u.rep;
}
function progValue(p){ return (p.lines||[]).reduce(function(s,l){ return s+(l.cost||0); },0); }

var state={ view:'list', open:null };
var chartJobs=[];

// ---- popups: the programmes behind a figure or a chart part. A row opens that programme here. ----
function openProg(id){ BB.closePopup(); state.view='detail'; state.open=id; paint(); window.scrollTo(0,0); }
function progRows(list, valueOf){
  valueOf=valueOf||progValue;
  return list.map(function(p){ var f=d.farmer(p.farmer), b=d.by('blocks',p.block)||{name:'—'};
    return [{ html:'<b>'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(b.name)+'</div>' }, (p.crop||'—')+' · '+(p.season||'—'), { html:BB.statusBadge(p.status) }, BB.money(valueOf(p))]; });
}
function progDetail(list, opts){
  opts=opts||{}; var valueOf=opts.valueFn||progValue;
  list=list.slice().sort(function(a,b){ return valueOf(b)-valueOf(a); });
  var tot=list.reduce(function(t,p){ return t+valueOf(p); },0);
  var rows=progRows(list, valueOf);
  if(list.length>1) rows.push([{ html:'<b>'+list.length+' programmes</b>' }, '', '', { html:'<b>'+BB.money(tot)+'</b>' }]);
  return { color:null, sub:null, table:{ columns:['Farm · block','Crop · season','Status',opts.valueLabel||'Value'], rows:rows, num:[3] },
    onOpen:function(body){ body.querySelectorAll('tbody tr').forEach(function(tr,i){ var p=list[i]; if(!p) return; tr.classList.add('click'); tr.onclick=function(){ openProg(p.id); }; }); },
    total:tot, count:list.length };
}
function toProgList(){ BB.closePopup(); var el=document.getElementById('progList'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
['pcActive','pcDraft'].forEach(function(k){
  BB.statDetail(k, function(){
    var want=k==='pcActive'?'Active':'Draft', list=d.all('programs').filter(inMyScope).filter(function(p){ return p.status===want; });
    var x=progDetail(list);
    return Object.assign(x, { stats:[{ l:'Programmes', v:String(x.count) }, { l:'Value', v:BB.money(x.total) }],
      actions:[{ label:'Open the full list', primary:true, onClick:toProgList }] });
  });
});
function leverValue(lever){ return function(p){ return (p.lines||[]).filter(function(l){ return (d.product(l.prod).lever||'Other')===lever; }).reduce(function(t,l){ return t+(l.cost||0); },0); }; }
var LEVER_COL={ Biology:'#3f6b28', Chemistry:'#2f6f9e', Physics:'#c77d17' };
function leverSplit(list){
  var t={};
  list.forEach(function(p){ (p.lines||[]).forEach(function(l){ var lv=d.product(l.prod).lever||'Other'; t[lv]=(t[lv]||0)+(l.cost||0); }); });
  return Object.keys(t).map(function(k){ return { label:k, value:t[k], color:LEVER_COL[k]||'#6b7a5e' }; }).sort(function(a,b){ return b.value-a.value; });
}

function programmes(){
  return d.all('programs').filter(inMyScope).sort(function(a,b){
    if(a.status===b.status) return 0; return a.status==='Active'?-1:1;
  });
}

function statRow(){
  var list=d.all('programs').filter(inMyScope);
  var active=list.filter(function(p){ return p.status==='Active'; }).length;
  var drafts=list.filter(function(p){ return p.status==='Draft'; }).length;
  var tot=list.reduce(function(s,p){ return s+progValue(p); },0);
  var seen={}, ha=0;
  list.forEach(function(p){ if(seen[p.block]) return; seen[p.block]=1; var b=d.by('blocks',p.block); ha+=(b&&b.ha)||0; });
  return '<div class="grid g4" style="margin-top:14px;">'+
    '<a class="stat tap" href="#progList" data-detail="pcActive"><div class="l">Active programmes</div><div class="v">'+active+'</div><div class="s">running this season</div></a>'+
    '<a class="stat tap'+(drafts?' warn':'')+'" href="#progList" data-detail="pcDraft"><div class="l">Drafts</div><div class="v">'+drafts+'</div><div class="s">awaiting sign-off</div></a>'+
    '<div class="stat"><div class="l">Programme value</div><div class="v">'+BB.money(tot)+'</div><div class="s">across all programmes</div></div>'+
    '<div class="stat"><div class="l">Hectares on a programme</div><div class="v">'+BB.num(ha)+'</div><div class="s">'+Object.keys(seen).length+' block'+(Object.keys(seen).length===1?'':'s')+'</div></div>'+
  '</div>';
}

function renderList(){
  var list=programmes();
  var html='';
  html += '<div class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">BioServices · BioConsult</div><h1>Programmes &amp; recommendations</h1>'+
    '<p>Soil and leaf data become a regenerative programme for the block: the right products, rates and timing, costed for the farmer.</p></div>'+
    '<div class="row"><button class="btn" id="newBtn">'+BB.icon('plus')+'Build a recommendation</button></div></div>';
  html += statRow();

  var maxV = Math.max.apply(null, list.map(progValue).concat([1]));
  var totV = list.reduce(function(s,p){ return s+progValue(p); },0);

  html += '<div class="split" style="margin-top:16px;align-items:start;">';
  html += '<div style="display:grid;gap:16px;min-width:0;">';
  html += '<div class="card" id="progList" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Programmes</h3><div class="sub">active first · tap one for the full programme</div></div><span class="badge b-grey">'+list.length+'</span></div>';
  if(!list.length){
    html += '<div class="empty">No programmes yet. Build the first recommendation.</div>';
  } else {
    html += '<div class="scroll'+(list.length>12?' tall':'')+'"><table class="bb"><thead><tr><th>Farm · block</th><th>Crop · season</th><th>Goal</th><th>Status</th><th class="num">Lines</th><th class="num">Value</th></tr></thead><tbody>';
    list.forEach(function(p){
      var f=d.farmer(p.farmer); var b=d.by('blocks',p.block)||{name:'—'};
      var v=progValue(p);
      html += '<tr class="click" data-open="'+p.id+'">'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.74rem;">'+BB.esc(b.name)+'</div></td>'+
        '<td class="muted">'+BB.esc(p.crop||'—')+'<div class="faint" style="font-size:.74rem;">'+BB.esc(p.season||'—')+'</div></td>'+
        '<td style="font-size:.82rem;max-width:240px;">'+BB.esc(p.goal||'—')+'</td>'+
        '<td>'+BB.statusBadge(p.status)+'</td>'+
        '<td class="num muted">'+(p.lines||[]).length+'</td>'+
        '<td class="num"><div class="bar-cell" style="min-width:150px;"><span class="trk"><i style="width:'+Math.round(v/maxV*100)+'%;'+(p.status==='Active'?'':'background:#b9c4ad;')+'"></i></span><b>'+BB.money(v)+'</b></div></td>'+
      '</tr>';
    });
    html += '</tbody><tfoot><tr><td colspan="5">Total</td><td class="num">'+BB.money(totV)+'</td></tr></tfoot></table></div>';
  }
  html += '</div>';

  // which products the programmes lean on, by value
  var byProd={};
  list.forEach(function(p){ (p.lines||[]).forEach(function(l){ byProd[l.prod]=(byProd[l.prod]||0)+(l.cost||0); }); });
  var prodRows=Object.keys(byProd).map(function(k){ var pr=d.product(k); return { id:k, label:pr.name, sub:pr.lever||'', value:byProd[k], color:LEVER_COL[pr.lever]||'#3f6b28' }; })
    .sort(function(a,b){ return b.value-a.value; }).slice(0,8);
  if(prodRows.length){
    html += '<div class="card"><div class="card-h"><div><h3>Products recommended</h3><div class="sub">programme value per product</div></div></div><div class="card-p"><div id="chProd"></div></div></div>';
    chartJobs.push(function(){ BB.chart.hbar('#chProd',{ rows:prodRows, money:true, valueLabel:'Programme value', legend:[{name:'Biology',color:LEVER_COL.Biology},{name:'Chemistry',color:LEVER_COL.Chemistry},{name:'Physics',color:LEVER_COL.Physics}],
      // the programmes that use this product, with its rate and timing in each
      detail:function(ctx){
        var pid=ctx.row.id, pr=d.product(pid), uses=list.filter(function(p){ return (p.lines||[]).some(function(l){ return l.prod===pid; }); });
        var lineOf=function(p){ return (p.lines||[]).filter(function(l){ return l.prod===pid; }); };
        var cost=function(p){ return lineOf(p).reduce(function(t,l){ return t+(l.cost||0); },0); };
        uses.sort(function(a,b){ return cost(b)-cost(a); });
        var sup=d.supplier(pr.supplier)||{}, tot=uses.reduce(function(t,p){ return t+cost(p); },0), lib=BB.auth && BB.auth.canPage && BB.auth.canPage('products-library.html');
        return { wide:true, layout:'split', color:null, sub:null, eyebrow:'Product'+(pr.lever?' · '+pr.lever:''), title:pr.name,
          meta:[ { icon:'package', text:[pr.code, pr.pack].filter(Boolean).join(' · '), tip:'Code · pack' }, pr.cat && pr.cat!==pr.lever? { icon:'tag', text:pr.cat, tip:'Category' } : null,
            sup.name? { icon:'link', text:sup.name, tip:'Supplier', html:BB.esc(sup.name)+(sup.lead!=null?'<small>'+sup.lead+' days lead</small>':'') } : null,
            { icon:'receipt', text:BB.money(pr.price)+' per '+(pr.unit||'unit'), tip:'Price' } ],
          stats:[{ l:'Programmes', v:String(uses.length), s:uses.filter(function(p){ return p.status==='Active'; }).length+' active' }, { l:'Value', v:BB.money(tot), s:'across them' }],
          html:'<div class="bbp-tt">Where it is recommended</div>',
          table:{ columns:['Farm · block','Status','Rate','Timing','Cost'], rows:uses.map(function(p){ var f=d.farmer(p.farmer), b=d.by('blocks',p.block)||{name:'—'}, ls=lineOf(p);
            return [{ html:'<b>'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(b.name)+'</div>' }, { html:BB.statusBadge(p.status) }, ls.map(function(l){ return l.rate||'—'; }).join(', '), ls.map(function(l){ return l.timing||'—'; }).join(', '), BB.money(cost(p))]; }), num:[4] },
          note: pr.sheet || null,
          onOpen:function(body){ body.querySelectorAll('tbody tr').forEach(function(tr,i){ var p=uses[i]; if(!p) return; tr.classList.add('click'); tr.onclick=function(){ openProg(p.id); }; }); },
          actions: lib ? [{ label:'Product library', href:'products-library.html?open='+encodeURIComponent(pid), primary:true }] : [] };
      } }); });
  }
  html += '</div>';

  // right: status mix and the three levers
  var st={}; list.forEach(function(p){ st[p.status]=(st[p.status]||0)+1; });
  var ST_COL={ Active:'#3f6b28', Draft:'#c77d17' };
  var stRows=Object.keys(st).map(function(k){ return { label:k, value:st[k], color:ST_COL[k] }; });
  var lv=leverSplit(list);
  html += '<div style="display:grid;gap:16px;min-width:0;">';
  html += '<div class="card"><div class="card-h"><div><h3>Programme status</h3><div class="sub">number of programmes</div></div></div><div class="card-p">'+(list.length?'<div id="chStatus"></div>':'<div class="empty" style="padding:20px;">Nothing yet.</div>')+'</div></div>';
  html += '<div class="card"><div class="card-h"><div><h3>The three levers</h3><div class="sub">programme value by lever</div></div></div><div class="card-p">'+(lv.length?'<div id="chLever"></div>':'<div class="empty" style="padding:20px;">Nothing yet.</div>')+'</div></div>';
  html += '</div></div>';
  if(list.length) chartJobs.push(function(){ BB.chart.donut('#chStatus',{ rows:stRows, centreLabel:'total', size:136, valueLabel:'Programmes',
    detail:function(ctx){ return progDetail(list.filter(function(p){ return p.status===ctx.row.label; })); } }); });
  if(lv.length) chartJobs.push(function(){ BB.chart.donut('#chLever',{ rows:lv, money:true, centreLabel:'value', size:136, valueLabel:'Programme value',
    // the programmes that carry this lever, valued by their lines in it
    detail:function(ctx){ var vf=leverValue(ctx.row.label);
      return progDetail(list.filter(function(p){ return vf(p)>0; }), { valueFn:vf, valueLabel:ctx.row.label+' value' }); } }); });
  return html;
}

function renderDetail(id){
  var p=d.by('programs',id); if(!p) return renderList();
  var f=d.farmer(p.farmer); var b=d.by('blocks',p.block)||{name:'—',crop:'—'};
  var adv=d.rep(p.advisor);

  var html='';
  html += '<div class="page-head row between noprint" style="gap:16px;">'+
    '<div><div class="eyebrow">BioConsult · programme</div><h1>'+BB.esc(f.farm)+'</h1>'+
    '<p>'+BB.esc(b.name)+' · '+BB.esc(p.crop||'')+' · '+BB.esc(p.season||'')+'</p></div>'+
    '<div class="row"><button class="btn ghost" id="backList">All programmes</button><button class="btn" id="printProg">'+BB.icon('file')+'Print / share with farmer</button></div></div>';

  html += '<div class="split" style="margin-top:14px;align-items:start;">';
  html += '<div class="prog" id="progCard">';
  html += '<div class="ph">'+
    '<div><div class="eyebrow">BioConsult programme</div>'+
      '<div style="font-family:var(--display);font-size:1.3rem;font-weight:600;color:var(--green-darkest);">'+BB.esc(f.farm)+'</div>'+
      '<div class="muted" style="font-size:.85rem;">'+BB.esc(f.name)+' · '+BB.esc(b.name)+' · '+BB.esc(p.crop||'')+' · '+BB.esc(p.season||'')+'</div></div>'+
    '<div>'+BB.statusBadge(p.status)+'</div>'+
  '</div>';
  html += '<div class="pb"><div class="goal"><div class="klabel">Programme goal</div><div style="font-size:.98rem;margin-top:3px;">'+BB.esc(p.goal||'—')+'</div></div></div>';

  html += '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th>Rate</th><th>Timing</th><th class="num">Line cost</th></tr></thead><tbody>';
  (p.lines||[]).forEach(function(l){
    var pr=d.product(l.prod);
    html += '<tr>'+
      '<td><b style="color:var(--green-dark);">'+BB.esc(pr.name)+'</b>'+(pr.lever?'<div class="faint" style="font-size:.72rem;">'+BB.esc(pr.lever)+'</div>':'')+'</td>'+
      '<td class="muted">'+BB.esc(pr.code)+'</td>'+
      '<td class="muted">'+BB.esc(l.rate||'—')+'</td>'+
      '<td class="muted">'+BB.esc(l.timing||'—')+'</td>'+
      '<td class="num">'+BB.money(l.cost||0)+'</td>'+
    '</tr>';
  });
  html += '</tbody><tfoot><tr><td colspan="4">Total programme value</td><td class="num" style="color:var(--green-dark);">'+BB.money(progValue(p))+'</td></tr></tfoot></table></div>';

  html += '<div class="pf"><span>Prepared by '+BB.esc(adv.name)+' · '+BB.esc(adv.role||'Crop Advisor')+'</span><span>BioBrix · The Biological Way</span></div>';
  html += '</div>';

  // right: the block it is for, and where the money goes
  var lv=leverSplit([p]);
  var ha=(b&&b.ha)||0;
  html += '<div style="display:grid;gap:16px;min-width:0;" class="noprint">';
  html += '<div class="card"><div class="card-h"><div><h3>The block</h3><div class="sub">'+BB.esc(b.name)+'</div></div></div><div class="card-p"><div class="facts">'+
    '<div><div class="klabel">Crop</div><div class="v">'+BB.esc(b.crop||p.crop||'—')+'</div></div>'+
    '<div><div class="klabel">Area</div><div class="v">'+(ha?BB.num(ha)+' ha':'—')+'</div></div>'+
    '<div><div class="klabel">Planted</div><div class="v">'+BB.esc(b.planted||'—')+'</div></div>'+
    '<div><div class="klabel">Per hectare</div><div class="v">'+(ha?BB.money(Math.round(progValue(p)/ha)):'—')+'</div></div>'+
  '</div></div><div class="card-f"><a href="biowatch.html?block='+encodeURIComponent(p.block)+'" style="color:var(--green-dark);font-weight:600;">BioWatch visits on this block ›</a></div></div>';
  html += '<div class="card"><div class="card-h"><div><h3>Where the money goes</h3><div class="sub">by lever</div></div></div><div class="card-p">'+(lv.length?'<div id="chPLever"></div>':'<div class="empty" style="padding:20px;">No product lines.</div>')+'</div></div>';
  html += '</div></div>';
  if(lv.length) chartJobs.push(function(){ BB.chart.donut('#chPLever',{ rows:lv, money:true, centreLabel:'total', size:136, valueLabel:'Value',
    // this programme's product lines in that lever
    detail:function(ctx){ var ls=(p.lines||[]).filter(function(l){ return (d.product(l.prod).lever||'Other')===ctx.row.label; });
      return { table:{ columns:['Product','Rate','Timing','Cost'], rows:ls.map(function(l){ var pr=d.product(l.prod); return [{ html:'<b>'+BB.esc(pr.name)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(pr.code||'')+'</div>' }, l.rate||'—', l.timing||'—', BB.money(l.cost||0)]; }), num:[3] } }; } }); });
  return html;
}

var draftLines=[]; // {prod, rate, timing, cost}

function renderForm(){
  var farmers=d.all('farmers');
  var blocks=d.all('blocks');
  var products=d.all('products');
  if(!draftLines.length) draftLines=[{prod:products[0].id, rate:'', timing:'', cost:0}];

  var html='';
  html += '<div class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">BioConsult · new programme</div><h1>Build a recommendation</h1><p>Frame the regenerative programme for a block: the products, rates and timing, costed as you build it.</p></div>'+
    '<div class="row"><button class="btn ghost" id="backList2">All programmes</button></div></div>';
  html += '<div class="split" style="margin-top:14px;align-items:start;">';
  html += '<div style="display:grid;gap:16px;min-width:0;">';
  html += '<div class="card"><div class="card-h"><div><h3>Farm and block</h3><div class="sub">who the programme is for</div></div></div><div class="card-p">';
  html += '<div class="grid g2">';
  html += '<div class="fld"><label>Farmer</label><select id="fFarmer">'+
    farmers.map(function(f){ return '<option value="'+f.id+'"'+(f.id===preFarmer?' selected':'')+'>'+BB.esc(f.farm)+' — '+BB.esc(f.name)+'</option>'; }).join('')+'</select></div>';
  html += '<div class="fld"><label>Block</label><select id="fBlock"></select></div>';
  html += '<div class="fld"><label>Crop</label><input id="fCrop" placeholder="e.g. Macadamia"></div>';
  html += '<div class="fld"><label>Season</label><input id="fSeason" value="2026/27"></div>';
  html += '</div>';
  html += '<div class="fld" style="margin-bottom:0;"><label>Programme goal</label><textarea id="fGoal" rows="2" placeholder="e.g. Rebuild biology + correct pH"></textarea></div>';
  html += '</div></div>';

  html += '<div class="card"><div class="card-h"><div><h3>Product lines</h3><div class="sub">line cost estimates at the block area × product price</div></div>'+
    '<button class="btn ghost sm" id="addLine">'+BB.icon('plus')+'Add product</button></div><div class="card-p">';
  html += '<div id="lines"></div>';
  html += '</div></div>';
  html += '</div>';

  html += '<div class="card" style="position:sticky;top:calc(var(--top) + 16px);"><div class="card-h"><div><h3>Estimated value</h3><div class="sub">updates as you build</div></div></div><div class="card-p">'+
    '<div id="lineTotal" class="tot">R0</div>'+
    '<p class="faint" style="font-size:.78rem;margin-top:6px;">Adjust the rate and timing in your own words. It saves as a draft for sign-off.</p>'+
    '<button class="btn block" id="saveProg" style="margin-top:14px;">'+BB.icon('check')+'Save programme (draft)</button>'+
  '</div></div>';
  html += '</div>';
  return html;
}

function blockHa(blockId){ var b=d.by('blocks',blockId); return (b&&b.ha)||1; }

function lineCost(blockId, prodId){
  var pr=d.product(prodId); var ha=blockHa(blockId);
  return Math.round((pr.price||0)*(ha||1));
}

function refreshBlockOptions(){
  var fSel=document.getElementById('fFarmer'); if(!fSel) return;
  var farmerId=fSel.value;
  var bSel=document.getElementById('fBlock');
  var bl=d.where('blocks',function(b){ return b.farmer===farmerId; });
  bSel.innerHTML=bl.length ? bl.map(function(b){ return '<option value="'+b.id+'"'+(b.id===preBlock?' selected':'')+'>'+BB.esc(b.name)+' · '+BB.esc(b.crop)+' · '+b.ha+' ha</option>'; }).join('')
    : '<option value="">No blocks on this farm</option>';
  // prefill crop from selected block
  var chosen=d.by('blocks',bSel.value);
  if(chosen && !document.getElementById('fCrop').value){ document.getElementById('fCrop').value=chosen.crop||''; }
  recost();
}

function renderLines(){
  var products=d.all('products');
  var wrap=document.getElementById('lines'); if(!wrap) return;
  wrap.innerHTML=draftLines.map(function(l,i){
    return '<div class="line-row" data-i="'+i+'">'+
      '<div class="fld" style="margin:0;"><label>Product</label><select class="lProd">'+
        products.map(function(p){ return '<option value="'+p.id+'"'+(p.id===l.prod?' selected':'')+'>'+BB.esc(p.name)+' ('+BB.esc(p.lever)+')</option>'; }).join('')+
      '</select></div>'+
      '<div class="fld" style="margin:0;"><label>Rate</label><input class="lRate" value="'+BB.esc(l.rate)+'" placeholder="5 L/ha"></div>'+
      '<div class="fld" style="margin:0;"><label>Timing</label><input class="lTiming" value="'+BB.esc(l.timing)+'" placeholder="Planting rain"></div>'+
      '<div class="fld" style="margin:0;"><button type="button" class="btn ghost lDel" title="Remove this line" aria-label="Remove this line">Remove</button></div>'+
    '</div>';
  }).join('');
  wireLines();
}

function wireLines(){
  var wrap=document.getElementById('lines'); if(!wrap) return;
  Array.prototype.forEach.call(wrap.querySelectorAll('.line-row'), function(row){
    var i=Number(row.getAttribute('data-i'));
    row.querySelector('.lProd').onchange=function(){ draftLines[i].prod=this.value; recost(); };
    row.querySelector('.lRate').oninput=function(){ draftLines[i].rate=this.value; };
    row.querySelector('.lTiming').oninput=function(){ draftLines[i].timing=this.value; };
    row.querySelector('.lDel').onclick=function(){ if(draftLines.length>1){ draftLines.splice(i,1); renderLines(); recost(); } };
  });
}

function recost(){
  var bSel=document.getElementById('fBlock'); if(!bSel) return;
  var blockId=bSel.value;
  var tot=0;
  draftLines.forEach(function(l){ l.cost=lineCost(blockId,l.prod); tot+=l.cost; });
  var tEl=document.getElementById('lineTotal'); if(tEl) tEl.textContent=BB.money(tot);
}

function paint(){
  var html;
  chartJobs=[];
  if(state.view==='detail') html=renderDetail(state.open);
  else if(state.view==='form') html=renderForm();
  else html=renderList();
  document.querySelector('main.wrap').innerHTML=html;
  chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });
  wire();
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-open]'), function(tr){
    tr.onclick=function(){ state.view='detail'; state.open=tr.getAttribute('data-open'); paint(); window.scrollTo(0,0); };
  });
  var nb=document.getElementById('newBtn'); if(nb) nb.onclick=function(){ state.view='form'; draftLines=[]; paint(); window.scrollTo(0,0); };
  var bl=document.getElementById('backList'); if(bl) bl.onclick=function(){ state.view='list'; paint(); };
  var bl2=document.getElementById('backList2'); if(bl2) bl2.onclick=function(){ state.view='list'; paint(); };
  var pp=document.getElementById('printProg'); if(pp) pp.onclick=function(){ window.print(); };

  if(state.view==='form'){
    renderLines();
    refreshBlockOptions();
    document.getElementById('fFarmer').onchange=function(){ document.getElementById('fCrop').value=''; refreshBlockOptions(); };
    document.getElementById('fBlock').onchange=function(){
      var chosen=d.by('blocks',this.value); if(chosen){ document.getElementById('fCrop').value=chosen.crop||''; }
      recost();
    };
    document.getElementById('addLine').onclick=function(){
      draftLines.push({prod:d.all('products')[0].id, rate:'', timing:'', cost:0}); renderLines(); recost();
    };
    document.getElementById('saveProg').onclick=saveProg;
  }
}

function saveProg(){
  var farmerId=document.getElementById('fFarmer').value;
  var blockId=document.getElementById('fBlock').value;
  if(!blockId){ BB.toast('Pick a block first'); return; }
  var f=d.farmer(farmerId);
  var lines=draftLines.map(function(l){ return { prod:l.prod, rate:l.rate.trim(), timing:l.timing.trim(), cost:lineCost(blockId,l.prod) }; });
  var rec=d.add('programs', {
    farmer: farmerId,
    block: blockId,
    crop: document.getElementById('fCrop').value.trim(),
    season: document.getElementById('fSeason').value.trim() || '2026/27',
    goal: document.getElementById('fGoal').value.trim(),
    advisor: u.rep || 'rep_juba',
    status: 'Draft',
    lines: lines
  });
  BB.toast('Programme drafted for '+f.farm);
  state.view='detail'; state.open=rec.id; paint(); window.scrollTo(0,0);
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"></main>');
// if arriving from a report with a farmer/block, drop straight into the builder
var preProg = preOpen ? d.by('programs', preOpen) : null;
if(preProg && inMyScope(preProg) && d.where('programs', function(x){ return x.id===preOpen; }).length){ state.view='detail'; state.open=preOpen; }
else if(preFarmer || preBlock){ state.view='form'; }
paint();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
