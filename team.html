<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Team feed · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign7"></script><script src="guard.js?v=redesign7"></script>
<script src="bb-data.js?v=redesign7"></script>
<script src="bb-shell.js?v=redesign7"></script>
<style>
  .feed-grid{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start;margin-top:14px;}
  .feed-side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px;}
  .post{display:flex;gap:12px;padding:16px 20px;border-top:1px solid var(--line-soft);}
  .post:first-child{border-top:0;}
  .post .bb-av{width:38px;height:38px;color:#fff;font-size:.78rem;}
  .post .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .post .nm{font-weight:600;font-size:.9rem;color:var(--ink);}
  .post .meta{font-size:.74rem;color:var(--faint);}
  .post .bd{margin-top:5px;font-size:.92rem;line-height:1.55;color:var(--ink);}
  .post .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .post .links .chip .ico{width:14px;height:14px;}
  .composer textarea{resize:vertical;min-height:88px;}
  .kinds{display:flex;flex-direction:column;gap:8px;}
  .kinds .r{display:flex;align-items:center;justify-content:space-between;font-size:.84rem;}
  .kinds .r b{font-variant-numeric:tabular-nums;}
  .empty .ico{width:28px;height:28px;color:var(--faint);margin-bottom:8px;}
  @media(max-width:1100px){ .feed-grid{grid-template-columns:minmax(0,1fr);} .feed-side{position:static;order:-1;} }
  @media(max-width:560px){ .post{padding:14px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'home', back:'index.html' });
var d = BB.data, u = BB.user;
var me = u.rep || u.id;

var KINDS = ['Note','Order','Stock','Visit','Delivery'];
var KBADGE = { Note:'b-grey', Order:'b-ok', Stock:'b-warn', Visit:'b-lime', Delivery:'b-blue' };

function render(){
  var feed = d.all('feed').slice().sort(function(a,b){ return (b.date+b.id).localeCompare(a.date+a.id); });
  var html = '';
  html += '<div class="page-head"><div class="eyebrow">One team, four provinces</div>'+
    '<h1>Team feed</h1><p>Everyone sees the same thing at the same time — post an update, flag stock, hand a farmer over.</p></div>';

  html += '<div class="feed-grid">';
  // feed
  html += '<div class="card"><div class="card-h"><div><h3>Latest</h3><div class="sub">newest first</div></div><span class="badge b-grey">'+feed.length+' update'+(feed.length===1?'':'s')+'</span></div>';
  if(!feed.length){ html += '<div class="empty">'+BB.icon('message')+'<div>No updates yet — be the first.</div></div>'; }
  else html += '<div>';
  feed.forEach(function(p){
    var who = d.person(p.from);
    var far = p.farmer ? d.farmer(p.farmer) : null;
    html += '<div class="post">'+
      '<span class="bb-av" style="background:'+BB.esc(who.colour)+';">'+BB.initials(who.name)+'</span>'+
      '<div style="flex:1;min-width:0;">'+
        '<div class="row between" style="align-items:flex-start;gap:8px;">'+
          '<div class="hd"><span class="nm">'+BB.esc(who.name)+'</span><span class="meta">'+BB.esc(who.role||'')+' · '+BB.date(p.date)+'</span></div>'+
          '<span class="badge '+(KBADGE[p.kind]||'b-grey')+'">'+BB.esc(p.kind)+'</span>'+
        '</div>'+
        '<div class="bd">'+BB.esc(p.text)+'</div>'+
        (far||p.ref ? '<div class="links">'+
          (far?'<a class="chip" href="farm-detail.html?farmer='+p.farmer+'" data-farm="'+BB.esc(p.farmer)+'">'+BB.icon('farm')+BB.esc(far.farm)+'</a>':'')+
          (p.ref?'<a class="chip" href="orders.html" data-oref="'+BB.esc(p.ref)+'">'+BB.icon('receipt')+BB.esc(p.ref)+'</a>':'')+
        '</div>' : '')+
      '</div></div>';
  });
  if(feed.length) html += '</div>';
  html += '</div>';

  // composer + what the feed holds
  var counts = {}; feed.forEach(function(p){ counts[p.kind]=(counts[p.kind]||0)+1; });
  html += '<div class="feed-side">'+
    '<div class="card composer"><div class="card-h"><div><h3>Post an update</h3><div class="sub">the whole team sees it at once</div></div></div><div class="card-p">'+
      '<div class="fld"><label for="txt">What just happened?</label><textarea id="txt" rows="3" placeholder="e.g. Signed Kobus on citrus programme — 140 L LeafSap for September."></textarea></div>'+
      '<div class="grid g2" style="gap:10px;">'+
        '<div class="fld" style="margin:0;"><label for="kind">Type</label><select id="kind">'+KINDS.map(function(k){return '<option>'+k+'</option>';}).join('')+'</select></div>'+
        '<div class="fld" style="margin:0;"><label for="farmer">Farmer (optional)</label><select id="farmer"><option value="">— none —</option>'+
          d.all('farmers').map(function(f){return '<option value="'+f.id+'">'+BB.esc(f.name+' · '+f.farm)+'</option>';}).join('')+'</select></div>'+
      '</div>'+
      '<button class="btn block" id="post" style="margin-top:14px;">'+BB.icon('message')+'Post</button>'+
    '</div></div>'+
    (feed.length ? '<div class="card"><div class="card-h"><div><h3>In the feed</h3><div class="sub">updates by type</div></div></div><div class="card-p"><div class="kinds">'+
      KINDS.filter(function(k){ return counts[k]; }).map(function(k){ return '<div class="r"><span class="badge '+KBADGE[k]+'">'+k+'</span><b>'+counts[k]+'</b></div>'; }).join('')+
    '</div></div></div>' : '')+
  '</div>';
  html += '</div><div style="height:24px;"></div>';

  document.querySelector('main')? (document.querySelector('main').innerHTML=html) :
    document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>');

  document.getElementById('post').onclick = function(){
    var txt = document.getElementById('txt').value.trim();
    if(!txt){ BB.toast('Type an update first'); return; }
    d.add('feed', { from: me, date: new Date().toISOString().slice(0,10),
      kind: document.getElementById('kind').value, farmer: document.getElementById('farmer').value||null,
      ref:null, text: txt });
    BB.toast('Posted — the whole team sees it');
    render();
  };
}
render();

// ---- A farm or order named in a post opens a preview over the feed; its own page is one tap further ----
var canGo = function(href){ try{ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }catch(e){ return true; } };
var initialsOf = function(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); };
var repMeta = function(r, tip){ return r && r.name && r.name!=='—' ? { initials:initialsOf(r.name), color:r.colour||'#3f6b28', text:r.name, tip:tip||'Rep' } : null; };
var farmHref = function(id){ return id && canGo('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(id) : null; };
// an order's own card (status, quote, invoice) lives on Orders: a row here opens it there
var orderHref = function(o){ return canGo('orders.html') ? 'orders.html?open='+encodeURIComponent(o.id) : null; };
function orderRows(list){
  var tot=0, rows=list.map(function(o){ var v=d.orderValue(o); tot+=v; return { cells:[o.ref||'—', BB.date(o.date), BB.monthName(o.deliverMonth), { html:BB.statusBadge(o.status) }, BB.money(v)], href:orderHref(o) }; });
  if(list.length>1) rows.push({ cells:[{ html:'<b>Total · '+list.length+' orders</b>' },{html:''},{html:''},{html:''},{ html:'<b>'+BB.money(tot)+'</b>' }] });
  return { title:'Orders', columns:['Order','Captured','Delivery','Status','Value'], rows:rows, num:[4] };
}
// A farm named in a post, as its card: who and where on the left, its orders on the right.
function farmPop(id){
  var f=d.farmer(id), os=d.where('orders',function(o){ return o.farmer===id; }).sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  var posts=d.where('feed',function(p){ return p.farmer===id; }).length, lim=d.creditLimit(id), bal=d.accountBalance(id), rec=farmHref(id);
  var tel=String(f.cell||'').replace(/\D/g,'').replace(/^0/,'27'), place=[f.town, f.region].filter(function(x,i,a){ return x && a.indexOf(x)===i; }).join(', ');
  BB.popup({ eyebrow:'Farm', title:f.farm||f.name, wide:!!os.length, layout:os.length?'split':null,
    meta:[ f.name&&f.name!==f.farm?{ icon:'user', text:f.name, tip:'Farmer' }:null, place?{ icon:'map', text:place, tip:'Town' }:null,
      (f.crops||[]).length?{ icon:'sprout', text:f.crops.join(', ')+(f.ha?' · '+BB.num(f.ha)+' ha':''), tip:'Crops' }:null,
      repMeta(d.rep(f.rep), 'Advisor'), tel?{ icon:'phone', tip:'Phone', html:'<a href="tel:+'+tel+'">'+BB.esc(f.cell)+'</a>' }:null ],
    stats:[{ l:'Status', html:BB.farmBadge(f) }, { l:'Balance', v:BB.money(bal), s:lim?'limit '+BB.money(lim):null, cls:lim&&bal>lim?'warn':'' },
      { l:'Orders', v:BB.num(os.length), s:os.length?BB.money(os.reduce(function(t,o){ return t+d.orderValue(o); },0)):'none yet' }, { l:'In the feed', v:posts, s:'update'+(posts===1?'':'s') }],
    table:os.length?orderRows(os):null,
    actions:[ rec?{ label:'Farm record', href:rec, primary:true }:null ].filter(Boolean) });
}
// An order named in a post: the short version, with its full card on Orders one tap away.
function orderPop(ref){
  var o=d.where('orders',function(x){ return x.ref===ref; })[0];
  if(!o){ BB.popup({ eyebrow:'Order', title:ref, html:'<div class="empty">This order is not on this device.</div>', actions:[canGo('orders.html')?{ label:'Open orders', href:'orders.html', primary:true }:null].filter(Boolean) }); return; }
  var f=d.farmer(o.farmer), tot=0, rows=(o.lines||[]).map(function(l){ var p=d.product(l.prod), v=(p.price||0)*(l.qty||0); tot+=v; return { cells:[{ html:'<b>'+BB.esc(p.name)+'</b>' }, p.pack||'—', BB.num(l.qty), BB.money(v)] }; });
  BB.popup({ eyebrow:'Order'+(o.source?' · '+o.source:''), title:o.ref, wide:true, layout:'split',
    meta:[ o.date?{ icon:'calendar', text:'Captured '+BB.date(o.date), tip:'Captured' }:null, { icon:'warehouse', text:d.depot(o.depot).name, tip:'Depot' },
      { icon:'user', text:f.name, tip:'Farmer' }, { icon:'farm', text:f.farm, tip:'Farm', href:farmHref(o.farmer) }, repMeta(d.rep(o.rep)) ],
    stats:[{ l:'Value', v:BB.money(d.orderValue(o)), s:'list' }, { l:'Status', html:BB.statusBadge(o.status) }, { l:'Delivery', v:BB.monthName(o.deliverMonth) },
      { l:'Invoice', html:d.orderInvoiced(o.id)? '<span class="tag tag-inv">'+BB.icon('receipt')+'Invoiced</span>' : '<span class="faint">—</span>' }],
    table:{ title:'Products', columns:['Product','Pack','Qty','Value'], rows:rows, num:[2,3], foot:rows.length>1?['List value',{html:''},{html:''},BB.money(tot)]:null },
    actions:[ farmHref(o.farmer)?{ label:'Farm record', href:farmHref(o.farmer) }:null, orderHref(o)?{ label:'Open order', href:orderHref(o), primary:true }:null ].filter(Boolean) });
}
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var a=e.target.closest('a[data-farm],a[data-oref]'); if(!a) return;
  e.preventDefault();
  if(a.hasAttribute('data-farm')) farmPop(a.getAttribute('data-farm')); else orderPop(a.getAttribute('data-oref'));
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
