<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Suppliers · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign2"></script><script src="guard.js?v=redesign2"></script>
<script src="bb-data.js?v=redesign2"></script>
<script src="bb-shell.js?v=redesign2"></script>
<style>
  .cc{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:1px 6px;border-radius:5px;font-size:.66rem;font-weight:700;letter-spacing:.5px;}
  .cc.loc{background:#eef6dc;color:var(--green-mid);} .cc.imp{background:var(--blue-bg);color:var(--blue);}
  .side{display:grid;gap:16px;align-content:start;min-width:0;}
  table.bb tr.sup-row.on td{background:#f3f8ec;} table.bb tr.sup-row.on td:first-child{box-shadow:inset 3px 0 0 var(--green-bright);}
  table.bb tr.r-low td{background:#fffaf0;} table.bb tr.r-out td{background:#fdf2f0;}
  table.bb tr.r-low td:first-child{box-shadow:inset 3px 0 0 var(--amber);} table.bb tr.r-out td:first-child{box-shadow:inset 3px 0 0 var(--red);}
  .sup-detail{border-top:3px solid var(--green-bright);}
  .po{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--line-soft);}
  .po:first-child{border-top:0;}
  .po b{color:var(--green-dark);font-size:.88rem;}
  @media(max-width:480px){ .po{padding:12px 14px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;
var suppliers = d.all('suppliers');
var products = d.all('products');
var inventory = d.all('inventory');
var selected = null;

// Country as a small code badge — local in green, imports in blue (no flag emoji).
function flag(c){ return '<span class="cc '+(isLocal(c)?'loc':'imp')+'" title="'+(isLocal(c)?'Local':'Imported')+'">'+BB.esc(c||'—')+'</span>'; }
function isLocal(c){ return c==='ZA'; }

function prodCount(supId){ return products.filter(function(p){ return p.supplier===supId; }).length; }
function panel(title, sub, actions, body, cls){
  return '<div class="card'+(cls?' '+cls:'')+'"><div class="card-h"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(actions||'')+'</div>'+body+'</div>';
}

// ---- popups ----
// A supplier or a purchase order opens as a card (CONVENTIONS.md, "Record popups: the card
// pattern"); a list opens as a table whose rows open those cards.
var COUNTRY = { ZA:'South Africa', US:'United States', DE:'Germany', AU:'Australia' };
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
function isOpenPo(po){ return po.status!=='Delivered' && po.status!=='Received'; }
function poValue(po){ return (po.lines||[]).reduce(function(t,l){ return t+(d.product(l.prod).price||0)*(l.qty||0); },0); }
function poTable(list, withSup){
  return { columns:(withSup?['Supplier']:[]).concat(['Items','To','Raised','ETA','Status']),
    rows:list.slice().sort(function(a,b){ return String(a.eta).localeCompare(String(b.eta)); }).map(function(po){
      var items=(po.lines||[]).map(function(l){ return d.product(l.prod).code+' ×'+BB.num(l.qty); }).join(', ');
      return { cells:(withSup?[d.supplier(po.supplier).name]:[]).concat([items||'—', String(d.depot(po.depot).name).replace(/ Depot$/,''), BB.date(po.date), BB.date(po.eta), { html:BB.statusBadge(po.status) }]),
        onClick:function(){ BB.popup(poCard(po)); } }; }) };
}
function prodTable(list, withSup){
  return { columns:['Product','Code'].concat(withSup?['Supplier','Lead']:['Pack']).concat(['Price']), num:withSup?[3,4]:[3],
    rows:list.map(function(p){ var sp=d.supplier(p.supplier);
      return { cells:[p.name, p.code||''].concat(withSup?[sp.name||'—', sp.lead!=null?sp.lead+' days':'—']:[p.pack||'']).concat([BB.money(p.price)+'/'+(p.unit||'')]),
        onClick:withSup && sp && sp.id? function(){ BB.popup(supplierCard(sp)); } : null }; }) };
}
// select a supplier in the list on this page
function openSupplier(id, primary){ return { label:'Show it in the list', primary:primary!==false, onClick:function(){ BB.closePopup(); selected=id; render();
  var el=document.getElementById('supdetail'); if(el) el.scrollIntoView({ behavior:'smooth', block:'center' }); } }; }
// One supplier: what it supplies, what is on order, and what is running low.
function supplierCard(sup){
  var mine=products.filter(function(p){ return p.supplier===sup.id; }), pos=d.all('purchaseOrders').filter(function(x){ return x.supplier===sup.id && isOpenPo(x); });
  var low=inventory.filter(function(i){ return i.qty<i.reorder && d.product(i.prod).supplier===sup.id; });
  var pt=prodTable(mine, false), ot=poTable(pos, false); pt.title='Products'; ot.title='Open purchase orders';
  return { wide:true, layout:'split', eyebrow:'Supplier · '+(isLocal(sup.country)?'Local':'Imported'), title:sup.name, color:null,
    meta:[{ icon:'map', text:(COUNTRY[sup.country]||sup.country||'—')+(sup.country?' ('+sup.country+')':''), tip:'Country' }, sup.note? { icon:'package', text:sup.note, tip:'Supplies' } : null],
    stats:[{ l:'Lead time', v:sup.lead+' days', s:'order to arrival' }, { l:'Products', v:mine.length }, { l:'Open POs', v:pos.length },
      { l:'Below reorder', v:low.length, s:low.length?'lines at the depots':null, cls:low.length?'bad':'' }],
    tables:[pt].concat(pos.length? [ot] : []),
    actions:[openSupplier(sup.id)] };
}
// One purchase order: what was ordered, for which depot, and when it lands.
function poCard(po){
  var sup=d.supplier(po.supplier)||{}, by=po.by? d.person(po.by) : null, n=(po.lines||[]).length;
  var due=po.eta? Math.round((new Date(po.eta)-new Date(new Date().toISOString().slice(0,10)))/86400000) : null;
  return { wide:true, layout:'split', eyebrow:'Purchase order', title:sup.name||'Purchase order',
    meta:[{ icon:'calendar', text:'Raised '+BB.date(po.date), tip:'Raised' }, po.eta? { icon:'truck', text:'ETA '+BB.date(po.eta), tip:'ETA' } : null,
      { icon:'warehouse', text:d.depot(po.depot).name, tip:'Delivers to' }, by&&by.name&&by.name!=='BioBrix'? { initials:initialsOf(by.name), color:by.colour, text:by.name, tip:'Raised by' } : null],
    stats:[{ l:'Status', html:BB.statusBadge(po.status) }, { l:'Value', v:BB.money(Math.round(poValue(po))), s:'at list price' },
      { l:'Lines', v:n, s:BB.num((po.lines||[]).reduce(function(t,l){ return t+(l.qty||0); },0))+' units' },
      { l:'Lead', v:(sup.lead!=null?sup.lead+' days':'—'), s:isOpenPo(po)&&due!=null&&due>=0? due+' days to go' : null }],
    html:isOpenPo(po)&&due!=null&&due<0? '<div class="bbp-alert warn">'+BB.icon('alert')+'Past its ETA by '+(-due)+' day'+(due===-1?'':'s')+'</div>' : '',
    table:{ title:'Lines', columns:['Product','Code','Qty','Value'], num:[2,3], rows:(po.lines||[]).map(function(l){ var p=d.product(l.prod);
      return { cells:[{ html:'<b>'+BB.esc(p.name)+'</b>' }, p.code||'', BB.num(l.qty)+' '+(p.unit||''), BB.money((p.price||0)*(l.qty||0))] }; }) },
    actions:[sup.id? { label:'Supplier', onClick:function(){ BB.closePopup(); setTimeout(function(){ BB.popup(supplierCard(sup)); }, 170); } } : null] };
}

function renderProducts(supId){
  var list = products.filter(function(p){ return p.supplier===supId; });
  var sup = d.supplier(supId);
  var body;
  if(!list.length){
    body = '<div class="empty">No products currently sourced from this supplier.</div>';
  } else {
    body = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th>Pack</th><th>Lever</th><th class="num">Price</th></tr></thead><tbody>';
    list.forEach(function(p){
      body += '<tr>'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(p.name)+'</b></td>'+
        '<td class="muted">'+BB.esc(p.code)+'</td>'+
        '<td class="muted">'+BB.esc(p.pack)+'</td>'+
        '<td>'+BB.statusBadge(p.lever)+'</td>'+
        '<td class="num"><b>'+BB.money(p.price)+'</b><span class="faint" style="font-size:.72rem;">/'+BB.esc(p.unit)+'</span></td>'+
      '</tr>';
    });
    body += '</tbody></table></div>';
  }
  return '<div class="card sup-detail" style="margin-top:16px;"><div class="card-h"><div><div class="eyebrow" style="margin-bottom:2px;">Sourced from '+flag(sup.country)+'</div><h3>'+BB.esc(sup.name)+'</h3>'+
    '<div class="sub">'+BB.esc(sup.note)+' · lead time '+sup.lead+' days</div></div><button class="btn ghost sm" data-sup-close="1">Close</button></div>'+body+'</div>';
}

function render(){
  var localCount = suppliers.filter(function(s){ return isLocal(s.country); }).length;
  var imported = suppliers.length - localCount;
  var avgLead = Math.round(suppliers.reduce(function(s,x){ return s+x.lead; }, 0) / (suppliers.length||1));
  var pos = d.all('purchaseOrders');
  var openPos = pos.filter(function(po){ return po.status!=='Delivered' && po.status!=='Received'; });

  var html = '';
  html += '<section class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">Operations · Suppliers</div>'+
    '<h1>Our supply network</h1>'+
    '<p>BioBrix sources across many suppliers, not one — local blends alongside imported biologicals. This is who each product comes from, and what needs ordering right now.</p></div>'+
    ((BB.auth && BB.auth.canPage && BB.auth.canPage('stock.html')) ? '<div class="row"><a class="btn ghost" href="stock.html">'+BB.icon('package')+'Stock</a></div>' : '')+
  '</section>';

  html += '<div class="grid g4" style="margin-top:14px;">'+
    '<div class="stat"><div class="l">Suppliers</div><div class="v">'+suppliers.length+'</div><div class="s">across the network</div></div>'+
    '<div class="stat"><div class="l">Local · imported</div><div class="v">'+localCount+' · '+imported+'</div><div class="s">ZA vs overseas</div></div>'+
    '<div class="stat"><div class="l">Avg lead time</div><div class="v">'+avgLead+' <span style="font-size:.9rem;">days</span></div><div class="s">order to arrival</div></div>'+
    '<a class="stat tap" href="#poCard" data-detail="sp-pos"><div class="l">Purchase orders open</div><div class="v">'+openPos.length+'</div><div class="s">with suppliers now ›</div></a>'+
  '</div>';
  BB.statDetail('sp-pos', function(){ return { table:poTable(openPos, true), actions:[] }; });   // rows open each PO's card

  // reorder radar
  var low = inventory.filter(function(i){ return i.qty<i.reorder; });
  // sort by longest lead first — that is what to order soonest
  var radar = low.map(function(i){
    var p = d.product(i.prod);
    var sup = d.supplier(p.supplier);
    return { i:i, p:p, sup:sup };
  }).sort(function(a,b){ return b.sup.lead-a.sup.lead; });

  var radarBody;
  if(!radar.length){
    radarBody = '<div class="empty"><div class="big">'+BB.icon('check')+'</div>Every line is above its reorder level.</div>';
  } else {
    radarBody = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Depot</th><th class="num">On hand</th><th>Supplier</th><th class="num">Lead</th><th class="num"></th></tr></thead><tbody>';
    radar.forEach(function(r){
      radarBody += '<tr class="'+(r.i.qty<=0?'r-out':'r-low')+'">'+
        '<td><b style="color:var(--green-dark);white-space:nowrap;">'+BB.esc(r.p.name)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(r.p.code)+'</div></td>'+
        '<td class="muted">'+BB.esc(String(d.depot(r.i.depot).name).replace(/ Depot$/,''))+'</td>'+
        '<td class="num">'+BB.num(r.i.qty)+' <span class="faint">/ '+BB.num(r.i.reorder)+'</span></td>'+
        '<td><span class="row" style="gap:6px;flex-wrap:nowrap;">'+flag(r.sup.country)+'<span>'+BB.esc(r.sup.name)+'</span></span></td>'+
        '<td class="num muted">'+r.sup.lead+' days</td>'+
        '<td class="num"><button class="btn ghost sm" data-order="'+r.p.id+'" data-depot="'+r.i.depot+'" data-qty="'+Math.max(r.i.reorder, r.i.reorder*2-r.i.qty)+'">'+BB.icon('plus')+'Raise PO</button></td>'+
      '</tr>';
    });
    radarBody += '</tbody></table></div>';
  }

  // open purchase orders (the ops "order from the States" flow — real records, not just a prompt)
  var poBody;
  if(!pos.length){ poBody = '<div class="empty"><div class="big">'+BB.icon('package')+'</div>No open purchase orders.</div>'; }
  else {
    poBody = '<div class="po-list">';
    pos.slice().sort(function(a,b){return (b.date).localeCompare(a.date);}).forEach(function(po){
      var items = (po.lines||[]).map(function(l){ return d.product(l.prod).code+' ×'+BB.num(l.qty); }).join(', ');
      var sup = d.supplier(po.supplier);
      (poBody += '<div class="po" role="button" tabindex="0" data-po="'+BB.esc(po.id)+'" style="cursor:pointer;">'+
        '<div style="min-width:0;"><div class="row" style="gap:6px;flex-wrap:nowrap;">'+flag(sup.country)+'<b>'+BB.esc(sup.name)+'</b></div>'+
          '<div style="font-size:.84rem;margin-top:2px;">'+BB.esc(items)+' <span class="faint">→ '+BB.esc(d.depot(po.depot).name)+'</span></div>'+
          '<div class="faint" style="font-size:.72rem;margin-top:1px;">Raised '+BB.date(po.date)+'</div></div>'+
        '<div style="text-align:right;flex:none;">'+BB.statusBadge(po.status)+'<div class="faint" style="font-size:.72rem;margin-top:4px;">ETA '+BB.shortDate(po.eta)+'</div></div>'+
      '</div>');
    });
    poBody += '</div>';
  }

  html += '<div class="split" style="margin-top:16px;">'+
    panel('Reorder radar', 'below reorder · longest lead first, so order these soonest', '<span class="badge '+(radar.length?'b-warn':'b-ok')+'">'+radar.length+' below reorder</span>', radarBody)+
    '<div id="poCard" style="min-width:0;">'+panel('Purchase orders', pos.length+' with suppliers', '', poBody)+'</div>'+
  '</div>';

  // supplier table beside the network picture
  var supBody = '<div class="scroll"><table class="bb"><thead><tr><th>Supplier</th><th>Country</th><th class="num">Lead</th><th>Note</th><th class="num">Products</th></tr></thead><tbody>';
  suppliers.forEach(function(s){
    var on = selected===s.id;
    supBody += '<tr class="click sup-row'+(on?' on':'')+'" data-sup="'+s.id+'">'+
      '<td><b style="color:var(--green-dark);">'+BB.esc(s.name)+'</b></td>'+
      '<td>'+flag(s.country)+'</td>'+
      '<td class="num muted">'+s.lead+' days</td>'+
      '<td class="faint" style="font-size:.78rem;">'+BB.esc(s.note)+'</td>'+
      '<td class="num"><b>'+prodCount(s.id)+'</b></td>'+
    '</tr>';
  });
  supBody += '</tbody><tfoot><tr><td>'+suppliers.length+' suppliers</td><td></td><td class="num">avg '+avgLead+' days</td><td></td><td class="num">'+products.filter(function(p){ return !!p.supplier; }).length+'</td></tr></tfoot></table></div>';

  html += '<div class="split" style="margin-top:16px;">'+
    '<div style="min-width:0;">'+panel('Suppliers', 'tap a supplier for its products', '', supBody)+
      // selected supplier products
      '<div id="supdetail">'+(selected?renderProducts(selected):'')+'</div></div>'+
    '<div class="side">'+
      panel('Lead time', 'days from order to arrival · longest first', '', '<div class="card-p"><div id="chLead"></div></div>')+
      panel('Where products come from', 'product lines by source', '', '<div class="card-p"><div id="chSource"></div></div>')+
    '</div>'+
  '</div>';

  html += '<div style="height:24px;"></div>';

  var main = document.querySelector('main.wrap');
  main.innerHTML = html;
  wire();

  try{
    BB.chart.hbar('#chLead', { fmt:function(v){ return v+' days'; },
      legend:[{name:'Local',color:'#3f6b28'},{name:'Imported',color:'#2f6f9e'}],
      rows:suppliers.slice().sort(function(a,b){ return b.lead-a.lead; }).map(function(s){ return { label:s.name, value:s.lead, color:isLocal(s.country)?'#3f6b28':'#2f6f9e', supId:s.id }; }),
      valueLabel:'Lead time',
      // that supplier's card
      detail:function(ctx){ return supplierCard(d.supplier(ctx.row.supId)); } });
    var locP = products.filter(function(p){ var sp=d.supplier(p.supplier); return sp && isLocal(sp.country); }).length;
    BB.chart.donut('#chSource', { centreLabel:'products', valueLabel:'Products', rows:[{label:'Local (ZA)', value:locP, color:'#3f6b28', local:true},{label:'Imported', value:products.length-locP, color:'#2f6f9e', local:false}],
      // the products from that source
      detail:function(ctx){ var list=products.filter(function(p){ var sp=d.supplier(p.supplier); return !!(sp && isLocal(sp.country))===ctx.row.local; })
        .sort(function(a,b){ return (d.supplier(b.supplier).lead||0)-(d.supplier(a.supplier).lead||0); });
        return { table:prodTable(list, true), wide:true }; } });
  }catch(e){ console.warn('chart', e); }
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.sup-row[data-sup]'), function(tr){
    tr.onclick = function(){
      var id = tr.getAttribute('data-sup');
      selected = (selected===id) ? null : id;
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-po]'), function(el){
    var open=function(){ var po=d.by('purchaseOrders', el.getAttribute('data-po')); if(po) BB.popup(poCard(po)); };
    el.onclick=open; el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });
  var cl = document.querySelector('[data-sup-close]');
  if(cl) cl.onclick = function(){ selected = null; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('button[data-order]'), function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var p = d.product(btn.getAttribute('data-order'));
      var sup = d.supplier(p.supplier);
      d.add('purchaseOrders', {
        supplier: p.supplier, depot: btn.getAttribute('data-depot'),
        date: new Date().toISOString().slice(0,10),
        eta: new Date(Date.now()+ (sup.lead||10)*86400000).toISOString().slice(0,10),
        status: 'Ordered', by: (BB.user.rep||BB.user.id),
        lines: [{ prod: p.id, qty: Number(btn.getAttribute('data-qty'))||0 }]
      });
      BB.toast('PO raised with '+sup.name+' — ETA '+ (sup.lead||10)+' days');
      render();
    };
  });
}

document.body.insertAdjacentHTML('beforeend', '<main class="wrap"></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
