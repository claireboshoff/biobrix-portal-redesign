<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Stock · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign2"></script><script src="guard.js?v=redesign2"></script>
<script src="bb-data.js?v=redesign2"></script>
<script src="bb-shell.js?v=redesign2"></script>
<style>
  /* phones: the count comes first; Depot, Reorder at, Level and Status live in the line's card */
  @media(max-width:700px){ [data-stock-table] .ph-x{display:none;} [data-stock-table] td.num .row{flex-wrap:wrap !important;justify-content:flex-end;} [data-stock-table] .cnt-in{width:92px;} [data-stock-table] .scroll{overflow-x:visible;} }
  .take{border-left:3px solid var(--green-bright);}
  .take-in{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:18px 20px;}
  .take-ic{width:40px;height:40px;border-radius:10px;background:#eef4e4;color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex:none;}
  .take h3{font-family:var(--display);font-size:1.04rem;font-weight:600;color:var(--green-darkest);}
  .take-act{display:flex;gap:8px;flex-wrap:wrap;align-self:center;}
  .lvl .trk{position:relative;overflow:visible;height:7px;}
  .lvl .trk i{border-radius:4px;}
  .lvl .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--green-darkest);opacity:.45;}
  table.bb tr.r-low td{background:#fffaf0;} table.bb tr.r-out td{background:#fdf2f0;}
  table.bb tr.r-low td:first-child{box-shadow:inset 3px 0 0 var(--amber);} table.bb tr.r-out td:first-child{box-shadow:inset 3px 0 0 var(--red);}
  .cnt-in{width:88px;padding:7px 9px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;text-align:right;background:#fff;}
  .cnt-in:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(104,165,62,.15);}
  @media(max-width:560px){ .lvl-col{display:none;} .take-act{width:100%;} .take-act .btn{flex:1 1 auto;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;

// Warehouse seat is scoped to its own depot — one depot, no chips.
// Directors / operations still see every depot + the full chip set.
var scopeDepot = (BB.user && BB.user.roleKey==='warehouse' && BB.user.depot) ? BB.user.depot : null;

var DEPOT_CHIPS = [
  { id:'all', name:'All depots' },
  { id:'dep_george', name:'George' },
  { id:'dep_ballito', name:'Ballito' },
  { id:'dep_tzaneen', name:'Tzaneen' }
];
var filter = scopeDepot || 'all';

// Inventory the current seat is allowed to see (all depots, or just their own).
function scopedInventory(){
  var rows = d.store().inventory; // live reference so stock-take edits persist in-memory
  return scopeDepot ? rows.filter(function(i){ return i.depot===scopeDepot; }) : rows;
}

function invRows(){
  var rows = scopedInventory();
  return filter==='all' ? rows : rows.filter(function(i){ return i.depot===filter; });
}

function statusOf(i){
  if(i.qty<=0) return 'Out of stock';
  if(i.qty<i.reorder) return 'Low stock';
  return 'In stock';
}

function shortName(n){ return String(n||'').replace(/^RenewAg\s+/,''); }
function depotShort(id){ return String(d.depot(id).name||'').replace(/ Depot$/,''); }
// stock level against reorder: the reorder level sits at the midpoint of the track
function levelCell(qty, reorder){
  var cap = Math.max(1, (reorder||0)*2), pct = Math.max(0, Math.min(100, qty/cap*100));
  var col = qty<=0 ? 'var(--red)' : (qty<reorder ? 'var(--amber)' : 'var(--green-bright)');
  return '<div class="bar-cell lvl"><div class="trk"><i style="width:'+pct+'%;background:'+col+'"></i><b title="reorder level"></b></div></div>';
}

// ---- popups ----
// A stock line or a depot opens as a card (CONVENTIONS.md, "Record popups: the card pattern");
// a list of lines opens as a table whose rows open the line's card.
function can(href){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }
function go(label, href, primary){ return href && can(href) ? { label:label, href:href, primary:!!primary } : null; }
function lineVal(i){ return (i.qty||0)*(d.product(i.prod).price||0); }
function findLine(depotId, prodId){ return d.store().inventory.find(function(r){ return r.depot===depotId && r.prod===prodId; }); }
// lines as a popup table: lowest against reorder first, or biggest value first
function lineTable(list, opts){ opts=opts||{}; var withDep=!scopeDepot && opts.depot!==false;
  var sorted=list.slice().sort(opts.byValue? function(a,b){ return lineVal(b)-lineVal(a); } : function(a,b){ return (a.qty/(a.reorder||1))-(b.qty/(b.reorder||1)); });
  var cols=['Product'].concat(withDep?['Depot']:[]).concat(['On hand','Reorder at']).concat(opts.byValue?['Value']:[]).concat(['Status']);
  var n=withDep?2:1, num=[n,n+1].concat(opts.byValue?[n+2]:[]);
  return { title:opts.title||null, columns:cols, num:num, rows:sorted.map(function(i){ var p=d.product(i.prod);
    return { cells:[p.name].concat(withDep?[depotShort(i.depot)]:[]).concat([BB.num(i.qty)+' '+(p.unit||''), BB.num(i.reorder)]).concat(opts.byValue?[BB.money(Math.round(lineVal(i)))]:[]).concat([{ html:BB.statusBadge(statusOf(i)) }]),
      onClick:function(){ openLine(i.depot, i.prod); } }; }) };
}
// the same as the table's Reorder button: a request to the product's supplier
function reorder(prodId){ var sup=d.supplier(d.product(prodId).supplier)||{}; BB.toast('Reorder raised with '+(sup.name||'the supplier')); }
// the same as typing a count in the table: save it, and queue it for the office
function saveCount(depotId, prodId, value){
  var row=findLine(depotId, prodId); if(!row) return;
  row.qty=Math.max(0, Math.round(Number(value)||0)); d.save();
  d.enqueue({ op:'stocktake', table:'inventory', depot:depotId, prod:prodId, qty:row.qty });
  BB.toast('Count saved · '+d.product(prodId).name);
  render();
}
// the same product at the other depots (the product is the card's title, so no Product column)
function otherDepots(list){
  return { title:'At the other depots', columns:['Depot','On hand','Reorder at','Status'], num:[1,2], rows:list.map(function(x){ var u=d.product(x.prod).unit||'';
    return { cells:[d.depot(x.depot).name, BB.num(x.qty)+' '+u, BB.num(x.reorder), { html:BB.statusBadge(x.qty<=0?'Out of stock':(x.qty<x.reorder?'Low stock':'In stock')) }], onClick:function(){ openLine(x.depot, x.prod); } }; }) };
}
// One stock line: a product at a depot — the count, the reorder level, and the same product elsewhere.
function openLine(depotId, prodId){
  var i=findLine(depotId, prodId); if(!i) return;
  var p=d.product(i.prod), sup=d.supplier(p.supplier)||{}, u=p.unit||'', low=i.qty<i.reorder;
  var others=scopeDepot? [] : d.store().inventory.filter(function(x){ return x.prod===i.prod && x.depot!==i.depot; });
  var net=others.reduce(function(t,x){ return t+(x.qty||0); }, i.qty||0);
  var alert=i.qty<=0 ? '<div class="bbp-alert">'+BB.icon('alert')+'Out of stock — reorder level is '+BB.num(i.reorder)+' '+BB.esc(u)+'</div>'
    : low ? '<div class="bbp-alert warn">'+BB.icon('alert')+'Below reorder — '+BB.num(i.qty)+' of '+BB.num(i.reorder)+' '+BB.esc(u)+' on hand</div>' : '';
  var count='<div class="bbp-tt">Stock take</div><div class="bbp-bar"><span class="faint">Counted on the floor</span><span class="sp"></span>'+
    '<input type="number" min="0" value="'+i.qty+'" class="cnt-in" style="width:96px;flex:none;" data-linecount="1" aria-label="Count for '+BB.esc(p.name)+'"><span class="faint">'+BB.esc(u)+'</span>'+
    '<button class="btn sm" data-linesave="1">'+BB.icon('check')+'Save count</button></div>';
  var stats=[{ l:'On hand', v:BB.num(i.qty)+' '+u, cls:low?'bad':'' }, { l:'Reorder at', v:BB.num(i.reorder)+' '+u },
    { l:'Value', v:BB.money(Math.round(lineVal(i))), s:'at list price' }];
  stats.push(others.length? { l:'All depots', v:BB.num(net)+' '+u, s:(others.length+1)+' depots' } : { l:'Status', html:BB.statusBadge(statusOf(i)) });
  BB.popup({ wide:true, layout:'split', eyebrow:'Stock line', title:p.name,
    meta:[{ icon:'warehouse', text:d.depot(i.depot).name, tip:'Depot' }, { icon:'package', text:[p.code, p.pack].filter(Boolean).join(' · '), tip:'Code · pack' },
      sup.name? { icon:'link', text:sup.name+(sup.lead?' · '+sup.lead+' days lead':''), tip:'Supplier', href:can('suppliers.html')?'suppliers.html':null } : null],
    stats:stats,
    html:alert+(others.length? '' : count),
    table:others.length? otherDepots(others) : null,
    note:null,
    actions:[go('Suppliers & POs','suppliers.html'), low? { label:'Reorder', primary:true, onClick:function(){ reorder(i.prod); } } : null],
    onOpen:function(body){
      // with other depots listed, the count sits under them
      if(others.length){ var m=body.querySelector('.bbp-split .main'); if(m) m.insertAdjacentHTML('beforeend', count); }
      var inp=body.querySelector('input[data-linecount]'), btn=body.querySelector('button[data-linesave]');
      var save=function(){ var dep=i.depot, pr=i.prod; saveCount(dep, pr, inp.value); BB.closePopup(); setTimeout(function(){ openLine(dep, pr); }, 170); };
      if(btn) btn.onclick=save;
      if(inp) inp.onkeydown=function(e){ if(e.key==='Enter') save(); };
    } });
}
// narrow the Stock lines table to some statuses (the funnel does the work), across every depot
function showInTable(statuses){
  BB.closePopup();
  if(!scopeDepot && filter!=='all'){ filter='all'; render(); }
  try{ BB.tableFilters.set('Stock lines', 'Status', { values:statuses }); }catch(e){ console.warn('filter', e); }
  var t=document.querySelector('[data-stock-table]'); if(t) t.scrollIntoView({ behavior:'smooth', block:'start' });
}
// One depot: its lines, lowest first (or by value), and a button that shows it on this page.
function depotLines(depId, byValue){
  var dep=d.depot(depId), mine=scopedInventory().filter(function(i){ return i.depot===depId; });
  var low=mine.filter(function(i){ return i.qty<i.reorder; }).length, out=mine.filter(function(i){ return i.qty<=0; }).length;
  return { wide:true, layout:'split', eyebrow:'Depot', title:dep.name, color:null, tags:dep.status?BB.statusBadge(dep.status):null,
    meta:[dep.region? { icon:'map', text:dep.region, tip:'Region' } : null, dep.manager? { icon:'user', text:dep.manager, tip:'Warehouse manager' } : null],
    stats:[{ l:'Stock lines', v:mine.length }, { l:'Below reorder', v:low, cls:low?'bad':'' }, { l:'Out of stock', v:out, cls:out?'bad':'' },
      { l:'Value', v:BB.money(Math.round(mine.reduce(function(t,i){ return t+lineVal(i); },0))), s:'at list price' }],
    table:lineTable(mine, { depot:false, byValue:!!byValue, title:byValue?'By value':'Lowest against reorder first' }),
    actions:[ (!scopeDepot && filter!==depId) ? { label:'Show this depot', primary:true, onClick:function(){ BB.closePopup(); filter=depId; render(); window.scrollTo({ top:0, behavior:'smooth' }); } } : null ] };
}

function render(){
  var rows = invRows();

  // stat row (computed off the seat's inventory, not the filtered view)
  var all = scopedInventory();
  var totalValue = all.reduce(function(s,i){ return s + (i.qty||0)*(d.product(i.prod).price||0); }, 0);
  var lowCount = all.filter(function(i){ return i.qty<i.reorder; }).length;
  var outCount = all.filter(function(i){ return i.qty<=0; }).length;
  var depotCount = scopeDepot ? 1 : d.all("depots").length;
  var oneDepot = scopeDepot || (filter!=='all' ? filter : null);

  var html = '';
  html += '<section class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">Operations · Stock</div>'+
    '<h1>'+(scopeDepot?('Stock at '+BB.esc(d.depot(scopeDepot).name)):'Stock across the depots')+'</h1>'+
    '<p>'+(scopeDepot
      ?'Every product line at your depot. Low and out-of-stock lines are flagged so you can reorder before a delivery is held. Count on the floor and save as you go — it works offline.'
      :'Every product line in every depot. Low and out-of-stock lines are flagged so ops can reorder before a delivery is held. Count on the floor and save as you go — it works offline.')+'</p></div>'+
    ((BB.auth && BB.auth.canPage && BB.auth.canPage('suppliers.html')) ? '<div class="row"><a class="btn ghost" href="suppliers.html">'+BB.icon('link')+'Suppliers &amp; POs</a></div>' : '')+
  '</section>';

  html += '<div class="grid g4" style="margin-top:14px;">'+
    '<div class="stat"><div class="l">Stock lines</div><div class="v">'+all.length+'</div><div class="s">'+(scopeDepot?('at '+d.depot(scopeDepot).name):('across '+depotCount+' depots'))+'</div></div>'+
    '<a class="stat tap'+(lowCount>0?' bad':'')+'" href="suppliers.html" data-detail="st-low"><div class="l">Below reorder</div><div class="v">'+lowCount+'</div><div class="s">need reordering ›</div></a>'+
    '<a class="stat tap'+(outCount>0?' bad':'')+'" href="suppliers.html" data-detail="st-out"><div class="l">Out of stock</div><div class="v">'+outCount+'</div><div class="s">nothing on the shelf ›</div></a>'+
    '<a class="stat tap" href="#takeCard" data-detail="st-value"><div class="l">On-hand value</div><div class="v">'+BB.money(totalValue)+'</div><div class="s">at list price ›</div></a>'+
  '</div>';

  // ---- the picture: on hand against reorder, beside where the value sits ----
  // On a phone the count comes first: stock take and lines, then the charts (see below).
  var phone = window.matchMedia('(max-width:700px)').matches;
  var picHtml = '';
  picHtml += '<div class="split" style="margin-top:16px;">'+
    '<div class="card"><div class="card-h"><div><h3>'+(oneDepot?'On hand against reorder level':'Stock health by depot')+'</h3><div class="sub">'+
      (oneDepot?BB.esc(d.depot(oneDepot).name)+' · every line':'lines in stock, low and out')+'</div></div></div><div class="card-p">'+
      (all.length?'<div id="chStock"></div>':'<div class="empty">No stock lines yet.</div>')+'</div></div>'+
    '<div class="card"><div class="card-h"><div><h3>On-hand value</h3><div class="sub">at list price, '+(oneDepot?'by product':'by depot')+'</div></div></div><div class="card-p">'+
      (totalValue>0?'<div id="chValue"></div>':'<div class="empty">Nothing on hand.</div>')+'</div></div>'+
  '</div>';

  if(!phone) html += picHtml;

  // ---- STOCK TAKE — one tap when nothing moved, voice when it did --------
  var lastTake = null; try{ lastTake = JSON.parse(localStorage.getItem('bb_stocktake_'+(scopeDepot||filter))); }catch(e){}
  var rmode=''; try{ rmode=localStorage.getItem('bb_reorder_mode')||'notify'; }catch(e){}
  html += '<div class="card take" id="takeCard" style="margin-top:16px;">'+
    '<div class="take-in">'+
      '<div class="take-ic">'+BB.icon('clipboard')+'</div>'+
      '<div style="min-width:0;flex:1 1 320px;"><div class="eyebrow" style="margin-bottom:2px;">Stock take</div>'+
        '<h3>'+(scopeDepot?BB.esc(d.depot(scopeDepot).name):(filter==='all'?'Choose a depot below':BB.esc(d.depot(filter).name)))+' · '+all.length+' lines</h3>'+
        '<p class="muted" style="font-size:.84rem;margin-top:3px;max-width:560px;">Walk the shelves. If every count matches what is on the screen, one tap closes the take. If something moved, say it or type it in the table below.</p>'+
        (lastTake?'<div class="faint" style="font-size:.76rem;margin-top:6px;">Last take: '+BB.esc(lastTake.when)+' by '+BB.esc(lastTake.by)+' · '+BB.esc(lastTake.note)+'</div>':'')+
      '</div>'+
      '<div class="take-act">'+
        '<button class="btn lime" id="takeVoice" title="Say the product and the count">'+BB.icon('mic')+'Say a count</button>'+
        '<button class="btn" id="takeSame">'+BB.icon('check')+'Nothing has changed</button>'+
      '</div>'+
    '</div>'+
    '<div class="card-f row" style="gap:8px;"><span class="faint" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600;">Below reorder</span>'+
      '<span class="seg"><button class="tog'+(rmode==='notify'?' on':'')+'" data-rmode="notify">Notify Renzie</button><button class="tog'+(rmode==='auto'?' on':'')+'" data-rmode="auto">Auto-raise PO</button></span></div>'+
    '<div id="takeVoiceOut" style="display:none;margin:0 20px 16px;padding:12px 14px;border-radius:10px;background:#f7faf1;border:1px solid var(--line);font-size:.86rem;"></div>'+
  '</div>';

  // filter chips — only for seats that see more than one depot
  var chips = '';
  if(!scopeDepot){
    chips = '<div class="row" style="gap:6px;">';
    DEPOT_CHIPS.forEach(function(c){
      chips += '<button class="chip'+(filter===c.id?' on':'')+'" data-depot="'+c.id+'">'+BB.esc(c.name)+'</button>';
    });
    chips += '</div>';
  }

  // table
  var lowInView = rows.filter(function(i){ return i.qty<i.reorder; }).length;
  html += '<div class="card" data-stock-table="1" style="margin-top:16px;"><div class="card-h"><div><h3>Stock lines</h3><div class="sub">'+rows.length+' line'+(rows.length===1?'':'s')+(lowInView?' · '+lowInView+' below reorder':'')+' · type a count to save it</div></div>'+chips+'</div>'+
    '<div class="scroll"><table class="bb">'+
    '<thead><tr><th>Product</th>'+(scopeDepot?'':'<th class="ph-x">Depot</th>')+'<th class="num">On hand</th><th class="num ph-x">Reorder at</th><th class="lvl-col ph-x" style="min-width:150px;">Level</th><th class="ph-x">Status</th><th class="num">'+(phone?'Count':'Stock take')+'</th></tr></thead><tbody>';

  if(!rows.length){
    html += '<tr><td colspan="'+(scopeDepot?6:7)+'"><div class="empty">No stock lines for this depot.</div></td></tr>';
  } else {
    rows.forEach(function(i, idx){
      var p = d.product(i.prod);
      var st = statusOf(i);
      var low = st!=='In stock';
      var rowCls = st==='Out of stock' ? 'r-out' : (st==='Low stock' ? 'r-low' : '');
      html += '<tr class="'+rowCls+'">'+
        '<td><a href="#" data-line="'+i.depot+'|'+i.prod+'" style="color:var(--green-dark);font-weight:700;">'+BB.esc(p.name)+'</a><div class="faint" style="font-size:.72rem;">'+BB.esc(p.code)+' · '+BB.esc(p.pack)+'</div></td>'+
        (scopeDepot?'':'<td class="muted ph-x">'+BB.esc(d.depot(i.depot).name)+'</td>')+
        '<td class="num"><b>'+BB.num(i.qty)+'</b> <span class="faint" style="font-size:.72rem;">'+BB.esc(p.unit||'')+'</span></td>'+
        '<td class="num muted ph-x">'+BB.num(i.reorder)+'</td>'+
        '<td class="lvl-col ph-x">'+levelCell(i.qty, i.reorder)+'</td>'+
        '<td class="ph-x">'+BB.statusBadge(st)+'</td>'+
        '<td class="num"><div class="row" style="justify-content:flex-end;gap:8px;flex-wrap:nowrap;">'+
          (low ? '<button class="btn ghost sm" data-reorder="'+i.depot+'|'+i.prod+'">Reorder</button>' : '')+
          '<input type="number" min="0" value="'+i.qty+'" data-count="'+i.depot+'|'+i.prod+'" class="cnt-in" aria-label="Count for '+BB.esc(p.name)+'">'+
        '</div></td>'+
      '</tr>';
    });
  }
  html += '</tbody></table></div>'+
    '<div class="card-f">Tap a product for its card. Change an On-hand count and it saves the moment you leave the field. Reorder raises a request with the product\'s supplier. The mark on each level bar is the reorder level.</div></div>';
  if(phone) html += picHtml;
  html += '<div style="height:24px;"></div>';

  var main = document.querySelector('main.wrap');
  if(main){ main.innerHTML = html; } else { document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>'); }
  wire();
  drawCharts(all, oneDepot);
  var sTile=function(list, statuses){ return { table:lineTable(list), actions:[list.length?{ label:'Show them in the table', primary:true, onClick:function(){ showInTable(statuses); } }:null, go('Reorder radar','suppliers.html')] }; };
  BB.statDetail('st-low', function(){ return sTile(all.filter(function(i){ return i.qty<i.reorder; }), ['Low stock','Out of stock']); });
  BB.statDetail('st-out', function(){ return sTile(all.filter(function(i){ return i.qty<=0; }), ['Out of stock']); });
  BB.statDetail('st-value', function(){ return { table:lineTable(all, { byValue:true }), actions:[] }; });
}

function drawCharts(all, oneDepot){
  try{
    var val = function(i){ return (i.qty||0)*(d.product(i.prod).price||0); };
    if(oneDepot){
      var mine = all.filter(function(i){ return i.depot===oneDepot; });
      if(mine.length) BB.chart.bar('#chStock', { labels:mine.map(function(i){ return shortName(d.product(i.prod).name); }), height:220, table:true,
        series:[{name:'On hand', values:mine.map(function(i){ return i.qty; }), color:'#3f6b28'},{name:'Reorder at', values:mine.map(function(i){ return i.reorder; }), color:'#c77d17'}],
        // that line, and the same product at the other depots
        detail:function(ctx){ var i=mine[ctx.index]; openLine(i.depot, i.prod); return false; } });
      var byP = mine.map(function(i){ return { label:shortName(d.product(i.prod).name), value:val(i), lines:[i] }; }).sort(function(a,b){ return b.value-a.value; });
      if(byP.length>6){ var rest = byP.slice(5); byP = byP.slice(0,5).concat([{label:'Everything else', value:rest.reduce(function(t,x){ return t+x.value; },0), color:'#6b7a5e', lines:rest.map(function(x){ return x.lines[0]; })}]); }
      if(document.getElementById('chValue')) BB.chart.donut('#chValue', { money:true, valueLabel:'On-hand value', centreLabel:'on hand', rows:byP,
        // the line(s) behind that slice
        detail:function(ctx){ var ls=ctx.row.lines||[]; if(ls.length===1){ openLine(ls[0].depot, ls[0].prod); return false; }
          return { table:lineTable(ls, { byValue:true, depot:false }) }; } });
    } else {
      var deps = d.all('depots');
      // counts of lines: keep the axis on whole numbers
      var perDep = deps.map(function(x){ return all.filter(function(i){ return i.depot===x.id; }).length; });
      var cMax = Math.max(4, Math.ceil(Math.max.apply(null, perDep.concat([0]))/4)*4);
      if(all.length) BB.chart.bar('#chStock', { labels:deps.map(function(x){ return depotShort(x.id); }), stacked:true, height:220, table:true, max:cMax,
        // that depot's lines, with on hand / reorder / status
        detail:function(ctx){ return depotLines(deps[ctx.index].id); },
        series:[
          {name:'In stock', values:deps.map(function(x){ return all.filter(function(i){ return i.depot===x.id && i.qty>=i.reorder; }).length; }), color:'#3f6b28'},
          {name:'Low', values:deps.map(function(x){ return all.filter(function(i){ return i.depot===x.id && i.qty>0 && i.qty<i.reorder; }).length; }), color:'#c77d17'},
          {name:'Out', values:deps.map(function(x){ return all.filter(function(i){ return i.depot===x.id && i.qty<=0; }).length; }), color:'#b8382a'}] });
      if(document.getElementById('chValue')) BB.chart.donut('#chValue', { money:true, valueLabel:'On-hand value', centreLabel:'on hand',
        detail:function(ctx){ return depotLines(ctx.row.depId, true); },
        rows:deps.map(function(x,k){ return { depId:x.id, label:depotShort(x.id), value:all.filter(function(i){ return i.depot===x.id; }).reduce(function(t,i){ return t+val(i); },0), color:['#3f6b28','#2f6f9e','#c77d17','#7d4f9a'][k%4] }; }) });
    }
  }catch(e){ console.warn('chart', e); }
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.tog[data-rmode]'), function(c){ c.onclick=function(){ try{ localStorage.setItem('bb_reorder_mode', this.dataset.rmode); }catch(e){} BB.toast(this.dataset.rmode==='auto'?'Below reorder → purchase order raised automatically with the supplier':'Below reorder → Renzie is notified to reorder'); render(); }; });
  // one-tap stock take — everything matches
  var same=document.getElementById('takeSame');
  if(same) same.onclick=function(){
    var dep = scopeDepot || (filter!=='all'?filter:null);
    if(!dep){ BB.toast('Pick a depot first'); return; }
    var rows = d.store().inventory.filter(function(i){ return i.depot===dep; });
    var when = new Date(); var stamp = when.toLocaleDateString('en-ZA',{day:'numeric',month:'short'})+' '+when.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
    rows.forEach(function(i){ d.enqueue({ op:'stocktake', table:'inventory', depot:dep, prod:i.prod, qty:i.qty, confirmed:true }); });
    try{ localStorage.setItem('bb_stocktake_'+dep, JSON.stringify({ when:stamp, by:BB.user.name, note:rows.length+' lines confirmed, no changes' })); }catch(e){}
    d.add('feed', { from:BB.user.id, date:when.toISOString().slice(0,10), kind:'Stock', farmer:null, ref:null, text:'Stock take done at '+d.depot(dep).name+' — '+rows.length+' lines counted, nothing changed.' });
    BB.toast('Stock take closed · '+rows.length+' lines confirmed');
    render();
  };
  // voice count — "SoilPrime six hundred and forty" / "HumiMax 220"
  var vb=document.getElementById('takeVoice'), vo=document.getElementById('takeVoiceOut');
  if(vb) vb.onclick=function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    vo.style.display='block';
    if(!SR){ vo.innerHTML='<b>Voice needs Chrome or Safari on the phone.</b> Type the count in the table below instead.'; return; }
    var rec=new SR(); rec.lang='en-ZA'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    vo.innerHTML='<span class="faint">Listening… say the product and the count, e.g. “SoilPrime 640”.</span>';
    vb.disabled=true;
    rec.onresult=function(e){
      var t=''; for(var i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; }
      vo.innerHTML='<span class="faint">Heard:</span> “'+BB.esc(t)+'”';
      if(e.results[e.results.length-1].isFinal){ applyVoiceCount(t); }
    };
    rec.onerror=function(){ vb.disabled=false; vo.innerHTML='<b>Didn’t catch that.</b> Tap the mic and try again, or type the count below.'; };
    rec.onend=function(){ vb.disabled=false; };
    try{ rec.start(); }catch(err){ vb.disabled=false; }
  };
  function wordsToNumber(str){
    var small={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
    var m=str.match(/\d[\d\s]*/); if(m) return parseInt(m[0].replace(/\s/g,''),10);
    var total=0,cur=0,hit=false;
    str.toLowerCase().replace(/-/g,' ').split(/\s+/).forEach(function(w){
      if(small[w]!=null){ cur+=small[w]; hit=true; }
      else if(w==='hundred'){ cur=(cur||1)*100; hit=true; }
      else if(w==='thousand'){ cur=(cur||1)*1000; total+=cur; cur=0; hit=true; }
    });
    return hit? total+cur : null;
  }
  function applyVoiceCount(t){
    var dep = scopeDepot || (filter!=='all'?filter:null);
    var rows = d.store().inventory.filter(function(i){ return !dep || i.depot===dep; });
    var low=t.toLowerCase().replace(/[^a-z0-9\s]/g,' ');
    var best=null, bestScore=0;
    rows.forEach(function(i){
      var p=d.product(i.prod); var name=String(p.name||'').toLowerCase();
      var toks=name.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
      var score=0; toks.forEach(function(tk){ if(tk.length>2 && low.indexOf(tk)>=0) score+=tk.length; });
      if(low.indexOf(name.replace(/\s/g,''))>=0) score+=name.length;
      if(score>bestScore){ bestScore=score; best=i; }
    });
    var qty=wordsToNumber(low);
    if(!best || qty==null){ vo.innerHTML='<b>Heard</b> “'+BB.esc(t)+'” — <span class="muted">couldn’t match a product and a number. Try “SoilPrime 640”.</span>'; return; }
    var p=d.product(best.prod); var was=best.qty;
    best.qty=Math.max(0,Math.round(qty)); d.save();
    d.enqueue({ op:'stocktake', table:'inventory', depot:best.depot, prod:best.prod, qty:best.qty, via:'voice' });
    BB.toast('Counted · '+p.name+' '+BB.num(best.qty));
    render();
    var vo2=document.getElementById('takeVoiceOut'); if(vo2){ vo2.style.display='block'; vo2.innerHTML='<b>'+BB.esc(p.name)+'</b> updated: '+BB.num(was)+' → <b>'+BB.num(best.qty)+'</b>. Say the next one, or tap <b>Nothing has changed</b> to close the take.'; }
  }
  // a product opens its line's card
  Array.prototype.forEach.call(document.querySelectorAll('a[data-line]'), function(a){
    a.onclick = function(e){ e.preventDefault(); var k=a.getAttribute('data-line').split('|'); openLine(k[0], k[1]); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-depot]'), function(btn){
    btn.onclick = function(){ filter = btn.getAttribute('data-depot'); render(); };
  });
  // stock take — update the live inventory row and persist
  Array.prototype.forEach.call(document.querySelectorAll('input[data-count]'), function(inp){
    inp.onchange = function(){
      var parts = inp.getAttribute('data-count').split('|');
      var depotId = parts[0], prodId = parts[1];
      var row = d.store().inventory.find(function(r){ return r.depot===depotId && r.prod===prodId; });
      if(row && String(inp.value).trim()===''){ inp.value=row.qty; BB.toast('Count left as '+row.qty+' — type 0 if the shelf is empty'); return; }
      if(row){
        var val = Math.max(0, Math.round(Number(inp.value)||0));
        row.qty = val;
        d.save();
        d.enqueue({ op:'stocktake', table:'inventory', depot:depotId, prod:prodId, qty:val });
        BB.toast('Count saved · '+d.product(prodId).name);
        render();
      }
    };
  });
  // reorder — raise request with the supplier
  Array.prototype.forEach.call(document.querySelectorAll('button[data-reorder]'), function(btn){
    btn.onclick = function(){
      var parts = btn.getAttribute('data-reorder').split('|');
      var prodId = parts[1];
      var p = d.product(prodId);
      var sup = d.supplier(p.supplier);
      BB.toast('Reorder raised with '+sup.name);
    };
  });
}

document.body.insertAdjacentHTML('beforeend', '<main class="wrap"></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
