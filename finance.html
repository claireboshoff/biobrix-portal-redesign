<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Finance · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign6"></script><script src="guard.js?v=redesign6"></script>
<script src="bb-data.js?v=redesign6"></script>
<script src="bb-shell.js?v=redesign6"></script>
<style>
  .fin-row{margin-top:16px;}
  .fin-rec{display:grid;gap:16px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;}
  @media(max-width:1100px){.fin-rec{grid-template-columns:minmax(0,1fr);}}
  .sync{display:flex;gap:16px;align-items:flex-start;}
  .sync .logo{width:46px;height:46px;border-radius:12px;background:#0b3d2e;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.74rem;letter-spacing:.6px;flex:none;}
  .sync .what{font-size:.84rem;color:var(--muted);line-height:1.5;}
  .sync-facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:.82rem;}
  .sync-facts dt{color:var(--faint);}
  .sync-facts dd{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .sync-ledger{margin-top:14px;padding:10px 12px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-soft);font-size:.8rem;color:var(--muted);line-height:1.5;}
  .sync-ledger b{color:var(--green-darkest);}
  .sync-err{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--red);line-height:1.45;}
  .sync-err .ico{width:15px;height:15px;margin-top:1px;}
  .gap-pos{color:var(--amber);font-weight:700;}
  .gap-zero{color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .gap-zero .ico{width:14px;height:14px;}
  .rep-dot{display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;}
  .rep-dot i{width:9px;height:9px;border-radius:50%;flex:none;}
  .inv-ref{font-weight:600;color:var(--green-darkest);}
  .sub-line{font-size:.72rem;color:var(--faint);margin-top:1px;}
  .od{font-size:.72rem;color:var(--red);font-weight:600;margin-top:1px;}
  .kind-tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:.64rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--line-soft);color:var(--muted);vertical-align:middle;}
  table.bb td.desc{max-width:280px;min-width:170px;color:var(--muted);}
  .ob-list{display:flex;flex-direction:column;}
  .draft{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 20px;border-top:1px solid var(--line-soft);border-left:3px solid var(--amber);background:#fffdf7;}
  .draft.sent{border-left-color:var(--ok);background:#fff;}
  .draft .subj{font-weight:600;font-size:.88rem;line-height:1.4;margin-top:4px;}
  .draft .meta{font-size:.74rem;color:var(--faint);margin-top:3px;}
  .ob-note{padding:12px 20px;font-size:.8rem;color:var(--muted);background:var(--panel-2);}
  .scroll.tall tfoot td{position:sticky;bottom:0;z-index:1;}
  .chart-empty{padding:28px 10px;text-align:center;color:var(--faint);font-size:.84rem;}
  @media(max-width:560px){
    .sync{flex-direction:column;}
    .draft{flex-direction:column;padding:12px 14px;}
    .ob-note{padding:12px 14px;}
  }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'finance', back:'index.html' });
var d = BB.data, u = BB.user;

// The last six calendar months, oldest first — the same window the home page charts.
var MONTHS6 = (function(){ var out=[], t=new Date(); t.setDate(1); for(var k=5;k>=0;k--){ var x=new Date(t.getFullYear(), t.getMonth()-k, 1); out.push({ ym:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'), l:BB.monthName(x.getMonth()) }); } return out; })();

function render(){
  var invs=d.all('invoices'), orders=d.all('orders'), outbox=d.all('outbox'), sync=d.all('syncLog')[0];
  // Outstanding is what is STILL owed on each invoice (part-payments count), not the whole invoice —
  // so these tiles reconcile with the accounting system instead of overstating the book.
  function open_(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); }
  var billed=invs.reduce(function(s,i){return s+(i.amount||0);},0);
  var owing=invs.reduce(function(s,i){return s+open_(i);},0);
  var paid=billed-owing;
  var overdueInvs=invs.filter(function(i){return i.status==='Overdue';});
  var overdue=overdueInvs.reduce(function(s,i){return s+open_(i);},0);
  var openCount=invs.filter(function(i){ return open_(i)>0.5; }).length;
  // The customers' own ledger balances — the figure finance sees in the accounting system.
  var ledger=null;
  if(BB.auth.live){ var fs=d.allUnscoped('farmers').filter(function(f){return f.sageBalance!=null;});
    if(fs.length) ledger=fs.reduce(function(s,f){return s+(f.sageBalance||0);},0); }

  // Money received. Live: the payments read from the ledger. Demo: the paid date on each invoice.
  var pays=d.all('payments')||[];
  var paySrc = pays.length ? pays : invs.filter(function(i){ return i.paidDate; }).map(function(i){ return { date:i.paidDate, amount:i.amount||0, ref:i.ref, farmer:i.farmer, forInv:i.label||i.ref }; });
  var sumMonth = function(list, key, ym){ return list.filter(function(x){ return String(x[key]||'').slice(0,7)===ym; }).reduce(function(t,x){ return t+(x.amount||0); },0); };
  var invByM = MONTHS6.map(function(m){ return sumMonth(invs,'date',m.ym); });
  var payByM = MONTHS6.map(function(m){ return sumMonth(paySrc,'date',m.ym); });
  var thisYm = MONTHS6[5].ym;
  var recvMonth = payByM[5], recvCount = paySrc.filter(function(x){ return String(x.date||'').slice(0,7)===thisYm; }).length;

  // Ageing: open money by days past its due date.
  var t0=new Date(new Date().toISOString().slice(0,10));
  var daysOver=function(i){ return i.dueDate ? Math.round((t0-new Date(i.dueDate))/86400000) : 0; };
  var ageB=[{label:'Current',value:0,color:'#3f6b28'},{label:'1–30 days',value:0,color:'#8fbf5a'},{label:'31–60 days',value:0,color:'#c77d17'},{label:'61–90 days',value:0,color:'#a3533f'},{label:'90+ days',value:0,color:'#b8382a'}];
  invs.forEach(function(i){ var v=open_(i); if(v<=0.5) return; var dd=daysOver(i); ageB[dd<=0?0:dd<=30?1:dd<=60?2:dd<=90?3:4].value+=v; });

  // Who is over their credit limit (the ledger balance when Sage is connected, open invoices otherwise).
  var overL=d.all('farmers').filter(function(f){ return d.overLimit(f.id,0); });
  var overAmt=overL.reduce(function(t,f){ return t+(d.accountBalance(f.id)-d.creditLimit(f.id)); },0);

  // Top debtors: open money per customer, split into overdue and not yet due.
  var byCust={};
  invs.forEach(function(i){ var v=open_(i); if(v<=0.5) return; var k=i.farmer||'_none';
    var r=byCust[k]||(byCust[k]={ id:i.farmer, od:0, nd:0, n:0 }); r.n++; if(i.status==='Overdue') r.od+=v; else r.nd+=v; });
  var debtors=Object.keys(byCust).map(function(k){ return byCust[k]; }).sort(function(a,b){ return (b.od+b.nd)-(a.od+a.nd); });
  var canFarm = BB.auth.canPage('farm-detail.html');

  // ---- Popups: the records behind each figure and chart part (CONVENTIONS: clicks open popups) ----
  var POP_CAP=100, farmHref=function(id){ return canFarm && id ? 'farm-detail.html?farmer='+encodeURIComponent(id) : null; };
  var bold=function(t){ return { html:'<b>'+BB.esc(t)+'</b>' }; };
  var capNote=function(n){ return n>POP_CAP ? 'Showing the first '+POP_CAP+' of '+n+'. The totals count all '+n+'.' : null; };
  var byOpen=function(a,b){ return open_(b)-open_(a); }, byDate=function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); };
  var invTable=function(list, oneCust){
    var ta=0, to=0; list.forEach(function(i){ ta+=(i.amount||0); to+=open_(i); });
    // one customer's open invoices, inside their card: short and narrow (the status is in the due date)
    if(oneCust){ var nw=function(t){ return { html:'<span style="white-space:nowrap">'+BB.esc(t)+'</span>' }; };
      return { columns:['Invoice','Date','Due','Amount','Outstanding'], num:[3,4], foot:list.length>1?['Total · '+list.length,{html:''},{html:''},BB.money(ta),BB.money(to)]:null,
        rows:list.slice(0,POP_CAP).map(function(i){ var op=open_(i), dd=daysOver(i);
          return { cells:[i.label||i.ref||'—', nw(BB.shortDate(i.date)), { html:'<span style="white-space:nowrap">'+BB.esc(BB.shortDate(i.dueDate))+'</span>'+(op>0.5&&dd>0?'<div style="font-size:.72rem;color:var(--red);font-weight:600;white-space:nowrap">'+dd+' days over</div>':'') }, BB.money(i.amount), op>0.5?BB.money(op):'—'] }; }) }; }
    var rows=list.slice(0,POP_CAP).map(function(i){ var f=d.farmer(i.farmer), op=open_(i), dd=daysOver(i);
      return { cells:[i.label||i.ref||'—', f.name, BB.date(i.date), { html:BB.esc(BB.date(i.dueDate))+(op>0.5&&dd>0?' <span class="faint">· '+dd+' d over</span>':'') }, BB.money(i.amount), op>0.5?BB.money(op):'—', { html:BB.statusBadge(i.status) }], onClick:oneCust?null:cardRow(i.farmer) }; });
    if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' invoices'),{html:''},{html:''},{html:''},bold(BB.money(ta)),bold(BB.money(to)),{html:''}] });
    var t={ columns:['Invoice','Customer','Date','Due','Amount','Outstanding','Status'], rows:rows, num:[4,5] };
    // one customer's invoices: the name is in the title, not on every line
    if(oneCust){ t.columns.splice(1,1); t.rows.forEach(function(r){ r.cells.splice(1,1); }); t.num=[3,4]; }
    return t;
  };
  var payTable=function(list){
    var tot=0; list.forEach(function(x){ tot+=(x.amount||0); });
    var rows=list.slice(0,POP_CAP).map(function(x){ return { cells:[x.ref||'—', d.farmer(x.farmer).name, BB.date(x.date), x.forInv||x.description||'—', BB.money(x.amount||0)], onClick:cardRow(x.farmer) }; });
    if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' receipts'),{html:''},{html:''},{html:''},bold(BB.money(tot))] });
    return { columns:['Receipt','Customer','Date','For','Amount'], rows:rows, num:[4] };
  };
  // ---- a customer, as its card (CONVENTIONS: the card pattern): who and where · what is open · its open invoices ----
  var initialsOf=function(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); };
  var cardRow=function(fid){ return fid && d.by('farmers', fid) ? function(){ BB.popup(custCard(fid)); } : null; };
  window.__finCustCard = function(fid){ return custCard(fid); };   // ?cust= (menu search) opens it
  function custCard(fid){
    var f=d.farmer(fid), list=openInvs.filter(function(i){ return (i.farmer||null)===(fid||null); }).sort(byOpen);
    var open=0, odv=0, oldest=0; list.forEach(function(i){ var v=open_(i); open+=v; if(i.status==='Overdue'){ odv+=v; oldest=Math.max(oldest, daysOver(i)); } });
    var bal=d.accountBalance(fid), lim=d.creditLimit(fid), rep=d.rep(f.rep), tel=String(f.cell||'').replace(/\D/g,'').replace(/^0/,'27'), rec=farmHref(fid);
    // the oldest overdue invoice with no reminder waiting yet: the one main thing to do from here
    var nudge=list.filter(function(i){ return i.status==='Overdue' && !outbox.some(function(x){ return x.invoice===i.id && x.status==='Draft'; }); }).sort(function(a,b){ return daysOver(b)-daysOver(a); })[0];
    var t=invTable(list, true); t.title='Open invoices';
    var warn = lim && bal>lim ? 'Over the credit limit by '+BB.money(bal-lim)+' · deliveries on hold' : (odv? BB.money(odv)+' overdue · deliveries on hold' : '');
    return { eyebrow:'Customer', title:f.name||'—', wide:true, layout:'split',
      meta:[ f.farm&&f.farm!==f.name?{ icon:'farm', text:f.farm, tip:'Farm', href:rec }:null,
        (f.town||f.region)?{ icon:'map', text:[f.town,f.region].filter(Boolean).join(', '), tip:'Town' }:null,
        tel?{ icon:'phone', tip:'Phone', html:'<a href="tel:+'+tel+'">'+BB.esc(f.cell)+'</a>' }:null,
        rep&&rep.name&&rep.name!=='—'?{ initials:initialsOf(rep.name), color:rep.colour, text:rep.name, tip:'Rep' }:null ],
      stats:[{ l:'Open', v:BB.money(open), s:list.length+' invoice'+(list.length===1?'':'s') },
        { l:'Overdue', v:odv?BB.money(odv):'—', s:odv?'oldest '+oldest+' days':'inside terms', cls:odv?'bad':'' },
        { l:'Balance', v:BB.money(bal), s:BB.auth.live?'in your accounts':'open invoices' },
        { l:'Credit limit', v:lim?BB.money(lim):'—', s:lim&&bal>lim?'over by '+BB.money(bal-lim):null, cls:lim&&bal>lim?'warn':'' }],
      html:warn?'<div class="bbp-alert'+(odv?'':' warn')+'">'+BB.icon('alert')+'<span>'+BB.esc(warn)+'</span></div>':'', table:t, note:capNote(list.length),
      actions:[ rec?{ label:'Farm record', href:rec }:null,
        nudge? { label:'Draft reminder · '+(nudge.label||nudge.ref), primary:true, onClick:function(){ BB.closePopup(); draftReminder(nudge.id); } }
             : { label:'Go to the invoices', primary:!rec, onClick:toInvoices } ].filter(Boolean) };
  }
  var toInvoices=function(){ BB.closePopup(); var el=document.getElementById('invoices'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); };
  // The tiles' list is the invoices table below under its ?show= preset: already there → scroll; otherwise load it.
  var curShow=(new URLSearchParams(location.search).get('show')||'all').toLowerCase();
  var listAction=function(k){ return [{ label:'Open the full list', primary:true, onClick:function(){ if(curShow===k) toInvoices(); else location.href='finance.html?show='+k+'#invoices'; } }]; };
  var openInvs=invs.filter(function(i){ return open_(i)>0.5; });
  var recvList=paySrc.filter(function(x){ return String(x.date||'').slice(0,7)===thisYm; }).sort(byDate);
  BB.statDetail('f-owed', function(){ return { wide:true, table:invTable(openInvs.slice().sort(byOpen)), note:capNote(openInvs.length), actions:listAction('open') }; });
  BB.statDetail('f-overdue', function(){ return { wide:true, table:invTable(overdueInvs.slice().sort(byOpen)), note:capNote(overdueInvs.length), actions:listAction('overdue') }; });
  BB.statDetail('f-recv', function(){ return { wide:true, table:payTable(recvList), note:capNote(recvList.length),
    actions:[{ label:'Go to the invoices', primary:true, onClick:toInvoices }] }; });
  BB.statDetail('f-overlimit', function(){
    var rows=overL.map(function(f){ var b=d.accountBalance(f.id), l=d.creditLimit(f.id); return { f:f, b:b, l:l, o:b-l }; }).sort(function(a,b){ return b.o-a.o; });
    return { table:{ columns:['Customer','Balance','Limit','Over by'], num:[1,2,3],
      rows:rows.map(function(r){ return { cells:[r.f.name+(r.f.farm&&r.f.farm!==r.f.name?' · '+r.f.farm:''), BB.money(r.b), BB.money(r.l), BB.money(r.o)], onClick:cardRow(r.f.id) }; }) } }; });

  var html='';
  html+='<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Finance</div><h1>Finance &amp; reconciliation</h1>'+
    '<p>What the reps report, what was actually invoiced, what has been paid — with the accounting system mirrored alongside, so nobody types a number twice.</p></div>'+
    '<div class="row" style="gap:8px;">'+
      '<a class="btn ghost" href="#outbox">'+BB.icon('message')+'Outbox'+(outbox.filter(function(x){return x.status==='Draft';}).length?' <span class="badge b-warn">'+outbox.filter(function(x){return x.status==='Draft';}).length+'</span>':'')+'</a>'+
      '<button class="btn" id="syncNow">'+BB.icon('refresh')+'Sync now</button>'+
    '</div></div>';
  html+=BB.staleNote();

  // ---- KPI strip ----
  var tile=function(href, cls, label, value, sub, spark, key){
    var inner='<div class="l">'+label+'</div><div class="v">'+value+'</div><div class="s">'+sub+'</div>'+(spark?'<div class="spark">'+spark+'</div>':'');
    if(href && BB.auth.canPage(href)) return '<a class="stat tap'+(cls?' '+cls:'')+'" href="'+href+'"'+(key?' data-detail="'+key+'"':'')+'>'+inner+'</a>';
    return '<div class="stat'+(cls?' '+cls:'')+'">'+inner+'</div>';
  };
  html+='<div class="grid g4" style="margin-top:14px;">'+
    tile('finance.html?show=open#invoices', '', 'Owed to you', BB.money(owing), openCount+' invoice'+(openCount===1?'':'s')+' open · '+BB.money(billed)+' invoiced', null, 'f-owed')+
    tile('finance.html?show=overdue#invoices', overdue?'bad':'', 'Overdue', BB.money(overdue), overdueInvs.length+' invoice'+(overdueInvs.length===1?'':'s')+' past due · deliveries on hold', null, 'f-overdue')+
    tile('finance.html#invoices', '', 'Received this month', BB.money(recvMonth), recvCount+' receipt'+(recvCount===1?'':'s')+' · '+BB.money(paid)+' paid in all', BB.chart.spark(payByM,{color:'#68a53e'}), 'f-recv')+
    tile('farms.html?show=overlimit', overL.length?'warn':'', 'Over their limit', overL.length, overL.length? BB.money(overAmt)+' over in total' : 'every account inside its limit', null, 'f-overlimit')+
  '</div>';

  // ---- The picture: money in and out, and how old the open money is ----
  html+='<div class="split fin-row">'+
    '<div class="card"><div class="card-h"><div><h3>Invoiced vs received</h3><div class="sub">last six months'+(pays.length?' · invoices and payments from your accounting system':' · invoice date vs paid date')+'</div></div>'+BB.liveChip()+'</div><div class="card-p"><div id="chTrend"></div></div></div>'+
    '<div class="card"><div class="card-h"><div><h3>What is owed, by age</h3><div class="sub">open invoices · days past due</div></div></div><div class="card-p"><div id="chAge"></div></div></div>'+
  '</div>';

  // ---- Top debtors beside the accounting system ----
  html+='<div class="split fin-row">';
  html+='<div class="card"><div class="card-h"><div><h3>Top debtors</h3><div class="sub">open money per customer · overdue first in each bar</div></div><span class="badge b-grey">'+debtors.length+' owing</span></div><div class="card-p"><div id="chDebtors"></div></div></div>';

  html+='<div class="card"><div class="card-h"><div><h3>Accounting system</h3><div class="sub">read-only mirror · you keep invoicing where you do today</div></div>'+BB.statusBadge(sync?sync.status:'Design')+'</div>'+
    '<div class="card-p"><div class="sync"><div class="logo">SAGE</div><div style="min-width:0;">'+
      '<b style="font-family:var(--display);color:var(--green-darkest);">'+BB.esc(sync?sync.system:'Sage 200 Evolution')+'</b>'+
      '<div class="what" style="margin-top:3px;">Pulls <b>'+BB.esc(sync?sync.pulled:'')+'</b> into this portal three times a day. Nothing is written back into Sage — invoices are still raised there until you decide to move invoicing into the portal.</div>'+
    '</div></div>'+
    '<dl class="sync-facts"><dt>Last sync</dt><dd>'+BB.esc(sync?sync.last:'—')+'</dd><dt>Next</dt><dd>'+BB.esc(sync?sync.next:'—')+'</dd>'+
      (sync&&sync.counts?'<dt>Read</dt><dd>'+BB.esc(sync.counts.customers)+' customers · '+BB.esc(sync.counts.invoices)+' invoices</dd>':'')+'</dl>'+
    (ledger!=null?'<div class="sync-ledger"><b>Customer balances in Sage: '+BB.money(ledger)+'</b> — what the accounts show right now. "Owed to you" above is what is open on individual invoices; the difference is credits not yet allocated to an invoice.</div>':'')+
    (sync&&sync.lastError?'<div class="sync-err">'+BB.icon('alert')+'<span>Last attempt failed '+BB.esc((sync.lastError.at||'').slice(0,16).replace('T',' '))+' — the team has it; figures shown are from the last good sync.</span></div>':'')+
    '</div>'+
    (BB.auth.live?'':'<div class="card-f"><a href="jobs.html" style="color:var(--green-dark);font-weight:600;">Which Evolution version do you run? ›</a></div>')+
  '</div>';
  html+='</div>';

  // ---- invoices ----
  var show=(new URLSearchParams(location.search).get('show')||'all').toLowerCase();
  var shown=invs.filter(function(i){ return show==='open'? i.status!=='Paid' : show==='overdue'? i.status==='Overdue' : true; });
  var shownSorted=shown.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var listed=shownSorted.slice(0,300);
  var totAmt=shown.reduce(function(t,i){ return t+(i.amount||0); },0), totOpen=shown.reduce(function(t,i){ return t+open_(i); },0);
  html+='<div class="card fin-row" id="invoices"><div class="card-h"><div><h3>Invoices '+BB.liveChip()+'</h3><div class="sub">'+shown.length+' of '+invs.length+' · from your accounting system</div></div>'+
    '<div class="seg" role="tablist" aria-label="Filter invoices">'+
      ['all|All','open|Still open','overdue|Overdue'].map(function(o){ var k=o.split('|')[0], t=o.split('|')[1];
        return '<a class="'+(show===k?'on':'')+'" href="finance.html?show='+k+'#invoices">'+t+'</a>'; }).join('')+
    '</div></div>';
  html+='<div class="scroll tall"><table class="bb"><thead><tr><th>Invoice</th><th>Customer</th><th>For</th><th>Due</th><th class="num">Amount</th><th class="num">Outstanding</th><th>Status</th><th></th></tr></thead><tbody>';
  if(!listed.length) html+='<tr><td colspan="8"><div class="empty">No invoices '+(show==='overdue'?'overdue':show==='open'?'still open':'yet')+'.</div></td></tr>';
  listed.forEach(function(i){
    var f=d.farmer(i.farmer); var hasDraft=outbox.some(function(x){return x.invoice===i.id && x.status==='Draft';});
    var op=open_(i), dd=daysOver(i);
    html+='<tr><td><span class="inv-ref">'+BB.esc(i.label||i.ref)+'</span>'+(i.kind&&i.kind!=='invoice'?'<span class="kind-tag">'+(i.kind==='opening'?'brought forward':'journal')+'</span>':'')+'<div class="sub-line">'+BB.date(i.date)+'</div></td>'+
      '<td>'+BB.esc(f.name)+(f.farm&&f.farm!==f.name?'<div class="sub-line">'+BB.esc(f.farm)+'</div>':'')+'</td>'+
      '<td class="desc">'+BB.esc(i.description||'')+'</td>'+
      '<td style="white-space:nowrap;">'+BB.date(i.dueDate)+(op>0.5&&dd>0?'<div class="od">'+dd+' day'+(dd===1?'':'s')+' over</div>':'')+'</td>'+
      '<td class="num">'+BB.money(i.amount)+'</td>'+
      '<td class="num">'+(op>0.5?'<b>'+BB.money(op)+'</b>':'<span class="faint">—</span>')+'</td>'+
      '<td>'+BB.statusBadge(i.status)+'</td>'+
      '<td class="right" style="white-space:nowrap;">'+(i.status==='Paid'?'':(hasDraft?'<span class="badge b-warn">Reminder drafted</span>':'<button class="btn ghost sm" data-remind="'+i.id+'">Draft reminder</button>'))+'</td></tr>';
  });
  html+='</tbody>';
  if(listed.length) html+='<tfoot><tr><td colspan="4">Total · '+shown.length+' invoice'+(shown.length===1?'':'s')+'</td><td class="num">'+BB.money(totAmt)+'</td><td class="num">'+BB.money(totOpen)+'</td><td colspan="2"></td></tr></tfoot>';
  html+='</table></div>';
  if(shown.length>listed.length) html+='<div class="card-f">Showing the latest '+listed.length+' of '+shown.length+'. The totals count all '+shown.length+'.</div>';
  html+='</div>';

  // ---- reported vs actual per rep (beside the outbox) ----
  var reps=d.all('reps');
  // This reconciliation compares orders captured in the portal against invoices. BioBrix capture
  // their orders in Sage, so on a live client seat there is nothing on the portal side to compare
  // and the whole section stands down rather than showing an empty table under a sample warning.
  var liveSeat = !!(BB.auth && BB.auth.tenantLive && BB.auth.tenantLive() && !(BB.auth.isFreedomHub && BB.auth.isFreedomHub()));
  var repRowsAny = reps.some(function(r){ return orders.some(function(o){ return o.rep===r.id && (o.status==='Delivered'||o.status==='Confirmed'); }); });
  var showRec = !(liveSeat && !repRowsAny);
  if(showRec && BB.sageReal() && !liveSeat) html+=BB.sampleNote('what the reps reported');
  html+=showRec ? '<div class="fin-rec fin-row">' : '';
  if(showRec){
    var tRep=0, tAct=0;
    html+='<div class="card"><div class="card-h"><div><h3>Reported vs actual</h3><div class="sub">rep counts delivered as a sale · finance counts invoiced</div></div></div>';
    html+='<div class="scroll"><table class="bb"><thead><tr><th>Rep</th><th class="num">Reported</th><th class="num">Invoiced</th><th class="num">Gap</th><th></th></tr></thead><tbody>';
    reps.forEach(function(r){
      var ro=orders.filter(function(o){return o.rep===r.id && (o.status==='Delivered'||o.status==='Confirmed');});
      var reported=ro.reduce(function(s,o){return s+d.quoteTotal(o);},0);
      var actual=ro.filter(function(o){return d.orderInvoiced(o.id);}).reduce(function(s,o){return s+d.quoteTotal(o);},0);
      var gap=reported-actual; var un=ro.filter(function(o){return !d.orderInvoiced(o.id);});
      if(!ro.length) return;
      tRep+=reported; tAct+=actual;
      html+='<tr><td><span class="rep-dot"><i style="background:'+BB.esc(r.colour)+';"></i>'+BB.esc(r.name)+'</span></td><td class="num">'+BB.money(reported)+'</td><td class="num">'+BB.money(actual)+'</td>'+
        '<td class="num">'+(gap?'<span class="gap-pos">'+BB.money(gap)+'</span>':'<span class="gap-zero">'+BB.icon('check')+'Reconciled</span>')+'</td>'+
        '<td class="right">'+(un.length?'<button class="btn sm" data-invall="'+r.id+'">Invoice '+un.length+' order'+(un.length>1?'s':'')+'</button>':'')+'</td></tr>';
    });
    html+='</tbody><tfoot><tr><td>Total</td><td class="num">'+BB.money(tRep)+'</td><td class="num">'+BB.money(tAct)+'</td><td class="num">'+(tRep-tAct?'<span class="gap-pos">'+BB.money(tRep-tAct)+'</span>':'—')+'</td><td></td></tr></tfoot></table></div>';
    html+='<div class="card-f">Reported is delivered + confirmed orders. A gap means a rep is counting product that went out but was never invoiced. Invoice it here and the actuals catch up — the forecast page updates the same second.</div></div>';
  }

  // ---- outbox: drafts first, automation later ----
  var drafts=outbox.filter(function(x){return x.status==='Draft';}).length;
  html+='<div class="card'+(showRec?'':' fin-row')+'" id="outbox"><div class="card-h"><div><h3>Outbox</h3><div class="sub">invoices &amp; reminders wake up as drafts — you check, then send</div></div><span class="chip">Auto-send: off</span></div>';
  html+='<div class="ob-note">Automation is <b>off</b> — every message lands here first. Once you trust it, switch it on and the reminders go by themselves.'+(drafts?' <b>'+drafts+'</b> waiting for you.':'')+'</div>';
  if(!outbox.length) html+='<div class="empty">Nothing waiting.</div>';
  html+='<div class="ob-list">';
  outbox.slice().sort(function(a,b){return (b.created||'').localeCompare(a.created||'');}).forEach(function(x){
    var f=d.farmer(x.to); var iv=d.by('invoices',x.invoice)||{};
    html+='<div class="draft'+(x.status==='Sent'?' sent':'')+'">'+
      '<div style="min-width:0;"><div class="row" style="gap:6px;"><span class="badge '+(x.kind==='Invoice'?'b-blue':'b-warn')+'">'+BB.esc(x.kind)+'</span>'+BB.statusBadge(x.status)+'</div>'+
      '<div class="subj">'+BB.esc(x.subject)+'</div>'+
      '<div class="meta">To '+BB.esc(f.name)+' · '+BB.esc(x.channel)+' · '+BB.date(x.created)+(iv.status?' · invoice '+BB.esc(iv.status).toLowerCase():'')+'</div></div>'+
      (x.status==='Draft'?'<div style="flex:none;"><button class="btn sm" data-send="'+x.id+'">'+BB.icon('check')+'Check &amp; send</button></div>':'')+
    '</div>';
  });
  html+='</div></div>';
  html+=showRec ? '</div>' : '';
  html+='<div style="height:24px;"></div>';

  var main=document.querySelector('main.wrap'); main.innerHTML=html;

  // charts — mounted after the HTML is in the page; a missing figure never stops the page
  try{
    if(invByM.some(function(v){return v>0;}) || payByM.some(function(v){return v>0;}))
      BB.chart.bar('#chTrend',{ labels:MONTHS6.map(function(m){return m.l;}), money:true, height:240, table:true,
        series:[{name:'Invoiced',values:invByM,color:'#3f6b28'},{name:'Received',values:payByM,color:'#8fbf5a'}],
        // a month → the invoices raised and the payments received in it
        detail:function(ctx){ var m=MONTHS6[ctx.index]; if(!m) return null;
          var iv=invs.filter(function(i){ return String(i.date||'').slice(0,7)===m.ym; }).sort(byDate);
          var py=paySrc.filter(function(x){ return String(x.date||'').slice(0,7)===m.ym; }).sort(byDate);
          var ivT=invTable(iv), pyT=payTable(py); ivT.title='Invoices'; pyT.title='Receipts';
          return { wide:true, stats:[{ l:'Invoiced', v:BB.money(invByM[ctx.index]||0), s:iv.length+' invoice'+(iv.length===1?'':'s') }, { l:'Received', v:BB.money(payByM[ctx.index]||0), s:py.length+' receipt'+(py.length===1?'':'s') }],
            tables:[ivT, pyT],
            note:(iv.length>POP_CAP||py.length>POP_CAP)?'Long lists show their first '+POP_CAP+' lines; the totals count them all.':null }; } });
    else document.getElementById('chTrend').innerHTML='<div class="chart-empty">Nothing invoiced or received in the last six months.</div>';
  }catch(e){ console.warn('chart', e); }
  try{
    if(ageB.some(function(b){return b.value>0;})) BB.chart.donut('#chAge',{ rows:ageB, money:true, centreLabel:'owed',
      // an age band → the open invoices in it
      detail:function(ctx){ var bi=ageB.indexOf(ctx.row); if(bi<0) return null;
        var list=openInvs.filter(function(i){ var dd=daysOver(i); return (dd<=0?0:dd<=30?1:dd<=60?2:dd<=90?3:4)===bi; }).sort(byOpen);
        return { wide:true, stats:[{ l:'Open', v:BB.money(ctx.value), s:list.length+' invoice'+(list.length===1?'':'s') }, { l:'Share', v:(ctx.total?Math.round(ctx.value/ctx.total*100):0)+'%', s:'of '+BB.money(ctx.total)+' owed' }], table:invTable(list), note:capNote(list.length),
          actions:[{ label:'Go to the invoices', primary:true, onClick:toInvoices }] }; } });
    else document.getElementById('chAge').innerHTML='<div class="chart-empty">Nothing open. Every invoice is paid.</div>';
  }catch(e){ console.warn('chart', e); }
  try{
    if(debtors.length) BB.chart.hbar('#chDebtors',{ money:true, rows:debtors.slice(0,8).map(function(r){
        var f=d.farmer(r.id);
        return { label:f.name||'—', sub:(f.farm&&f.farm!==f.name?f.farm:(r.n+' open')), href:(canFarm&&r.id?'farm-detail.html?farmer='+r.id:null),
          parts:[{name:'Overdue',value:r.od,color:'#b8382a'},{name:'Not yet overdue',value:r.nd,color:'#3f6b28'}] }; }),
        legend:[{name:'Overdue',color:'#b8382a'},{name:'Not yet overdue',color:'#3f6b28'}], valueLabel:'Open', openLabel:'Open full record',
        // a customer → their card
        detail:function(ctx){ var r=debtors[ctx.index]; if(!r) return null;
          if(r.id && d.by('farmers', r.id)){ var c=custCard(r.id); c.color=null; return c; }
          var list=openInvs.filter(function(i){ return !i.farmer; }).sort(byOpen);
          return { wide:true, table:invTable(list), note:capNote(list.length), actions:[{ label:'Go to the invoices', primary:true, onClick:toInvoices }] }; } });
    else document.getElementById('chDebtors').innerHTML='<div class="chart-empty">Nobody owes anything right now.</div>';
  }catch(e){ console.warn('chart', e); }
  wire();
}
function nextMonth25(){ var n=new Date(); var y=n.getFullYear(), m=n.getMonth()+1; if(m>11){m=0;y++;} return y+'-'+String(m+1).padStart(2,'0')+'-25'; }
// a reminder for one invoice lands in the outbox as a draft (the invoice row's button and the customer card both use it)
function draftReminder(id){
  var iv=d.by('invoices', id); if(!iv) return; var f=d.farmer(iv.farmer);
  d.add('outbox',{ kind:'Reminder', to:iv.farmer, invoice:iv.id, subject:(iv.status==='Overdue'?'Gentle reminder — ':'Heads-up — ')+iv.ref+' ('+BB.money(iv.amount)+') '+(iv.status==='Overdue'?'is overdue':'is due '+BB.date(iv.dueDate)), status:'Draft', created:new Date().toISOString().slice(0,10), channel:'Email + WhatsApp' });
  BB.toast('Reminder drafted for '+f.name+' — check & send below'); render();
}
function wire(){
  var sn=document.getElementById('syncNow'); if(sn) sn.onclick=function(){
    if(BB.auth.live){ sn.disabled=true; sn.innerHTML=BB.icon('refresh')+'Fetching…'; d.refreshSage().then(function(ok){ sn.disabled=false; sn.innerHTML=BB.icon('refresh')+'Sync now'; BB.toast(ok?'Latest Sage figures loaded':'No newer figures yet — Sage is read at 06:00, 12:00 and 17:00'); render(); }); return; }
    var sl=d.all('syncLog')[0]; var now=new Date(); var stamp=now.toISOString().slice(0,10)+' '+now.toTimeString().slice(0,5); if(sl){ d.update('syncLog', sl.id, { last:stamp, status:'Live' }); } BB.toast('Synced · customers, invoices, payments, stock'); render(); };
  document.querySelectorAll('button[data-invall]').forEach(function(b){ b.onclick=function(){
    var rid=this.dataset.invall; var n=0;
    d.all('orders').filter(function(o){return o.rep===rid && (o.status==='Delivered'||o.status==='Confirmed') && !d.orderInvoiced(o.id);}).forEach(function(o){
      d.add('invoices',{ ref:'INV-'+(1046+Math.floor(Math.random()*900)), farmer:o.farmer, order:o.id, date:new Date().toISOString().slice(0,10), dueDate:nextMonth25(), description:'Order '+o.ref, amount:d.quoteTotal(o), status:'Outstanding', paidDate:null }); n++;
    });
    BB.toast(n+' invoice'+(n===1?'':'s')+' generated — actuals updated'); render(); }; });
  document.querySelectorAll('button[data-remind]').forEach(function(b){ b.onclick=function(){ draftReminder(this.dataset.remind); }; });
  document.querySelectorAll('button[data-send]').forEach(function(b){ b.onclick=function(){ d.update('outbox', this.dataset.send, { status:'Sent', sentAt:new Date().toISOString().slice(0,10) }); BB.toast('Sent · logged against the farmer'); render(); }; });
}
document.body.insertAdjacentHTML('beforeend','<main class="wrap"></main>');
render();
window.addEventListener('bb:sage', function(){ render(); });
// ?cust=<farmer>: the menu search found one of their invoices — open their card
var openCust=new URLSearchParams(location.search).get('cust');
if(openCust && window.__finCustCard && d.by('farmers', openCust)) setTimeout(function(){ BB.popup(window.__finCustCard(openCust)); }, 200);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
