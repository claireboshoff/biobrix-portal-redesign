<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Ways to pay · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign7"></script><script src="guard.js?v=redesign7"></script>
<script src="bb-data.js?v=redesign7"></script>
<script src="bb-shell.js?v=redesign7"></script>
<style>
  .pay-grid{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;}
  .pay{display:flex;flex-direction:column;}
  .pay .card-p{display:flex;flex-direction:column;gap:14px;flex:1;}
  .pay .big{font-family:var(--display,inherit);font-size:1.9rem;font-weight:600;color:var(--ink);line-height:1.1;}
  .pay .big small{font-size:.85rem;font-weight:500;color:var(--faint);}
  .pay table{width:100%;font-size:.88rem;border-collapse:collapse;}
  .pay td{padding:7px 0;border-top:1px solid var(--line-soft);}
  .pay td.num{text-align:right;font-weight:600;}
  .pay .go{margin-top:auto;}
  .pay.pick{box-shadow:inset 0 0 0 2px #68a53e;}
  @media(max-width:900px){ .pay-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'home', back:'index.html' });
var R = function(n){ return 'R' + Math.round(n).toLocaleString('en-ZA').replace(/,/g,' '); };
var BUILD = 155000, CARE = 5000, START = BUILD*0.20;
var PLANS = [
  { key:'once', name:'Once-off', months:0, lead:'Half to start, half at go-live',
    rows:[['To start', BUILD/2], ['At go-live', BUILD/2]], total:BUILD },
  { key:'12', name:'Over 12 months', months:12, lead:'Start with 20%, the rest over 12 months', pick:true,
    rows:[['To start', START], ['Then monthly x 12', (BUILD-START)*1.125/12]], total:START+(BUILD-START)*1.125 },
  { key:'24', name:'Over 24 months', months:24, lead:'Start with 20%, the rest over 24 months',
    rows:[['To start', START], ['Then monthly x 24', (BUILD-START)*1.25/24]], total:START+(BUILD-START)*1.25 }
];
var html =
  '<div class="page-head"><div class="eyebrow">BioBrix OS</div><h1>Ways to pay</h1>'+
  '<p>Pay once-off, or spread it over 12 or 24 months. Either way your portal starts working now.</p></div>'+
  '<div class="pay-grid">'+PLANS.map(function(p){
    return '<div class="card pay'+(p.pick?' pick':'')+'"><div class="card-h"><div><h3>'+p.name+'</h3><div class="sub">'+p.lead+'</div></div>'+
      '</div><div class="card-p">'+
      '<div class="big">'+R(p.rows[0][1])+' <small>to start</small></div>'+
      '<table>'+p.rows.map(function(r){ return '<tr><td>'+r[0]+'</td><td class="num">'+R(r[1])+'</td></tr>'; }).join('')+
      '<tr><td>Build total</td><td class="num">'+R(p.total)+'</td></tr>'+
      '<tr><td>Care, from go-live</td><td class="num">'+R(CARE)+' / month</td></tr></table>'+
      '<a class="btn go'+(p.pick?' lime':' ghost')+'" href="mailto:info@freedomhub.io?subject='+encodeURIComponent('BioBrix OS: '+p.name)+'">I\'d like this one</a>'+
      '</div></div>';
  }).join('')+'</div>'+
  '<div class="card" style="margin-top:16px;"><div class="card-p" style="font-size:.9rem;line-height:1.6;">'+
  'The build is the full BioBrix OS: Sales, Operations, BioServices and Finance on your own Sage figures, the farmer\'s portal and orders by voice. '+
  'Paying once-off costs the least. Putting more down to start brings the monthly amount down.</div></div>'+
  '<div style="height:24px;"></div>';
document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>');
</script>
</body>
</html>
