<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Deliveries · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
  .side{display:grid;gap:16px;align-content:start;min-width:0;}
  select.adv{padding:6px 8px;font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;}
  select.adv:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(104,165,62,.15);}
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;

// Warehouse seat sees only deliveries for its own depot. Directors / ops see all.
var scopeDepot = (BB.user && BB.user.roleKey==='warehouse' && BB.user.depot) ? BB.user.depot : null;

var STATUS_CHIPS = [
  { id:'all', name:'All' },
  { id:'In transit', name:'In transit' },
  { id:'Delivered', name:'Delivered' },
  { id:'Awaiting stock', name:'Awaiting stock' }
];
var STATUS_OPTIONS = ['Awaiting stock','In transit','Delivered'];
var filter = 'all';

function orderRef(delivery){
  var o = d.by('orders', delivery.order);
  return o ? o.ref : '—';
}

var STATUS_COL = { 'In transit':'#2f6f9e', 'Delivered':'#3f6b28', 'Awaiting stock':'#c77d17' };

function render(){
  var all = d.all('deliveries');
  if(scopeDepot){ all = all.filter(function(x){ return x.depot===scopeDepot; }); }
  var inTransit = all.filter(function(x){ return x.status==='In transit'; }).length;
  var delivered = all.filter(function(x){ return x.status==='Delivered'; }).length;
  var awaiting = all.filter(function(x){ return x.status==='Awaiting stock'; }).length;
  // finance hold — flag deliveries whose order is on account-overdue / over-limit hold
  var holdOf = function(x){ return d.deliveryHold(d.by('orders', x.order)); };
  var onHold = all.filter(function(x){ return !!holdOf(x); }).length;

  var rows = filter==='all' ? all : all.filter(function(x){ return x.status===filter; });

  var html = '';
  html += '<section class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">Operations · Deliveries</div>'+
    '<h1>Logistics &amp; dispatch</h1>'+
    '<p>Every order on its way out of a depot. Advance a delivery as it moves — held on stock, on the road, or dropped at the farm.</p></div>'+
    ((BB.auth && BB.auth.canPage && BB.auth.canPage('labels.html')) ? '<div class="row"><a class="btn ghost" href="labels.html">'+BB.icon('tag')+'Delivery labels</a></div>' : '')+
  '</section>';

  html += '<div class="grid g4" style="margin-top:14px;">'+
    '<div class="stat"><div class="l">In transit</div><div class="v">'+inTransit+'</div><div class="s">on the road</div></div>'+
    '<div class="stat"><div class="l">Delivered</div><div class="v">'+delivered+'</div><div class="s">this season</div></div>'+
    '<div class="stat'+(awaiting>0?' warn':'')+'"><div class="l">Awaiting stock</div><div class="v">'+awaiting+'</div><div class="s">held on stock</div></div>'+
    '<div class="stat'+(onHold>0?' bad':'')+'"><div class="l">On finance hold</div><div class="v">'+onHold+'</div><div class="s">account overdue or over limit</div></div>'+
  '</div>';

  var chips = '<div class="row" style="gap:6px;">';
  STATUS_CHIPS.forEach(function(c){
    var n = c.id==='all' ? all.length : all.filter(function(x){ return x.status===c.id; }).length;
    chips += '<button class="chip'+(filter===c.id?' on':'')+'" data-status="'+BB.esc(c.id)+'">'+BB.esc(c.name)+' <span style="opacity:.7;">'+n+'</span></button>';
  });
  chips += '</div>';

  var tbl = '<div class="scroll"><table class="bb">'+
    '<thead><tr><th>Order</th><th>Farmer</th>'+(scopeDepot?'':'<th>Depot</th>')+'<th>Transport</th><th>ETA</th><th>Status</th><th class="num">Advance</th></tr></thead><tbody>';
  if(!rows.length){
    tbl += '<tr><td colspan="'+(scopeDepot?6:7)+'"><div class="empty">No deliveries in this view.</div></td></tr>';
  } else {
    rows.forEach(function(x){
      var opts = STATUS_OPTIONS.map(function(s){ return '<option value="'+BB.esc(s)+'"'+(s===x.status?' selected':'')+'>'+BB.esc(s)+'</option>'; }).join('');
      var hold = holdOf(x);
      var holdBadge = hold ? ' <span class="badge '+(hold.sev==='high'?'b-bad':'b-warn')+'" title="'+BB.esc(hold.reason)+'">HOLD</span>' : '';
      tbl += '<tr>'+
        '<td style="white-space:nowrap;"><b style="color:var(--green-dark);">'+BB.esc(orderRef(x))+'</b></td>'+
        '<td style="white-space:nowrap;">'+BB.esc(d.farmer(x.farmer).name)+'</td>'+
        (scopeDepot?'':'<td class="muted">'+BB.esc(d.depot(x.depot).name)+'</td>')+
        '<td class="muted">'+BB.esc(x.transport)+'</td>'+
        '<td class="muted" style="white-space:nowrap;">'+BB.date(x.eta)+'</td>'+
        '<td style="white-space:nowrap;">'+BB.statusBadge(x.status)+holdBadge+'</td>'+
        '<td class="num"><select class="adv" data-del="'+BB.esc(x.id)+'" aria-label="Advance delivery">'+opts+'</select></td>'+
      '</tr>';
    });
  }
  tbl += '</tbody></table></div>';

  var depots = scopeDepot ? [] : d.all('depots');
  var tableCard = '<div class="card"><div class="card-h"><div><h3>Deliveries</h3><div class="sub">'+rows.length+' in this view'+(scopeDepot?' · '+BB.esc(d.depot(scopeDepot).name):'')+'</div></div>'+chips+'</div>'+tbl+'</div>';
  var statusCard = '<div class="card"><div class="card-h"><div><h3>By status</h3><div class="sub">'+all.length+' deliver'+(all.length===1?'y':'ies')+(scopeDepot?' from your depot':' across the depots')+'</div></div></div><div class="card-p">'+
    (all.length?'<div id="chStatus"></div>':'<div class="empty">No deliveries yet.</div>')+'</div></div>';
  if(depots.length){
    // every depot: the picture first, then the full-width list to work from
    html += '<div class="grid g2" style="margin-top:16px;">'+statusCard+
      '<div class="card"><div class="card-h"><div><h3>By depot</h3><div class="sub">where they leave from, by status</div></div></div><div class="card-p"><div id="chDepot"></div></div></div></div>';
    html += '<div style="margin-top:16px;">'+tableCard+'</div>';
  } else {
    // one depot: a short list, with its status split beside it
    html += '<div class="split" style="margin-top:16px;">'+tableCard+statusCard+'</div>';
  }

  html += '<div style="height:24px;"></div>';

  var main = document.querySelector('main.wrap');
  main.innerHTML = html;
  wire();

  try{
    if(all.length) BB.chart.donut('#chStatus', { centreLabel:all.length===1?'delivery':'deliveries', rows:STATUS_OPTIONS.map(function(s){ return { label:s, value:all.filter(function(x){ return x.status===s; }).length, color:STATUS_COL[s] }; }) });
    if(depots.length) BB.chart.hbar('#chDepot', {
      legend:STATUS_OPTIONS.map(function(s){ return { name:s, color:STATUS_COL[s] }; }),
      rows:depots.map(function(dep){ var mine = all.filter(function(x){ return x.depot===dep.id; });
        return { label:dep.name, sub:dep.region, parts:STATUS_OPTIONS.map(function(s){ return { name:s, value:mine.filter(function(x){ return x.status===s; }).length, color:STATUS_COL[s] }; }) }; }) });
  }catch(e){ console.warn('chart', e); }
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-status]'), function(btn){
    btn.onclick = function(){ filter = btn.getAttribute('data-status'); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('select[data-del]'), function(sel){
    sel.onchange = function(){
      var id = sel.getAttribute('data-del');
      var status = sel.value;
      d.update('deliveries', id, { status:status });
      BB.toast('Delivery updated · '+status);
      render();
    };
  });
}

document.body.insertAdjacentHTML('beforeend', '<main class="wrap"></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
