<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Farm files · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=live35"></script><script src="guard.js?v=live35"></script>
<script src="bb-data.js?v=live35"></script>
<script src="bb-shell.js?v=live35"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var farmers = d.all('farmers');

var css=''+
'.kind{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.66rem;font-weight:700;}'+
'.k-Soil{background:var(--amber-bg);color:var(--amber);}'+
'.k-Leaf{background:var(--ok-bg);color:var(--ok);}'+
'.k-Programme{background:#eef6dc;color:var(--green-mid);}'+
'.k-Monitoring{background:var(--blue-bg);color:var(--blue);}'+
'.k-Delivery{background:#eef1ea;color:var(--muted);}'+
'.fico{width:34px;height:34px;border-radius:9px;background:var(--green-darkest);color:var(--lime);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex:none;}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

var KINDS = ['All','Soil','Leaf','Programme','Monitoring','Delivery'];
var state = { q:'', kind:'All', farmer:'' };

function files(){
  return d.all('files').filter(function(f){
    if(state.kind!=='All' && f.kind!==state.kind) return false;
    if(state.farmer && f.farmer!==state.farmer) return false;
    if(state.q && f.name.toLowerCase().indexOf(state.q.toLowerCase())<0) return false;
    return true;
  }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}

function statRow(){
  var all=d.all('files');
  var withFiles=all.map(function(f){ return f.farmer; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).length;
  var now=new Date(); var monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  var thisMonth=all.filter(function(f){ return (f.date||'') >= monthStart; }).length;
  return '<div class="grid g3">'+
    '<div class="stat"><div class="l">Total files</div><div class="v">'+all.length+'</div><div class="s">one indexed place</div></div>'+
    '<div class="stat"><div class="l">Farms with files</div><div class="v">'+withFiles+'</div><div class="s">tagged to a farm</div></div>'+
    '<div class="stat"><div class="l">Filed this month</div><div class="v">'+thisMonth+'</div><div class="s">newest first</div></div>'+
  '</div>';
}

function controls(){
  var html='';
  html += '<div class="fld" style="margin-top:20px;"><input id="search" placeholder="Search file name…" value="'+BB.esc(state.q)+'"></div>';
  html += '<div class="row" style="margin-bottom:10px;">';
  KINDS.forEach(function(k){ html += '<button class="chip kind-chip'+(state.kind===k?' on':'')+'" data-kind="'+k+'">'+k+'</button>'; });
  html += '</div>';
  html += '<div class="fld" style="max-width:340px;"><label>Farm</label><select id="farmerFilter"><option value="">All farms</option>'+
    farmers.map(function(f){ return '<option value="'+f.id+'"'+(f.id===state.farmer?' selected':'')+'>'+BB.esc(f.farm)+' — '+BB.esc(f.name)+'</option>'; }).join('')+
    '</select></div>';
  return html;
}

function table(){
  var list=files();
  var html='<div class="card">';
  if(!list.length){
    html += '<div class="empty"><div class="big">🗂</div>No files match. Try a different filter, or file a new one below.</div>';
  } else {
    html += '<div class="scroll"><table class="bb"><thead><tr><th>File</th><th>Kind</th><th>Farm</th><th>Date</th><th>Size</th><th class="right"></th></tr></thead><tbody>';
    list.forEach(function(f){
      var fm=d.farmer(f.farmer);
      html += '<tr>'+
        '<td><div class="row" style="gap:9px;flex-wrap:nowrap;"><span class="fico">📄</span><b style="color:var(--green-dark);">'+BB.esc(f.name)+'</b></div></td>'+
        '<td><span class="kind k-'+BB.esc(f.kind)+'">'+BB.esc(f.kind)+'</span></td>'+
        '<td><b>'+BB.esc(fm.farm)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(fm.name)+'</div></td>'+
        '<td class="muted" style="white-space:nowrap;">'+BB.shortDate(f.date)+'</td>'+
        '<td class="muted">'+BB.esc(f.size)+'</td>'+
        '<td class="right"><div class="row" style="gap:6px;flex-wrap:nowrap;justify-content:flex-end;"><button class="btn ghost sm openF" data-name="'+BB.esc(f.name)+'" data-farmer="'+BB.esc(f.farmer)+'" data-fk="'+BB.esc(f.kind)+'">Open</button><button class="btn ghost sm dlF" data-name="'+BB.esc(f.name)+'" data-farmer="'+BB.esc(f.farmer)+'" data-fk="'+BB.esc(f.kind)+'" title="Open / print">⬇</button></div></td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}

function uploadForm(){
  var html='<div class="sec"><h2>Upload / capture a file</h2><span class="ln"></span></div>';
  html += '<div class="card card-p">';
  html += '<p class="muted" style="font-size:.85rem;margin-bottom:14px;">Anything you capture files itself to the right farm automatically — no more hunting across a dozen drives. One place, everything tagged to the farm it belongs to.</p>';
  html += '<div class="grid g3">';
  html += '<div class="fld"><label>Farm</label><select id="uFarmer">'+
    farmers.map(function(f){ return '<option value="'+f.id+'">'+BB.esc(f.farm)+' — '+BB.esc(f.name)+'</option>'; }).join('')+'</select></div>';
  html += '<div class="fld"><label>Kind</label><select id="uKind">'+
    KINDS.filter(function(k){ return k!=='All'; }).map(function(k){ return '<option>'+k+'</option>'; }).join('')+'</select></div>';
  html += '<div class="fld"><label>File name</label><input id="uName" placeholder="e.g. Rietvlei — Soil Report Block B.pdf"></div>';
  html += '</div>';
  html += '<div class="row"><input id="uFile" type="file" style="padding:8px;"><button class="btn" id="fileIt">File it</button></div>';
  html += '</div>';
  return html;
}

function render(){
  var html='';
  html += '<div class="page-head"><h1>Farm files</h1>'+
    '<p>One home for every document — soil reports, programmes, monitoring, delivery notes — all tagged to the farm. No more time lost searching across scattered drives.</p></div>';
  html += statRow();
  html += controls();
  html += '<div class="sec"><h2>All files</h2><span class="ln"></span><span class="cnt">'+files().length+' shown</span></div>';
  html += table();
  html += uploadForm();
  html += '<div style="height:24px;"></div>';
  document.querySelector('main.wrap').innerHTML=html;
  wire();
}

function wire(){
  var s=document.getElementById('search');
  if(s) s.oninput=function(){ state.q=s.value; refreshList(); };
  Array.prototype.forEach.call(document.querySelectorAll('.kind-chip'), function(c){
    c.onclick=function(){ state.kind=c.getAttribute('data-kind'); render(); };
  });
  var ff=document.getElementById('farmerFilter');
  if(ff) ff.onchange=function(){ state.farmer=ff.value; refreshList(); };
  wireRowButtons();

  var fb=document.getElementById('fileIt');
  if(fb) fb.onclick=function(){
    var farmerId=document.getElementById('uFarmer').value;
    var name=document.getElementById('uName').value.trim();
    var uf=document.getElementById('uFile');
    if(!name && uf && uf.files && uf.files.length){ name=uf.files[0].name; }
    if(!name){ BB.toast('Give the file a name, or choose a file'); return; }
    var f=d.farmer(farmerId);
    d.add('files', {
      farmer: farmerId,
      name: name,
      kind: document.getElementById('uKind').value,
      date: new Date().toISOString().slice(0,10),
      size: (uf && uf.files && uf.files[0]) ? humanSize(uf.files[0].size) : '—'
    });
    BB.toast('Filed under '+f.farm);
    render();
  };
}

// re-render just the list + count without losing the search box focus
function refreshList(){
  var wrap=document.getElementById('listWrap');
  // simplest: full re-render but keep focus on search
  var focus=document.activeElement && document.activeElement.id==='search';
  var val=state.q;
  render();
  if(focus){ var s=document.getElementById('search'); if(s){ s.focus(); s.value=val; s.setSelectionRange(val.length,val.length); } }
}

function openDoc(b){
  window.open('document.html?farmer='+encodeURIComponent(b.getAttribute('data-farmer')||'')+'&kind='+encodeURIComponent(b.getAttribute('data-fk')||'Document')+'&name='+encodeURIComponent(b.getAttribute('data-name')||''), '_blank');
}
function wireRowButtons(){
  Array.prototype.forEach.call(document.querySelectorAll('.openF'), function(b){ b.onclick=function(){ openDoc(b); }; });
  Array.prototype.forEach.call(document.querySelectorAll('.dlF'), function(b){ b.onclick=function(){ openDoc(b); }; });
}

function humanSize(bytes){
  if(!bytes) return '—';
  if(bytes<1024) return bytes+' B';
  if(bytes<1048576) return Math.round(bytes/1024)+' KB';
  return (bytes/1048576).toFixed(1)+' MB';
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
