<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioBrix Intelligence · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<script src="bb-intel.js?v=redesign1"></script>
<style>
  .ask{background:linear-gradient(118deg,var(--green-darkest),var(--green-dark) 70%,#2c5520);color:#eaf4d8;border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;}
  .ask .eyebrow{color:var(--lime);display:flex;align-items:center;gap:6px;}
  .ask .eyebrow .ico{width:14px;height:14px;}
  .ask h2{font-family:var(--display);font-weight:600;font-size:1.25rem;color:#fff;margin-top:2px;letter-spacing:-.2px;}
  .ask-box{display:flex;gap:8px;margin-top:14px;position:relative;}
  .ask-box .ico.s{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(234,244,216,.55);}
  .ask-box input{flex:1;min-width:0;padding:13px 14px 13px 42px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:.95rem;outline:none;transition:border-color .15s,background .15s;}
  .ask-box input::placeholder{color:rgba(234,244,216,.55);}
  .ask-box input:focus{border-color:var(--lime);background:rgba(255,255,255,.12);}
  .ask-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .ask-chips .chip{background:rgba(255,255,255,.08);color:#eaf4d8;border-color:rgba(255,255,255,.18);}
  .ask-chips .chip:hover{border-color:var(--lime);}
  .ans{background:#fff;color:var(--ink);border-radius:10px;padding:16px 18px;margin-top:16px;flex:1;}
  .ans h4{font-family:var(--display);font-weight:600;color:var(--green-darkest);font-size:1rem;}
  .ans .ln1{font-size:.9rem;line-height:1.55;margin-top:6px;white-space:pre-line;color:var(--muted);}
  .ans .ln1:first-of-type{color:var(--ink);font-weight:600;}
  .alert-list{max-height:440px;overflow:auto;}
  .alert{display:flex;align-items:flex-start;gap:10px;padding:11px 20px;border-top:1px solid var(--line-soft);color:inherit;transition:background .12s;}
  .alert:first-child{border-top:0;}
  .alert:hover{background:#fafcf7;}
  .alert .sv{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;}
  .alert .tx{flex:1;min-width:0;font-size:.86rem;line-height:1.45;}
  .alert .badge{flex:none;}
  .health-list{max-height:520px;overflow:auto;}
  .cover .bar-cell{min-width:150px;}
  .cover .bar-cell span{font-size:.8rem;white-space:nowrap;min-width:64px;text-align:right;}
  @media(max-width:560px){ .ask{padding:18px 16px;} .alert{padding:11px 14px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'index.html' });
var d = BB.data;

/* The engine (farmHealth, reorderForecast, alerts, answer) lives in bb-intel.js, shared with Home's Ask bar. */
var farmHealth=BB.intel.farmHealth, reorderForecast=BB.intel.reorderForecast, alerts=BB.intel.alerts, answer=BB.intel.answer;

/* ---------- render ---------- */
// Compute once: the KPI strip, the alerts list and the health ranking all read the same figures.
var al=alerts();
var rf=reorderForecast();
// Every customer from the accounting system is a farmer record now, and most have no agronomy
// captured yet — scoring 300+ of those says nothing. Rank the ones we actually know something
// about, worst first, because that is the list a director acts on.
var scored=d.all('farmers').map(function(f){ return {f:f, h:farmHealth(f.id), known:(d.where('soil',function(s){return s.farmer===f.id;}).length + d.where('leaf',function(l){return l.farmer===f.id;}).length + d.where('watch',function(w){return w.farmer===f.id;}).length)}; });
var ranked=scored.filter(function(x){ return x.known>0; }).sort(function(a,b){ return a.h.score-b.h.score; });
var notCaptured=scored.length-ranked.length;
var nHigh=al.filter(function(a){return a.sev==='high';}).length, nMed=al.filter(function(a){return a.sev==='med';}).length;
var avg=ranked.length? Math.round(ranked.reduce(function(t,x){return t+x.h.score;},0)/ranked.length) : null;
var urgent=rf.filter(function(r){return r.urgent;}).length;
var scoreCol=function(v){ return v>=75?'#2b7d39':v>=55?'#c77d17':'#b8382a'; };

var html='';
html+='<div class="page-head"><div class="eyebrow">The layer that thinks</div>'+
  '<h1>BioBrix Intelligence</h1><p>Your whole operation, read for you: ask a question, see what needs you today, and know what to order before you run out.</p></div>';

html+='<div class="grid g4" style="margin-top:14px;">'+
  '<div class="stat'+(nHigh?' bad':'')+'"><div class="l">Needs you now</div><div class="v">'+nHigh+'</div><div class="s">high-priority alerts</div></div>'+
  '<div class="stat'+(nMed?' warn':'')+'"><div class="l">Worth watching</div><div class="v">'+nMed+'</div><div class="s">medium-priority alerts</div></div>'+
  '<div class="stat"><div class="l">Average farm health</div><div class="v">'+(avg==null?'—':avg+'<span style="font-size:.9rem;color:var(--faint);font-weight:500;">/100</span>')+'</div><div class="s">'+ranked.length+' farm'+(ranked.length===1?'':'s')+' scored</div></div>'+
  '<div class="stat'+(urgent?' warn':'')+'"><div class="l">Order now</div><div class="v">'+urgent+'</div><div class="s">of '+rf.length+' stock line'+(rf.length===1?'':'s')+' running low</div></div>'+
'</div>';

// ASK beside WHAT NEEDS YOU. The wrapper keeps id="alerts": the shell hangs its sample note after it.
html+='<div class="split" id="alerts" style="margin-top:16px;">'+
  '<div class="ask">'+
    '<div class="eyebrow">'+BB.icon('sparkles')+'Ask BioBrix</div>'+
    '<h2>What do you want to know?</h2>'+
    '<div class="ask-box">'+BB.icon('search','s')+
      '<input id="q" placeholder="Ask anything — e.g. what should we order this week?" aria-label="Ask BioBrix">'+
      '<button class="btn lime" id="ask">Ask</button>'+
    '</div>'+
    '<div class="ask-chips" id="chips"></div>'+
    '<div id="ans"></div>'+
  '</div>'+
  '<div class="card"><div class="card-h"><div><h3>What needs you today</h3><div class="sub">most urgent first</div></div><span class="badge '+(nHigh?'b-bad':al.length?'b-warn':'b-ok')+'">'+al.length+'</span></div>'+
    '<div id="alertList"></div></div>'+
'</div>';

html+='<div class="split-r" style="margin-top:16px;">'+
  '<div class="card"><div class="card-h"><div><h3>Farm health</h3><div class="sub">lowest first · from soil, leaf and monitoring</div></div></div><div class="card-p health-list"><div id="health"></div></div>'+
    (notCaptured?'<div class="card-f">'+notCaptured+' customer'+(notCaptured===1?'':'s')+' from your accounting system have no agronomy captured yet, so they are not scored.</div>':'')+'</div>'+
  '<div class="card"><div class="card-h"><div><h3>Reorder forecast</h3><div class="sub">days of cover vs supplier lead time</div></div>'+(urgent?'<span class="badge b-bad">'+urgent+' to order now</span>':'')+'</div><div id="reorder"></div></div>'+
'</div>';
html+='<div style="height:24px;"></div>';

document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');

// suggested chips
var chips=['Forecast for October','What stock will run out','Which farms need attention','Where should we grow','Citrus farms'];
document.getElementById('chips').innerHTML=chips.map(function(c){return '<button type="button" class="chip" data-q="'+BB.esc(c)+'">'+BB.esc(c)+'</button>';}).join('');

function renderAns(a){
  if(!a){ document.getElementById('ans').innerHTML=''; return; }
  var body=a.lines.map(function(l){return '<div class="ln1">'+BB.esc(l)+'</div>';}).join('');
  document.getElementById('ans').innerHTML='<div class="ans"><h4>'+BB.esc(a.title)+'</h4>'+body+
    '<a class="btn ghost sm" href="'+a.to+'" style="margin-top:12px;">Open the detail '+BB.icon('chevron')+'</a></div>';
}
function doAsk(){ renderAns(answer(document.getElementById('q').value)); }
document.getElementById('ask').onclick=doAsk;
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')doAsk();});
Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'),function(c){c.onclick=function(){document.getElementById('q').value=c.getAttribute('data-q');doAsk();};});

// farm health — a ranked bar per farm, worst first
try{
  if(ranked.length) BB.chart.hbar('#health',{ max:100, fmt:function(v){ return v+'/100'; },
    rows:ranked.map(function(x){ return { label:x.f.farm, sub:(x.h.drivers.length? x.h.drivers.join(' · ') : 'healthy — on programme'), value:x.h.score, color:scoreCol(x.h.score), href:'farm-detail.html?farmer='+x.f.id }; }) });
  else document.getElementById('health').innerHTML='<div class="empty">No soil, leaf or monitoring captured yet, so no farm is scored.</div>';
}catch(e){ console.warn('chart', e); }

// alerts
// 67 alerts is not attention, it is noise. Show what needs a person now; the rest stay a click away.
var alShown = al.slice(0,12), alRest = al.length - alShown.length;
var SEV = { high:{b:'b-bad',c:'var(--red)',t:'High'}, med:{b:'b-warn',c:'var(--amber)',t:'Medium'}, low:{b:'b-grey',c:'var(--faint)',t:'Low'} };
document.getElementById('alertList').innerHTML=al.length?
  '<div class="alert-list">'+alShown.map(function(a){ var s=SEV[a.sev]||SEV.low;
    return '<a href="'+a.to+'" class="alert"><span class="sv" style="background:'+s.c+';"></span><span class="tx">'+BB.esc(a.txt)+'</span><span class="badge '+s.b+'">'+s.t+'</span></a>';
  }).join('')+'</div>'+(alRest>0?'<div class="card-f">and '+alRest+' more of lower priority — the stock and sample alerts are demonstration data.</div>':'')
  : '<div class="empty">Nothing needs you right now.</div>';

// reorder
var maxCover=Math.max.apply(null, rf.map(function(r){ return r.daysCover; }).concat([1]));
document.getElementById('reorder').innerHTML='<div class="scroll"><table class="bb cover"><thead><tr><th>Product</th><th>Depot</th><th>Cover</th><th class="num">Lead</th><th>Supplier</th><th class="right">Action</th></tr></thead><tbody>'+
  (rf.length?rf.map(function(r){
    return '<tr><td style="white-space:nowrap;"><b style="color:var(--green-darkest);">'+BB.esc(r.p.name)+'</b></td>'+
    '<td class="muted">'+BB.esc(r.depot.name)+'</td>'+
    '<td><div class="bar-cell"><div class="trk"><i style="width:'+Math.max(3,Math.round(r.daysCover/maxCover*100))+'%;background:'+(r.urgent?'#b8382a':'#c77d17')+';"></i></div><span>~'+r.daysCover+' days</span></div></td>'+
    '<td class="num muted">'+r.lead+' days</td>'+
    '<td class="muted">'+BB.esc(r.sup.name)+'</td><td class="right">'+(r.urgent?'<span class="badge b-bad">Order now</span>':'<span class="badge b-warn">Watch</span>')+'</td></tr>';
  }).join(''):'<tr><td colspan="6"><div class="empty">All stock lines have healthy cover.</div></td></tr>')+'</tbody></table></div>';

// default answer on load: the at-a-glance summary (any question it cannot place falls back to it)
renderAns(answer('') || answer('at a glance'));
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
