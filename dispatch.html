<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product movement · BioBrix OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign5"></script><script src="guard.js?v=redesign5"></script>
<script src="bb-data.js?v=redesign5"></script>
<script src="bb-shell.js?v=redesign5"></script>
<style>
  .mini{font-size:.72rem;color:var(--faint);}
  td.up b{color:var(--ok);} td.down b{color:var(--red);}
  .dp-row{margin-top:16px;}
  .dp-empty{margin-top:16px;}
  .dp-empty .ic{width:44px;height:44px;border-radius:12px;background:#eef4e4;color:var(--green-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
</style>
</head>
<body>
<script>
BB.renderHeader({ back:'index.html', active:'dispatch' });
var d = BB.data, u = BB.user;
document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="main"></div></main>');

// Month keys, newest first, so "this month" follows the calendar rather than a hard-coded date.
function ymOf(dt){ return dt.toISOString().slice(0,7); }
function shift(n){ var t=new Date(); t.setDate(1); t.setMonth(t.getMonth()+n); return ymOf(t); }
var THIS = shift(0), PREV = shift(-1), LASTYR = shift(-12);
function monthName(ym){
  var p=ym.split('-'); return new Date(+p[0], +p[1]-1, 1).toLocaleDateString('en-ZA',{month:'short', year:'2-digit'});
}
var prods = [], showValue = false, M12 = [], MY = [], hasYear = false;
function qty(v){ return (Math.round(v*10)/10).toLocaleString('en-ZA'); }

function render(){
  var sg = d.sage && d.sage();
  var host = document.getElementById('main');
  showValue = BB.auth.can('finance') || u.roleKey==='director' || u.roleKey==='operations';

  var html = '<div class="page-head"><div class="eyebrow">Operations · Stock out of the door</div><h1>Product movement</h1>'+
    '<p>Every product you have invoiced, in the quantity that left the shelf — this month against last month, and against the same month a year ago. Straight off your own invoices, so what you see here is what actually went out.</p></div>';

  if(!sg || !sg.live || !(sg.products||[]).length){
    html += '<div class="card dp-empty"><div class="empty"><div class="ic">'+BB.icon('moving')+'</div>'+
      'Nothing to show yet — this page fills up from your invoices as soon as the accounting system has been read. It is read three times a day.</div></div>';
    host.innerHTML = html; return;
  }

  html += BB.staleNote();

  prods = (sg.products||[]).map(function(p){
    var m = p.months||{};
    return { code:p.code, name:p.name, pack:p.pack||'', total:p.qty||0, totalV:p.value||0,
             now:(m[THIS]&&m[THIS].qty)||0, prev:(m[PREV]&&m[PREV].qty)||0, yr:(m[LASTYR]&&m[LASTYR].qty)||0,
             nowV:(m[THIS]&&m[THIS].value)||0, months:m };
  });

  var sum = function(k){ return prods.reduce(function(t,p){ return t+p[k]; },0); };
  var nowQ = sum('now'), prevQ = sum('prev'), yrQ = sum('yr');
  var moving = prods.filter(function(p){ return p.now>0; }).length;

  // twelve months of units out, and the twelve before that — counted off the same invoices
  M12 = []; MY = [];
  for(var k=11;k>=0;k--){ M12.push(shift(-k)); MY.push(shift(-k-12)); }
  // Months before the ledger's first entry are unknown, not zero: they draw as a gap, not a cliff.
  var first = prods.reduce(function(mn,p){ Object.keys(p.months).forEach(function(k){ if(!mn || k<mn) mn=k; }); return mn; }, null);
  var unitsIn = function(ym){ if(!first || ym<first) return null; return prods.reduce(function(t,p){ var m=p.months[ym]; return t+((m&&m.qty)||0); },0); };
  var series12 = M12.map(unitsIn), seriesY = MY.map(unitsIn);
  hasYear = seriesY.some(function(v){ return v>0; });
  var spark12 = series12.map(function(v){ return v||0; });

  html += '<div class="sec"><h2>This month</h2><span class="ln"></span><span class="cnt">'+monthName(THIS)+' so far</span>'+BB.liveChip()+'</div>';
  html += '<div class="grid g4">'+
    '<a class="stat tap" href="#tbl" data-detail="dp-'+THIS+'"><div class="l">Units out</div><div class="v">'+qty(nowQ)+'</div><div class="s">across '+moving+' products ›</div><div class="spark">'+BB.chart.spark(spark12)+'</div></a>'+
    '<a class="stat tap" href="#tbl" data-detail="dp-'+PREV+'"><div class="l">'+monthName(PREV)+'</div><div class="v">'+qty(prevQ)+'</div><div class="s">'+(prevQ? (nowQ>=prevQ?'ahead of last month':'behind last month') : 'nothing last month')+' ›</div></a>'+
    '<a class="stat tap" href="#tbl" data-detail="dp-'+LASTYR+'"><div class="l">'+monthName(LASTYR)+'</div><div class="v">'+qty(yrQ)+'</div><div class="s">same month a year ago ›</div></a>'+
    (showValue
      ? '<div class="stat"><div class="l">Invoiced this month</div><div class="v">'+BB.money(Math.round(sum('nowV')))+'</div><div class="s">excluding VAT</div></div>'
      : '<div class="stat"><div class="l">Products on the books</div><div class="v">'+prods.length+'</div><div class="s">sold at least once</div></div>')+
  '</div>';

  // ---- the picture ----
  var busiest = prods.filter(function(p){ return p.now>0; }).sort(function(a,b){ return b.now-a.now; }).slice(0,8);
  html += '<div class="split dp-row">'+
    '<div class="card"><div class="card-h"><div><h3>Units out, month by month</h3><div class="sub">last twelve months'+(hasYear?' against the twelve before':'')+' · '+monthName(THIS)+' is part-finished</div></div>'+BB.liveChip()+'</div><div class="card-p"><div id="chMonths"></div></div></div>'+
    '<div class="card"><div class="card-h"><div><h3>Busiest this month</h3><div class="sub">units invoiced in '+monthName(THIS)+'</div></div></div><div class="card-p">'+
      (busiest.length?'<div id="chBusy"></div>':'<div class="empty">Nothing invoiced yet this month.</div>')+'</div></div>'+
  '</div>';

  // ---- the list ----
  html += '<div class="card dp-row"><div class="card-h"><div><h3>Product by product</h3><div class="sub">busiest first · quantities as invoiced</div></div>'+
    '<span class="badge b-grey" id="cnt"></span></div>'+
    '<div id="tbl"></div></div>';
  html += '<div class="pline faint" style="font-size:.78rem;margin-top:10px;">Quantities are as they were invoiced — litres, kilograms or units, whichever the line was sold in. Credit notes are already taken off.</div>';

  host.innerHTML = html;
  renderTable();
  [THIS, PREV, LASTYR].forEach(function(ym){ BB.statDetail('dp-'+ym, function(){ return monthDetail(ym); }); });

  var lbl = M12.map(function(ym){ return monthName(ym); });
  try{
    BB.chart.line('#chMonths', { labels:lbl, height:240, table:true, fmt:qty,
      series:[{name:'Last 12 months', values:series12, color:'#3f6b28', area:true}].concat(hasYear?[{name:'Year before', values:seriesY, color:'#c77d17', dash:true}]:[]),
      // the product lines invoiced that month
      detail:function(ctx){ var o=monthDetail(M12[ctx.index]); delete o.stats; delete o.title; delete o.eyebrow; return o; } });
    if(busiest.length) BB.chart.hbar('#chBusy', { fmt:qty, valueLabel:'Units out', rows:busiest.map(function(p){ return { label:p.name, sub:p.code||'', value:p.now, color:'#3f6b28', prod:p }; }),
      detail:function(ctx){ var o=productDetail(ctx.row.prod); o.color=null; return o; } });
  }catch(e){ console.warn('chart', e); }
}

// ---- popups ----
// One month: every product invoiced in it, busiest first (with the same month a year earlier).
function monthDetail(ym){
  var p=ym.split('-'), ago=(+p[0]-1)+'-'+p[1];
  var agoKnown=prods.some(function(x){ return !!x.months[ago]; });   // before the ledger starts is unknown, not zero
  var list=prods.map(function(x){ var m=x.months[ym]||{}, a=x.months[ago]||{}; return { p:x, q:m.qty||0, v:m.value||0, a:a.qty||0 }; })
    .filter(function(x){ return x.q>0; }).sort(function(a,b){ return b.q-a.q; });
  var tq=list.reduce(function(t,x){ return t+x.q; },0), tv=list.reduce(function(t,x){ return t+x.v; },0);
  return { eyebrow:'Product movement', title:monthName(ym), wide:true,
    stats:[{l:'Units out', v:qty(tq), s:ym===THIS?'so far':null}, {l:'Products', v:list.length}].concat(showValue?[{l:'Invoiced', v:BB.money(Math.round(tv)), s:'excluding VAT'}]:[]),
    table:{ columns:['Product','Code',monthName(ym),monthName(ago)].concat(showValue?['Invoiced']:[]), num:showValue?[2,3,4]:[2,3],
      rows:list.map(function(x){ return { cells:[x.p.name, x.p.code||'', qty(x.q), agoKnown?qty(x.a):'—'].concat(showValue?[BB.money(Math.round(x.v))]:[]), onClick:function(){ BB.popup(productDetail(x.p)); } }; }) },
    actions:[] };
}
// One product's movement — a card: its last twelve months beside the figures.
function productDetail(pr){
  var rows=M12.slice().reverse().map(function(ym){ var m=pr.months[ym]||{}; return { cells:[monthName(ym), qty(m.qty||0)].concat(showValue?[BB.money(Math.round(m.value||0))]:[]) }; });
  var trend=pr.prev? (pr.now>pr.prev?'up on ':pr.now<pr.prev?'down on ':'level with ')+monthName(PREV) : null;
  return { wide:true, layout:'split', eyebrow:'Product movement', title:pr.name,
    meta:[pr.code? { icon:'package', text:pr.code+(pr.pack?' · '+pr.pack:''), tip:'Code · pack' } : (pr.pack? { icon:'package', text:pr.pack, tip:'Pack' } : null),
      showValue && pr.nowV? { icon:'receipt', text:BB.money(Math.round(pr.nowV))+' invoiced in '+monthName(THIS), tip:'Invoiced this month' } : null],
    stats:[{l:monthName(THIS), v:qty(pr.now), s:trend}, {l:monthName(PREV), v:qty(pr.prev)}, {l:monthName(LASTYR), v:qty(pr.yr), s:'a year ago'}, {l:'All time', v:qty(pr.total)}],
    table:{ title:'Last twelve months', columns:['Month','Quantity'].concat(showValue?['Invoiced']:[]), num:showValue?[1,2]:[1], rows:rows },
    actions:[] };
}

// Only the table redraws as you type; the charts above stay put.
function renderTable(){
  var el = document.getElementById('tbl'); if(!el) return;
  var rows = prods.slice();
  rows.sort(function(a,b){ return (b.now-a.now) || (b.total-a.total); });
  var cols = showValue?7:6;
  var html = '<div class="scroll tall"><table class="bb"><thead><tr>'+
    '<th>Product</th><th>Code</th><th class="num">'+monthName(THIS)+'</th><th class="num">'+monthName(PREV)+'</th>'+
    '<th class="num">'+monthName(LASTYR)+'</th><th class="num">All time</th>'+(showValue?'<th class="num">Invoiced</th>':'')+'</tr></thead><tbody>';
  if(!rows.length){
    html += '<tr><td colspan="'+cols+'"><div class="empty">No products yet.</div></td></tr>';
  }
  var shown = rows, t = {now:0,prev:0,yr:0,total:0,nowV:0};
  shown.forEach(function(p, k){
    ['now','prev','yr','total','nowV'].forEach(function(k){ t[k]+=p[k]; });
    var move = p.prev? (p.now>p.prev?'up':(p.now<p.prev?'down':'')) : '';
    html += '<tr class="click" data-prod="'+prods.indexOf(p)+'"><td><b>'+BB.esc(p.name)+'</b>'+(p.pack?'<div class="mini">'+BB.esc(p.pack)+'</div>':'')+'</td>'+
      '<td class="mini">'+BB.esc(p.code||'')+'</td>'+
      '<td class="num'+(move?' '+move:'')+'"><b>'+qty(p.now)+'</b></td>'+
      '<td class="num">'+qty(p.prev)+'</td><td class="num">'+qty(p.yr)+'</td><td class="num">'+qty(p.total)+'</td>'+
      (showValue?'<td class="num">'+BB.money(Math.round(p.nowV))+'</td>':'')+'</tr>';
  });
  html += '</tbody>';
  if(shown.length) html += '<tfoot><tr><td colspan="2">Total</td><td class="num">'+qty(t.now)+'</td><td class="num">'+qty(t.prev)+'</td><td class="num">'+qty(t.yr)+'</td><td class="num">'+qty(t.total)+'</td>'+
    (showValue?'<td class="num">'+BB.money(Math.round(t.nowV))+'</td>':'')+'</tr></tfoot>';
  html += '</table></div>';
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll('tr.click[data-prod]'), function(tr){
    tr.onclick = function(){ var pr=prods[+tr.getAttribute('data-prod')]; if(pr) BB.popup(productDetail(pr)); };
  });
  var c = document.getElementById('cnt'); if(c) c.textContent = rows.length+' product'+(rows.length===1?'':'s');
}

render();
window.addEventListener('bb:sage', function(){ render(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
