<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Sales forecast · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign7"></script><script src="guard.js?v=redesign7"></script>
<script src="bb-data.js?v=redesign7"></script>
<script src="bb-shell.js?v=redesign7"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'sales', back:'index.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';

var css=''+
'.pv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}'+
'.pv-tools .lbl{font-size:.64rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-left:6px;}'+
'.pv-tools .chip.tog{cursor:pointer;user-select:none;}'+
'.rep{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;} .rep i{width:8px;height:8px;border-radius:50%;flex:none;}'+
'#pivotBody table.bb td:first-child,#pivotBody table.bb th:first-child{position:sticky;left:0;background:#fff;z-index:2;min-width:160px;}'+
'#pivotBody table.bb th:first-child{background:var(--panel-2);z-index:3;} #pivotBody table.bb tfoot td:first-child{background:var(--panel-2);}';
css+='.fc-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfcf8;font-size:.86rem;color:var(--muted);}'+
  '.fc-sum b{color:var(--ink);font-weight:700;}.fc-sum i{font-style:normal;color:var(--faint);font-weight:700;padding:0 2px;}'+
  '.term{border-bottom:1px dotted var(--faint);cursor:help;}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

// scope orders to role
var orders = d.all('orders');
if(isAdvisor){ orders = orders.filter(function(o){ return o.rep===u.rep; }); }

function isPipeline(o){ return o.status==='Forecast'||o.status==='Pending'; }
function isConfirmed(o){ return o.status==='Confirmed'||o.status==='Delivered'; }
function isAwaiting(o){ return !isPipeline(o) && !isConfirmed(o); }   // farmer said yes, waiting on stock
// One set of words on this page, and they add up: Confirmed + Awaiting stock + Pipeline = Booked.
var TERMS = { Confirmed:'The farmer said yes: confirmed or already delivered.', 'Awaiting stock':'The farmer said yes, but it can only go once the stock is in.',
  Pipeline:'Not yet confirmed by the farmer: forecast and pending orders.', Booked:'Every order this season, whatever its status.' };
function term(t){ return '<span class="term" data-tip="'+BB.esc(TERMS[t])+'">'+t+'</span>'; }

// ---- popups: the orders (or order lines) behind a chart part or a figure ----
// Each row opens that order in Orders (expanded), the page that holds its products, quote and invoice.
function merge(a,b){ Object.keys(b).forEach(function(k){ a[k]=b[k]; }); return a; }
function orderTable(list, sumLabel, noRep){
  list=list.slice().sort(function(a,b){ return (a.deliverMonth-b.deliverMonth) || (d.orderValue(b)-d.orderValue(a)); });
  var showRep=!isAdvisor && !noRep;
  var cols=['Ref','Farmer'].concat(showRep?['Rep']:[]).concat(['Delivery','Status','Value']), tot=0;
  var rows=list.map(function(o){ var f=d.farmer(o.farmer), v=d.orderValue(o); tot+=v;
    return { href:'orders.html?open='+encodeURIComponent(o.id), cells:[{ html:'<b style="white-space:nowrap">'+BB.esc(o.ref)+'</b>' }, f.name].concat(showRep?[d.rep(o.rep).name]:[]).concat([BB.monthName(o.deliverMonth), { html:BB.statusBadge(o.status) }, BB.money(v)]) }; });
  if(list.length>1 || (list.length && sumLabel)) rows.push({ cells:[{ html:'<b style="white-space:nowrap">'+(sumLabel||list.length+' orders')+'</b>' }].concat(cols.slice(1,-1).map(function(){ return {html:''}; })).concat([{ html:'<b>'+BB.money(tot)+'</b>' }]) });
  return { wide:showRep, table:{ columns:cols, rows:rows, num:[cols.length-1] }, actions:[{ label:'Open Orders', href:'orders.html', primary:true }] };
}
function lineTable(list, test){
  var cols=['Ref','Farmer','Product','Delivery','Status','Qty','Value'], rows=[], tot=0;
  list.slice().sort(function(a,b){ return a.deliverMonth-b.deliverMonth; }).forEach(function(o){
    var f=d.farmer(o.farmer);
    (o.lines||[]).forEach(function(l){ var p=d.product(l.prod); if(test && !test(p)) return; var v=(p.price||0)*(l.qty||0); tot+=v;
      rows.push({ href:'orders.html?open='+encodeURIComponent(o.id), cells:[{ html:'<b style="white-space:nowrap">'+BB.esc(o.ref)+'</b>' }, f.name, p.name, BB.monthName(o.deliverMonth), { html:BB.statusBadge(o.status) }, BB.num(l.qty)+(p.unit?' '+p.unit:''), BB.money(v)] }); });
  });
  var n=rows.length;
  if(n>1) rows.push({ cells:[{ html:'<b style="white-space:nowrap">'+n+' lines</b>' },{html:''},{html:''},{html:''},{html:''},{html:''},{ html:'<b>'+BB.money(tot)+'</b>' }] });
  return { table:{ columns:cols, rows:rows, num:[5,6] }, wide:true, actions:[{ label:'Open Orders', href:'orders.html', primary:true }] };
}
// ---- record cards (CONVENTIONS: the card pattern): a rep, a product ----
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
function repCard(x){
  var r=x.rep, list=orders.filter(function(o){ return o.rep===r.id; });
  var pipe=list.filter(function(o){ return !isConfirmed(o); }), done=list.filter(isConfirmed);
  // the pipeline first (what is still to land), then what is already confirmed
  var t=orderTable(pipe, pipe.length+' still open', true);
  if(done.length){ var t2=orderTable(done, done.length+' confirmed', true); t.table.rows=t.table.rows.concat(t2.table.rows); }
  t.table.title='Orders this season';
  var tel=String(r.cell||'').replace(/\D/g,'').replace(/^0/,'27');
  return merge(t, { eyebrow:'Rep', title:r.name, color:null, wide:true, layout:'split',
    meta:[ { initials:initialsOf(r.name), color:r.colour||'#3f6b28', text:r.role||r.name, tip:'Role' },
      r.region?{ icon:'map', text:r.region+(r.base&&r.base!==r.region?' · based '+r.base:''), tip:'Covers' }:null,
      tel?{ icon:'phone', tip:'Phone', html:'<a href="tel:+'+tel+'">'+BB.esc(r.cell)+'</a>' }:null ],
    stats:[{ l:'Booked', v:BB.money(x.total), s:x.count+' order'+(x.count===1?'':'s') }, { l:'Confirmed', v:BB.money(x.confirmed), s:done.length+' confirmed' },
      { l:'Awaiting stock', v:BB.money(x.total-x.confirmed-x.pipeline) }, { l:'Pipeline', v:BB.money(x.pipeline), s:'not yet confirmed' }] });
}
function productCard(name){
  var p=d.all('products').filter(function(x){ return x.name===name; })[0]||{ name:name }, qty=0, val=0, n=0, nOrd={};
  orders.forEach(function(o){ (o.lines||[]).forEach(function(l){ var q=d.product(l.prod); if(q.name!==name) return; qty+=(l.qty||0); val+=(q.price||0)*(l.qty||0); n++; nOrd[o.id]=1; }); });
  var t=lineTable(orders.filter(function(o){ return nOrd[o.id]; }), function(q){ return q.name===name; });
  t.table.title='Every line, by delivery month';
  return merge(t, { eyebrow:'Product', title:name, color:null, layout:'split',
    meta:[ p.code?{ icon:'tag', text:p.code, tip:'Code' }:null, p.pack?{ icon:'package', text:p.pack, tip:'Pack' }:null, p.cat?{ icon:'leaf', text:p.cat, tip:'Category' }:null ],
    stats:[{ l:'Value', v:BB.money(val), s:'this season' }, { l:'Quantity', v:BB.num(qty)+(p.unit?' '+p.unit:'') }, { l:'Orders', v:BB.num(Object.keys(nOrd).length), s:n+' line'+(n===1?'':'s') },
      { l:'Share', v:totalVal? Math.round(val/totalVal*100)+'%' : '—', s:'of your book' }] });
}

var pipelineVal = orders.filter(isPipeline).reduce(function(s,o){ return s+d.orderValue(o); },0);
var confirmedVal = orders.filter(isConfirmed).reduce(function(s,o){ return s+d.orderValue(o); },0);
var awaitVal = orders.filter(isAwaiting).reduce(function(s,o){ return s+d.orderValue(o); },0);
var totalVal = orders.reduce(function(s,o){ return s+d.orderValue(o); },0);

// group by deliverMonth
var byMonth=[];
for(var i=0;i<12;i++) byMonth.push({ i:i, orders:0, forecast:0, confirmed:0, awaiting:0 });
orders.forEach(function(o){
  var m=byMonth[o.deliverMonth]; if(!m) return;
  m.orders++;
  var v=d.orderValue(o);
  if(isConfirmed(o)) m.confirmed+=v; else if(isAwaiting(o)) m.awaiting+=v; else m.forecast+=v;
});
var activeMonths = byMonth.filter(function(m){ return m.orders>0; });
var maxMonth = Math.max.apply(null, byMonth.map(function(m){ return m.forecast+m.confirmed+m.awaiting; }).concat([1]));

var html='';
html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Sales</div><h1>Sales forecast</h1><p>'+
  (isAdvisor?'Your pipeline by delivery month, live as you capture.'
            :'Every rep, live by delivery month. Captured in the field, on your screen the same moment.')+'</p></div>'+
  '<div class="row" style="gap:8px;"><a class="btn" href="voice-order.html">'+BB.icon('mic')+'Capture an order</a><a class="btn ghost" href="orders.html">'+BB.icon('receipt')+'Full pipeline</a></div></div>';

// stat tiles
var busiest = activeMonths.slice().sort(function(a,b){ return (b.forecast+b.confirmed+b.awaiting)-(a.forecast+a.confirmed+a.awaiting); })[0];
var convPct = totalVal ? Math.round(confirmedVal/totalVal*100) : 0;
html += '<div class="grid g4" style="margin-top:16px;">';
// every figure here is a list of orders: tap one and the list opens over the page
function tile(key, l, v, s){ return '<a class="stat tap" href="orders.html" data-detail="'+key+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></a>'; }
function tileDetail(list, sub){ var x=orderTable(list); var tot=list.reduce(function(t,o){ return t+d.orderValue(o); },0);
  return merge(x, { stats:[{ l:'Orders', v:BB.num(list.length) }, { l:'Value', v:BB.money(tot) }], actions:[{ label:'Open the full list', href:'orders.html', primary:true }] }); }
BB.statDetail('fcPipe', function(){ return tileDetail(orders.filter(isPipeline), 'forecast and pending, by delivery month'); });
BB.statDetail('fcAwait', function(){ return tileDetail(orders.filter(isAwaiting), 'waiting on stock, by delivery month'); });
BB.statDetail('fcConf', function(){ return tileDetail(orders.filter(isConfirmed), 'confirmed and delivered, by delivery month'); });
BB.statDetail('fcAll', function(){ return tileDetail(orders, 'every order this season, by delivery month'); });
BB.statDetail('fcBusy', function(){ return busiest? tileDetail(orders.filter(function(o){ return o.deliverMonth===busiest.i; }), 'due for delivery in '+BB.monthName(busiest.i)) : null; });
html += tile('fcConf', 'Confirmed', BB.money(confirmedVal), 'confirmed + delivered · '+convPct+'% of booked');
html += tile('fcAwait', 'Awaiting stock', BB.money(awaitVal), orders.filter(isAwaiting).length+' order'+(orders.filter(isAwaiting).length===1?'':'s')+' waiting on stock');
html += tile('fcPipe', 'Pipeline', BB.money(pipelineVal), 'forecast + pending · not yet confirmed');
html += tile('fcAll', 'Booked', BB.money(totalVal), orders.length+' orders'+(busiest?' · busiest '+BB.monthName(busiest.i):''));
html += '</div>';
// the sum, in words, so the four figures above visibly agree (hover a word for what it means)
html += '<div class="fc-sum">'+term('Confirmed')+' <b>'+BB.money(confirmedVal)+'</b> <i>+</i> '+term('Awaiting stock')+' <b>'+BB.money(awaitVal)+'</b> <i>+</i> '+term('Pipeline')+' <b>'+BB.money(pipelineVal)+'</b> <i>=</i> '+term('Booked')+' <b>'+BB.money(totalVal)+'</b></div>';

// the picture: month by month beside the split by rep (or, for an advisor, confirmed vs pipeline)
html += '<div class="split" style="margin-top:16px;">'+
  '<div class="card"><div class="card-h"><div><h3>Month by month</h3><div class="sub">order value by delivery month · confirmed, awaiting stock and pipeline</div></div></div><div class="card-p"><div id="chMonth"></div></div></div>'+
  '<div class="card"><div class="card-h"><div><h3>'+(isAdvisor?'Confirmed vs pipeline':'By rep')+'</h3><div class="sub">'+(isAdvisor?'your book this season':'confirmed, awaiting stock and pipeline')+'</div></div></div><div class="card-p"><div id="chSide"></div></div></div>'+
'</div>';

// ---- the pivot Rudie asked for: per product · per rep · per area · per month ----
html += '<div class="card" id="pivot" style="margin-top:16px;"><div class="card-h"><div><h3>By product · rep · area · month</h3><div class="sub">every line of every order, live</div></div>'+
  '<div class="pv-tools map-tools">'+
  '<span class="lbl">Rows</span>'+
  '<span class="chip tog on" data-dim="product">Product</span>'+(isAdvisor?'':'<span class="chip tog" data-dim="rep">Rep</span>')+'<span class="chip tog" data-dim="area">Area</span><span class="chip tog" data-dim="farmer">Farmer</span>'+
  '<span class="lbl">Show</span>'+
  '<span class="chip tog on" data-measure="value">Rand</span><span class="chip tog" data-measure="qty">Litres / kg</span>'+
  '<span class="chip tog" data-conf="all" title="Toggle: all orders vs confirmed only">All orders</span>'+
'</div></div><div class="scroll" id="pivotBody"></div></div>';

// month detail table beside the rep table (director) or the products (advisor)
var monthTbl = '<div class="card"><div class="card-h"><div><h3>Detail by month</h3><div class="sub">'+activeMonths.length+' months with deliveries</div></div></div><div class="scroll"><table class="bb"><thead><tr>'+
  '<th>Month</th><th class="num">Orders</th><th class="num">Confirmed</th><th class="num">Awaiting stock</th><th class="num">Pipeline</th><th class="num">Booked</th></tr></thead><tbody>';
if(!activeMonths.length){
  monthTbl += '<tr><td colspan="6" class="center faint">No orders yet.</td></tr></tbody>';
} else {
  var tO=0,tF=0,tC=0,tA=0;
  activeMonths.forEach(function(m){
    tO+=m.orders; tF+=m.forecast; tC+=m.confirmed; tA+=m.awaiting;
    monthTbl += '<tr><td><b>'+BB.monthName(m.i)+'</b></td><td class="num">'+m.orders+'</td>'+
      '<td class="num">'+BB.money(m.confirmed)+'</td><td class="num">'+BB.money(m.awaiting)+'</td><td class="num">'+BB.money(m.forecast)+'</td><td class="num"><b>'+BB.money(m.forecast+m.confirmed+m.awaiting)+'</b></td></tr>';
  });
  monthTbl += '</tbody><tfoot><tr><td>Season</td><td class="num">'+tO+'</td><td class="num">'+BB.money(tC)+'</td><td class="num">'+BB.money(tA)+'</td><td class="num">'+BB.money(tF)+'</td><td class="num">'+BB.money(tF+tC+tA)+'</td></tr></tfoot>';
}
monthTbl += '</table></div></div>';

var sideTbl = '';
var repRows = [];
if(!isAdvisor){
  var reps = d.all('reps');
  repRows = reps.map(function(r){
    var ro = orders.filter(function(o){ return o.rep===r.id; });
    return {
      rep:r,
      count:ro.length,
      pipeline: ro.filter(isPipeline).reduce(function(s,o){ return s+d.orderValue(o); },0),
      confirmed: ro.filter(isConfirmed).reduce(function(s,o){ return s+d.orderValue(o); },0),
      total: ro.reduce(function(s,o){ return s+d.orderValue(o); },0)
    };
  }).filter(function(x){ return x.count>0; }).sort(function(a,b){ return b.total-a.total; });
  var maxRep = Math.max.apply(null, repRows.map(function(x){ return x.total; }).concat([1]));
  sideTbl = '<div class="card"><div class="card-h"><div><h3>By rep</h3><div class="sub">'+repRows.length+' active</div></div></div><div class="scroll"><table class="bb"><thead><tr>'+
    '<th>Rep</th><th class="num">Orders</th><th class="num">Confirmed</th><th class="num">Awaiting stock</th><th class="num">Pipeline</th><th class="num">Booked</th></tr></thead><tbody>';
  repRows.forEach(function(x){
    sideTbl += '<tr><td><span class="rep"><i style="background:'+x.rep.colour+';"></i><b>'+BB.esc(x.rep.name)+'</b></span></td>'+
      '<td class="num">'+x.count+'</td>'+
      '<td class="num">'+BB.money(x.confirmed)+'</td>'+
      '<td class="num">'+BB.money(x.total-x.confirmed-x.pipeline)+'</td>'+
      '<td class="num">'+BB.money(x.pipeline)+'</td>'+
      '<td class="num"><b>'+BB.money(x.total)+'</b></td></tr>';
  });
  sideTbl += '</tbody><tfoot><tr><td>All reps</td><td class="num">'+repRows.reduce(function(t,x){return t+x.count;},0)+'</td><td class="num">'+BB.money(confirmedVal)+'</td><td class="num">'+BB.money(awaitVal)+'</td><td class="num">'+BB.money(pipelineVal)+'</td><td class="num">'+BB.money(totalVal)+'</td></tr></tfoot></table></div></div>';
} else {
  sideTbl = '<div class="card"><div class="card-h"><div><h3>Your products</h3><div class="sub">order value per product, this season</div></div></div><div class="card-p"><div id="chProd"></div></div></div>';
}
html += '<div class="grid g2" style="margin-top:16px;">'+monthTbl+sideTbl+'</div>';

document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');

// ---- charts ----
try{
  var used = activeMonths.map(function(m){ return m.i; });
  var lo = used.length?Math.min.apply(null,used):new Date().getMonth(), hi = used.length?Math.max.apply(null,used):lo+5;
  if(hi-lo<5) hi=Math.min(11, lo+5);
  if(hi-lo<5) lo=Math.max(0, hi-5);
  var span=[]; for(var mi=lo; mi<=hi; mi++) span.push(byMonth[mi]);
  BB.chart.bar('#chMonth',{ labels:span.map(function(m){ return BB.monthName(m.i); }), money:true, stacked:true, height:240, table:true,
    series:[{name:'Confirmed',values:span.map(function(m){return m.confirmed;}),color:'#22431a'},{name:'Awaiting stock',values:span.map(function(m){return m.awaiting;}),color:'#c77d17'},{name:'Pipeline',values:span.map(function(m){return m.forecast;}),color:'#68a53e'}],
    detail:function(ctx){ var mi=span[ctx.index].i, list=orders.filter(function(o){ return o.deliverMonth===mi; });
      var cv=list.filter(isConfirmed).reduce(function(t,o){ return t+d.orderValue(o); },0);
      return merge(orderTable(list), { stats:[{ l:'Booked', v:BB.money(ctx.total), s:list.length+' order'+(list.length===1?'':'s') }, { l:'Confirmed', v:BB.money(cv) }, { l:'Awaiting stock', v:BB.money(list.filter(isAwaiting).reduce(function(t,o){ return t+d.orderValue(o); },0)) }, { l:'Pipeline', v:BB.money(list.filter(isPipeline).reduce(function(t,o){ return t+d.orderValue(o); },0)) }] }); } });
  if(isAdvisor){
    if(totalVal) BB.chart.donut('#chSide',{ money:true, centreLabel:'your book', rows:[{label:'Confirmed',value:confirmedVal,color:'#22431a'},{label:'Awaiting stock',value:awaitVal,color:'#c77d17'},{label:'Pipeline',value:pipelineVal,color:'#68a53e'}],
      detail:function(ctx){ var list=orders.filter(ctx.row.label==='Confirmed'? isConfirmed : ctx.row.label==='Awaiting stock'? isAwaiting : isPipeline);
        return merge(orderTable(list), { stats:[{ l:'Value', v:BB.money(ctx.value), s:list.length+' order'+(list.length===1?'':'s') }, { l:'Share', v:(ctx.total?Math.round(ctx.value/ctx.total*100):0)+'%', s:'of your book' }] }); } });
    else document.getElementById('chSide').innerHTML='<div class="empty">No orders yet.</div>';
    var pr={};
    orders.forEach(function(o){ (o.lines||[]).forEach(function(l){ var p=d.product(l.prod); pr[p.name]=(pr[p.name]||0)+(p.price||0)*(l.qty||0); }); });
    var prow=Object.keys(pr).map(function(k){ return {label:k, value:pr[k]}; }).sort(function(a,b){ return b.value-a.value; }).slice(0,8);
    if(prow.length) BB.chart.hbar('#chProd',{ money:true, rows:prow,
      detail:function(ctx){ return productCard(ctx.row.label); } });
    else document.getElementById('chProd').innerHTML='<div class="empty">No products ordered yet.</div>';
  } else {
    if(repRows.length) BB.chart.hbar('#chSide',{ money:true, rows:repRows.map(function(x){ return { label:x.rep.name, sub:x.count+' orders', value:x.total,
        parts:[{name:'Confirmed',value:x.confirmed,color:'#22431a'},{name:'Pipeline',value:x.pipeline,color:'#68a53e'},{name:'Awaiting stock',value:Math.max(0,x.total-x.confirmed-x.pipeline),color:'#c77d17'}] }; }),
      legend:[{name:'Confirmed',color:'#22431a'},{name:'Pipeline',color:'#68a53e'},{name:'Awaiting stock',color:'#c77d17'}],
      detail:function(ctx){ var x=repRows[ctx.index]; return x? repCard(x) : null; } });
    else document.getElementById('chSide').innerHTML='<div class="empty">No orders yet.</div>';
  }
}catch(e){ console.warn('chart', e); }

// ---- pivot engine ----
var pv = { dim:'product', measure:'value', confOnly:false };
function pivotRows(){
  var rows={}, months={};
  orders.forEach(function(o){
    if(pv.confOnly && !isConfirmed(o)) return;
    var f=d.farmer(o.farmer), r=d.rep(o.rep);
    (o.lines||[]).forEach(function(l){
      var p=d.product(l.prod);
      var key = pv.dim==='product'? p.name : pv.dim==='rep'? r.name : pv.dim==='area'? (f.region||'—') : (f.farm||f.name);
      var sub = pv.dim==='product'? (p.unit||'') : pv.dim==='rep'? r.region : pv.dim==='area'? '' : f.name;
      var val = pv.measure==='value' ? (p.price||0)*(l.qty||0)*(d.quoteStatus(o)?(1+d.quotePct(o)/100):1) : (l.qty||0);
      rows[key]=rows[key]||{key:key, sub:sub, months:{}, total:0, unit:p.unit||''};
      rows[key].months[o.deliverMonth]=(rows[key].months[o.deliverMonth]||0)+val; rows[key].total+=val; months[o.deliverMonth]=1;
    });
  });
  var ms=Object.keys(months).map(Number).sort(function(a,b){return a-b;});
  var list=Object.keys(rows).map(function(k){return rows[k];}).sort(function(a,b){return b.total-a.total;});
  return {rows:list, months:ms};
}
function fmt(v, unit){ return pv.measure==='value' ? BB.money(Math.round(v)) : (BB.num(Math.round(v))+(unit?' '+unit:'')); }
function renderPivot(){
  var P=pivotRows(); var el=document.getElementById('pivotBody'); if(!el) return;
  if(!P.rows.length){ el.innerHTML='<div class="empty">No orders in this view yet.</div>'; return; }
  var colTot={}; var grand=0;
  var h='<table class="bb"><thead><tr><th>'+({product:'Product',rep:'Rep',area:'Area',farmer:'Farmer'})[pv.dim]+'</th>'+P.months.map(function(m){return '<th class="num">'+BB.monthName(m)+'</th>';}).join('')+'<th class="num">Total</th></tr></thead><tbody>';
  P.rows.forEach(function(r){
    h+='<tr><td><b>'+BB.esc(r.key)+'</b>'+(r.sub?'<div class="faint" style="font-size:.72rem;">'+BB.esc(r.sub)+'</div>':'')+'</td>';
    P.months.forEach(function(m){ var v=r.months[m]||0; colTot[m]=(colTot[m]||0)+v; h+='<td class="num">'+(v?fmt(v, pv.dim==='product'?r.unit:''):'<span class="faint">·</span>')+'</td>'; });
    grand+=r.total; h+='<td class="num"><b>'+fmt(r.total, pv.dim==='product'?r.unit:'')+'</b></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>Total</td>'+P.months.map(function(m){return '<td class="num">'+fmt(colTot[m]||0,'')+'</td>';}).join('')+'<td class="num">'+fmt(grand,'')+'</td></tr></tfoot></table>';
  el.innerHTML=h;
}
document.querySelectorAll('.chip.tog[data-dim]').forEach(function(c){ c.onclick=function(){ document.querySelectorAll('.chip.tog[data-dim]').forEach(function(x){x.classList.remove('on');}); c.classList.add('on'); pv.dim=c.dataset.dim; renderPivot(); }; });
document.querySelectorAll('.chip.tog[data-measure]').forEach(function(c){ c.onclick=function(){ document.querySelectorAll('.chip.tog[data-measure]').forEach(function(x){x.classList.remove('on');}); c.classList.add('on'); pv.measure=c.dataset.measure; renderPivot(); }; });
var confChip=document.querySelector('.chip.tog[data-conf]'); if(confChip) confChip.onclick=function(){ pv.confOnly=!pv.confOnly; confChip.classList.toggle('on', pv.confOnly); confChip.textContent=pv.confOnly?'Confirmed only':'All orders'; renderPivot(); };
renderPivot();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
