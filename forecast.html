<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Sales forecast · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'sales', back:'index.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';

var css=''+
'.pv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}'+
'.pv-tools .lbl{font-size:.64rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-left:6px;}'+
'.pv-tools .chip.tog{cursor:pointer;user-select:none;}'+
'.rep{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;} .rep i{width:8px;height:8px;border-radius:50%;flex:none;}'+
'#pivotBody table.bb td:first-child,#pivotBody table.bb th:first-child{position:sticky;left:0;background:#fff;z-index:2;min-width:160px;}'+
'#pivotBody table.bb th:first-child{background:var(--panel-2);z-index:3;} #pivotBody table.bb tfoot td:first-child{background:var(--panel-2);}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

// scope orders to role
var orders = d.all('orders');
if(isAdvisor){ orders = orders.filter(function(o){ return o.rep===u.rep; }); }

function isPipeline(o){ return o.status==='Forecast'||o.status==='Pending'; }
function isConfirmed(o){ return o.status==='Confirmed'||o.status==='Delivered'; }

var pipelineVal = orders.filter(isPipeline).reduce(function(s,o){ return s+d.orderValue(o); },0);
var confirmedVal = orders.filter(isConfirmed).reduce(function(s,o){ return s+d.orderValue(o); },0);
var totalVal = orders.reduce(function(s,o){ return s+d.orderValue(o); },0);

// group by deliverMonth
var byMonth=[];
for(var i=0;i<12;i++) byMonth.push({ i:i, orders:0, forecast:0, confirmed:0 });
orders.forEach(function(o){
  var m=byMonth[o.deliverMonth]; if(!m) return;
  m.orders++;
  var v=d.orderValue(o);
  if(isConfirmed(o)) m.confirmed+=v; else m.forecast+=v;
});
var activeMonths = byMonth.filter(function(m){ return m.orders>0; });
var maxMonth = Math.max.apply(null, byMonth.map(function(m){ return m.forecast+m.confirmed; }).concat([1]));

var html='';
html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Sales</div><h1>Sales forecast</h1><p>'+
  (isAdvisor?'Your pipeline by delivery month, live as you capture.'
            :'Every rep, live by delivery month. Captured in the field, on your screen the same moment.')+'</p></div>'+
  '<div class="row" style="gap:8px;"><a class="btn" href="voice-order.html">'+BB.icon('mic')+'Capture an order</a><a class="btn ghost" href="orders.html">'+BB.icon('receipt')+'Full pipeline</a></div></div>';

// stat tiles
var busiest = activeMonths.slice().sort(function(a,b){ return (b.forecast+b.confirmed)-(a.forecast+a.confirmed); })[0];
var convPct = totalVal ? Math.round(confirmedVal/totalVal*100) : 0;
html += '<div class="grid g4" style="margin-top:16px;">';
html += '<div class="stat"><div class="l">Pipeline value</div><div class="v">'+BB.money(pipelineVal)+'</div><div class="s">forecast + pending</div></div>';
html += '<div class="stat"><div class="l">Confirmed value</div><div class="v">'+BB.money(confirmedVal)+'</div><div class="s">confirmed + delivered · '+convPct+'% of the book</div></div>';
html += '<div class="stat"><div class="l">Total booked</div><div class="v">'+BB.money(totalVal)+'</div><div class="s">'+orders.length+' orders this season</div></div>';
html += '<div class="stat"><div class="l">Busiest month</div><div class="v">'+(busiest?BB.monthName(busiest.i):'—')+'</div><div class="s">'+(busiest?BB.money(busiest.forecast+busiest.confirmed)+' due for delivery':'no orders yet')+'</div></div>';
html += '</div>';

// the picture: month by month beside the split by rep (or, for an advisor, confirmed vs pipeline)
html += '<div class="split" style="margin-top:16px;">'+
  '<div class="card"><div class="card-h"><div><h3>Month by month</h3><div class="sub">order value by delivery month · confirmed and not yet confirmed</div></div></div><div class="card-p"><div id="chMonth"></div></div></div>'+
  '<div class="card"><div class="card-h"><div><h3>'+(isAdvisor?'Confirmed vs pipeline':'By rep')+'</h3><div class="sub">'+(isAdvisor?'your book this season':'confirmed and pipeline, this season')+'</div></div></div><div class="card-p"><div id="chSide"></div></div></div>'+
'</div>';

// ---- the pivot Rudie asked for: per product · per rep · per area · per month ----
html += '<div class="card" id="pivot" style="margin-top:16px;"><div class="card-h"><div><h3>By product · rep · area · month</h3><div class="sub">every line of every order, live</div></div>'+
  '<div class="pv-tools map-tools">'+
  '<span class="lbl">Rows</span>'+
  '<span class="chip tog on" data-dim="product">Product</span>'+(isAdvisor?'':'<span class="chip tog" data-dim="rep">Rep</span>')+'<span class="chip tog" data-dim="area">Area</span><span class="chip tog" data-dim="farmer">Farmer</span>'+
  '<span class="lbl">Show</span>'+
  '<span class="chip tog on" data-measure="value">Rand</span><span class="chip tog" data-measure="qty">Litres / kg</span>'+
  '<span class="chip tog" data-conf="all" title="Toggle: all orders vs confirmed only">All orders</span>'+
'</div></div><div class="scroll" id="pivotBody"></div></div>';

// month detail table beside the rep table (director) or the products (advisor)
var monthTbl = '<div class="card"><div class="card-h"><div><h3>Detail by month</h3><div class="sub">'+activeMonths.length+' months with deliveries</div></div></div><div class="scroll"><table class="bb"><thead><tr>'+
  '<th>Month</th><th class="num">Orders</th><th class="num">Forecast value</th><th class="num">Confirmed value</th><th class="num">Total</th></tr></thead><tbody>';
if(!activeMonths.length){
  monthTbl += '<tr><td colspan="5" class="center faint">No orders yet.</td></tr></tbody>';
} else {
  var tO=0,tF=0,tC=0;
  activeMonths.forEach(function(m){
    tO+=m.orders; tF+=m.forecast; tC+=m.confirmed;
    monthTbl += '<tr><td><b>'+BB.monthName(m.i)+'</b></td><td class="num">'+m.orders+'</td>'+
      '<td class="num">'+BB.money(m.forecast)+'</td><td class="num">'+BB.money(m.confirmed)+'</td><td class="num"><b>'+BB.money(m.forecast+m.confirmed)+'</b></td></tr>';
  });
  monthTbl += '</tbody><tfoot><tr><td>Season</td><td class="num">'+tO+'</td><td class="num">'+BB.money(tF)+'</td><td class="num">'+BB.money(tC)+'</td><td class="num">'+BB.money(tF+tC)+'</td></tr></tfoot>';
}
monthTbl += '</table></div></div>';

var sideTbl = '';
var repRows = [];
if(!isAdvisor){
  var reps = d.all('reps');
  repRows = reps.map(function(r){
    var ro = orders.filter(function(o){ return o.rep===r.id; });
    return {
      rep:r,
      count:ro.length,
      pipeline: ro.filter(isPipeline).reduce(function(s,o){ return s+d.orderValue(o); },0),
      confirmed: ro.filter(isConfirmed).reduce(function(s,o){ return s+d.orderValue(o); },0),
      total: ro.reduce(function(s,o){ return s+d.orderValue(o); },0)
    };
  }).filter(function(x){ return x.count>0; }).sort(function(a,b){ return b.total-a.total; });
  var maxRep = Math.max.apply(null, repRows.map(function(x){ return x.total; }).concat([1]));
  sideTbl = '<div class="card"><div class="card-h"><div><h3>By rep</h3><div class="sub">'+repRows.length+' active</div></div></div><div class="scroll"><table class="bb"><thead><tr>'+
    '<th>Rep</th><th class="num">Orders</th><th class="num">Pipeline</th><th class="num">Confirmed</th><th class="num">Total</th></tr></thead><tbody>';
  repRows.forEach(function(x){
    sideTbl += '<tr><td><span class="rep"><i style="background:'+x.rep.colour+';"></i><b>'+BB.esc(x.rep.name)+'</b></span></td>'+
      '<td class="num">'+x.count+'</td>'+
      '<td class="num">'+BB.money(x.pipeline)+'</td>'+
      '<td class="num">'+BB.money(x.confirmed)+'</td>'+
      '<td class="num"><b>'+BB.money(x.total)+'</b></td></tr>';
  });
  sideTbl += '</tbody><tfoot><tr><td>All reps</td><td class="num">'+repRows.reduce(function(t,x){return t+x.count;},0)+'</td><td class="num">'+BB.money(pipelineVal)+'</td><td class="num">'+BB.money(confirmedVal)+'</td><td class="num">'+BB.money(totalVal)+'</td></tr></tfoot></table></div></div>';
} else {
  sideTbl = '<div class="card"><div class="card-h"><div><h3>Your products</h3><div class="sub">order value per product, this season</div></div></div><div class="card-p"><div id="chProd"></div></div></div>';
}
html += '<div class="grid g2" style="margin-top:16px;">'+monthTbl+sideTbl+'</div>';

document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');

// ---- charts ----
try{
  var used = activeMonths.map(function(m){ return m.i; });
  var lo = used.length?Math.min.apply(null,used):new Date().getMonth(), hi = used.length?Math.max.apply(null,used):lo+5;
  if(hi-lo<5) hi=Math.min(11, lo+5);
  if(hi-lo<5) lo=Math.max(0, hi-5);
  var span=[]; for(var mi=lo; mi<=hi; mi++) span.push(byMonth[mi]);
  BB.chart.bar('#chMonth',{ labels:span.map(function(m){ return BB.monthName(m.i); }), money:true, stacked:true, height:240, table:true,
    series:[{name:'Confirmed',values:span.map(function(m){return m.confirmed;}),color:'#22431a'},{name:'Not yet confirmed',values:span.map(function(m){return m.forecast;}),color:'#68a53e'}] });
  if(isAdvisor){
    if(totalVal) BB.chart.donut('#chSide',{ money:true, centreLabel:'your book', rows:[{label:'Confirmed',value:confirmedVal,color:'#22431a'},{label:'Not yet confirmed',value:totalVal-confirmedVal,color:'#68a53e'}] });
    else document.getElementById('chSide').innerHTML='<div class="empty">No orders yet.</div>';
    var pr={};
    orders.forEach(function(o){ (o.lines||[]).forEach(function(l){ var p=d.product(l.prod); pr[p.name]=(pr[p.name]||0)+(p.price||0)*(l.qty||0); }); });
    var prow=Object.keys(pr).map(function(k){ return {label:k, value:pr[k]}; }).sort(function(a,b){ return b.value-a.value; }).slice(0,8);
    if(prow.length) BB.chart.hbar('#chProd',{ money:true, rows:prow });
    else document.getElementById('chProd').innerHTML='<div class="empty">No products ordered yet.</div>';
  } else {
    if(repRows.length) BB.chart.hbar('#chSide',{ money:true, rows:repRows.map(function(x){ return { label:x.rep.name, sub:x.count+' orders', value:x.total,
        parts:[{name:'Confirmed',value:x.confirmed,color:'#22431a'},{name:'Pipeline',value:x.pipeline,color:'#68a53e'},{name:'Awaiting stock',value:Math.max(0,x.total-x.confirmed-x.pipeline),color:'#c77d17'}] }; }),
      legend:[{name:'Confirmed',color:'#22431a'},{name:'Pipeline',color:'#68a53e'},{name:'Awaiting stock',color:'#c77d17'}] });
    else document.getElementById('chSide').innerHTML='<div class="empty">No orders yet.</div>';
  }
}catch(e){ console.warn('chart', e); }

// ---- pivot engine ----
var pv = { dim:'product', measure:'value', confOnly:false };
function pivotRows(){
  var rows={}, months={};
  orders.forEach(function(o){
    if(pv.confOnly && !isConfirmed(o)) return;
    var f=d.farmer(o.farmer), r=d.rep(o.rep);
    (o.lines||[]).forEach(function(l){
      var p=d.product(l.prod);
      var key = pv.dim==='product'? p.name : pv.dim==='rep'? r.name : pv.dim==='area'? (f.region||'—') : (f.farm||f.name);
      var sub = pv.dim==='product'? (p.unit||'') : pv.dim==='rep'? r.region : pv.dim==='area'? '' : f.name;
      var val = pv.measure==='value' ? (p.price||0)*(l.qty||0)*(d.quoteStatus(o)?(1+d.quotePct(o)/100):1) : (l.qty||0);
      rows[key]=rows[key]||{key:key, sub:sub, months:{}, total:0, unit:p.unit||''};
      rows[key].months[o.deliverMonth]=(rows[key].months[o.deliverMonth]||0)+val; rows[key].total+=val; months[o.deliverMonth]=1;
    });
  });
  var ms=Object.keys(months).map(Number).sort(function(a,b){return a-b;});
  var list=Object.keys(rows).map(function(k){return rows[k];}).sort(function(a,b){return b.total-a.total;});
  return {rows:list, months:ms};
}
function fmt(v, unit){ return pv.measure==='value' ? BB.money(Math.round(v)) : (BB.num(Math.round(v))+(unit?' '+unit:'')); }
function renderPivot(){
  var P=pivotRows(); var el=document.getElementById('pivotBody'); if(!el) return;
  if(!P.rows.length){ el.innerHTML='<div class="empty">No orders in this view yet.</div>'; return; }
  var colTot={}; var grand=0;
  var h='<table class="bb"><thead><tr><th>'+({product:'Product',rep:'Rep',area:'Area',farmer:'Farmer'})[pv.dim]+'</th>'+P.months.map(function(m){return '<th class="num">'+BB.monthName(m)+'</th>';}).join('')+'<th class="num">Total</th></tr></thead><tbody>';
  P.rows.forEach(function(r){
    h+='<tr><td><b>'+BB.esc(r.key)+'</b>'+(r.sub?'<div class="faint" style="font-size:.72rem;">'+BB.esc(r.sub)+'</div>':'')+'</td>';
    P.months.forEach(function(m){ var v=r.months[m]||0; colTot[m]=(colTot[m]||0)+v; h+='<td class="num">'+(v?fmt(v, pv.dim==='product'?r.unit:''):'<span class="faint">·</span>')+'</td>'; });
    grand+=r.total; h+='<td class="num"><b>'+fmt(r.total, pv.dim==='product'?r.unit:'')+'</b></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>Total</td>'+P.months.map(function(m){return '<td class="num">'+fmt(colTot[m]||0,'')+'</td>';}).join('')+'<td class="num">'+fmt(grand,'')+'</td></tr></tfoot></table>';
  el.innerHTML=h;
}
document.querySelectorAll('.chip.tog[data-dim]').forEach(function(c){ c.onclick=function(){ document.querySelectorAll('.chip.tog[data-dim]').forEach(function(x){x.classList.remove('on');}); c.classList.add('on'); pv.dim=c.dataset.dim; renderPivot(); }; });
document.querySelectorAll('.chip.tog[data-measure]').forEach(function(c){ c.onclick=function(){ document.querySelectorAll('.chip.tog[data-measure]').forEach(function(x){x.classList.remove('on');}); c.classList.add('on'); pv.measure=c.dataset.measure; renderPivot(); }; });
var confChip=document.querySelector('.chip.tog[data-conf]'); if(confChip) confChip.onclick=function(){ pv.confOnly=!pv.confOnly; confChip.classList.toggle('on', pv.confOnly); confChip.textContent=pv.confOnly?'Confirmed only':'All orders'; renderPivot(); };
renderPivot();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
