<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Labels · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign3"></script><script src="guard.js?v=redesign3"></script>
<script src="bb-data.js?v=redesign3"></script>
<script src="bb-shell.js?v=redesign3"></script>
<style>
.sheet{background:var(--panel-2);padding:20px;border-top:1px solid var(--line-soft);border-radius:0 0 var(--radius) var(--radius);}
.lbl-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));}
.lbl{border:2px solid var(--green-dark);border-radius:12px;padding:14px 16px;background:#fff;width:100%;max-width:420px;box-shadow:var(--shadow);}
.lbl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1.5px solid var(--line);padding-bottom:8px;margin-bottom:8px;}
.lbl .bw{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--green-dark);letter-spacing:.5px;}
.lbl .bw .os{color:var(--green-bright);}
.lbl .tag{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--faint);text-align:right;}
.lbl h4{font-family:var(--display);font-size:1.15rem;color:var(--ink);margin:2px 0 4px;}
.lbl .rowl{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;padding:3px 0;border-bottom:1px dashed var(--line-soft);}
.lbl .rowl:last-of-type{border-bottom:0;}
.lbl .rowl b{color:var(--green-dark);text-align:right;min-width:0;overflow-wrap:anywhere;}
.lbl .code{font-family:ui-monospace,monospace;font-size:.86rem;letter-spacing:1px;background:#12210c;color:#b7d97a;padding:2px 8px;border-radius:6px;}
.bars{height:34px;background:repeating-linear-gradient(90deg,#12210c 0 2px,#fff 2px 4px,#12210c 4px 7px,#fff 7px 9px,#12210c 9px 11px,#fff 11px 14px);margin-top:10px;border-radius:3px;}
.seg .n{opacity:.65;margin-left:4px;font-weight:600;}
@media(max-width:560px){ .sheet{padding:14px;} .seg{display:flex;width:100%;} .seg button{flex:1;padding:6px 6px;} }
@media print{
  #bbNav,#bbOverlay,.bb-top,.bb-nav,.bb-scope,.bb-sync,.bbc-tip,.toast,.noprint{display:none!important;}
  body{padding:0!important;background:#fff;}
  .wrap{max-width:none;padding:0;}
  .card.lbl-card{border:0;box-shadow:none;background:#fff;}
  .sheet{background:#fff;padding:0;border:0;}
  .lbl-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .lbl{box-shadow:none;max-width:none;page-break-inside:avoid;break-inside:avoid;}
  .lbl, .lbl .code, .bars{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });
var d = BB.data;

var MODES = {product:'Product labels', blend:'Blend batch labels', delivery:'Delivery labels'};

function render(mode){
  mode = mode || 'product';
  var counts = { product:d.all('products').length, blend:d.all('blending').length, delivery:d.all('orders').length };
  var html = '';
  html += '<div class="page-head row between noprint" style="gap:16px;"><div><div class="eyebrow">Warehouse &amp; field</div>'+
    '<h1>Labels</h1><p>The labels reps and depots always ask for — product, blend batches and delivery — generated from live data and ready to print. No re-typing.</p></div>'+
    '<div class="row"><button class="btn" id="print">'+BB.icon('file')+'Print sheet</button></div></div>';

  var cards = '';
  if(mode==='product'){
    d.all('products').forEach(function(p){
      var sup = d.supplier(p.supplier);
      cards += label(p.name, [
        ['Code', '<span class="code">'+BB.esc(p.code)+'</span>'],
        ['Pack', BB.esc(p.pack)],
        ['Lever', BB.esc(p.lever)],
        ['Supplier', BB.esc(sup.name)],
        ['Batch', 'BX-'+p.code.replace(/[^A-Z0-9]/g,'')+'-2607']
      ], true);
    });
  } else if(mode==='blend'){
    d.all('blending').forEach(function(b){
      var far = d.farmer(b['for']); var dep = d.depot(b.depot);
      cards += label(b.recipe, [
        ['Batch size', BB.esc(b.batch)],
        ['For', BB.esc(far.farm)],
        ['Depot', BB.esc(dep.name)],
        ['Mixed', BB.date(b.due)],
        ['Batch no', 'BL-'+b.id.toUpperCase()+'-2607']
      ], true);
    });
  } else {
    d.all('orders').forEach(function(o){
      var far = d.farmer(o.farmer); var dep = d.depot(o.depot);
      var items = (o.lines||[]).map(function(l){ return d.product(l.prod).code+' ×'+l.qty; }).join(', ');
      cards += label('Delivery · '+o.ref, [
        ['Farmer', BB.esc(far.name)],
        ['Farm', BB.esc(far.farm)],
        ['From', BB.esc(dep.name)],
        ['Items', BB.esc(items||'—')],
        ['Deliver', BB.monthName(o.deliverMonth)]
      ], true);
    });
  }
  html += '<div class="card lbl-card" style="margin-top:16px;">'+
    '<div class="card-h noprint"><div><h3>'+MODES[mode]+'</h3><div class="sub">'+counts[mode]+' label'+(counts[mode]===1?'':'s')+' on this sheet · prints two across, without the menu</div></div>'+
      '<div class="seg" role="tablist">'+['product','blend','delivery'].map(function(m){
        return '<button class="'+(m===mode?'on':'')+'" data-m="'+m+'" role="tab" aria-selected="'+(m===mode)+'">'+MODES[m].replace(' labels','')+'<span class="n">'+counts[m]+'</span></button>';
      }).join('')+'</div></div>'+
    '<div class="sheet">'+(cards?'<div class="lbl-grid">'+cards+'</div>':'<div class="empty">Nothing to label yet.</div>')+'</div>'+
  '</div>';
  html += '<div style="height:24px;" class="noprint"></div>';

  var main = document.querySelector('main');
  if(main) main.innerHTML = html; else document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');

  document.querySelectorAll('[data-m]').forEach(function(c){ c.onclick=function(){ render(c.getAttribute('data-m')); }; });
  document.getElementById('print').onclick = function(){ window.print(); };
}

function label(title, rows, bars){
  return '<div class="lbl">'+
    '<div class="top"><div class="bw">BIOBRIX <span class="os">·</span></div><div class="tag">The Biological Way</div></div>'+
    '<h4>'+BB.esc(title)+'</h4>'+
    rows.map(function(r){ return '<div class="rowl"><span class="faint">'+BB.esc(r[0])+'</span><b>'+r[1]+'</b></div>'; }).join('')+
    (bars?'<div class="bars"></div>':'')+
  '</div>';
}

// ?mode=blend|delivery opens that sheet (a blending job's card links here)
var startMode = new URLSearchParams(location.search).get('mode');
render(MODES[startMode] ? startMode : 'product');
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
