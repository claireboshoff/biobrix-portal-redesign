<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Operations board · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign5"></script><script src="guard.js?v=redesign5"></script>
<script src="bb-data.js?v=redesign5"></script>
<script src="bb-shell.js?v=redesign5"></script>
<style>
  .ops-kpi{margin-top:14px;}
  .ops-row{margin-top:16px;}
  .ops-row > .card{display:flex;flex-direction:column;}
  .ops-row > .card > .card-f{margin-top:auto;}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
  .lvl .trk{position:relative;overflow:visible;height:7px;}
  .lvl .trk i{border-radius:4px;}
  .lvl .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--green-darkest);opacity:.45;}
  .dep-list{border-top:1px solid var(--line-soft);}
  .dep-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;border-top:1px solid var(--line-soft);transition:background .12s;}
  .dep-row:first-child{border-top:0;}
  .dep-row:hover{background:#f3f8ec;}
  .dep-row b{color:var(--green-dark);font-size:.88rem;}
  @media(max-width:480px){ .dep-row{padding:10px 14px;flex-wrap:wrap;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;
// Is this a BioBrix seat on BioBrix's own figures? If so the board is built from the ledger.
var liveBoard = !!(BB.auth && BB.auth.tenantLive && BB.auth.tenantLive() && !(BB.auth.isFreedomHub && BB.auth.isFreedomHub()));

// ---- source data ----
var orders = d.all('orders');
var inventory = d.all('inventory');
var deliveries = d.all('deliveries');
var blending = d.all('blending');
var depots = d.all('depots');
var reps = d.all('reps');
var soil = d.all('soil');
var leaf = d.all('leaf');

// ---- top stat computations ----
var openOrders = orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
var pipelineVal = openOrders.reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var confirmedVal = orders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; }).reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var awaitingStock = orders.filter(function(o){ return o.status==='Awaiting stock'; }).length;
var lowItems = inventory.filter(function(i){ return i.qty<i.reorder; });
var inTransit = deliveries.filter(function(x){ return x.status==='In transit'; });

// ---- render ----
var html = '';
var chartJobs = [];
// A panel in the conventions' shape: header (title, context, actions) then the body.
function panel(title, sub, actions, body, extra){
  return '<div class="card'+(extra?' '+extra:'')+'"><div class="card-h"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(actions||'')+'</div>'+body+'</div>';
}
function openLink(href, label){
  if(BB.auth && typeof BB.auth.canPage==='function' && !BB.auth.canPage(href)) return '';
  return '<a class="btn ghost sm" href="'+href+'">'+(label||'Open')+BB.icon('chevron')+'</a>';
}
// stock level against reorder: the reorder level sits at the midpoint of the track
function levelCell(qty, reorder){
  var cap = Math.max(1, (reorder||0)*2), pct = Math.max(0, Math.min(100, qty/cap*100));
  var col = qty<=0 ? 'var(--red)' : (qty<reorder ? 'var(--amber)' : 'var(--green-bright)');
  return '<div class="bar-cell lvl"><div class="trk"><i style="width:'+pct+'%;background:'+col+'"></i><b title="reorder level"></b></div></div>';
}

// ---- popups: what sits behind a click (BB.popup) ----
// One record opens as a card (CONVENTIONS.md, "Record popups: the card pattern"); a list opens as
// a table whose rows open those cards.
function can(href){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }
function go(label, href, primary){ return href && can(href) ? { label:label, href:href, primary:!!primary } : null; }
function farmHref(fid){ return fid && can('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(fid) : null; }
function depShort(id){ return String(d.depot(id).name||'').replace(/ Depot$/,''); }
function stockStatus(i){ return i.qty<=0?'Out of stock':(i.qty<i.reorder?'Low stock':'In stock'); }
function badgeCell(s){ return { html:BB.statusBadge(s) }; }
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
// a popup row that opens a record's card
function opens(fn){ return function(){ BB.popup(fn()); }; }
// the card's identity lines
function mFarmer(fid){ var f=d.farmer(fid), h=farmHref(fid);
  return f.farm && f.farm!==f.name ? [{ icon:'user', text:f.name, tip:'Farmer' }, { icon:'farm', text:f.farm, tip:'Farm', href:h }] : [{ icon:'user', text:f.name, tip:'Farmer', href:h }]; }
function mDepot(id){ return id ? { icon:'warehouse', text:d.depot(id).name, tip:'Depot' } : null; }
function mRep(id){ var r=d.rep(id); return r && r.name ? { initials:initialsOf(r.name), color:r.colour, text:r.name, tip:'Rep' } : null; }
function alertLine(text, warn){ return '<div class="bbp-alert'+(warn?' warn':'')+'">'+BB.icon('alert')+BB.esc(text)+'</div>'; }
function stockAlert(i){ var u=d.product(i.prod).unit||'';
  return i.qty<=0 ? alertLine('Out of stock — reorder level is '+BB.num(i.reorder)+' '+u) : i.qty<i.reorder ? alertLine('Below reorder — '+BB.num(i.qty)+' of '+BB.num(i.reorder)+' '+u+' on hand', true) : ''; }
// long lists: keep the biggest n, and say so
function cap(rows, n, noun){ return rows.length>n ? { rows:rows.slice(0,n), note:'Showing the '+n+' largest of '+rows.length+' '+noun+'.' } : { rows:rows, note:null }; }
function orderTable(list){
  return { columns:['Order','Farmer','Status','Value'], num:[3], rows:list.slice().sort(function(a,b){ return d.orderValue(b)-d.orderValue(a); }).map(function(o){
    return { cells:[{ html:'<span style="white-space:nowrap">'+BB.esc(o.ref)+'</span>' }, d.farmer(o.farmer).name, badgeCell(o.status), BB.money(d.orderValue(o))], onClick:opens(function(){ return orderPreview(o); }) }; }) };
}
function lineTable(list, withDepot){
  return { columns:['Product'].concat(withDepot?['Depot']:[]).concat(['On hand','Reorder at','Status']), num:withDepot?[2,3]:[1,2],
    rows:list.slice().sort(function(a,b){ return (a.qty/(a.reorder||1))-(b.qty/(b.reorder||1)); }).map(function(i){ var p=d.product(i.prod);
      return { cells:[p.name].concat(withDepot?[depShort(i.depot)]:[]).concat([BB.num(i.qty)+' '+(p.unit||''), BB.num(i.reorder), badgeCell(stockStatus(i))]), onClick:opens(function(){ return stockPreview(i); }) }; }) };
}
function productLines(o){
  return { title:'Products', columns:['Product','Pack','Qty','Value'], num:[2,3], rows:(o.lines||[]).map(function(l){ var p=d.product(l.prod);
    return { cells:[{ html:'<b>'+BB.esc(p.name)+'</b>' }, p.pack||'', BB.num(l.qty), BB.money((p.price||0)*(l.qty||0))] }; }),
    foot:['List value',{ html:'' },{ html:'' },BB.money(d.orderValue(o))] };
}
// An order, briefly — the full order card lives on the orders page (?open=<id>).
function orderPreview(o){
  var dl=deliveries.filter(function(x){ return x.order===o.id; })[0], hold=d.deliveryHold(o), inv=d.orderInvoiced(o.id), counted=(o.status==='Delivered'||o.status==='Confirmed');
  return { wide:true, layout:'split', eyebrow:'Order · '+(o.source||'Portal'), title:o.ref,
    meta:[{ icon:'calendar', text:'Captured '+BB.date(o.date), tip:'Captured' }, mDepot(o.depot)].concat(mFarmer(o.farmer)).concat([mRep(o.rep)]),
    stats:[{ l:'Value', v:BB.money(d.orderValue(o)), s:'list' }, { l:'Status', html:BB.statusBadge(o.status) },
      { l:'Delivery', v:BB.monthName(o.deliverMonth), s:dl? (dl.status==='Delivered'?'delivered '+BB.shortDate(dl.eta):dl.status.toLowerCase()+' · '+BB.shortDate(dl.eta)+(BB.lateDays(dl)?' · late '+BB.lateDays(dl)+'d':'')) : (o.status==='Delivered'?'delivered':'not booked') },
      { l:'Invoice', html: inv? '<span class="tag tag-inv">'+BB.icon('receipt')+'Invoiced</span>' : counted? '<span class="tag tag-uninv">'+BB.icon('receipt')+'Not yet</span>' : '<span class="faint">—</span>' }],
    html:hold? alertLine(hold.reason, hold.sev!=='high') : '', table:productLines(o),
    actions:[go('Farm record', farmHref(o.farmer)), go('Open order', 'orders.html?open='+encodeURIComponent(o.id), true)] };
}
// the same product at the other depots (the product is the card's title, so no Product column)
function otherDepots(list){
  return { title:'At the other depots', columns:['Depot','On hand','Reorder at','Status'], num:[1,2], rows:list.map(function(x){ var u=d.product(x.prod).unit||'';
    return { cells:[d.depot(x.depot).name, BB.num(x.qty)+' '+u, BB.num(x.reorder), { html:BB.statusBadge(x.qty<=0?'Out of stock':(x.qty<x.reorder?'Low stock':'In stock')) }], onClick:opens(function(){ return stockPreview(x); }) }; }) };
}
// A stock line: one product at one depot, and the same product at the others.
function stockPreview(i){
  var p=d.product(i.prod), sup=d.supplier(p.supplier)||{}, low=i.qty<i.reorder;
  var others=inventory.filter(function(x){ return x.prod===i.prod && x.depot!==i.depot; }), net=others.reduce(function(t,x){ return t+(x.qty||0); }, i.qty||0);
  return { wide:others.length>0, layout:others.length?'split':null, eyebrow:'Stock line', title:p.name,
    meta:[mDepot(i.depot), { icon:'package', text:[p.code, p.pack].filter(Boolean).join(' · '), tip:'Code · pack' },
      sup.name? { icon:'link', text:sup.name+(sup.lead?' · '+sup.lead+' days lead':''), tip:'Supplier', href:can('suppliers.html')?'suppliers.html':null } : null],
    stats:[{ l:'On hand', v:BB.num(i.qty)+' '+(p.unit||''), cls:low?'bad':'' }, { l:'Reorder at', v:BB.num(i.reorder)+' '+(p.unit||'') }, { l:'Value', v:BB.money(Math.round((i.qty||0)*(p.price||0))), s:'at list price' },
      others.length? { l:'All depots', v:BB.num(net)+' '+(p.unit||''), s:(others.length+1)+' depots' } : { l:'Status', html:BB.statusBadge(stockStatus(i)) }],
    html:stockAlert(i),
    table:others.length? otherDepots(others) : null,
    actions:[go('Open stock','stock.html', !low), low? go('Reorder radar','suppliers.html',true) : null] };
}
// A delivery: where it is going, how, and when — the order's lines beside it.
function deliveryPreview(x){
  var o=d.by('orders', x.order), hold=o&&d.deliveryHold(o), tr=x.transport&&x.transport!=='—'?x.transport:null;
  return { wide:!!o, layout:o?'split':null, eyebrow:'Delivery', title:o?o.ref:d.farmer(x.farmer).name,
    meta:[{ icon:'calendar', html:(x.status==='Delivered'?'Delivered ':'ETA ')+BB.etaHtml(x), tip:x.status==='Delivered'?'Delivered':'ETA' }, mDepot(x.depot),
      { icon:'truck', text:tr||'No transport yet', tip:'Transport', muted:!tr }].concat(mFarmer(x.farmer)),
    stats:[{ l:'Status', html:BB.statusBadge(x.status) }, { l:'Order value', v:o?BB.money(d.orderValue(o)):'—' }],
    html:hold? alertLine(hold.reason, hold.sev!=='high') : '', table:o?productLines(o):null,
    actions:[go('Farm record', farmHref(x.farmer)), o? go('Open order', 'orders.html?open='+encodeURIComponent(o.id), true) : go('Open deliveries','deliveries.html',true)] };
}
// A depot: its lines, lowest against reorder first.
function depotStock(dep){
  var items=inventory.filter(function(i){ return i.depot===dep.id; }), low=items.filter(function(i){ return i.qty<i.reorder; }), out=items.filter(function(i){ return i.qty<=0; });
  return { wide:true, layout:'split', eyebrow:'Depot', title:dep.name, color:null, tags:BB.statusBadge(dep.status),
    meta:[{ icon:'map', text:dep.region, tip:'Region' }, dep.address? { icon:'map', text:dep.address, tip:'Address' } : null, dep.manager? { icon:'user', text:dep.manager, tip:'Warehouse manager' } : null],
    stats:[{ l:'Stock lines', v:items.length }, { l:'Below reorder', v:low.length, cls:low.length?'bad':'' }, { l:'Out of stock', v:out.length, cls:out.length?'bad':'' },
      { l:'Blending', v:blending.filter(function(b){ return b.depot===dep.id; }).length, s:'jobs on the floor' }],
    table:(function(t){ t.title='Stock on hand · lowest first'; return t; })(lineTable(items, false)),
    actions:[go('Open the depot','depots.html'), go('Open stock','stock.html',true)] };
}
// A blending job on a depot floor.
function blendPreview(b){
  return { eyebrow:'Blending job', title:b.recipe,
    meta:[{ icon:'calendar', text:'Due '+BB.date(b.due), tip:'Due' }, mDepot(b.depot)].concat(mFarmer(b['for'])),
    stats:[{ l:'Status', html:BB.statusBadge(b.status) }, { l:'Batch', v:b.batch }],
    actions:[go('Farm record', farmHref(b['for'])), go('Open the depot','depots.html',true)] };
}

var headActions = [
  {href:'orders.html', ic:'receipt', t:'Orders'},
  {href:'stock.html', ic:'package', t:'Stock'},
  {href:'deliveries.html', ic:'truck', t:'Deliveries'}
].filter(function(a){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(a.href); });

html += '<section class="page-head row between" style="gap:16px;">'+
  '<div><div class="eyebrow">Operations</div>'+
  '<h1>The board</h1>'+
  '<p>'+(liveBoard
    ? 'The whole business on one screen, straight from your accounting system — what has been invoiced and received, who is behind, who is selling it and what is going out the door. Read three times a day.'
    : 'The whole business on one screen — sales, stock, blending and deliveries, live as the team works. Everything here is saved on this device and syncs when you have signal.')+'</p></div>'+
  (headActions.length ? '<div class="row" style="gap:8px;">'+headActions.map(function(a,i){ return '<a class="btn'+(i?' ghost':'')+'" href="'+a.href+'">'+BB.icon(a.ic)+a.t+'</a>'; }).join('')+'</div>' : '')+
'</section>';

// ---- top stat row ----
// With the accounting system connected, the top of the board is the real trading picture.
// Orders, stock and blending do not exist in Sage, so they sit lower down and are marked.
var sg = BB.data.sage && BB.data.sage();
var STATS, invoicePreview, accountPreview;   // the ledger cards, set when the ledger is live
if(sg && sg.live){
  var si=sg.invoices||[], sp=sg.payments||[], sc=sg.customers||[];
  var op=function(i){ return i.outstanding!=null?i.outstanding:(i.status==='Paid'?0:(i.amount||0)); };
  var ym=new Date().toISOString().slice(0,7);
  var t0=new Date(new Date().toISOString().slice(0,10));
  var dov=function(i){ return i.dueDate? Math.round((t0-new Date(i.dueDate))/86400000):0; };
  var invM=si.filter(function(i){return (i.date||'').slice(0,7)===ym;});
  var payM=sp.filter(function(x){return (x.date||'').slice(0,7)===ym;});
  var owed=si.reduce(function(t,i){return t+op(i);},0);
  var od=si.filter(function(i){return i.status==='Overdue';});
  var a90=si.filter(function(i){ return op(i)>0.5 && dov(i)>=90; });
  var lim=sc.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; });
  var openInv=si.filter(function(i){return op(i)>0.5;});
  STATS = [
    {l:'Invoiced this month', v:BB.money(invM.reduce(function(t,i){return t+(i.amount||0);},0)), s:invM.length+' invoices', cls:'', key:'ops-inv', href:'finance.html'},
    {l:'Received this month', v:BB.money(payM.reduce(function(t,x){return t+(x.amount||0);},0)), s:payM.length+' receipts', cls:'', key:'ops-rec', href:'finance.html'},
    {l:'Owed to you', v:BB.money(owed), s:openInv.length+' open invoices', cls:'', key:'ops-owed', href:'finance.html'},
    {l:'Overdue', v:BB.money(od.reduce(function(t,i){return t+op(i);},0)), s:od.length+' past due', cls:od.length?'bad':'', key:'ops-overdue', href:'finance.html?show=overdue'},
    {l:'90 days and older', v:BB.money(a90.reduce(function(t,i){return t+op(i);},0)), s:a90.length+' invoices', cls:a90.length?'warn':'', key:'ops-90', href:'finance.html?show=overdue'},
    {l:'Over their limit', v:lim.length, s:'accounts to watch', cls:lim.length?'warn':'', key:'ops-limit', href:'farms.html?show=overlimit'}
  ];
  // the ledger lists behind each figure; a row opens that invoice or account as a card
  var custById={}; sc.forEach(function(c){ custById[c.id]=c; });
  var farmOfCust={}; (d.allUnscoped('farmers')||[]).forEach(function(f){ if(f.sageId) farmOfCust[f.sageId]=f.id; });
  var custName=function(id){ return (custById[id]||{}).name||'—'; };
  var openOf=function(cid){ return si.filter(function(i){ return i.customer===cid && i.kind!=='opening' && op(i)>0.5; }).sort(function(a,b){ return dov(b)-dov(a); }); };
  var openTable=function(list, title){ var c=cap(list, 30, 'open invoices');
    return { table:{ title:title, columns:['Invoice','Due','Days over','Open'], num:[2,3], rows:c.rows.map(function(i){
      return { cells:[i.label||i.ref||'—', i.dueDate?BB.date(i.dueDate):'—', String(Math.max(0,dov(i))), BB.money(Math.round(op(i)))], onClick:opens(function(){ return invoicePreview(i); }) }; }) }, note:c.note }; };
  var agentOfCust=function(c){ var r=(sg.reps||[]).filter(function(x){ return x.id===c.sageRep; })[0]; return r&&r.name? { initials:initialsOf(r.name), text:r.name, tip:'Agent' } : null; };
  invoicePreview=function(i){
    var cu=custById[i.customer]||{name:'—'}, fh=farmHref(farmOfCust[i.customer]), open=op(i), over=open>0.5? dov(i) : 0;
    var all=openOf(i.customer), rest=all.filter(function(x){ return x.id!==i.id; }), t=openTable(rest, 'Other open invoices on the account');
    return { wide:rest.length>0, layout:rest.length?'split':null, eyebrow:'Invoice', title:i.label||i.ref||'Invoice',
      meta:[{ icon:'user', text:cu.name, tip:'Customer', href:fh }, { icon:'calendar', text:'Invoiced '+BB.date(i.date), tip:'Invoiced' },
        i.dueDate? { icon:'calendar', text:'Due '+BB.date(i.dueDate), tip:'Due' } : null, i.description? { icon:'file', text:i.description, tip:'Description' } : null],
      stats:[{ l:'Amount', v:BB.money(Math.round(i.amount||0)) }, { l:'Open', v:BB.money(Math.round(open)), cls:over>0?'bad':'' },
        { l:'Status', html:BB.statusBadge(i.status||(open>0.5?'Open':'Paid')) }, { l:'Account', v:BB.money(Math.round(cu.balance||0)), s:all.length+' open invoice'+(all.length===1?'':'s') }],
      html:over>0? alertLine(over+' days past due'+(over>=90?' — 90 days and older':''), over<90) : '',
      table:rest.length? t.table : null, note:rest.length? t.note : null,
      actions:[go('Farm record', fh), over>0? go('Open what is overdue','finance.html?show=overdue',true) : go('Open finance','finance.html',true)] };
  };
  accountPreview=function(c, kind, listHref){
    var rest=openOf(c.id), t=openTable(rest, 'Open invoices'), fh=farmHref(farmOfCust[c.id]), over=c.creditLimit>0 && c.balance>c.creditLimit;
    var warn=[c.onHold?'Account on hold':null, over?'over the credit limit by '+BB.money(Math.round(c.balance-c.creditLimit)):null].filter(Boolean).join(' · ');
    return { wide:rest.length>0, layout:rest.length?'split':null, eyebrow:'Account'+(kind?' · '+kind:''), title:c.name,
      meta:[c.code? { icon:'file', text:c.code, tip:'Account code' } : null, c.phone? { icon:'phone', text:c.phone, tip:'Phone', href:'tel:'+String(c.phone).replace(/\s/g,'') } : null, agentOfCust(c)],
      stats:[{ l:'Balance', v:BB.money(Math.round(c.balance||0)) }, { l:'Credit limit', v:c.creditLimit>0?BB.money(Math.round(c.creditLimit)):'none set' },
        { l:'Open invoices', v:rest.length, s:BB.money(Math.round(rest.reduce(function(t,i){ return t+op(i); },0)))+' open' },
        (function(od){ return { l:'Overdue', v:BB.money(Math.round(od.reduce(function(t,i){ return t+op(i); },0))), s:od.length+' invoice'+(od.length===1?'':'s'), cls:od.length?'bad':'' }; })(rest.filter(function(i){ return dov(i)>0; }))],
      html:warn? alertLine(warn.charAt(0).toUpperCase()+warn.slice(1), !c.onHold) : '',
      table:rest.length? t.table : null, note:rest.length? t.note : null,
      actions:[go('Farm record', fh), go('Open the list', listHref, true)] };
  };
  var invTable=function(list, val, cols){ var c=cap(list.slice().sort(function(a,b){ return val(b)-val(a); }), 40, 'invoices');
    return { table:{ columns:['Customer','Invoice',cols==='due'?'Due':'Date'].concat(cols==='due'?['Days over']:[]).concat(['Amount']), num:cols==='due'?[3,4]:[3],
      rows:c.rows.map(function(i){ return { cells:[custName(i.customer), i.label||i.ref||'—', BB.date(cols==='due'?i.dueDate:i.date)].concat(cols==='due'?[String(Math.max(0,dov(i)))]:[]).concat([BB.money(Math.round(val(i)))]),
        onClick:opens(function(){ return invoicePreview(i); }) }; }) }, note:c.note }; };
  var amt=function(i){ return i.amount||0; };
  var withAct=function(o, label, href){ o.actions=[go(label||'Open the full list', href, true)]; return o; };
  BB.statDetail('ops-inv', function(){ return withAct(invTable(invM, amt), null, 'finance.html'); });
  BB.statDetail('ops-rec', function(){ var c=cap(payM.slice().sort(function(a,b){ return (b.amount||0)-(a.amount||0); }), 40, 'receipts');
    return withAct({ table:{ columns:['Customer','Reference','Date','Amount'], num:[3], rows:c.rows.map(function(x){ return { cells:[custName(x.customer), x.ref||'—', BB.date(x.date), BB.money(Math.round(x.amount||0))], href:farmHref(farmOfCust[x.customer]) }; }) }, note:c.note }, null, 'finance.html'); });
  BB.statDetail('ops-owed', function(){ return withAct(invTable(openInv, op, 'due'), null, 'finance.html'); });
  BB.statDetail('ops-overdue', function(){ return withAct(invTable(od, op, 'due'), null, 'finance.html?show=overdue'); });

// ---- sales vs actuals (invoiced-vs-sale reconciliation) ----
// Reported = what reps count as sold (Confirmed + Delivered orders).
// Actual   = orders that are actually invoiced (real revenue).
// Gap      = delivered/counted but not yet invoiced — the discrepancy.
var recRows = reps.map(function(r){
  var repOrders = orders.filter(function(o){ return o.rep===r.id; });
  var reported = repOrders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; })
    .reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  var actual = repOrders.filter(function(o){ return (o.status==='Confirmed'||o.status==='Delivered') && d.orderInvoiced(o.id); })
    .reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  return { rep:r, reported:reported, actual:actual, gap:reported-actual };
}).sort(function(a,b){ return b.gap-a.gap; });
var recTot = recRows.reduce(function(t,x){ t.reported+=x.reported; t.actual+=x.actual; t.gap+=x.gap; return t; }, {reported:0,actual:0,gap:0});

}
// A soil or leaf sample waiting on the lab.
function samplePreview(s, kind, href){
  var adv=d.rep(s.advisor), blk=s.block?(d.by('blocks', s.block)||{}):{}, crop=s.crop||blk.crop;
  return { eyebrow:kind, title:blk.name||d.farmer(s.farmer).farm||d.farmer(s.farmer).name,
    meta:[s.date? { icon:'calendar', text:'Taken '+BB.date(s.date), tip:'Taken' } : null].concat(mFarmer(s.farmer)).concat([
      crop? { icon:'sprout', text:crop, tip:'Crop' } : null,
      adv&&adv.name? { initials:initialsOf(adv.name), color:adv.colour, text:adv.name, tip:'Advisor' } : null]),
    stats:[{ l:'Status', html:BB.statusBadge(s.status) }].concat(s.flag? [{ l:'Flag', v:s.flag }] : []),
    actions:[go('Farm record', farmHref(s.farmer)), go('Open '+kind.toLowerCase()+'s', href, true)] };
}
if(!liveBoard) orders.filter(function(o){ return o.status==='Pending'||o.status==='Awaiting stock'; }).forEach(function(o){
  actions.push({
    kind: o.status==='Awaiting stock'?'Awaiting stock':'New order',
    what: o.ref+' · '+d.farmer(o.farmer).name,
    val: BB.money(d.orderValue(o)),
    badge: o.status,
    href: 'orders.html',
    pop: function(){ return orderPreview(o); }
  });
});
if(!liveBoard) lowItems.forEach(function(i){
  actions.push({
    kind: i.qty===0?'Out of stock':'Low stock',
    what: d.product(i.prod).name+' · '+d.depot(i.depot).name,
    val: i.qty+' / '+i.reorder+' '+(d.product(i.prod).unit||''),
    badge: i.qty===0?'Out of stock':'Low stock',
    href: 'stock.html',
    pop: function(){ return stockPreview(i); }
  });
});
if(!liveBoard) soil.filter(function(s){ return s.status==='New'||s.status==='Awaiting lab'; }).forEach(function(s){
  actions.push({ kind:'Soil sample', what:d.farmer(s.farmer).name+' · '+s.status, val:'', badge:s.status, href:'bioanalyze-soil.html', pop:function(){ return samplePreview(s, 'Soil sample', 'bioanalyze-soil.html'); } });
});
if(!liveBoard) leaf.filter(function(l){ return l.status==='New'||l.status==='Awaiting lab'; }).forEach(function(l){
  actions.push({ kind:'Leaf sample', what:d.farmer(l.farmer).name+' · '+l.status, val:'', badge:l.status, href:'bioanalyze-leaf.html', pop:function(){ return samplePreview(l, 'Leaf sample', 'bioanalyze-leaf.html'); } });
});

var actBody;
if(!actions.length){
  actBody = '<div class="empty"><div class="big">'+BB.icon('check')+'</div>Nothing waiting — the board is clear.</div>';
} else {
  actBody = '<div class="scroll tall"><table class="bb"><thead><tr><th>What</th><th>Detail</th><th class="num">Value</th><th class="num">Status</th></tr></thead><tbody>';
  actions.forEach(function(a, k){
    actBody += '<tr class="click" data-act="'+k+'">'+
      '<td style="white-space:nowrap;"><b style="color:var(--green-dark);font-size:.82rem;">'+BB.esc(a.kind)+'</b></td>'+
      '<td>'+BB.esc(a.what)+'</td>'+
      '<td class="num muted">'+BB.esc(a.val)+'</td>'+
      '<td class="num">'+BB.statusBadge(a.badge)+'</td>'+
    '</tr>';
  });
  actBody += '</tbody></table></div>';
}
var actPanel = panel('Needs action', 'tap a row to open it', '<span class="badge '+(actions.length?'b-warn':'b-ok')+'">'+actions.length+' open</span>', actBody);

// Blending sits beside the action list on the portal's own figures. BioBrix do not keep blending
// in Sage, so a live client seat does not get demonstration jobs.
if(!liveBoard){
  var blendBody;
  if(!blending.length){ blendBody = '<div class="empty">No blending jobs on the floor.</div>'; }
  else {
    blendBody = '<div class="dep-list" style="border-top:0;">';
    blending.slice().sort(function(a,b){ return String(a.due).localeCompare(String(b.due)); }).forEach(function(b){
      blendBody += '<div class="dep-row" role="button" tabindex="0" data-blend="'+BB.esc(b.id)+'" style="cursor:pointer;"><div style="min-width:0;"><b>'+BB.esc(b.recipe)+'</b>'+
        '<div class="faint" style="font-size:.74rem;">'+BB.esc(b.batch)+' · '+BB.esc(d.depot(b.depot).name.replace(/ Depot$/,''))+' · for '+BB.esc(d.farmer(b['for']).name)+'</div></div>'+
        '<div style="text-align:right;flex:none;">'+BB.statusBadge(b.status)+'<div class="faint" style="font-size:.72rem;margin-top:3px;">due '+BB.shortDate(b.due)+'</div></div></div>';
    });
    blendBody += '</div>';
  }
  html += '<div class="split ops-row">'+actPanel+
    panel('Mixing &amp; blending', blending.length+' job'+(blending.length===1?'':'s')+' across the depots', openLink('depots.html','Depots'), blendBody)+'</div>';
} else {
  html += '<div class="ops-row">'+actPanel+'</div>';
}

// ---- latest orders + deliveries in transit (two columns) ----
var latest = orders.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }).slice(0,5);

var latestBody = '<div class="scroll"><table class="bb"><thead><tr><th>Ref</th><th>Farmer</th><th class="num">Value</th><th class="num">Status</th></tr></thead><tbody>';
if(!latest.length) latestBody += '<tr><td colspan="4"><div class="empty">No orders yet.</div></td></tr>';
latest.forEach(function(o){
  latestBody += '<tr class="click" data-order="'+BB.esc(o.id)+'">'+
    '<td><b style="color:var(--green-dark);">'+BB.esc(o.ref)+'</b></td>'+
    '<td>'+BB.esc(d.farmer(o.farmer).name)+'</td>'+
    '<td class="num">'+BB.money(d.orderValue(o))+'</td>'+
    '<td class="num">'+BB.statusBadge(o.status)+'</td>'+
  '</tr>';
});
latestBody += '</tbody></table></div>';

var transitBody;
if(!inTransit.length){
  transitBody = '<div class="empty">Nothing on the road right now.</div>';
} else {
  transitBody = '<div class="scroll"><table class="bb"><thead><tr><th>Farmer</th><th>Depot</th><th>Transport</th><th class="num">ETA</th></tr></thead><tbody>';
  inTransit.forEach(function(x){
    transitBody += '<tr class="click" data-del="'+BB.esc(x.id)+'">'+
      '<td><b style="color:var(--green-dark);">'+BB.esc(d.farmer(x.farmer).name)+'</b></td>'+
      '<td class="muted">'+BB.esc(d.depot(x.depot).name)+'</td>'+
      '<td class="muted">'+BB.esc(x.transport||'')+'</td>'+
      '<td class="num muted">'+BB.etaHtml(x)+'</td>'+
    '</tr>';
  });
  transitBody += '</tbody></table></div>';
}

html += '<div class="grid g2 ops-row">'+
  panel('Latest orders', 'the five most recent', openLink('orders.html','All'), latestBody)+
  panel('Deliveries in transit', inTransit.length+' on the road', openLink('deliveries.html','All'), transitBody)+
'</div>';

html += '<div style="height:24px;"></div>';

document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>');
chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });

// rows open their record over the board; the record page is a button inside
function onRows(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(tr){ tr.onclick = function(){ var p=fn(tr); if(p) BB.popup(p); }; }); }
onRows('tr.click[data-act]', function(tr){ var a=actions[+tr.getAttribute('data-act')];
  return a && (a.pop ? a.pop() : { eyebrow:'Needs action', title:a.kind, actions:[go('Open full record', a.href, true)] }); });
onRows('tr.click[data-order]', function(tr){ var o=d.by('orders', tr.getAttribute('data-order')); return o && orderPreview(o); });
onRows('tr.click[data-del]', function(tr){ var x=d.by('deliveries', tr.getAttribute('data-del')); return x && deliveryPreview(x); });
onRows('tr.click[data-stock]', function(tr){ var i=inventory[+tr.getAttribute('data-stock')]; return i && stockPreview(i); });
onRows('[data-blend]', function(el){ var b=d.by('blending', el.getAttribute('data-blend')); return b && blendPreview(b); });
Array.prototype.forEach.call(document.querySelectorAll('[data-blend]'), function(el){ el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } }; });
// a product's movement off the ledger, month by month
onRows('tr.click[data-mover]', function(tr){ var x=movers[+tr.getAttribute('data-mover')]; if(!x) return null;
  var ks=Object.keys(x.months).sort().reverse().slice(0,6), lm=(function(){ var t=new Date(); t.setDate(1); t.setMonth(t.getMonth()-1); return x.months[t.toISOString().slice(0,7)]||{}; })();
  return { wide:true, layout:'split', eyebrow:'Product movement', title:x.n,
    meta:[x.c? { icon:'package', text:x.c+(x.pack?' · '+x.pack:''), tip:'Code · pack' } : null],
    stats:[{ l:'This month', v:(Math.round(x.q*10)/10).toLocaleString('en-ZA'), s:'quantity invoiced' }, { l:'Invoiced', v:BB.money(Math.round(x.v)) },
      { l:'Last month', v:(Math.round((lm.qty||0)*10)/10).toLocaleString('en-ZA') },
      { l:'Six months', v:(Math.round(ks.reduce(function(t,k){ return t+((x.months[k]||{}).qty||0); },0)*10)/10).toLocaleString('en-ZA'), s:'quantity invoiced' }],
    table:{ title:'Last six months', columns:['Month','Quantity','Invoiced'], num:[1,2], rows:ks.map(function(k){ var m=x.months[k]||{}, p=k.split('-');
      return { cells:[BB.monthName(+p[1]-1)+' '+p[0], (Math.round((m.qty||0)*10)/10).toLocaleString('en-ZA'), BB.money(Math.round(m.value||0))] }; }) },
    actions:[go('Every product','dispatch.html',true)] }; });
// a depot in the health list opens its card
Array.prototype.forEach.call(document.querySelectorAll('a.dep-row[data-dep]'), function(a){
  a.addEventListener('click', function(e){ if(e.metaKey||e.ctrlKey||e.shiftKey) return; e.preventDefault();
    BB.popup(depotStock(d.depot(a.getAttribute('data-dep')))); });
});


// On a first sign-in there is no cached snapshot yet, so this page draws before the accounting
// data arrives — and would sit there showing sample figures until the next navigation. When the
// data lands, draw it again. Once only.
window.addEventListener('bb:sage', function(){
  try{ if(sessionStorage.getItem('bb_sage_drawn')) return; sessionStorage.setItem('bb_sage_drawn','1'); }catch(e){}
  location.reload();
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
