<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Operations board · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
  .ops-kpi{margin-top:14px;}
  .ops-row{margin-top:16px;}
  .ops-row > .card{display:flex;flex-direction:column;}
  .ops-row > .card > .card-f{margin-top:auto;}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
  .lvl .trk{position:relative;overflow:visible;height:7px;}
  .lvl .trk i{border-radius:4px;}
  .lvl .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--green-darkest);opacity:.45;}
  .dep-list{border-top:1px solid var(--line-soft);}
  .dep-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;border-top:1px solid var(--line-soft);transition:background .12s;}
  .dep-row:first-child{border-top:0;}
  .dep-row:hover{background:#f3f8ec;}
  .dep-row b{color:var(--green-dark);font-size:.88rem;}
  @media(max-width:480px){ .dep-row{padding:10px 14px;flex-wrap:wrap;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;
// Is this a BioBrix seat on BioBrix's own figures? If so the board is built from the ledger.
var liveBoard = !!(BB.auth && BB.auth.tenantLive && BB.auth.tenantLive() && !(BB.auth.isFreedomHub && BB.auth.isFreedomHub()));

// ---- source data ----
var orders = d.all('orders');
var inventory = d.all('inventory');
var deliveries = d.all('deliveries');
var blending = d.all('blending');
var depots = d.all('depots');
var reps = d.all('reps');
var soil = d.all('soil');
var leaf = d.all('leaf');

// ---- top stat computations ----
var openOrders = orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
var pipelineVal = openOrders.reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var confirmedVal = orders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; }).reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var awaitingStock = orders.filter(function(o){ return o.status==='Awaiting stock'; }).length;
var lowItems = inventory.filter(function(i){ return i.qty<i.reorder; });
var inTransit = deliveries.filter(function(x){ return x.status==='In transit'; });

// ---- render ----
var html = '';
var chartJobs = [];
// A panel in the conventions' shape: header (title, context, actions) then the body.
function panel(title, sub, actions, body, extra){
  return '<div class="card'+(extra?' '+extra:'')+'"><div class="card-h"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(actions||'')+'</div>'+body+'</div>';
}
function openLink(href, label){
  if(BB.auth && typeof BB.auth.canPage==='function' && !BB.auth.canPage(href)) return '';
  return '<a class="btn ghost sm" href="'+href+'">'+(label||'Open')+BB.icon('chevron')+'</a>';
}
// stock level against reorder: the reorder level sits at the midpoint of the track
function levelCell(qty, reorder){
  var cap = Math.max(1, (reorder||0)*2), pct = Math.max(0, Math.min(100, qty/cap*100));
  var col = qty<=0 ? 'var(--red)' : (qty<reorder ? 'var(--amber)' : 'var(--green-bright)');
  return '<div class="bar-cell lvl"><div class="trk"><i style="width:'+pct+'%;background:'+col+'"></i><b title="reorder level"></b></div></div>';
}

var headActions = [
  {href:'orders.html', ic:'receipt', t:'Orders'},
  {href:'stock.html', ic:'package', t:'Stock'},
  {href:'deliveries.html', ic:'truck', t:'Deliveries'}
].filter(function(a){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(a.href); });

html += '<section class="page-head row between" style="gap:16px;">'+
  '<div><div class="eyebrow">Operations</div>'+
  '<h1>The board</h1>'+
  '<p>'+(liveBoard
    ? 'The whole business on one screen, straight from your accounting system — what has been invoiced and received, who is behind, who is selling it and what is going out the door. Read three times a day.'
    : 'The whole business on one screen — sales, stock, blending and deliveries, live as the team works. Everything here is saved on this device and syncs when you have signal.')+'</p></div>'+
  (headActions.length ? '<div class="row" style="gap:8px;">'+headActions.map(function(a,i){ return '<a class="btn'+(i?' ghost':'')+'" href="'+a.href+'">'+BB.icon(a.ic)+a.t+'</a>'; }).join('')+'</div>' : '')+
'</section>';

// ---- top stat row ----
// With the accounting system connected, the top of the board is the real trading picture.
// Orders, stock and blending do not exist in Sage, so they sit lower down and are marked.
var sg = BB.data.sage && BB.data.sage();
var STATS;
if(sg && sg.live){
  var si=sg.invoices||[], sp=sg.payments||[], sc=sg.customers||[];
  var op=function(i){ return i.outstanding!=null?i.outstanding:(i.status==='Paid'?0:(i.amount||0)); };
  var ym=new Date().toISOString().slice(0,7);
  var t0=new Date(new Date().toISOString().slice(0,10));
  var dov=function(i){ return i.dueDate? Math.round((t0-new Date(i.dueDate))/86400000):0; };
  var invM=si.filter(function(i){return (i.date||'').slice(0,7)===ym;});
  var payM=sp.filter(function(x){return (x.date||'').slice(0,7)===ym;});
  var owed=si.reduce(function(t,i){return t+op(i);},0);
  var od=si.filter(function(i){return i.status==='Overdue';});
  var a90=si.filter(function(i){ return op(i)>0.5 && dov(i)>=90; });
  var lim=sc.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; });
  STATS = [
    {l:'Invoiced this month', v:BB.money(invM.reduce(function(t,i){return t+(i.amount||0);},0)), s:invM.length+' invoices', cls:''},
    {l:'Received this month', v:BB.money(payM.reduce(function(t,x){return t+(x.amount||0);},0)), s:payM.length+' receipts', cls:''},
    {l:'Owed to you', v:BB.money(owed), s:si.filter(function(i){return op(i)>0.5;}).length+' open invoices', cls:''},
    {l:'Overdue', v:BB.money(od.reduce(function(t,i){return t+op(i);},0)), s:od.length+' past due', cls:od.length?'bad':''},
    {l:'90 days and older', v:BB.money(a90.reduce(function(t,i){return t+op(i);},0)), s:a90.length+' invoices', cls:a90.length?'warn':''},
    {l:'Over their limit', v:lim.length, s:'accounts to watch', cls:lim.length?'warn':''}
  ];
} else {
  STATS = [
    {l:'Open pipeline', v:BB.money(pipelineVal), s:openOrders.length+' forecast + pending', cls:''},
    {l:'Confirmed this season', v:BB.money(confirmedVal), s:'won + delivered', cls:''},
    {l:'Awaiting stock', v:awaitingStock, s:'orders held on stock', cls:awaitingStock>0?'warn':''},
    {l:'Below reorder', v:lowItems.length, s:'stock lines low', cls:lowItems.length>0?'bad':''},
    {l:'In transit', v:inTransit.length, s:'deliveries on the road', cls:''},
    {l:'Blending jobs', v:blending.length, s:'across depots', cls:''}
  ];
}
html += '<div class="grid g6 ops-kpi">';
STATS.forEach(function(st){
  html += '<div class="stat'+(st.cls?' '+st.cls:'')+'">'+
    '<div class="l">'+st.l+'</div>'+
    '<div class="v">'+st.v+'</div>'+
    '<div class="s">'+BB.esc(st.s)+'</div></div>';
});
html += '</div>';

// ---- On their own figures, this board is built from the ledger --------------------------------
// The four sections that used to live here (sales by rep, reported-vs-invoiced, stock health, and
// the order queue) all ran on the portal's own orders and stock. BioBrix keep neither in Sage, so
// on a live client seat they would render as a wall of zeros. These replace them with what their
// accounting system actually knows.
var sgB = d.sage && d.sage();
if(liveBoard && sgB && sgB.live){
  var plB = d.plan ? d.plan() : {agents:{}};
  var invB = (sgB.invoices||[]).filter(function(i){ return i.kind!=='opening'; });
  var custB = sgB.customers||[];
  var byIdB = {}; custB.forEach(function(c){ byIdB[c.id]=c; });
  var ymB = new Date().toISOString().slice(0,7);
  var repsB = (sgB.reps||[]);
  var agentName = function(k){
    if(!k) return 'Not allocated to an agent';
    var pr = (d.allUnscoped('reps')||[]).find(function(r){ return r.id===k; });
    if(pr) return pr.name;
    var m = k.indexOf('sage_rep_')===0 && repsB.find(function(r){ return 'sage_rep_'+r.id===k; });
    return m? m.name : k;
  };
  var agentOf = function(c){
    var set = plB.agents && plB.agents['sage_'+c.id]; if(set) return set;
    return c.sageRep? ('sage_rep_'+c.sageRep) : null;
  };

  // --- this month, by agent ---
  var byAgent = {}, monthTotal = 0;
  invB.filter(function(i){ return (i.date||'').slice(0,7)===ymB; }).forEach(function(i){
    var c = byIdB[i.customer]||{}; var k = agentOf(c) || '';
    byAgent[k] = byAgent[k] || {v:0,n:0}; byAgent[k].v += (i.amount||0); byAgent[k].n++; monthTotal += (i.amount||0);
  });
  var agentRows = Object.keys(byAgent).map(function(k){ return {k:k, v:byAgent[k].v, n:byAgent[k].n}; })
    .sort(function(a,b){ return b.v-a.v; });

  // --- biggest movers, in litres and kilograms ---
  var movers = (sgB.products||[]).map(function(pp){
    var m=(pp.months||{})[ymB]; return { n:pp.name, c:pp.code, q:(m&&m.qty)||0, v:(m&&m.value)||0 };
  }).filter(function(x){ return x.q>0; }).sort(function(a,b){ return b.q-a.q; }).slice(0,10);

  var agentBody = !agentRows.length ? '<div class="empty">Nothing invoiced yet this month.</div>'
    : '<div class="card-p"><div id="chAgent"></div></div>'+
      (byAgent[''] ? '<div class="card-f">'+BB.money(Math.round(byAgent[''].v))+' is not allocated to anyone yet. '+
        'Allocate those accounts once in <a href="sales-report.html?view=customer" style="color:var(--green-dark);font-weight:600;">Sales → By customer</a> and every report here, and the commission, follows.</div>' : '');
  if(agentRows.length){
    var agentPal = ['#3f6b28','#c77d17','#2f6f9e','#7d4f9a','#a3533f','#22431a','#68a53e'];
    chartJobs.push(function(){ BB.chart.hbar('#chAgent', { money:true, rows:agentRows.map(function(x,ix){
      return { label:agentName(x.k), sub:x.n+' invoice'+(x.n===1?'':'s'), value:Math.round(x.v), color:x.k?agentPal[ix%agentPal.length]:'#6b7a5e' }; }) }); });
  }

  var moverBody = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th class="num">Quantity</th><th class="num">Invoiced</th></tr></thead><tbody>';
  if(!movers.length){ moverBody += '<tr><td colspan="4"><div class="empty">Nothing invoiced yet this month.</div></td></tr>'; }
  movers.forEach(function(x){
    moverBody += '<tr><td><b style="color:var(--green-dark);">'+BB.esc(x.n)+'</b></td><td class="muted">'+BB.esc(x.c||'')+'</td>'+
      '<td class="num">'+(Math.round(x.q*10)/10).toLocaleString('en-ZA')+'</td><td class="num">'+BB.money(Math.round(x.v))+'</td></tr>';
  });
  moverBody += '</tbody></table></div>';

  html += '<div class="grid g2 ops-row">'+
    panel('This month, by agent', 'invoiced, from your accounting system', BB.liveChip(), agentBody)+
    panel('Biggest movers this month', 'in the quantity they were invoiced', openLink('dispatch.html','Every product'), moverBody)+
  '</div>';

  // --- six months of invoiced vs received, beside what is owed by age (all counted off the ledger) ---
  if((sgB.invoices||[]).length){
    var M6 = (function(){ var out=[], t=new Date(); t.setDate(1); for(var k=5;k>=0;k--){ var x=new Date(t.getFullYear(), t.getMonth()-k, 1); out.push({ ym:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'), l:BB.monthName(x.getMonth()) }); } return out; })();
    var invBy = M6.map(function(m){ return invB.filter(function(i){ return (i.date||'').slice(0,7)===m.ym; }).reduce(function(t,i){ return t+(i.amount||0); },0); });
    var payBy = M6.map(function(m){ return (sgB.payments||[]).filter(function(x){ return (x.date||'').slice(0,7)===m.ym; }).reduce(function(t,x){ return t+(x.amount||0); },0); });
    var t0g = new Date(new Date().toISOString().slice(0,10));
    var openG = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
    var ageG = [{label:'Current',value:0,color:'#3f6b28'},{label:'1–30 days',value:0,color:'#8fbf5a'},{label:'31–60 days',value:0,color:'#c77d17'},{label:'61–90 days',value:0,color:'#a3533f'},{label:'90+ days',value:0,color:'#b8382a'}];
    (sgB.invoices||[]).forEach(function(i){ var v=openG(i); if(v<=0.5) return; var dd=i.dueDate?Math.round((t0g-new Date(i.dueDate))/86400000):0;
      ageG[dd<=0?0:dd<=30?1:dd<=60?2:dd<=90?3:4].value+=v; });
    html += '<div class="split ops-row">'+
      panel('Invoiced vs received', 'last six months · from your accounting system', BB.liveChip(), '<div class="card-p"><div id="chTrade"></div></div>')+
      panel('What is owed, by age', 'open invoices', '', '<div class="card-p"><div id="chAgeOps"></div></div>')+
    '</div>';
    chartJobs.push(function(){ BB.chart.bar('#chTrade', { labels:M6.map(function(m){ return m.l; }), money:true, height:230, table:true,
      series:[{name:'Invoiced',values:invBy,color:'#3f6b28'},{name:'Received',values:payBy,color:'#8fbf5a'}] }); });
    chartJobs.push(function(){ BB.chart.donut('#chAgeOps', { rows:ageG, money:true, centreLabel:'owed' }); });
  }
} else {
// ---- sales by rep ----
var repRows = reps.map(function(r){
  var mine = orders.filter(function(o){ return o.rep===r.id; });
  var val = mine.reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  var won = mine.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; }).reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  return { rep:r, val:val, won:won, cnt:mine.length };
}).sort(function(a,b){ return b.val-a.val; });

// ---- sales vs actuals (invoiced-vs-sale reconciliation) ----
// Reported = what reps count as sold (Confirmed + Delivered orders).
// Actual   = orders that are actually invoiced (real revenue).
// Gap      = delivered/counted but not yet invoiced — the discrepancy.
var recRows = reps.map(function(r){
  var repOrders = orders.filter(function(o){ return o.rep===r.id; });
  var reported = repOrders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; })
    .reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  var actual = repOrders.filter(function(o){ return (o.status==='Confirmed'||o.status==='Delivered') && d.orderInvoiced(o.id); })
    .reduce(function(s,o){ return s+d.orderValue(o); }, 0);
  return { rep:r, reported:reported, actual:actual, gap:reported-actual };
}).sort(function(a,b){ return b.gap-a.gap; });
var recTot = recRows.reduce(function(t,x){ t.reported+=x.reported; t.actual+=x.actual; t.gap+=x.gap; return t; }, {reported:0,actual:0,gap:0});

var recBody = '<div class="scroll"><table class="bb"><thead><tr>'+
  '<th>Rep</th><th class="num">Reported</th><th class="num">Invoiced</th><th class="num">Gap</th></tr></thead><tbody>';
recRows.forEach(function(x){
  recBody += '<tr>'+
    '<td><span class="row" style="gap:8px;flex-wrap:nowrap;"><span class="sw" style="background:'+BB.esc(x.rep.colour)+';"></span><b style="color:var(--green-dark);white-space:nowrap;">'+BB.esc(x.rep.name)+'</b></span></td>'+
    '<td class="num">'+BB.money(x.reported)+'</td>'+
    '<td class="num">'+BB.money(x.actual)+'</td>'+
    '<td class="num"><span class="badge '+(x.gap>0?'b-warn':'b-ok')+'">'+BB.money(x.gap)+'</span></td>'+
  '</tr>';
});
recBody += '</tbody><tfoot><tr><td>Total</td><td class="num">'+BB.money(recTot.reported)+'</td><td class="num">'+BB.money(recTot.actual)+'</td>'+
  '<td class="num"><span class="badge '+(recTot.gap>0?'b-warn':'b-ok')+'">'+BB.money(recTot.gap)+'</span></td></tr></tfoot></table></div>'+
  '<div class="card-f">The <b>gap</b> is product reps have delivered and counted as a sale that has not been invoiced yet. Only invoiced product is actual revenue, so the gap is exactly what makes the rep numbers and the finance numbers differ.</div>';

html += '<div class="grid g2 ops-row">'+
  panel('Sales by rep', 'all orders this season · confirmed and still in the pipeline', openLink('orders.html','Orders'), '<div class="card-p"><div id="chReps"></div></div>')+
  panel('Sales vs actuals', 'reported by reps vs invoiced', '', recBody)+
'</div>';
chartJobs.push(function(){ BB.chart.hbar('#chReps', { money:true,
  legend:[{name:'Confirmed + delivered',color:'#22431a'},{name:'Pipeline',color:'#68a53e'}],
  rows:repRows.map(function(x){ return { label:x.rep.name, sub:x.rep.region+' · '+x.cnt+' order'+(x.cnt===1?'':'s'),
    parts:[{name:'Confirmed + delivered',value:x.won,color:'#22431a'},{name:'Pipeline',value:x.val-x.won,color:'#68a53e'}] }; }) }); });

// ---- stock vs reorder, beside stock health by depot ----
var stockRows = inventory.slice().sort(function(a,b){ return (a.qty/(a.reorder||1))-(b.qty/(b.reorder||1)); });
var stockBody = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Depot</th><th class="num">On hand</th><th class="num">Reorder at</th><th style="min-width:160px;">Level</th><th>Status</th></tr></thead><tbody>';
if(!stockRows.length) stockBody += '<tr><td colspan="6"><div class="empty">No stock lines yet.</div></td></tr>';
stockRows.forEach(function(i){
  var p = d.product(i.prod), st = i.qty<=0?'Out of stock':(i.qty<i.reorder?'Low stock':'In stock');
  stockBody += '<tr class="click" data-href="stock.html">'+
    '<td><b style="color:var(--green-dark);white-space:nowrap;">'+BB.esc(p.name)+'</b></td>'+
    '<td class="muted">'+BB.esc(d.depot(i.depot).name.replace(/ Depot$/,''))+'</td>'+
    '<td class="num"><b>'+BB.num(i.qty)+'</b> <span class="faint" style="font-size:.72rem;">'+BB.esc(p.unit||'')+'</span></td>'+
    '<td class="num muted">'+BB.num(i.reorder)+'</td>'+
    '<td>'+levelCell(i.qty, i.reorder)+'</td>'+
    '<td>'+BB.statusBadge(st)+'</td></tr>';
});
stockBody += '</tbody></table></div><div class="card-f">The mark on each bar is the reorder level. Lowest first.</div>';

var depotList = '<div class="dep-list">';
var depOk = [], depLow = [];
depots.forEach(function(dep){
  var items = inventory.filter(function(i){ return i.depot===dep.id; });
  var low = items.filter(function(i){ return i.qty<i.reorder; });
  depOk.push(items.length-low.length); depLow.push(low.length);
  depotList += '<a class="dep-row" href="stock.html">'+
    '<div style="min-width:0;"><b>'+BB.esc(dep.name)+'</b><div class="faint" style="font-size:.74rem;">'+BB.esc(dep.region)+' · '+items.length+' lines</div></div>'+
    '<div class="row" style="gap:8px;flex:none;">'+(low.length?'<span class="badge b-bad">'+low.length+' low</span>':'<span class="badge b-ok">All above</span>')+BB.statusBadge(dep.status)+'</div>'+
  '</a>';
});
depotList += '</div>';

html += '<div class="split ops-row">'+
  panel('Stock vs reorder', inventory.length+' lines across '+depots.length+' depots', openLink('stock.html','Stock'), stockBody)+
  panel('Stock health by depot', 'lines above and below reorder', '', '<div class="card-p"><div id="chDepots"></div></div>'+depotList)+
'</div>';
chartJobs.push(function(){ BB.chart.bar('#chDepots', { labels:depots.map(function(x){ return x.name.replace(/ Depot$/,''); }), stacked:true, height:190, table:true,
  max:Math.max(4, Math.ceil(Math.max.apply(null, depOk.map(function(v,k){ return v+depLow[k]; }).concat([0]))/4)*4),
  series:[{name:'Above reorder',values:depOk,color:'#3f6b28'},{name:'Below reorder',values:depLow,color:'#b8382a'}] }); });

}

// ---- needs action ----
var actions = [];
// On a live client seat this list is built from the ledger: who is over their limit, what is
// ninety days old, who is on hold. The portal-side order and sample queues below are empty for
// them by design — BioBrix keep neither in Sage.
if(liveBoard && sgB && sgB.live){
  var invN = (sgB.invoices||[]).filter(function(i){ return i.kind!=='opening'; });
  var custN = sgB.customers||[];
  var byIdN = {}; custN.forEach(function(c){ byIdN[c.id]=c; });
  var openN = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
  var t0N = new Date(new Date().toISOString().slice(0,10));
  var overN = function(i){ return i.dueDate ? Math.round((t0N-new Date(i.dueDate))/86400000) : 0; };
  invN.filter(function(i){ return openN(i)>0.5 && overN(i)>=90; })
    .sort(function(a,b){ return overN(b)-overN(a); }).slice(0,8).forEach(function(i){
      actions.push({ kind:'90+ days', what:(byIdN[i.customer]||{name:'—'}).name+' · '+(i.label||i.ref||''),
        val:BB.money(Math.round(openN(i))), badge:'Overdue', href:'finance.html?show=overdue' });
    });
  custN.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; })
    .sort(function(a,b){ return (b.balance-b.creditLimit)-(a.balance-a.creditLimit); }).slice(0,8).forEach(function(c){
      actions.push({ kind:'Over limit', what:c.name, val:BB.money(Math.round(c.balance))+' of '+BB.money(Math.round(c.creditLimit)),
        badge:'Over limit', href:'farms.html?show=overlimit' });
    });
  custN.filter(function(c){ return c.onHold; }).slice(0,8).forEach(function(c){
    actions.push({ kind:'On hold', what:c.name, val:BB.money(Math.round(c.balance||0)), badge:'On hold', href:'farms.html?show=accounts' });
  });
}
if(!liveBoard) orders.filter(function(o){ return o.status==='Pending'||o.status==='Awaiting stock'; }).forEach(function(o){
  actions.push({
    kind: o.status==='Awaiting stock'?'Awaiting stock':'New order',
    what: o.ref+' · '+d.farmer(o.farmer).name,
    val: BB.money(d.orderValue(o)),
    badge: o.status,
    href: 'orders.html'
  });
});
if(!liveBoard) lowItems.forEach(function(i){
  actions.push({
    kind: i.qty===0?'Out of stock':'Low stock',
    what: d.product(i.prod).name+' · '+d.depot(i.depot).name,
    val: i.qty+' / '+i.reorder+' '+(d.product(i.prod).unit||''),
    badge: i.qty===0?'Out of stock':'Low stock',
    href: 'stock.html'
  });
});
if(!liveBoard) soil.filter(function(s){ return s.status==='New'||s.status==='Awaiting lab'; }).forEach(function(s){
  actions.push({ kind:'Soil sample', what:d.farmer(s.farmer).name+' · '+s.status, val:'', badge:s.status, href:'bioanalyze-soil.html' });
});
if(!liveBoard) leaf.filter(function(l){ return l.status==='New'||l.status==='Awaiting lab'; }).forEach(function(l){
  actions.push({ kind:'Leaf sample', what:d.farmer(l.farmer).name+' · '+l.status, val:'', badge:l.status, href:'bioanalyze-leaf.html' });
});

var actBody;
if(!actions.length){
  actBody = '<div class="empty"><div class="big">'+BB.icon('check')+'</div>Nothing waiting — the board is clear.</div>';
} else {
  actBody = '<div class="scroll tall"><table class="bb"><thead><tr><th>What</th><th>Detail</th><th class="num">Value</th><th class="num">Status</th></tr></thead><tbody>';
  actions.forEach(function(a){
    actBody += '<tr class="click" data-href="'+BB.esc(a.href)+'">'+
      '<td style="white-space:nowrap;"><b style="color:var(--green-dark);font-size:.82rem;">'+BB.esc(a.kind)+'</b></td>'+
      '<td>'+BB.esc(a.what)+'</td>'+
      '<td class="num muted">'+BB.esc(a.val)+'</td>'+
      '<td class="num">'+BB.statusBadge(a.badge)+'</td>'+
    '</tr>';
  });
  actBody += '</tbody></table></div>';
}
var actPanel = panel('Needs action', 'tap a row to open it', '<span class="badge '+(actions.length?'b-warn':'b-ok')+'">'+actions.length+' open</span>', actBody);

// Blending sits beside the action list on the portal's own figures. BioBrix do not keep blending
// in Sage, so a live client seat does not get demonstration jobs.
if(!liveBoard){
  var blendBody;
  if(!blending.length){ blendBody = '<div class="empty">No blending jobs on the floor.</div>'; }
  else {
    blendBody = '<div class="dep-list" style="border-top:0;">';
    blending.slice().sort(function(a,b){ return String(a.due).localeCompare(String(b.due)); }).forEach(function(b){
      blendBody += '<div class="dep-row"><div style="min-width:0;"><b>'+BB.esc(b.recipe)+'</b>'+
        '<div class="faint" style="font-size:.74rem;">'+BB.esc(b.batch)+' · '+BB.esc(d.depot(b.depot).name.replace(/ Depot$/,''))+' · for '+BB.esc(d.farmer(b['for']).name)+'</div></div>'+
        '<div style="text-align:right;flex:none;">'+BB.statusBadge(b.status)+'<div class="faint" style="font-size:.72rem;margin-top:3px;">due '+BB.shortDate(b.due)+'</div></div></div>';
    });
    blendBody += '</div>';
  }
  html += '<div class="split ops-row">'+actPanel+
    panel('Mixing &amp; blending', blending.length+' job'+(blending.length===1?'':'s')+' across the depots', openLink('depots.html','Depots'), blendBody)+'</div>';
} else {
  html += '<div class="ops-row">'+actPanel+'</div>';
}

// ---- latest orders + deliveries in transit (two columns) ----
var latest = orders.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }).slice(0,5);

var latestBody = '<div class="scroll"><table class="bb"><thead><tr><th>Ref</th><th>Farmer</th><th class="num">Value</th><th class="num">Status</th></tr></thead><tbody>';
if(!latest.length) latestBody += '<tr><td colspan="4"><div class="empty">No orders yet.</div></td></tr>';
latest.forEach(function(o){
  latestBody += '<tr class="click" data-href="orders.html">'+
    '<td><b style="color:var(--green-dark);">'+BB.esc(o.ref)+'</b></td>'+
    '<td>'+BB.esc(d.farmer(o.farmer).name)+'</td>'+
    '<td class="num">'+BB.money(d.orderValue(o))+'</td>'+
    '<td class="num">'+BB.statusBadge(o.status)+'</td>'+
  '</tr>';
});
latestBody += '</tbody></table></div>';

var transitBody;
if(!inTransit.length){
  transitBody = '<div class="empty">Nothing on the road right now.</div>';
} else {
  transitBody = '<div class="scroll"><table class="bb"><thead><tr><th>Farmer</th><th>Depot</th><th>Transport</th><th class="num">ETA</th></tr></thead><tbody>';
  inTransit.forEach(function(x){
    transitBody += '<tr class="click" data-href="deliveries.html">'+
      '<td><b style="color:var(--green-dark);">'+BB.esc(d.farmer(x.farmer).name)+'</b></td>'+
      '<td class="muted">'+BB.esc(d.depot(x.depot).name)+'</td>'+
      '<td class="muted">'+BB.esc(x.transport||'')+'</td>'+
      '<td class="num muted">'+BB.date(x.eta)+'</td>'+
    '</tr>';
  });
  transitBody += '</tbody></table></div>';
}

html += '<div class="grid g2 ops-row">'+
  panel('Latest orders', 'the five most recent', openLink('orders.html','All'), latestBody)+
  panel('Deliveries in transit', inTransit.length+' on the road', openLink('deliveries.html','All'), transitBody)+
'</div>';

html += '<div style="height:24px;"></div>';

document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>');
chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });

// row navigation
Array.prototype.forEach.call(document.querySelectorAll('tr.click[data-href]'), function(tr){
  tr.onclick = function(){ location.href = tr.getAttribute('data-href'); };
});


// On a first sign-in there is no cached snapshot yet, so this page draws before the accounting
// data arrives — and would sit there showing sample figures until the next navigation. When the
// data lands, draw it again. Once only.
window.addEventListener('bb:sage', function(){
  try{ if(sessionStorage.getItem('bb_sage_drawn')) return; sessionStorage.setItem('bb_sage_drawn','1'); }catch(e){}
  location.reload();
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
