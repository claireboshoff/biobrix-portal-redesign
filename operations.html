<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Operations board · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
  .ops-kpi{margin-top:14px;}
  .ops-row{margin-top:16px;}
  .ops-row > .card{display:flex;flex-direction:column;}
  .ops-row > .card > .card-f{margin-top:auto;}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
  .lvl .trk{position:relative;overflow:visible;height:7px;}
  .lvl .trk i{border-radius:4px;}
  .lvl .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--green-darkest);opacity:.45;}
  .dep-list{border-top:1px solid var(--line-soft);}
  .dep-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;border-top:1px solid var(--line-soft);transition:background .12s;}
  .dep-row:first-child{border-top:0;}
  .dep-row:hover{background:#f3f8ec;}
  .dep-row b{color:var(--green-dark);font-size:.88rem;}
  @media(max-width:480px){ .dep-row{padding:10px 14px;flex-wrap:wrap;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'ops', back:'index.html' });

var d = BB.data;
// Is this a BioBrix seat on BioBrix's own figures? If so the board is built from the ledger.
var liveBoard = !!(BB.auth && BB.auth.tenantLive && BB.auth.tenantLive() && !(BB.auth.isFreedomHub && BB.auth.isFreedomHub()));

// ---- source data ----
var orders = d.all('orders');
var inventory = d.all('inventory');
var deliveries = d.all('deliveries');
var blending = d.all('blending');
var depots = d.all('depots');
var reps = d.all('reps');
var soil = d.all('soil');
var leaf = d.all('leaf');

// ---- top stat computations ----
var openOrders = orders.filter(function(o){ return o.status==='Forecast'||o.status==='Pending'; });
var pipelineVal = openOrders.reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var confirmedVal = orders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; }).reduce(function(s,o){ return s+d.orderValue(o); }, 0);
var awaitingStock = orders.filter(function(o){ return o.status==='Awaiting stock'; }).length;
var lowItems = inventory.filter(function(i){ return i.qty<i.reorder; });
var inTransit = deliveries.filter(function(x){ return x.status==='In transit'; });

// ---- render ----
var html = '';
var chartJobs = [];
// A panel in the conventions' shape: header (title, context, actions) then the body.
function panel(title, sub, actions, body, extra){
  return '<div class="card'+(extra?' '+extra:'')+'"><div class="card-h"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(actions||'')+'</div>'+body+'</div>';
}
function openLink(href, label){
  if(BB.auth && typeof BB.auth.canPage==='function' && !BB.auth.canPage(href)) return '';
  return '<a class="btn ghost sm" href="'+href+'">'+(label||'Open')+BB.icon('chevron')+'</a>';
}
// stock level against reorder: the reorder level sits at the midpoint of the track
function levelCell(qty, reorder){
  var cap = Math.max(1, (reorder||0)*2), pct = Math.max(0, Math.min(100, qty/cap*100));
  var col = qty<=0 ? 'var(--red)' : (qty<reorder ? 'var(--amber)' : 'var(--green-bright)');
  return '<div class="bar-cell lvl"><div class="trk"><i style="width:'+pct+'%;background:'+col+'"></i><b title="reorder level"></b></div></div>';
}

// ---- popups: what sits behind a click (BB.popup) ----
function can(href){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }
function go(label, href, primary){ return href && can(href) ? { label:label, href:href, primary:!!primary } : null; }
function farmHref(fid){ return fid && can('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(fid) : null; }
function depShort(id){ return String(d.depot(id).name||'').replace(/ Depot$/,''); }
function stockStatus(i){ return i.qty<=0?'Out of stock':(i.qty<i.reorder?'Low stock':'In stock'); }
function badgeCell(s){ return { html:BB.statusBadge(s) }; }
// long lists: keep the biggest n, and say so
function cap(rows, n, noun){ return rows.length>n ? { rows:rows.slice(0,n), note:'Showing the '+n+' largest of '+rows.length+' '+noun+'.' } : { rows:rows, note:null }; }
function orderTable(list){
  return { columns:['Order','Farmer','Status','Value'], num:[3], rows:list.slice().sort(function(a,b){ return d.orderValue(b)-d.orderValue(a); }).map(function(o){
    return { cells:[{ html:'<span style="white-space:nowrap">'+BB.esc(o.ref)+'</span>' }, d.farmer(o.farmer).name, badgeCell(o.status), BB.money(d.orderValue(o))], href:farmHref(o.farmer) }; }) };
}
function lineTable(list, withDepot){
  return { columns:['Product'].concat(withDepot?['Depot']:[]).concat(['On hand','Reorder at','Status']), num:withDepot?[2,3]:[1,2],
    rows:list.slice().sort(function(a,b){ return (a.qty/(a.reorder||1))-(b.qty/(b.reorder||1)); }).map(function(i){ var p=d.product(i.prod);
      return { cells:[p.name].concat(withDepot?[depShort(i.depot)]:[]).concat([BB.num(i.qty)+' '+(p.unit||''), BB.num(i.reorder), badgeCell(stockStatus(i))]) }; }) };
}
function orderPreview(o, eyebrow){
  var f=d.farmer(o.farmer), r=d.rep(o.rep)||{}, dl=deliveries.filter(function(x){ return x.order===o.id; })[0];
  var stats=[{l:'Value', v:BB.money(d.orderValue(o)), s:(o.lines||[]).length+' line'+((o.lines||[]).length===1?'':'s')},
    {l:'Status', html:BB.statusBadge(o.status), s:'raised '+BB.date(o.date)}, {l:'Rep', v:r.name||'—'}, {l:'Depot', v:o.depot?depShort(o.depot):'—'}];
  if(dl) stats.push({l:'Delivery', html:BB.statusBadge(dl.status), s:'ETA '+BB.date(dl.eta)});
  return { eyebrow:eyebrow||'Order', title:o.ref+' · '+f.name, sub:(f.farm&&f.farm!==f.name?f.farm+' · ':'')+'deliver in '+BB.monthName(o.deliverMonth),
    stats:stats, table:{ columns:['Product','Quantity','Value'], num:[1,2], rows:(o.lines||[]).map(function(l){ var p=d.product(l.prod);
      return { cells:[p.name, BB.num(l.qty)+' '+(p.unit||''), BB.money((p.price||0)*(l.qty||0))] }; }) },
    actions:[go('Open full record','orders.html',true), go('Open the farm', farmHref(o.farmer))] };
}
function stockPreview(i, eyebrow){
  var p=d.product(i.prod), sup=d.supplier(p.supplier)||{};
  return { eyebrow:eyebrow||'Stock line', title:p.name+' · '+depShort(i.depot), sub:[p.code,p.pack].filter(Boolean).join(' · '),
    stats:[{l:'On hand', v:BB.num(i.qty)+' '+(p.unit||''), cls:i.qty<i.reorder?'bad':''}, {l:'Reorder at', v:BB.num(i.reorder)}, {l:'Status', html:BB.statusBadge(stockStatus(i))},
      {l:'Supplier', v:sup.name||'—', s:sup.lead?sup.lead+' days lead time':null}],
    html:'<div class="sub" style="margin:4px 0 6px;">The same product at every depot</div>',
    table:lineTable(inventory.filter(function(x){ return x.prod===i.prod; }), true),
    actions:[go('Open full record','stock.html',true), go('Suppliers & POs','suppliers.html')] };
}
function deliveryPreview(x){
  var o=d.by('orders', x.order), hold=o&&d.deliveryHold(o);
  var p=o? orderPreview(o, 'Delivery') : { eyebrow:'Delivery', title:d.farmer(x.farmer).name, stats:[] };
  p.title=(o?o.ref+' · ':'')+d.farmer(x.farmer).name;
  p.sub='from '+d.depot(x.depot).name+' · '+(x.transport||'no transport yet');
  p.stats=[{l:'Status', html:BB.statusBadge(x.status)}, {l:'ETA', v:BB.date(x.eta)}, {l:'Order value', v:o?BB.money(d.orderValue(o)):'—'}]
    .concat(hold?[{l:'Finance hold', v:'HOLD', s:hold.reason, cls:hold.sev==='high'?'bad':'warn'}]:[]);
  p.actions=[go('Open full record','deliveries.html',true), go('Open the farm', farmHref(x.farmer))];
  return p;
}
function depotStock(dep){
  var items=inventory.filter(function(i){ return i.depot===dep.id; }), low=items.filter(function(i){ return i.qty<i.reorder; });
  return { eyebrow:'Stock health by depot', title:dep.name, sub:dep.region+' · '+dep.manager,
    stats:[{l:'Stock lines', v:items.length}, {l:'Below reorder', v:low.length, cls:low.length?'bad':''}, {l:'Out of stock', v:items.filter(function(i){ return i.qty<=0; }).length}],
    table:lineTable(items, false), actions:[go('Open stock','stock.html',true), go('Open the depot','depots.html')] };
}

var headActions = [
  {href:'orders.html', ic:'receipt', t:'Orders'},
  {href:'stock.html', ic:'package', t:'Stock'},
  {href:'deliveries.html', ic:'truck', t:'Deliveries'}
].filter(function(a){ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(a.href); });

html += '<section class="page-head row between" style="gap:16px;">'+
  '<div><div class="eyebrow">Operations</div>'+
  '<h1>The board</h1>'+
  '<p>'+(liveBoard
    ? 'The whole business on one screen, straight from your accounting system — what has been invoiced and received, who is behind, who is selling it and what is going out the door. Read three times a day.'
    : 'The whole business on one screen — sales, stock, blending and deliveries, live as the team works. Everything here is saved on this device and syncs when you have signal.')+'</p></div>'+
  (headActions.length ? '<div class="row" style="gap:8px;">'+headActions.map(function(a,i){ return '<a class="btn'+(i?' ghost':'')+'" href="'+a.href+'">'+BB.icon(a.ic)+a.t+'</a>'; }).join('')+'</div>' : '')+
'</section>';

// ---- top stat row ----
// With the accounting system connected, the top of the board is the real trading picture.
// Orders, stock and blending do not exist in Sage, so they sit lower down and are marked.
var sg = BB.data.sage && BB.data.sage();
var STATS;
if(sg && sg.live){
  var si=sg.invoices||[], sp=sg.payments||[], sc=sg.customers||[];
  var op=function(i){ return i.outstanding!=null?i.outstanding:(i.status==='Paid'?0:(i.amount||0)); };
  var ym=new Date().toISOString().slice(0,7);
  var t0=new Date(new Date().toISOString().slice(0,10));
  var dov=function(i){ return i.dueDate? Math.round((t0-new Date(i.dueDate))/86400000):0; };
  var invM=si.filter(function(i){return (i.date||'').slice(0,7)===ym;});
  var payM=sp.filter(function(x){return (x.date||'').slice(0,7)===ym;});
  var owed=si.reduce(function(t,i){return t+op(i);},0);
  var od=si.filter(function(i){return i.status==='Overdue';});
  var a90=si.filter(function(i){ return op(i)>0.5 && dov(i)>=90; });
  var lim=sc.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; });
  var openInv=si.filter(function(i){return op(i)>0.5;});
  STATS = [
    {l:'Invoiced this month', v:BB.money(invM.reduce(function(t,i){return t+(i.amount||0);},0)), s:invM.length+' invoices', cls:'', key:'ops-inv', href:'finance.html'},
    {l:'Received this month', v:BB.money(payM.reduce(function(t,x){return t+(x.amount||0);},0)), s:payM.length+' receipts', cls:'', key:'ops-rec', href:'finance.html'},
    {l:'Owed to you', v:BB.money(owed), s:openInv.length+' open invoices', cls:'', key:'ops-owed', href:'finance.html'},
    {l:'Overdue', v:BB.money(od.reduce(function(t,i){return t+op(i);},0)), s:od.length+' past due', cls:od.length?'bad':'', key:'ops-overdue', href:'finance.html?show=overdue'},
    {l:'90 days and older', v:BB.money(a90.reduce(function(t,i){return t+op(i);},0)), s:a90.length+' invoices', cls:a90.length?'warn':'', key:'ops-90', href:'finance.html?show=overdue'},
    {l:'Over their limit', v:lim.length, s:'accounts to watch', cls:lim.length?'warn':'', key:'ops-limit', href:'farms.html?show=overlimit'}
  ];
  // the ledger lists behind each figure
  var custById={}; sc.forEach(function(c){ custById[c.id]=c; });
  var farmOfCust={}; (d.allUnscoped('farmers')||[]).forEach(function(f){ if(f.sageId) farmOfCust[f.sageId]=f.id; });
  var custName=function(id){ return (custById[id]||{}).name||'—'; };
  var invTable=function(list, val, cols){ var c=cap(list.slice().sort(function(a,b){ return val(b)-val(a); }), 40, 'invoices');
    return { table:{ columns:['Customer','Invoice',cols==='due'?'Due':'Date'].concat(cols==='due'?['Days over']:[]).concat(['Amount']), num:cols==='due'?[3,4]:[3],
      rows:c.rows.map(function(i){ return { cells:[custName(i.customer), i.label||i.ref||'—', BB.date(cols==='due'?i.dueDate:i.date)].concat(cols==='due'?[String(Math.max(0,dov(i)))]:[]).concat([BB.money(Math.round(val(i)))]),
        href:farmHref(farmOfCust[i.customer]) }; }) }, note:c.note }; };
  var amt=function(i){ return i.amount||0; };
  var withAct=function(o, label, href){ o.actions=[go(label||'Open the full list', href, true)]; return o; };
  BB.statDetail('ops-inv', function(){ return withAct(invTable(invM, amt), null, 'finance.html'); });
  BB.statDetail('ops-rec', function(){ var c=cap(payM.slice().sort(function(a,b){ return (b.amount||0)-(a.amount||0); }), 40, 'receipts');
    return withAct({ table:{ columns:['Customer','Reference','Date','Amount'], num:[3], rows:c.rows.map(function(x){ return { cells:[custName(x.customer), x.ref||'—', BB.date(x.date), BB.money(Math.round(x.amount||0))], href:farmHref(farmOfCust[x.customer]) }; }) }, note:c.note }, null, 'finance.html'); });
  BB.statDetail('ops-owed', function(){ return withAct(invTable(openInv, op, 'due'), null, 'finance.html'); });
  BB.statDetail('ops-overdue', function(){ return withAct(invTable(od, op, 'due'), null, 'finance.html?show=overdue'); });
  BB.statDetail('ops-90', function(){ return withAct(invTable(a90, op, 'due'), null, 'finance.html?show=overdue'); });
  BB.statDetail('ops-limit', function(){ return withAct({ table:{ columns:['Customer','Balance','Limit','Over by'], num:[1,2,3],
    rows:lim.slice().sort(function(a,b){ return (b.balance-b.creditLimit)-(a.balance-a.creditLimit); }).map(function(c){
      return { cells:[c.name, BB.money(Math.round(c.balance)), BB.money(Math.round(c.creditLimit)), BB.money(Math.round(c.balance-c.creditLimit))], href:farmHref(farmOfCust[c.id]) }; }) } }, null, 'farms.html?show=overlimit'); });
} else {
  STATS = [
    {l:'Open pipeline', v:BB.money(pipelineVal), s:openOrders.length+' forecast + pending', cls:'', key:'ops-pipe', href:'orders.html'},
    {l:'Confirmed this season', v:BB.money(confirmedVal), s:'won + delivered', cls:'', key:'ops-won', href:'orders.html'},
    {l:'Awaiting stock', v:awaitingStock, s:'orders held on stock', cls:awaitingStock>0?'warn':'', key:'ops-await', href:'orders.html'},
    {l:'Below reorder', v:lowItems.length, s:'stock lines low', cls:lowItems.length>0?'bad':'', key:'ops-low', href:'stock.html'},
    {l:'In transit', v:inTransit.length, s:'deliveries on the road', cls:'', key:'ops-transit', href:'deliveries.html'},
    {l:'Blending jobs', v:blending.length, s:'across depots', cls:'', key:'ops-blend', href:'depots.html'}
  ];
  var ordersTile=function(list, href){ return { table:orderTable(list), actions:[go('Open the full list', href, true)] }; };
  BB.statDetail('ops-pipe', function(){ return ordersTile(openOrders, 'orders.html'); });
  BB.statDetail('ops-won', function(){ return ordersTile(orders.filter(function(o){ return o.status==='Confirmed'||o.status==='Delivered'; }), 'orders.html'); });
  BB.statDetail('ops-await', function(){ return ordersTile(orders.filter(function(o){ return o.status==='Awaiting stock'; }), 'orders.html'); });
  BB.statDetail('ops-low', function(){ return { table:lineTable(lowItems, true), actions:[go('Open the full list','stock.html',true), go('Reorder radar','suppliers.html')] }; });
  BB.statDetail('ops-transit', function(){ return { table:{ columns:['Order','Farmer','Depot','Transport','ETA'], rows:inTransit.map(function(x){ var o=d.by('orders', x.order);
    return { cells:[{ html:'<span style="white-space:nowrap">'+BB.esc(o?o.ref:'—')+'</span>' }, d.farmer(x.farmer).name, depShort(x.depot), x.transport||'—', BB.date(x.eta)], href:farmHref(x.farmer) }; }) }, actions:[go('Open the full list','deliveries.html',true)] }; });
  BB.statDetail('ops-blend', function(){ return { table:{ columns:['Recipe','Batch','Depot','For','Due','Status'], rows:blending.slice().sort(function(a,b){ return String(a.due).localeCompare(String(b.due)); }).map(function(b){
    return { cells:[b.recipe, b.batch, depShort(b.depot), d.farmer(b['for']).name, BB.date(b.due), badgeCell(b.status)], href:farmHref(b['for']) }; }) }, actions:[go('Open the full list','depots.html',true)] }; });
}
html += '<div class="grid g6 ops-kpi">';
STATS.forEach(function(st){
  var inner = '<div class="l">'+st.l+'</div><div class="v">'+st.v+'</div><div class="s">'+BB.esc(st.s)+(st.key?' ›':'')+'</div>';
  html += st.key
    ? '<a class="stat tap'+(st.cls?' '+st.cls:'')+'" href="'+(can(st.href)?st.href:'#')+'" data-detail="'+st.key+'">'+inner+'</a>'
    : '<div class="stat'+(st.cls?' '+st.cls:'')+'">'+inner+'</div>';
});
html += '</div>';

// ---- On their own figures, this board is built from the ledger --------------------------------
// The four sections that used to live here (sales by rep, reported-vs-invoiced, stock health, and
// the order queue) all ran on the portal's own orders and stock. BioBrix keep neither in Sage, so
// on a live client seat they would render as a wall of zeros. These replace them with what their
// accounting system actually knows.
var sgB = d.sage && d.sage();
if(liveBoard && sgB && sgB.live){
  var plB = d.plan ? d.plan() : {agents:{}};
  var invB = (sgB.invoices||[]).filter(function(i){ return i.kind!=='opening'; });
  var custB = sgB.customers||[];
  var byIdB = {}; custB.forEach(function(c){ byIdB[c.id]=c; });
  var farmOfB = {}; (d.allUnscoped('farmers')||[]).forEach(function(f){ if(f.sageId) farmOfB[f.sageId]=f.id; });
  var ymB = new Date().toISOString().slice(0,7);
  var repsB = (sgB.reps||[]);
  var agentName = function(k){
    if(!k) return 'Not allocated to an agent';
    var pr = (d.allUnscoped('reps')||[]).find(function(r){ return r.id===k; });
    if(pr) return pr.name;
    var m = k.indexOf('sage_rep_')===0 && repsB.find(function(r){ return 'sage_rep_'+r.id===k; });
    return m? m.name : k;
  };
  var agentOf = function(c){
    var set = plB.agents && plB.agents['sage_'+c.id]; if(set) return set;
    return c.sageRep? ('sage_rep_'+c.sageRep) : null;
  };

  // --- this month, by agent ---
  var byAgent = {}, monthTotal = 0;
  invB.filter(function(i){ return (i.date||'').slice(0,7)===ymB; }).forEach(function(i){
    var c = byIdB[i.customer]||{}; var k = agentOf(c) || '';
    byAgent[k] = byAgent[k] || {v:0,n:0}; byAgent[k].v += (i.amount||0); byAgent[k].n++; monthTotal += (i.amount||0);
  });
  var agentRows = Object.keys(byAgent).map(function(k){ return {k:k, v:byAgent[k].v, n:byAgent[k].n}; })
    .sort(function(a,b){ return b.v-a.v; });

  // --- biggest movers, in litres and kilograms ---
  var movers = (sgB.products||[]).map(function(pp){
    var m=(pp.months||{})[ymB]; return { n:pp.name, c:pp.code, pack:pp.pack||'', q:(m&&m.qty)||0, v:(m&&m.value)||0, months:pp.months||{} };
  }).filter(function(x){ return x.q>0; }).sort(function(a,b){ return b.q-a.q; }).slice(0,10);

  var agentBody = !agentRows.length ? '<div class="empty">Nothing invoiced yet this month.</div>'
    : '<div class="card-p"><div id="chAgent"></div></div>'+
      (byAgent[''] ? '<div class="card-f">'+BB.money(Math.round(byAgent[''].v))+' is not allocated to anyone yet. '+
        'Allocate those accounts once in <a href="sales-report.html?view=customer" style="color:var(--green-dark);font-weight:600;">Sales → By customer</a> and every report here, and the commission, follows.</div>' : '');
  if(agentRows.length){
    var agentPal = ['#3f6b28','#c77d17','#2f6f9e','#7d4f9a','#a3533f','#22431a','#68a53e'];
    chartJobs.push(function(){ BB.chart.hbar('#chAgent', { money:true, valueLabel:'Invoiced', rows:agentRows.map(function(x,ix){
      return { label:agentName(x.k), sub:x.n+' invoice'+(x.n===1?'':'s'), value:Math.round(x.v), color:x.k?agentPal[ix%agentPal.length]:'#6b7a5e', k:x.k }; }),
      // that agent's invoices this month
      detail:function(ctx){ var k=ctx.row.k;
        var mine=invB.filter(function(i){ return (i.date||'').slice(0,7)===ymB && (agentOf(byIdB[i.customer]||{})||'')===k; }).sort(function(a,b){ return (b.amount||0)-(a.amount||0); });
        var c=cap(mine, 40, 'invoices');
        return { sub:'invoiced in '+BB.monthName(new Date().getMonth())+' · '+mine.length+' invoice'+(mine.length===1?'':'s'),
          table:{ columns:['Customer','Invoice','Date','Amount'], num:[3], rows:c.rows.map(function(i){ var cu=byIdB[i.customer]||{};
            return { cells:[cu.name||'—', i.label||i.ref||'—', BB.date(i.date), BB.money(Math.round(i.amount||0))], href:farmHref(farmOfB[i.customer]) }; }) },
          note:c.note, actions:[go('Open sales by customer','sales-report.html?view=customer',true)] }; } }); });
  }

  var moverBody = '<div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th class="num">Quantity</th><th class="num">Invoiced</th></tr></thead><tbody>';
  if(!movers.length){ moverBody += '<tr><td colspan="4"><div class="empty">Nothing invoiced yet this month.</div></td></tr>'; }
  movers.forEach(function(x, k){

      '<td><b style="color:var(--green-dark);">'+BB.esc(d.farmer(x.farmer).name)+'</b></td>'+
      '<td class="muted">'+BB.esc(d.depot(x.depot).name)+'</td>'+
      '<td class="muted">'+BB.esc(x.transport||'')+'</td>'+
      '<td class="num muted">'+BB.date(x.eta)+'</td>'+
    '</tr>';
  });
  transitBody += '</tbody></table></div>';
}

html += '<div class="grid g2 ops-row">'+
  panel('Latest orders', 'the five most recent', openLink('orders.html','All'), latestBody)+
  panel('Deliveries in transit', inTransit.length+' on the road', openLink('deliveries.html','All'), transitBody)+
'</div>';

html += '<div style="height:24px;"></div>';

document.body.insertAdjacentHTML('beforeend', '<main class="wrap">'+html+'</main>');
chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });

// rows open their record over the board; the record page is a button inside
function onRows(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(tr){ tr.onclick = function(){ var p=fn(tr); if(p) BB.popup(p); }; }); }
onRows('tr.click[data-act]', function(tr){ var a=actions[+tr.getAttribute('data-act')];
  return a && (a.pop ? a.pop() : { eyebrow:'Needs action', title:a.kind, sub:a.what, actions:[go('Open full record', a.href, true)] }); });
onRows('tr.click[data-order]', function(tr){ var o=d.by('orders', tr.getAttribute('data-order')); return o && orderPreview(o, 'Latest orders'); });
onRows('tr.click[data-del]', function(tr){ var x=d.by('deliveries', tr.getAttribute('data-del')); return x && deliveryPreview(x); });
onRows('tr.click[data-stock]', function(tr){ var i=inventory[+tr.getAttribute('data-stock')]; return i && stockPreview(i, 'Stock vs reorder'); });
onRows('tr.click[data-mover]', function(tr){ var x=movers[+tr.getAttribute('data-mover')]; if(!x) return null;
  var ks=Object.keys(x.months).sort().reverse().slice(0,6);
  return { eyebrow:'Biggest movers this month', title:x.n, sub:[x.c, x.pack].filter(Boolean).join(' · ')||null,
    stats:[{l:'This month', v:(Math.round(x.q*10)/10).toLocaleString('en-ZA'), s:'quantity invoiced'}, {l:'Invoiced', v:BB.money(Math.round(x.v))}],
    table:{ columns:['Month','Quantity','Invoiced'], num:[1,2], rows:ks.map(function(k){ var m=x.months[k]||{}, p=k.split('-');
      return { cells:[BB.monthName(+p[1]-1)+' '+p[0], (Math.round((m.qty||0)*10)/10).toLocaleString('en-ZA'), BB.money(Math.round(m.value||0))] }; }) },
    actions:[go('Every product','dispatch.html',true)] }; });
// a depot in the health list opens its lines
Array.prototype.forEach.call(document.querySelectorAll('a.dep-row[data-dep]'), function(a){
  a.addEventListener('click', function(e){ if(e.metaKey||e.ctrlKey||e.shiftKey) return; e.preventDefault();
    BB.popup(depotStock(d.depot(a.getAttribute('data-dep')))); });
});


// On a first sign-in there is no cached snapshot yet, so this page draws before the accounting
// data arrives — and would sit there showing sample figures until the next navigation. When the
// data lands, draw it again. Once only.
window.addEventListener('bb:sage', function(){
  try{ if(sessionStorage.getItem('bb_sage_drawn')) return; sessionStorage.setItem('bb_sage_drawn','1'); }catch(e){}
  location.reload();
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
