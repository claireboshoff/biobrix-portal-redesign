<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioAnalyze — Leaf · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
/* BioAnalyze — page-scoped */
.detail{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin:2px 0 4px;}
.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
.reading{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.reading .rl{font-size:.64rem;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;}
.reading .rv{font-family:var(--display);font-size:1.15rem;font-weight:600;color:var(--green-dark);margin-top:2px;}
.interp{margin-top:8px;padding:11px 13px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:.86rem;}
.interp.ok{background:var(--ok-bg);color:var(--ok);}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;}
.ctx .chip .ico{width:14px;height:14px;transform:rotate(180deg);}
.flagl{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);}
.flagl .f{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--amber);}
.flagl .f.ok{color:var(--ok);}
.flagl .f::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;margin-top:6px;}
.flagl .f b{color:var(--ink);font-weight:600;}
table.bb tr.open td{background:#f3f8ec;}
table.bb tr.detail-row td{padding-top:0;background:#f3f8ec;}
.empty .big .ico{width:30px;height:30px;color:var(--faint);}
.card .empty{padding:26px 20px;}
.fld:last-of-type{margin-bottom:12px;}
.bbp .interp{margin-top:0;}
.flagl .f.click{cursor:pointer;border-radius:6px;} .flagl .f.click:hover{background:var(--panel-2);}
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';
function esc(s){ return BB.esc(s); }

var blockParam = new URLSearchParams(location.search).get('block');

function baseRows(){
  var rows = d.all('leaf');
  if(isAdvisor) rows = rows.filter(function(l){ return l.advisor===u.rep; });
  if(blockParam) rows = rows.filter(function(l){ return l.block===blockParam; });
  return rows.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}

function formBlocks(){
  var blocks = d.all('blocks');
  if(isAdvisor){
    var myFarms = d.where('farmers', function(f){ return f.rep===u.rep; }).map(function(f){ return f.id; });
    blocks = blocks.filter(function(b){ return myFarms.indexOf(b.farmer)>=0; });
  }
  return blocks;
}

// Status used to be chips above the samples; the funnel on the Status column does that now.
var openId = null;
var blockCtx = blockParam ? d.by('blocks', blockParam) : null;

// readings arrive as text from the lab ("2.1%") — read the number, never guess one
function numOf(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)? n : null; }
function shortBlock(b){ var n=String(b.name||'—'); var parts=n.split(' — '); return parts.length>1? parts[1] : n; }

// ---- popups: one sample's full reading, or the samples behind a figure / chart part ----
function canGo(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } }
function interpOk(l){ return /balanced|hold|good/i.test(l.flag||''); }
function showSample(id){
  BB.closePopup(); openId=id; render();
  setTimeout(function(){ var tr=document.querySelector('#leafMain tr.click[data-id="'+id+'"]'); if(!tr) return;
    if(tr.style.display==='none'){ BB.toast('That sample is hidden by a filter on the table'); return; }
    tr.scrollIntoView({ behavior:'smooth', block:'center' }); }, 120);
}
// the block's full reading and what it means
function sampleInfo(l){
  var f=d.farmer(l.farmer), b=d.by('blocks',l.block)||{name:'—'}, adv=d.rep(l.advisor), isI=l.status==='Interpreted';
  var acts=[{ label:'Open full record', primary:true, onClick:function(){ showSample(l.id); } }];
  if(isI && canGo('bioconsult.html')) acts.push({ label:'Create BioConsult recommendation', href:'bioconsult.html?farmer='+encodeURIComponent(l.farmer)+'&block='+encodeURIComponent(l.block) });
  if(canGo('biowatch.html')) acts.push({ label:'Monitor this block', href:'biowatch.html?block='+encodeURIComponent(l.block) });
  return { eyebrow:'Leaf-sap sample · '+(f.farm||f.name), title:b.name, sub:[f.name, l.crop, 'sampled '+BB.date(l.date), 'advisor '+adv.name].filter(Boolean).join(' · '),
    stats: isI ? [{ l:'Nitrogen (N)', v:l.n||'—' }, { l:'Potassium (K)', v:l.k||'—' }, { l:'Calcium (Ca)', v:l.ca||'—' }]
               : [{ l:'Status', html:BB.statusBadge(l.status) }, { l:'Sampled', v:BB.date(l.date) }],
    html:'<div class="interp'+(isI&&interpOk(l)?' ok':'')+'"><b>'+(isI?'Interpretation':'Status')+':</b> '+esc(l.flag||(isI?'—':'Sap collected — readings appear once interpreted.'))+'</div>',
    actions:acts };
}
function sampleDetail(list){
  list=list.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  return { table:{ columns:['Date','Farmer / block','Crop','Status','Reading'], rows:list.map(function(l){ var f=d.farmer(l.farmer), b=d.by('blocks',l.block)||{name:'—'};
      return [BB.shortDate(l.date), { html:'<b>'+esc(f.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.name)+'</div>' }, l.crop||'—', { html:BB.statusBadge(l.status) }, { html:'<span style="font-size:.78rem;">'+esc(l.flag||'—')+'</span>' }]; }) },
    note: list.length? 'Tap a sample to open it in the list.' : null,
    onOpen:function(body){ body.querySelectorAll('tbody tr').forEach(function(tr,i){ var l=list[i]; if(!l) return; tr.classList.add('click'); tr.onclick=function(){ showSample(l.id); }; }); } };
}
function toSamples(){ BB.closePopup(); var el=document.getElementById('sampleList'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
var TILE={};
BB.statDetail('leafAwait', function(){ return Object.assign(sampleDetail(TILE.await||[]), { sub:'collected or at the lab, waiting to be read', actions:[{ label:'Open the full list', primary:true, onClick:toSamples }] }); });
BB.statDetail('leafInterp', function(){ return Object.assign(sampleDetail(TILE.interp||[]), { sub:'read and interpreted', actions:[{ label:'Open the full list', primary:true, onClick:toSamples }] }); });

function statBar(rows){
  var awaitL = rows.filter(function(l){ return l.status!=='Interpreted'; }), awaiting = awaitL.length;
  var interpL = rows.filter(function(l){ return l.status==='Interpreted'; }), interp = interpL.length;
  var crops = rows.map(function(l){ return l.crop; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; });
  TILE = { await:awaitL, interp:interpL };
  var html='<div class="grid g4" style="margin-top:12px;">';
  html += '<div class="stat"><div class="l">Samples</div><div class="v">'+rows.length+'</div><div class="s">'+(blockCtx?'on this block':'in view')+'</div></div>';
  html += '<a class="stat tap'+(awaiting>0?' warn':'')+'" href="#sampleList" data-detail="leafAwait"><div class="l">Awaiting interpretation</div><div class="v">'+awaiting+'</div><div class="s">new + at lab</div></a>';
  html += '<a class="stat tap" href="#sampleList" data-detail="leafInterp"><div class="l">Interpreted</div><div class="v">'+interp+'</div><div class="s">this season</div></a>';
  html += '<div class="stat"><div class="l">Crops</div><div class="v">'+crops.length+'</div><div class="s">'+(crops.length? esc(crops.join(' · ')) : 'none sampled yet')+'</div></div>';
  html += '</div>';
  return html;
}

function detailPanel(l){
  var f=d.farmer(l.farmer), b=d.by('blocks',l.block)||{name:'—'}, adv=d.rep(l.advisor);
  var html='<div class="detail">';
  html += '<div class="row between"><div><b>'+esc(f.name)+'</b> · '+esc(b.name)+' · '+esc(l.crop)+'<div class="faint" style="font-size:.76rem;">Sampled '+BB.date(l.date)+' · advisor '+esc(adv.name)+'</div></div>'+BB.statusBadge(l.status)+'</div>';
  if(l.status==='Interpreted'){
    html += '<div class="readings">'+
      '<div class="reading"><div class="rl">Nitrogen</div><div class="rv">'+esc(l.n)+'</div></div>'+
      '<div class="reading"><div class="rl">Potassium</div><div class="rv">'+esc(l.k)+'</div></div>'+
      '<div class="reading"><div class="rl">Calcium</div><div class="rv">'+esc(l.ca)+'</div></div>'+
    '</div>';
    var ok = /balanced|hold|good/i.test(l.flag||'');
    html += '<div class="interp'+(ok?' ok':'')+'"><b>Interpretation:</b> '+esc(l.flag)+'</div>';
    html += '<div class="row" style="margin-top:12px;">'+
      '<a class="btn" href="bioconsult.html?farmer='+encodeURIComponent(l.farmer)+'&block='+encodeURIComponent(l.block)+'">Create BioConsult recommendation</a>'+
      '<a class="btn ghost" href="biowatch.html?block='+encodeURIComponent(l.block)+'">Monitor this block</a>'+
    '</div>';
  } else {
    html += '<div class="interp"><b>Status:</b> '+esc(l.flag||'Sap collected — readings appear once interpreted.')+'</div>';
    if(u.roleKey==='director'||u.roleKey==='advisor'){
      html += '<div class="row" style="margin-top:12px;"><button class="btn ghost sm" data-interp="'+esc(l.id)+'">Mark as interpreted</button></div>';
    }
  }
  html += '</div>';
  return html;
}

function logForm(){
  var blocks = formBlocks();
  var opts = blocks.map(function(b){
    var f=d.farmer(b.farmer);
    return '<option value="'+esc(b.id)+'" data-crop="'+esc(b.crop)+'"'+(blockParam===b.id?' selected':'')+'>'+esc(f.name)+' — '+esc(b.name)+'</option>';
  }).join('');
  var html='<div class="card" id="logSample"><div class="card-h"><div><h3>Log a leaf-sap sample</h3><div class="sub">saves on this device and syncs when you have signal</div></div></div><div class="card-p">';
  html += '<div class="fld"><label>Block</label><select id="fBlock">'+opts+'</select></div>';
  html += '<div class="grid g2" style="gap:12px;">';
  html += '<div class="fld"><label>Date sampled</label><input id="fDate" type="date" value="2026-07-28"></div>';
  html += '<div class="fld"><label>Status</label><select id="fStatus"><option>New</option><option>Awaiting lab</option></select></div>';
  html += '</div>';
  html += '<div class="fld"><label>Field note (optional)</label><input id="fNote" type="text" placeholder="e.g. Youngest fully-expanded leaves, pre nut-fill"></div>';
  html += '<button class="btn block" id="fSave">'+BB.icon('plus')+'Save sample</button>';
  html += '</div></div>';
  return html;
}

function render(){
  var rows = baseRows();
  var shown = rows;

  var html='';
  html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">BioServices · BioAnalyze</div><h1>BioAnalyze — Leaf</h1><p>'+
    (blockCtx?'Leaf-sap results for '+esc(blockCtx.name)+'. ':'')+
    'Leaf-sap analysis for in-season correction — what the plant is actually taking up, block by block.</p></div>'+
    '<div class="row" style="gap:8px;"><a class="btn ghost" href="bioanalyze-soil.html'+(blockParam?'?block='+encodeURIComponent(blockParam):'')+'">'+BB.icon('flask')+'Soil results</a>'+
    '<a class="btn" href="#logSample">'+BB.icon('plus')+'Log a sample</a></div></div>';

  if(blockCtx){
    html += '<div class="ctx"><a class="chip" href="bioanalyze-leaf.html">'+BB.icon('chevron')+'All blocks</a>'+
      '<span class="chip on">'+esc(d.farmer(blockCtx.farmer).name)+' — '+esc(blockCtx.name)+'</span></div>';
  }

  html += statBar(rows);

  // The picture: N, K and Ca as reported, block by block, beside where the samples stand
  var interp = rows.filter(function(l){ return l.status==='Interpreted' && (numOf(l.n)!=null || numOf(l.k)!=null || numOf(l.ca)!=null); });
  html += '<div class="split" style="margin-top:16px;">';
  html += '<div class="card"><div class="card-h"><div><h3>Nutrient readings by block</h3><div class="sub">interpreted samples in view · % as reported by the lab</div></div></div><div class="card-p">';
  if(interp.length>=2){
    html += '<div id="chNut"></div>';
    html += '<div class="flagl">'+interp.map(function(l){
      var b=d.by('blocks',l.block)||{name:'—'}, ok=/balanced|hold|good/i.test(l.flag||'');
      return '<div class="f click'+(ok?' ok':'')+'" data-reading="'+esc(l.id)+'" role="button" tabindex="0"><span><b>'+esc(shortBlock(b))+'</b> · '+esc(l.crop)+' — '+esc(l.flag)+'</span></div>';
    }).join('')+'</div>';
  } else if(interp.length===1){
    var l1=interp[0], b1=d.by('blocks',l1.block)||{name:'—'};
    html += '<div class="readings" style="margin:0;">'+
      '<div class="reading"><div class="rl">Nitrogen</div><div class="rv">'+esc(l1.n)+'</div></div>'+
      '<div class="reading"><div class="rl">Potassium</div><div class="rv">'+esc(l1.k)+'</div></div>'+
      '<div class="reading"><div class="rl">Calcium</div><div class="rv">'+esc(l1.ca)+'</div></div>'+
    '</div><div class="faint" style="font-size:.78rem;margin-top:10px;">One interpreted sample in view — '+esc(b1.name)+', '+BB.date(l1.date)+'. Readings compare here once there are two.</div>';
  } else {
    html += '<div class="empty" style="padding:20px;">No interpreted results in view yet. Readings appear here once the sap results are interpreted.</div>';
  }
  html += '</div></div>';
  html += '<div class="card"><div class="card-h"><div><h3>Where the samples are</h3><div class="sub">'+rows.length+' in view</div></div></div><div class="card-p">'+
    (rows.length?'<div id="chStatus"></div>':'<div class="empty" style="padding:16px;">No samples yet.</div>')+'</div></div>';
  html += '</div>';

  // The work: the sample queue beside the log form
  html += '<div class="split" style="margin-top:16px;align-items:start;">';
  html += '<div class="card" id="sampleList" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Samples</h3><div class="sub">newest first · tap a row for the full result · filter by status with the funnel</div></div>'+
    '<span class="badge b-grey">'+rows.length+'</span></div>';

  html += '<div class="scroll"><table class="bb"><thead><tr>'+
    '<th>Date</th><th>Farmer / block</th><th>Crop</th><th class="num">N</th><th class="num">K</th><th class="num">Ca</th><th>Status</th></tr></thead><tbody>';

  if(!shown.length){
    html += '<tr><td colspan="7"><div class="empty"><div class="big">'+BB.icon('leaf')+'</div>No leaf-sap samples here yet.</div></td></tr>';
  }

  shown.forEach(function(l){
    var f=d.farmer(l.farmer), b=d.by('blocks',l.block)||{name:'—'};
    var isInterp = l.status==='Interpreted';
    html += '<tr class="click'+(openId===l.id?' open':'')+'" data-id="'+esc(l.id)+'">'+
      '<td style="white-space:nowrap;">'+BB.date(l.date)+'</td>'+
      '<td style="min-width:150px;"><b>'+esc(f.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.name)+'</div></td>'+
      '<td>'+esc(l.crop)+'</td>'+
      '<td class="num">'+(isInterp?esc(l.n):'<span class="faint">—</span>')+'</td>'+
      '<td class="num">'+(isInterp?esc(l.k):'<span class="faint">—</span>')+'</td>'+
      '<td class="num">'+(isInterp?esc(l.ca):'<span class="faint">—</span>')+'</td>'+
      '<td>'+BB.statusBadge(l.status)+'</td>'+
    '</tr>';
    if(openId===l.id){
      html += '<tr class="detail-row"><td colspan="7">'+detailPanel(l)+'</td></tr>';
    }
  });

  html += '</tbody></table></div></div>';

  html += logForm();
  html += '</div>';
  html += '<div style="height:20px;"></div>';

  document.getElementById('leafMain').innerHTML=html;
  bind();

  // charts — only the lab's own figures and counts of the rows in view
  try{
    if(interp.length>=2){
      BB.chart.bar('#chNut', { height:220, table:true, fmt:function(v){ return (Math.round(v*100)/100)+'%'; }, axisFmt:function(v){ return (Math.round(v*100)/100)+'%'; },
        labels: interp.map(function(l){ return shortBlock(d.by('blocks',l.block)||{name:'—'}); }),
        series:[
          { name:'Nitrogen (N)',  values: interp.map(function(l){ return numOf(l.n)||0; }),  color:'#3f6b28' },
          { name:'Potassium (K)', values: interp.map(function(l){ return numOf(l.k)||0; }),  color:'#c77d17' },
          { name:'Calcium (Ca)',  values: interp.map(function(l){ return numOf(l.ca)||0; }), color:'#2f6f9e' }
        ],
        // that block's full reading and its interpretation (the readings say more than a share of the chart)
        detail:function(ctx){ var l=interp[ctx.index]; return l? sampleInfo(l) : null; } });
    }
  }catch(e){ console.warn('chart', e); }
  try{
    if(rows.length){
      var ST=[['New','#7d4f9a'],['Awaiting lab','#c77d17'],['Interpreted','#3f6b28']];
      var stRows = ST.map(function(x){ return { label:x[0], value:rows.filter(function(l){ return l.status===x[0]; }).length, color:x[1] }; });
      var other = rows.filter(function(l){ return ST.every(function(x){ return x[0]!==l.status; }); }).length;
      if(other) stRows.push({ label:'Other', value:other, color:'#6b7a5e' });
      BB.chart.donut('#chStatus', { rows:stRows, centreLabel:'samples', valueLabel:'Samples',
        detail:function(ctx){ var lbl=ctx.row.label;
          return sampleDetail(rows.filter(function(l){ return lbl==='Other' ? ST.every(function(x){ return x[0]!==l.status; }) : l.status===lbl; })); } });
    }
  }catch(e){ console.warn('chart', e); }
}

function bind(){
  var main=document.getElementById('leafMain');
  Array.prototype.forEach.call(main.querySelectorAll('[data-reading]'), function(el){
    var go=function(){ var l=d.by('leaf', el.dataset.reading); if(l) BB.popup(sampleInfo(l)); };
    el.onclick=go; el.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  });
  Array.prototype.forEach.call(main.querySelectorAll('tr.click[data-id]'), function(row){
    row.onclick=function(){ var rid=this.dataset.id; openId = openId===rid ? null : rid; render(); };
  });
  Array.prototype.forEach.call(main.querySelectorAll('[data-interp]'), function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      d.update('leaf', this.dataset.interp, { status:'Interpreted' });
      BB.toast('Marked as interpreted');
      render();
    };
  });
  var save=document.getElementById('fSave');
  if(save){
    save.onclick=function(){
      var sel=document.getElementById('fBlock');
      var blockId=sel.value;
      var block=d.by('blocks',blockId);
      if(!block){ BB.toast('Choose a block first'); return; }
      var crop = (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].getAttribute('data-crop')) || block.crop || '';
      var rec={
        block:blockId, farmer:block.farmer, date:document.getElementById('fDate').value||'2026-07-28',
        status:document.getElementById('fStatus').value, crop:crop,
        flag:document.getElementById('fNote').value||'Sap collected — pending interpretation',
        n:null, k:null, ca:null, advisor:(u.rep||block.rep||null)
      };
      d.add('leaf', rec);
      BB.toast('Leaf-sap sample saved');
      openId=null; render();
    };
  }
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="leafMain"></div></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
