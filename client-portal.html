var d = BB.data;

// ---- persisted "Viewing as" farmer (demo device switch) ----------
var VKEY = 'bb_portal_farmer_v1';
function currentFarmerId(){
  if(isFarmerSeat) return BB.user.farmer; // a farmer only ever sees their own farm
  var saved = null;
  try{ saved = localStorage.getItem(VKEY); }catch(e){}
  if(saved && d.by('farmers', saved)) return saved;
  return 'f_joubert'; // Gideon Joubert — the default demo farmer
}
function setFarmerId(id){ try{ localStorage.setItem(VKEY, id); }catch(e){} }

// ---- small helpers -----------------------------------------------
function statusFlagBadge(flag){
  // paraphrase interpretation flag into a calm tone class
  var f = String(flag||'').toLowerCase();
  if(/pending|collected|sampled|at lab|upload/.test(f)) return 'b-grey';
  if(/low|acidic|correct|high|watch|monitor/.test(f)) return 'b-warn';
  if(/improving|balanced|maintain|hold|good|even|strong/.test(f)) return 'b-ok';
  return 'b-lime';
}

// build a plain-language read of the farm from soil/leaf/watch data
function farmReadLines(id){
  var soil = d.where('soil', function(s){ return s.farmer===id; });
  var leaf = d.where('leaf', function(l){ return l.farmer===id; });
  var watch = d.where('watch', function(w){ return w.farmer===id; });
  var progs = d.where('programs', function(p){ return p.farmer===id; });
  var lines = [];
  // lead with the freshest interpreted soil read tied to a programme, in plain words
  var interpreted = soil.filter(function(s){ return s.status==='Interpreted'; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  interpreted.slice(0,2).forEach(function(s){
    var blk = d.by('blocks', s.block) || { name:'a block', crop:'' };
    var prog = progs.find(function(p){ return p.block===s.block; });
    var w = watch.filter(function(x){ return x.block===s.block; })
      .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); })[0];
    var msg = 'Your <b>'+BB.esc(blk.name)+'</b> ';
    var flagTxt = String(s.flag||'').toLowerCase();
    if(prog) msg += 'is following the '+BB.esc(prog.goal)+' programme';
    else msg += 'is being watched by your advisor';
    if(/acidic|low biology|inoculant/.test(flagTxt)) msg += ' — rebuilding biology, pH being corrected';
    else if(/improving|maintain/.test(flagTxt)) msg += ' — soil life is improving, hold the course';
    else if(/high|correct/.test(flagTxt)) msg += ' — nutrient balance being corrected';
    if(w && /stink bug|eldana|aphid|monitor/i.test(w.pest||'')) msg += '; watch '+BB.esc(String(w.pest).split(/\s*[–-]/)[0].trim().toLowerCase());
    msg += '.';
    lines.push(msg);
  });
  // if there is fresh leaf guidance, add a short line
  var freshLeaf = leaf.filter(function(l){ return l.status==='Interpreted'; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); })[0];
  if(freshLeaf && /low|foliar/.test(String(freshLeaf.flag||'').toLowerCase())){
    var lblk = d.by('blocks', freshLeaf.block) || { name:'a block' };
    lines.push('Latest leaf-sap on <b>'+BB.esc(lblk.name)+'</b>: '+BB.esc(freshLeaf.flag)+'.');
  }
  if(!lines.length) lines.push('Your farm is on the BioBrix programme. Your advisor will share the first readings as soil and leaf results come back from the lab.');
  return lines;
}

function progValue(p){
  return (p.lines||[]).reduce(function(s,l){ return s + (l.cost||0); }, 0);
}

// ---- popups: the farmer's own records behind a figure or a chart part (never anyone else's) ----
function toSec(sel){ return function(){ BB.closePopup(); var el=document.getElementById(sel); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }; }
// ---- record cards (CONVENTIONS: "Record popups: the card pattern") — only ever this farmer's own ----
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
function nw(t){ return { html:'<span style="white-space:nowrap;">'+t+'</span>' }; }
// press a button the page already has (pay, reorder, approve) — the page keeps the one way of doing it
function pagePress(sel, sec){ return function(){ BB.closePopup(); setTimeout(function(){ var b=document.querySelector(sel);
  if(b){ b.scrollIntoView({ behavior:'smooth', block:'center' }); b.click(); } else { var el=document.getElementById(sec); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); } }, 170); }; }
function mine(rec){ return rec && rec.farmer===currentFarmerId(); }
function invoiceCard(iv){
  if(!mine(iv)) return null;
  var open=iv.status!=='Paid', od=iv.status==='Overdue', rp=d.rep(d.farmer(iv.farmer).rep);
  return { color:null, sub:null, eyebrow:'Invoice', title:iv.ref||iv.label||'Invoice', tags:BB.statusBadge(iv.status||'Outstanding'),
    meta:[ iv.description? { icon:'file', text:iv.description, tip:'For' } : null,
      iv.date? { icon:'calendar', text:'Issued '+BB.date(iv.date), tip:'Issued' } : null,
      rp && rp.name? { initials:initialsOf(rp.name), color:rp.colour, text:rp.name, tip:'Your advisor' } : null ],
    stats:[{ l:'Amount', v:BB.money(iv.amount||0), s:open?'to pay':'paid — thank you', cls:od?'bad':'' },
      open? { l:'Due', v:iv.dueDate?BB.shortDate(iv.dueDate):'—', s:od?'overdue':'card or EFT', cls:od?'bad':'' } : { l:'Paid', v:iv.paidDate?BB.shortDate(iv.paidDate):'—', s:iv.method||null }],
    html: od? '<div class="bbp-alert">'+BB.icon('alert')+'Overdue — please settle to release pending deliveries</div>' : (iv.status==='Proof received'? '<div class="bbp-alert warn">'+BB.icon('check')+'Proof received — marked paid once the funds land</div>' : ''),
    actions: open && iv.status!=='Proof received' ? [{ label:'Statement', onClick:toSec('account') }, { label:'Pay now', primary:true, onClick:pagePress('button[data-pay="'+iv.id+'"]', 'account') }]
                  : [{ label:'Statement', primary:true, onClick:toSec('account') }] };
}
function openInvoice(iv){ var c=invoiceCard(iv); if(c) BB.popup(c); }
function orderCard(o){
  if(!mine(o)) return null;
  var q=d.quoteStatus(o), del=d.where('deliveries', function(x){ return x.order===o.id; })[0], rp=d.rep(o.rep), pct=q? d.quotePct(o) : 0;
  var val=q? d.quoteTotal(o) : d.orderValue(o), toApprove=q==='Sent to farmer';
  var stLabel = toApprove? '<span class="badge b-warn">Quote to approve</span>' : (q==='Awaiting approval'||q==='Approved')? '<span class="badge b-grey">Being quoted</span>' : BB.statusBadge(o.status);
  var acts=[];
  if(toApprove) acts.push({ label:'Approve quote', primary:true, onClick:pagePress('button[data-qok="'+o.id+'"]', 'orders') });
  else if(o.status==='Delivered') acts.push({ label:'Reorder', primary:true, onClick:pagePress('button[data-reorder="'+o.id+'"]', 'orders') });
  else acts.push({ label:'My orders', onClick:toSec('orders') });
  return { wide:true, layout:'split', color:null, sub:null, eyebrow:'Order', title:o.ref,
    meta:[ { icon:'calendar', text:'Ordered '+BB.date(o.date), tip:'Ordered' },
      { icon:'truck', text:'Delivery '+BB.monthName(o.deliverMonth)+(del? ' · '+String(del.status).toLowerCase()+(del.eta?' '+BB.shortDate(del.eta):'') : ''), tip:'Delivery' },
      rp && rp.name? { initials:initialsOf(rp.name), color:rp.colour, text:rp.name, tip:'Your advisor' } : null ],
    stats:[{ l:'Value', v:BB.money(val), s:q? 'quote' : 'list' }, { l:'Status', html:stLabel }],
    html:(toApprove? '<div class="bbp-alert warn">'+BB.icon('alert')+'This quote waits for your approval — nothing is charged until you approve</div>' : '')+'<div class="bbp-tt">Products</div>',
    table:{ columns:['Product','Qty','Value'], rows:(o.lines||[]).map(function(l){ var p=d.product(l.prod); return [{ html:'<b>'+BB.esc(p.name)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(p.pack||'')+'</div>' }, { html:'<span style="white-space:nowrap;">'+BB.num(l.qty)+' pack'+(l.qty==1?'':'s')+'</span><div class="faint" style="font-size:.72rem;">'+BB.esc(d.volumeLabel(l.prod,l.qty))+'</div>' }, BB.money(Math.round((p.price||0)*l.qty*(1+pct/100)))]; }), num:[1,2], foot:['Total',{ html:'' },BB.money(val)] },
    actions:acts };
}
function openOrderCard(o){ var c=orderCard(o); if(c) BB.popup(c); }
function invRows(list){
  return list.map(function(i){ return { cells:[{ html:'<b>'+BB.esc(i.label||i.ref||'—')+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(i.description||'')+'</div>' },
    nw(i.date?BB.shortDate(i.date):'—'), nw(i.status==='Paid'? (i.paidDate?'paid '+BB.shortDate(i.paidDate):'paid') : (i.dueDate?'due '+BB.shortDate(i.dueDate):'—')), { html:BB.statusBadge(i.status||'Outstanding') }, BB.money(i.amount||0)],
    onClick:function(){ openInvoice(i); } }; });
}
function invTable(list){ return { columns:['Invoice','Issued','Due / paid','Status','Amount'], rows:invRows(list), num:[4] }; }
var TILE = {};
BB.statDetail('cpOwing', function(){
  var open=TILE.open||[];
  return { table:invTable(open), note: open.length? null : 'Nothing to pay — thank you.',
    actions:[{ label:'Open the full list', primary:true, onClick:toSec('account') }] };
});
BB.statDetail('cpBlocks', function(){
  var blocks=TILE.blocks||[], soil=TILE.soil||[], leaf=TILE.leaf||[];
  var last=function(list,bid){ return list.filter(function(x){ return x.block===bid; })[0]; };
  return { table:{ columns:['Block','Ha','Soil','Leaf'], rows:blocks.map(function(b){ var s1=last(soil,b.id), l1=last(leaf,b.id);
      var cell=function(x){ return x? { html:'<span class="badge '+statusFlagBadge(x.flag)+'" style="white-space:normal;">'+BB.esc(x.flag||x.status)+'</span>' } : '—'; };
      return [{ html:'<b>'+BB.esc(b.name)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(b.crop||'')+'</div>' }, BB.num(b.ha||0), cell(s1), cell(l1)]; }), num:[1] },
    actions:[{ label:'Open the full list', primary:true, onClick:toSec('reports') }] };
});

// =================================================================
var chartJobs = [];
var LEVER_COL = { Biology:'#3f6b28', Chemistry:'#2f6f9e', Physics:'#c77d17' };
function render(){
  chartJobs = [];
  var id = currentFarmerId();
  var f = d.farmer(id);
  var rep = d.rep(f.rep);
  var first = String(f.name||'').split(' ')[0];
  var repFirst = String(rep.name||'').split(' ')[0];
  var repWa = String(rep.cell||'').replace(/\D/g,'').replace(/^0/,'27');

  var blocks = d.where('blocks', function(b){ return b.farmer===id; });
  var soil = d.where('soil', function(s){ return s.farmer===id; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var leaf = d.where('leaf', function(l){ return l.farmer===id; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var watch = d.where('watch', function(w){ return w.farmer===id; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var progs = d.where('programs', function(p){ return p.farmer===id; });
  var orders = d.where('orders', function(o){ return o.farmer===id; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var files = d.where('files', function(x){ return x.farmer===id; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

  var latestSoil = soil.find(function(s){ return s.status==='Interpreted'; }) || soil[0];
  var activeProg = progs.find(function(p){ return p.status==='Active'; });
  var latestVigour = (watch[0] && watch[0].vigour) || '—';

  var html='';

  // ---- page head: the farmer's own greeting, or the staff preview with its "viewing as" switch ----
  var hour = new Date().getHours();
  var greet = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  var crops = (f.crops||[]).join(' · ');
  if(isFarmerSeat){
    html += '<div class="page-head row between" style="gap:16px;">'+
      '<div><div class="eyebrow">The Biological Way · '+BB.esc(new Date().toLocaleDateString('en-ZA',{weekday:'long', day:'numeric', month:'long'}))+'</div>'+
      '<h1>'+greet+', '+BB.esc(first)+'.</h1>'+
      '<p>Your programme, orders, account and documents. Everything opens on this phone, even without signal.</p></div>'+
      '<div class="row"><a class="btn ghost" href="#account">'+BB.icon('receipt')+'My account</a><a class="btn" href="#orders">'+BB.icon('package')+'My orders</a></div></div>';
  } else {
    html += '<div class="page-head row between" style="gap:16px;">'+
      '<div><div class="eyebrow"><span class="fp-preview"><span class="dot"></span>Farmer preview</span></div>'+
      '<h1>Farmer portal</h1><p>Exactly what '+BB.esc(f.name)+' sees on their phone. Switch farmer to check another account.</p></div>'+
      '<div class="selbar"><span class="faint" style="font-size:.76rem;">Viewing as</span>'+
        '<select id="whoSel">'+
          d.all('farmers').map(function(fm){
            return '<option value="'+fm.id+'"'+(fm.id===id?' selected':'')+'>'+BB.esc(fm.name)+' — '+BB.esc(fm.farm)+'</option>';
          }).join('')+
        '</select>'+
      '</div></div>';
  }

  // ---- farm header ----
  var editOpen = window.__editFarm===true;
  html += '<section class="fp-hero">'+
    '<div><div class="eyebrow">Your farm</div>'+
      '<div class="farm">'+BB.esc(f.farm)+'</div>'+
      '<div class="crops">'+BB.esc(f.name)+(crops?' · '+BB.esc(crops):'')+'</div>'+
      '<div class="meta">'+
        '<span class="fp-pill">'+BB.icon('map')+BB.esc(f.town)+', '+BB.esc(f.region)+'</span>'+
        '<span class="fp-pill">'+BB.icon('farm')+BB.num(f.ha)+' ha under management</span>'+
        '<span class="fp-pill">'+BB.icon('sprout')+blocks.length+' block'+(blocks.length===1?'':'s')+'</span>'+
      '</div></div>'+
    '<div class="fp-advisor">'+
      '<div class="fp-av" style="background:'+(rep.colour||'#68a53e')+';">'+BB.initials(rep.name)+'</div>'+
      '<div class="who"><div class="r">Your BioBrix advisor</div>'+
        '<div class="n">'+BB.esc(rep.name)+'</div>'+
        '<div class="c">'+BB.esc(rep.role||'Crop Advisor')+(rep.cell?' · '+BB.esc(rep.cell):'')+'</div></div>'+
      (rep.cell? '<div class="call">'+
          '<a class="btn lime sm" href="tel:'+BB.esc(String(rep.cell).replace(/\s/g,''))+'">'+BB.icon('phone')+'Call '+BB.esc(repFirst)+'</a>'+
          '<a class="btn sm" style="background:#25D366;color:#0a2417;" target="_blank" href="https://wa.me/'+BB.esc(repWa)+'?text='+encodeURIComponent('Hi '+repFirst+', it\'s '+f.name+' from '+f.farm+' — ')+'">'+BB.icon('message')+'WhatsApp</a>'+
        '</div>' : '')+
    '</div>'+
  '</section>';
  html += '<div class="row between" style="margin-top:8px;"><span class="faint" style="font-size:.76rem;">Something changed on the farm? Keep '+BB.esc(repFirst)+' up to date.</span><button class="btn ghost sm" id="editFarm">'+(editOpen?'Close':BB.icon('clipboard')+'Update my farm details')+'</button></div>';
  if(editOpen){
    html += '<div class="card" style="margin-top:8px;"><div class="card-h"><div><h3>Your farm details</h3><div class="sub">'+BB.esc(repFirst)+' sees the update straight away</div></div></div><div class="card-p"><div class="grid g3">'+
      '<div class="fld"><label>Hectares under management</label><input id="efHa" type="number" min="0" value="'+BB.esc(f.ha||0)+'"></div>'+
      '<div class="fld"><label>Crops (comma separated)</label><input id="efCrops" value="'+BB.esc((f.crops||[]).join(', '))+'"></div>'+
      '<div class="fld"><label>% of hectares on the BioBrix programme</label><input id="efPct" type="number" min="0" max="100" value="'+BB.esc(f.programmePct!=null?f.programmePct:'')+'" placeholder="e.g. 40"></div>'+
      '<div class="fld"><label>Cell</label><input id="efCell" value="'+BB.esc(f.cell||'')+'"></div>'+
      '<div class="fld"><label>Town</label><input id="efTown" value="'+BB.esc(f.town||'')+'"></div>'+
    '</div><button class="btn" id="saveFarm">'+BB.icon('check')+'Save</button></div></div>';
  }

  // ---- farm at a glance ----

        var list=invs.filter(function(i){ return lbl==='Paid' ? i.status==='Paid' : lbl==='Overdue' ? i.status==='Overdue' : (i.status!=='Paid' && i.status!=='Overdue'); });
        return { table:invTable(list), actions:[{ label:'Open the full list', primary:true, onClick:toSec('account') }] }; } }); });
    html += '<div class="card"><div class="card-h"><div><h3>Statement</h3><div class="sub">transaction history</div></div></div><div class="stmt scroll'+(ledger.length>8?' tall':'')+'">';
    ledger.forEach(function(t){
      html += '<div class="tx"><div style="min-width:0;"><div class="d">'+BB.shortDate(t.date)+'</div>'+BB.esc(t.txt)+'</div>'+
        '<span style="font-weight:600;color:'+(t.dir==='credit'?'var(--ok)':'var(--muted)')+';white-space:nowrap;">'+(t.dir==='credit'?'− ':'+ ')+BB.money(t.amt)+'</span></div>';
    });
    html += '</div><div class="row between" style="padding:12px 20px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 var(--radius) var(--radius);"><b>Balance outstanding</b><b style="color:'+(owing>0?'var(--amber)':'var(--ok)')+'">'+BB.money(owing)+'</b></div></div>';
    html += '</div></div>';
    html += '<div class="pline" style="margin-top:10px;">'+BB.icon('receipt')+'Invoices &amp; statements sync from BioBrix\'s accounts. Pay by card or EFT here and it reflects straight away.</div>';
  }

  // ---- my reports and documents ----
  html += '<div class="sec" id="docs"><h2>My reports &amp; documents</h2><span class="ln"></span><span class="cnt">tap Open — works without signal</span></div>';
  html += '<div class="split" style="align-items:start;">';
  html += '<div class="card" id="reports" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Lab reports</h3><div class="sub">each opens with what it means and what to do next</div></div><span class="badge b-grey">'+(soil.length+leaf.length)+'</span></div>';
  if(!soil.length && !leaf.length){
    html += '<div class="empty">No lab reports yet. Your advisor will load these as samples come back.</div>';
  } else {
    html += '<div class="scroll"><table class="bb rep"><thead><tr>'+
      '<th>Type</th><th>Block</th><th>Date</th><th>Status</th><th>What it means</th><th></th></tr></thead><tbody>';
    soil.forEach(function(s){
      var blk = d.by('blocks', s.block) || { name:'—' };
      html += '<tr><td><span class="badge b-lime">Soil</span></td>'+
        '<td>'+BB.esc(blk.name)+'</td>'+
        '<td style="white-space:nowrap;">'+BB.shortDate(s.date)+'</td>'+
        '<td>'+BB.statusBadge(s.status)+'</td>'+
        '<td><span class="badge '+statusFlagBadge(s.flag)+'" style="white-space:normal;">'+BB.esc(s.flag)+'</span></td>'+
        '<td class="right"><a class="btn ghost sm" href="document.html?farmer='+encodeURIComponent(id)+'&kind=Soil&id='+encodeURIComponent(s.id)+'&name='+encodeURIComponent('Soil report — '+blk.name)+'">Open</a></td></tr>';
    });
    leaf.forEach(function(l){
      var blk = d.by('blocks', l.block) || { name:'—' };
      html += '<tr><td><span class="badge b-blue">Leaf</span></td>'+
        '<td>'+BB.esc(blk.name)+'</td>'+
        '<td style="white-space:nowrap;">'+BB.shortDate(l.date)+'</td>'+
        '<td>'+BB.statusBadge(l.status)+'</td>'+
        '<td><span class="badge '+statusFlagBadge(l.flag)+'" style="white-space:normal;">'+BB.esc(l.flag)+'</span></td>'+
        '<td class="right"><a class="btn ghost sm" href="document.html?farmer='+encodeURIComponent(id)+'&kind=Leaf&id='+encodeURIComponent(l.id)+'&name='+encodeURIComponent('Leaf-sap report — '+blk.name)+'">Open</a></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  html += '<div class="card"><div class="card-h"><div><h3>Documents</h3><div class="sub">one place for every file</div></div><span class="badge b-grey">'+files.length+'</span></div>';
  if(!files.length){
    html += '<div class="empty">No documents shared yet.</div>';
  } else {
    html += '<div>';
    files.forEach(function(fl){
      html += '<div class="fcard">'+
        '<div class="fic">'+BB.icon('file')+'</div>'+
        '<div style="min-width:0;flex:1;"><div style="font-weight:600;color:var(--green-dark);font-size:.88rem;">'+BB.esc(fl.name)+'</div>'+
          '<div class="faint" style="font-size:.74rem;">'+BB.esc(fl.kind)+' · '+BB.date(fl.date)+' · '+BB.esc(fl.size||'')+'</div></div>'+
        '<button class="btn ghost sm" data-open="'+BB.esc(fl.name)+'" data-fk="'+BB.esc(fl.kind)+'">Open</button>'+
      '</div>';
    });
    html += '</div>';
  }
  html += '</div></div>';

  // ---- footer ----
  html += '<div class="foot">'+
    '<div class="row between" style="align-items:flex-start;gap:14px;">'+
      '<div><div class="brand">BioBrix · The Biological Way</div>'+
        '<div class="faint" style="font-size:.82rem;margin-top:3px;max-width:460px;">Your regenerative partner across Southern Africa. '+
          'Questions about your programme or an order? Speak to '+BB.esc(rep.name)+', your advisor.</div></div>'+
      '<div class="row" style="gap:8px;">'+
        (rep.cell? '<a class="btn ghost sm" href="tel:'+BB.esc(String(rep.cell).replace(/\s/g,''))+'">'+BB.icon('phone')+BB.esc(rep.cell)+'</a>' : '')+
        '<a class="btn ghost sm" href="https://claireboshoff.github.io/biobrix-website/" target="_blank" rel="noopener">Visit biobrix.co.za</a>'+
        '<a class="btn ghost sm" href="login.html">'+BB.icon('logout')+'Sign out · switch seat</a>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById('portalMain').innerHTML = html;
  chartJobs.forEach(function(fn){ try{ fn(); }catch(e){ console.warn('chart', e); } });
  bind();
  if(location.hash){ var tgt=document.querySelector(location.hash); if(tgt) setTimeout(function(){ tgt.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
}
window.addEventListener('hashchange', function(){ var tgt=location.hash&&document.querySelector(location.hash); if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'}); });

function bind(){
  var main = document.getElementById('portalMain');
  var ef=document.getElementById('editFarm'); if(ef) ef.onclick=function(){ window.__editFarm=!window.__editFarm; render(); };
  var sf=document.getElementById('saveFarm'); if(sf) sf.onclick=function(){
    var fid=currentFarmerId();
    d.update('farmers', fid, { ha:Number(document.getElementById('efHa').value)||0, crops:document.getElementById('efCrops').value.split(',').map(function(x){return x.trim();}).filter(Boolean), programmePct:Number(document.getElementById('efPct').value)||null, cell:document.getElementById('efCell').value.trim(), town:document.getElementById('efTown').value.trim() });
    window.__editFarm=false; BB.toast('Saved — '+String(d.rep(d.farmer(fid).rep).name).split(' ')[0]+' sees the update'); render();
  };

  // farmer approves a quote → order confirmed, advisor can invoice
  Array.prototype.forEach.call(main.querySelectorAll('button[data-qok]'), function(btn){
    btn.onclick=function(){
      var o=d.by('orders', this.dataset.qok); if(!o||!o.quote) return;
      var q=Object.assign({}, o.quote, { status:'Farmer approved', farmerApprovedAt:new Date().toISOString().slice(0,10) });
      d.update('orders', o.id, { quote:q, status:(o.status==='Forecast'||o.status==='Pending')?'Confirmed':o.status });
      var rp=d.rep(o.rep);
      d.add('feed', { from:'u_farmer', date:new Date().toISOString().slice(0,10), kind:'Order', farmer:o.farmer, ref:o.ref, text:d.farmer(o.farmer).name+' approved quote '+o.ref+' ('+BB.money(d.quoteTotal(o))+') in the farmer portal.' });
      BB.toast('Approved — '+String(rp.name).split(' ')[0]+' will invoice and book the delivery');
      render(); var t=document.getElementById('orders'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    };
  });
  // live 7-day weather → best application window
  var wx=document.getElementById('wxLine');
  if(wx){
    var fm=d.farmer(currentFarmerId());
    d.forecast7(fm.town).then(function(fc){
      if(!fc){ wx.innerHTML='Weather needs signal — your reminder will include the 7-day window.'; return; }
      var strip=fc.days.map(function(dy){ var dt=new Date(dy.date); return '<span title="'+dy.rain+'% rain · '+Math.round(dy.wind)+' km/h wind" style="display:inline-flex;flex-direction:column;align-items:center;min-width:34px;font-size:.7rem;">'+d.wxIcon(dy.code)+'<span>'+['Su','Mo','Tu','We','Th','Fr','Sa'][dt.getDay()]+'</span><span class="faint">'+Math.round(dy.tmax)+'°</span></span>'; }).join('');
      var b=fc.best; var bd=b?new Date(b.date):null;
      wx.innerHTML='<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;">'+strip+'</div>'+
        (b?'<div style="margin-top:6px;color:var(--green-mid);font-weight:600;">Good window to apply: '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][bd.getDay()]+' '+BB.date(b.date)+' — '+b.rain+'% rain chance, wind '+Math.round(b.wind)+' km/h.</div>':'');
    });
  }

  var sel = main.querySelector('#whoSel');
  if(sel) sel.onchange = function(){ setFarmerId(this.value); render(); window.scrollTo(0,0); };

  // an order row opens that order's card (its own buttons keep working)
  Array.prototype.forEach.call(main.querySelectorAll('tr[data-ocard]'), function(tr){
    tr.onclick=function(e){ if(e.target.closest('a,button,input,label')) return; openOrderCard(d.by('orders', tr.getAttribute('data-ocard'))); };
  });
  Array.prototype.forEach.call(main.querySelectorAll('button[data-reorder]'), function(btn){
    btn.onclick = function(){
      var oid = this.dataset.reorder;
      var o = d.by('orders', oid);
      if(!o) return;
      // financial controls — the farmer sees it here, not after a phone call
      var rp0=d.rep(o.rep);
      if(d.isOverdue(o.farmer)){
        BB.toast('We can\u2019t take this order yet — your account has an overdue invoice. Please make a payment or contact '+String(rp0.name).split(' ')[0]+' and we\u2019ll gladly place it.');
        var acc=document.getElementById('account'); if(acc) acc.scrollIntoView({behavior:'smooth',block:'start'}); return;
      }
      if(d.overLimit(o.farmer, d.orderValue(o))){
        BB.toast('This order takes your account over its credit limit of '+BB.money(d.creditLimit(o.farmer))+'. '+String(rp0.name).split(' ')[0]+' will call you to arrange it.'); return;
      }
      d.add('orders', {
        ref:'BB-'+Math.floor(1050 + Math.random()*900),
        farmer:o.farmer, rep:o.rep, date:new Date().toISOString().slice(0,10),
        deliverMonth:o.deliverMonth, status:'Pending', depot:o.depot, source:'Portal',
        lines:(o.lines||[]).map(function(l){ return { prod:l.prod, qty:l.qty }; })
      });
      BB.toast('Order placed — your advisor will confirm');
      render();
    };
  });

  Array.prototype.forEach.call(main.querySelectorAll('button[data-open]'), function(btn){
    btn.onclick = function(){
      location.href='document.html?farmer='+encodeURIComponent(currentFarmerId())+'&kind='+encodeURIComponent(this.dataset.fk||'Document')+'&name='+encodeURIComponent(this.dataset.open);
    };
  });

  Array.prototype.forEach.call(main.querySelectorAll('button[data-pay]'), function(btn){
    btn.onclick = function(){
      var iv = d.by('invoices', this.dataset.pay); if(!iv) return;
      var td=this.closest('td'); if(!td) return;
      td.innerHTML='<div style="display:grid;gap:6px;min-width:220px;text-align:left;">'+
        '<button class="btn sm" data-paycard="'+iv.id+'">'+BB.icon('wallet')+'Pay '+BB.money(iv.outstanding!=null&&iv.outstanding>0?iv.outstanding:iv.amount)+' by card</button>'+
        '<button class="btn ghost sm" data-payeft="'+iv.id+'">'+BB.icon('receipt')+'EFT — bank details &amp; proof</button>'+
      '</div>';
      // the amount, said plainly, before any money moves
      td.querySelector('button[data-paycard]').onclick=function(){
        var amt=iv.outstanding!=null&&iv.outstanding>0? iv.outstanding : iv.amount;
        BB.confirm('Pay '+BB.money(amt)+' by card for '+(iv.label||iv.ref)+'? Your card is charged through Yoco.', { title:'Pay '+BB.money(amt)+'?', ok:'Pay '+BB.money(amt) }).then(function(yes){
          if(!yes) return;
          d.update('invoices', iv.id, { status:'Paid', paidDate:new Date().toISOString().slice(0,10), method:'Card' }); BB.toast('Paid '+BB.money(amt)+' — thank you. Your statement is updated.'); render(); }); };
      td.querySelector('button[data-payeft]').onclick=function(){
        td.innerHTML='<div style="text-align:left;font-size:.78rem;line-height:1.5;min-width:240px;"><b>BioBrix (Pty) Ltd</b><br>FNB · Acc 62 000 000 000 · Branch 250655<br>Ref: <b>'+BB.esc(iv.ref)+'</b>'+
          '<div style="margin-top:8px;"><label class="btn ghost sm" style="cursor:pointer;">'+BB.icon('file')+'Upload proof of payment<input type="file" accept="image/*,.pdf" style="display:none;" data-pop="'+iv.id+'"></label></div></div>';
        td.querySelector('input[data-pop]').onchange=function(){ d.update('invoices', iv.id, { status:'Proof received', proofAt:new Date().toISOString().slice(0,10), method:'EFT' }); BB.toast('Proof received — we\u2019ll mark it paid as soon as the funds land.'); render(); };
      };
    };
  });
  Array.prototype.forEach.call(main.querySelectorAll('button[data-pay-OLD]'), function(btn){
    btn.onclick = function(){
      var iv = d.by('invoices', this.dataset.pay);
      if(!iv) return;
      d.update('invoices', iv.id, { status:'Paid', paidDate:new Date().toISOString().slice(0,10) });
      BB.toast('Payment received — thank you');
      render();
    };
  });
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="portalMain"></div></main>');
render();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
