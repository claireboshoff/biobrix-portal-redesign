<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioAnalyze — Soil · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign4"></script><script src="guard.js?v=redesign4"></script>
<script src="bb-data.js?v=redesign4"></script>
<script src="bb-shell.js?v=redesign4"></script>
<style>
/* BioAnalyze — page-scoped */
.detail{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin:2px 0 4px;}
.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
.reading{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.reading .rl{font-size:.64rem;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;}
.reading .rv{font-family:var(--display);font-size:1.15rem;font-weight:600;color:var(--green-dark);margin-top:2px;}
.interp{margin-top:8px;padding:11px 13px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:.86rem;}
.interp.ok{background:var(--ok-bg);color:var(--ok);}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;}
.ctx .chip .ico{width:14px;height:14px;transform:rotate(180deg);}
.mini h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--faint);margin-bottom:10px;}
table.bb tr.open td{background:#f3f8ec;}
table.bb tr.detail-row td{padding-top:0;background:#f3f8ec;}
.empty .big .ico{width:30px;height:30px;color:var(--faint);}
.card .empty{padding:26px 20px;}
.fld:last-of-type{margin-bottom:12px;}
.bbp .interp{margin-top:0;}
.bbp-meta .mwa{margin-left:10px;display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;background:#e9f9ef;color:#128C4A !important;border:1px solid #bfe8cf;font-size:.72rem;font-weight:600;}
.bbp-meta .mwa .ico{width:12px;height:12px;}
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var isAdvisor = u.roleKey==='advisor';
function esc(s){ return BB.esc(s); }

var blockParam = new URLSearchParams(location.search).get('block');

// advisor sees their own samples; a block filter narrows further
function baseRows(){
  var rows = d.all('soil');
  if(isAdvisor) rows = rows.filter(function(s){ return s.advisor===u.rep; });
  if(blockParam) rows = rows.filter(function(s){ return s.block===blockParam; });
  return rows.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}

// blocks available for the log form (advisor -> their farms' blocks)
function formBlocks(){
  var blocks = d.all('blocks');
  if(isAdvisor){
    var myFarms = d.where('farmers', function(f){ return f.rep===u.rep; }).map(function(f){ return f.id; });
    blocks = blocks.filter(function(b){ return myFarms.indexOf(b.farmer)>=0; });
  }
  return blocks;
}

// Status used to be chips above the samples; the funnel on the Status column does that now.
var openId = null;
var blockCtx = blockParam ? d.by('blocks', blockParam) : null;

// readings arrive as text from the lab ("2.1%", "12 ppm", "3.1:1") — read the number, never guess one
function numOf(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)? n : null; }
function microBadge(m){ if(!m) return '<span class="faint">—</span>'; var c=/low/i.test(m)?'b-warn':/high|good|excellent/i.test(m)?'b-ok':'b-lime'; return '<span class="badge '+c+'">'+esc(m)+'</span>'; }

// ---- popups: one sample's result, or the samples behind a figure / chart part ----
function canGo(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } }
function interpOk(s){ return /improv|maintain|balanced|good|hold/i.test(s.flag||''); }
// open a sample in the list below (expanded), without leaving the page
function showSample(id){
  BB.closePopup(); openId=id; render();
  setTimeout(function(){ var tr=document.querySelector('#soilMain tr.click[data-id="'+id+'"]'); if(!tr) return;
    if(tr.style.display==='none'){ BB.toast('That sample is hidden by a filter on the table'); return; }
    tr.scrollIntoView({ behavior:'smooth', block:'center' }); }, 120);
}
// ---- record cards (CONVENTIONS: "Record popups: the card pattern") ----
function initialsOf(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); }
function byDateDesc(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); }
function daysSince(iso){ return Math.max(0, Math.round((Date.now()-new Date(iso))/86400000)); }
function phoneMeta(f){
  if(!f.cell) return null;
  var wa='https://wa.me/'+String(f.cell).replace(/\D/g,'').replace(/^0/,'27')+'?text='+encodeURIComponent('Hi '+String(f.name).split(' ')[0]+', it\'s '+String(u.name).split(' ')[0]+' from BioBrix — ');
  return { icon:'phone', tip:'Phone', html:'<a href="tel:'+esc(String(f.cell).replace(/\s/g,''))+'">'+esc(f.cell)+'</a><a class="mwa" target="_blank" rel="noopener" href="'+esc(wa)+'">'+BB.icon('message')+'WhatsApp</a>' };
}
// the block's last walk, which also links to its monitoring
function walkMeta(bid){
  var w=d.where('watch', function(x){ return x.block===bid; }).sort(byDateDesc)[0];
  return { icon:'eye', tip:'BioWatch', text:w? 'Walked '+BB.shortDate(w.date)+' · vigour '+String(w.vigour||'—').toLowerCase() : 'Not walked yet', muted:!w, href:canGo('biowatch.html')?'biowatch.html?block='+encodeURIComponent(bid):null };
}
function markInterp(id){ var undo=BB.snapshot('soil', id); d.update('soil', id, { status:'Interpreted' }); BB.toast('Marked as interpreted', { undo:function(){ undo(); render(); }, undone:'Back to waiting for interpretation' }); BB.closePopup(); render(); var s=d.by('soil', id); if(s) setTimeout(function(){ BB.popup(samplePopup(s)); }, 180); }
// one sample as a card: who, where and when on the left with its key readings; the full read on the right
function samplePopup(s){
  var f=d.farmer(s.farmer), b=d.by('blocks',s.block)||{name:'—'}, isI=s.status==='Interpreted', adv=s.advisor && !(isAdvisor && s.advisor===u.rep) ? d.rep(s.advisor) : null;
  var low=isI && /low/i.test(s.microbial||''), lowNote=low && !/biology/i.test(s.flag||''), wait=daysSince(s.date), canMark=(u.roleKey==='director'||u.roleKey==='advisor');
  var acts=[{ label:'Show in list', onClick:function(){ showSample(s.id); } }];
  if(isI && canGo('bioconsult.html')) acts.push({ label:'Create recommendation', primary:true, href:'bioconsult.html?farmer='+encodeURIComponent(s.farmer)+'&block='+encodeURIComponent(s.block) });
  if(!isI && canMark) acts.push({ label:'Mark as interpreted', primary:true, onClick:function(){ markInterp(s.id); } });
  var html;
  if(isI){
    html=(lowNote?'<div class="bbp-alert warn">'+BB.icon('alert')+'Low biology — feed the soil life first</div>':'')+
      '<div class="bbp-tt">Readings</div><div class="scroll"><table class="bb" data-nofilter="1"><thead><tr><th>pH</th><th>Organic matter</th><th>Ca:Mg</th><th>Microbial</th><th>Phosphorus</th></tr></thead><tbody><tr>'+
      [s.ph, s.om, s.ca_mg, s.microbial, s.p].map(function(v){ return '<td>'+(v!=null&&v!==''? esc(v) : '—')+'</td>'; }).join('')+'</tr></tbody></table></div>'+
      '<div class="interp'+(interpOk(s)?' ok':'')+'" style="margin-top:12px;"><b>Interpretation:</b> '+esc(s.flag||'—')+'</div>';
  } else {
    html=(wait>21?'<div class="bbp-alert warn">'+BB.icon('alert')+'Waiting '+wait+' days — chase the lab</div>':'')+
      '<div class="bbp-bar" style="margin-top:0;"><span class="faint">'+esc(s.flag||'Awaiting laboratory results — readings appear once interpreted.')+'</span></div>';
  }
  return { wide:isI, layout:isI?'split':null, color:null, sub:null, eyebrow:'Soil sample', title:b.name,
    meta:[ { icon:'calendar', text:'Sampled '+BB.date(s.date), tip:'Sampled' },
      { icon:'farm', text:f.farm||f.name, tip:'Farm', href:canGo('farm-detail.html')?'farm-detail.html?farmer='+encodeURIComponent(s.farmer):null },
      { icon:'user', text:f.name, tip:'Farmer' }, phoneMeta(f), b.crop? { icon:'sprout', text:b.crop, tip:'Crop' } : null, walkMeta(s.block),
      adv? { initials:initialsOf(adv.name), color:adv.colour, text:adv.name, tip:'Advisor' } : null ],
    stats: isI ? [{ l:'Status', html:BB.statusBadge(s.status) }, { l:'pH', v:s.ph!=null?String(s.ph):'—' }, { l:'Microbial', v:s.microbial||'—', cls:low?'warn':'' }, { l:'Ca:Mg', v:s.ca_mg||'—' }]
               : [{ l:'Status', html:BB.statusBadge(s.status) }, { l:'Waiting', v:wait+' day'+(wait===1?'':'s'), s:'since sampling', cls:wait>21?'warn':'' }],
    html:html, actions:acts };
}
// the samples behind a figure or a chart part; a row opens that sample's card
function sampleDetail(list){
  list=list.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  return { color:null, sub:null, table:{ columns:['Date','Farmer / block','pH','Status','Reading'], rows:list.map(function(s){ var f=d.farmer(s.farmer), b=d.by('blocks',s.block)||{name:'—'};
      return { cells:[{ html:'<span style="white-space:nowrap;">'+BB.shortDate(s.date)+'</span>' }, { html:'<b>'+esc(f.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.name)+'</div>' }, s.status==='Interpreted'&&s.ph!=null?String(s.ph):'—', { html:BB.statusBadge(s.status) }, { html:'<span style="font-size:.78rem;">'+esc(s.flag||'—')+'</span>' }],
        onClick:function(){ BB.popup(samplePopup(s)); } }; }), num:[2] } };
}
function toSamples(){ BB.closePopup(); var el=document.getElementById('sampleList'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
var TILE={};
BB.statDetail('soilAwait', function(){ return Object.assign(sampleDetail(TILE.await||[]), { actions:[{ label:'Open the full list', primary:true, onClick:toSamples }] }); });
BB.statDetail('soilInterp', function(){ return Object.assign(sampleDetail(TILE.interp||[]), { actions:[{ label:'Open the full list', primary:true, onClick:toSamples }] }); });
BB.statDetail('soilBlocks', function(){
  var rows=TILE.all||[], ids=rows.map(function(s){ return s.block; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; });
  var go=canGo('farm-detail.html');
  return { table:{ columns:['Block','Farmer','Samples','Latest'], rows:ids.map(function(bid){ var b=d.by('blocks',bid)||{name:'—'}, mine=rows.filter(function(s){ return s.block===bid; }), last=mine[0], f=d.farmer(b.farmer||(last&&last.farmer));
      return { cells:[{ html:'<b>'+esc(b.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.crop||'')+'</div>' }, f.name, String(mine.length), { html:last? BB.statusBadge(last.status)+' <span class="faint" style="font-size:.74rem;">'+BB.shortDate(last.date)+'</span>' : '—' }],
        href:'bioanalyze-soil.html?block='+encodeURIComponent(bid) }; }), num:[2] },
    actions:[{ label:'Open the full list', primary:true, onClick:toSamples }] };
});

function statBar(rows){
  var awaitL = rows.filter(function(s){ return s.status==='New'||s.status==='Awaiting lab'; }), awaiting = awaitL.length;
  var interpL = rows.filter(function(s){ return s.status==='Interpreted'; }), interp = interpL.length;
  var blocksN = rows.map(function(s){ return s.block; }).filter(function(v,i,a){ return v && a.indexOf(v)===i; }).length;
  TILE = { await:awaitL, interp:interpL, all:rows };
  var html='<div class="grid g4" style="margin-top:12px;">';
  html += '<div class="stat"><div class="l">Samples</div><div class="v">'+rows.length+'</div><div class="s">'+(blockCtx?'on this block':'in view')+'</div></div>';
  html += '<a class="stat tap'+(awaiting>0?' warn':'')+'" href="#sampleList" data-detail="soilAwait"><div class="l">Awaiting interpretation</div><div class="v">'+awaiting+'</div><div class="s">new + at lab</div></a>';
  html += '<a class="stat tap" href="#sampleList" data-detail="soilInterp"><div class="l">Interpreted</div><div class="v">'+interp+'</div><div class="s">this season</div></a>';
  html += '<a class="stat tap" href="#sampleList" data-detail="soilBlocks"><div class="l">Blocks sampled</div><div class="v">'+blocksN+'</div><div class="s">'+(blockCtx?esc(blockCtx.crop||''):'with at least one sample')+'</div></a>';
  html += '</div>';
  return html;
}

function detailPanel(s){
  var f=d.farmer(s.farmer), b=d.by('blocks',s.block)||{name:'—'}, adv=d.rep(s.advisor);
  var html='<div class="detail">';
  html += '<div class="row between"><div><b>'+esc(f.name)+'</b> · '+esc(b.name)+'<div class="faint" style="font-size:.76rem;">Sampled '+BB.date(s.date)+' · advisor '+esc(adv.name)+'</div></div>'+BB.statusBadge(s.status)+'</div>';
  if(s.status==='Interpreted'){
    html += '<div class="readings">'+
      '<div class="reading"><div class="rl">pH</div><div class="rv">'+esc(s.ph)+'</div></div>'+
      '<div class="reading"><div class="rl">Organic matter</div><div class="rv">'+esc(s.om)+'</div></div>'+
      '<div class="reading"><div class="rl">Ca:Mg</div><div class="rv">'+esc(s.ca_mg)+'</div></div>'+
      '<div class="reading"><div class="rl">Microbial</div><div class="rv">'+esc(s.microbial)+'</div></div>'+
      '<div class="reading"><div class="rl">Phosphorus</div><div class="rv">'+esc(s.p)+'</div></div>'+
    '</div>';
    var ok = /improv|maintain|balanced|good|hold/i.test(s.flag||'');
    html += '<div class="interp'+(ok?' ok':'')+'"><b>Interpretation:</b> '+esc(s.flag)+'</div>';
    html += '<div class="row" style="margin-top:12px;">'+
      '<a class="btn" href="bioconsult.html?farmer='+encodeURIComponent(s.farmer)+'&block='+encodeURIComponent(s.block)+'">Create BioConsult recommendation</a>'+
      '<a class="btn ghost" href="biowatch.html?block='+encodeURIComponent(s.block)+'">Monitor this block</a>'+
    '</div>';
  } else {
    html += '<div class="interp"><b>Status:</b> '+esc(s.flag||'Awaiting laboratory results — readings appear once interpreted.')+'</div>';
    if(u.roleKey==='director'||u.roleKey==='advisor'){
      html += '<div class="row" style="margin-top:12px;"><button class="btn ghost sm" data-interp="'+esc(s.id)+'">Mark as interpreted</button></div>';
    }
  }
  html += '</div>';
  return html;
}

function logForm(){
  var blocks = formBlocks();
  var opts = blocks.map(function(b){
    var f=d.farmer(b.farmer);
    return '<option value="'+esc(b.id)+'"'+(blockParam===b.id?' selected':'')+'>'+esc(f.name)+' — '+esc(b.name)+'</option>';
  }).join('');
  var html='<div class="card" id="logSample"><div class="card-h"><div><h3>Log a soil sample</h3><div class="sub">saves on this device and syncs when you have signal</div></div></div><div class="card-p">';
  html += '<div class="fld"><label>Block</label><select id="fBlock">'+opts+'</select></div>';
  html += '<div class="grid g2" style="gap:12px;">';
  html += '<div class="fld"><label>Date sampled</label><input id="fDate" type="date" value="2026-07-28"></div>';
  html += '<div class="fld"><label>Status</label><select id="fStatus"><option>New</option><option>Awaiting lab</option></select></div>';
  html += '</div>';
  html += '<div class="fld"><label>Field note (optional)</label><input id="fNote" type="text" placeholder="e.g. Collected top 20cm, wet block"></div>';
  html += '<button class="btn block" id="fSave">'+BB.icon('plus')+'Save sample</button>';
  html += '</div></div>';
  return html;
}

function render(){
  var rows = baseRows();
  var shown = rows;

  var html='';
  html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">BioServices · BioAnalyze</div><h1>BioAnalyze — Soil</h1><p>'+
    (blockCtx?'Soil results for '+esc(blockCtx.name)+'. ':'')+
    'Soil read as a living system — pH, organic matter, Ca:Mg balance, microbial life and phosphorus.</p></div>'+
    '<div class="row" style="gap:8px;"><a class="btn ghost" href="bioanalyze-leaf.html'+(blockParam?'?block='+encodeURIComponent(blockParam):'')+'">'+BB.icon('leaf')+'Leaf results</a>'+
    '<a class="btn" href="#logSample">'+BB.icon('plus')+'Log a sample</a></div></div>';

  if(blockCtx){
    html += '<div class="ctx"><a class="chip" href="bioanalyze-soil.html">'+BB.icon('chevron')+'All blocks</a>'+
      '<span class="chip on">'+esc(d.farmer(blockCtx.farmer).name)+' — '+esc(blockCtx.name)+'</span></div>';
  }

  html += statBar(rows);

  // The picture: interpreted readings compared block by block, beside where the samples stand
  var interp = rows.filter(function(s){ return s.status==='Interpreted'; });
  var omRows = interp.filter(function(s){ return numOf(s.om)!=null; });
  var pRows  = interp.filter(function(s){ return numOf(s.p)!=null; });
  var cmp = interp.length>=2;
  html += '<div class="split" style="margin-top:16px;">';
  html += '<div class="card"><div class="card-h"><div><h3>Readings by block</h3><div class="sub">interpreted samples in view · as reported by the lab · tap a block for its interpretation</div></div></div>';
  if(cmp){
    var maxOm = Math.max.apply(null, omRows.map(function(s){ return numOf(s.om); }).concat([0.0001]));
    var maxP  = Math.max.apply(null, pRows.map(function(s){ return numOf(s.p); }).concat([0.0001]));
    html += '<div class="scroll"><table class="bb"><thead><tr><th>Block</th><th class="num">pH</th><th class="num">Organic matter</th><th class="num">Ca:Mg</th><th class="num">Phosphorus</th><th>Microbial</th></tr></thead><tbody>';
    interp.forEach(function(s){
      var f=d.farmer(s.farmer), b=d.by('blocks',s.block)||{name:'—'};
      var om=numOf(s.om), p=numOf(s.p);
      html += '<tr class="click" data-reading="'+esc(s.id)+'"><td style="min-width:170px;"><b>'+esc(b.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(f.name)+' · '+BB.shortDate(s.date)+'</div></td>'+
        '<td class="num">'+(s.ph!=null?'<b>'+esc(s.ph)+'</b>':'<span class="faint">—</span>')+'</td>'+
        '<td class="num">'+(om!=null?'<div class="bar-cell" style="justify-content:flex-end;"><span class="trk" style="max-width:70px;"><i style="width:'+Math.round(om/maxOm*100)+'%"></i></span><span>'+esc(s.om)+'</span></div>':'<span class="faint">—</span>')+'</td>'+
        '<td class="num">'+esc(s.ca_mg||'—')+'</td>'+
        '<td class="num">'+(p!=null?'<div class="bar-cell" style="justify-content:flex-end;"><span class="trk" style="max-width:70px;"><i style="width:'+Math.round(p/maxP*100)+'%;background:#2f6f9e;"></i></span><span>'+esc(s.p)+'</span></div>':'<span class="faint">—</span>')+'</td>'+
        '<td>'+microBadge(s.microbial)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  } else if(interp.length===1){
    var s1=interp[0];
    html += '<div class="card-p"><div class="readings" style="margin:0;">'+
      '<div class="reading"><div class="rl">pH</div><div class="rv">'+esc(s1.ph)+'</div></div>'+
      '<div class="reading"><div class="rl">Organic matter</div><div class="rv">'+esc(s1.om)+'</div></div>'+
      '<div class="reading"><div class="rl">Ca:Mg</div><div class="rv">'+esc(s1.ca_mg)+'</div></div>'+
      '<div class="reading"><div class="rl">Microbial</div><div class="rv">'+esc(s1.microbial)+'</div></div>'+
      '<div class="reading"><div class="rl">Phosphorus</div><div class="rv">'+esc(s1.p)+'</div></div>'+
    '</div><div class="faint" style="font-size:.78rem;margin-top:10px;">One interpreted sample in view — '+BB.date(s1.date)+'. Readings compare here once there are two.</div></div>';
  } else {
    html += '<div class="empty">No interpreted results in view yet. Readings appear here once the lab results are interpreted.</div>';
  }
  html += '</div>';
  html += '<div class="card"><div class="card-h"><div><h3>Where the samples are</h3><div class="sub">'+rows.length+' in view</div></div></div><div class="card-p">'+
    (rows.length?'<div id="chStatus"></div>':'<div class="empty" style="padding:16px;">No samples yet.</div>')+'</div></div>';
  html += '</div>';

  // The work: the sample queue beside the log form
  html += '<div class="split" style="margin-top:16px;align-items:start;">';
  html += '<div class="card" id="sampleList" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Samples</h3><div class="sub">newest first · tap a row for the full result · filter by status with the funnel</div></div>'+
    '<span class="badge b-grey">'+rows.length+'</span></div>';

  html += '<div class="scroll"><table class="bb"><thead><tr>'+
    '<th>Date</th><th>Farmer / block</th><th class="num">pH</th><th class="num">Ca:Mg</th><th>Microbial</th><th>Status</th></tr></thead><tbody>';

  if(!shown.length){
    html += '<tr><td colspan="6"><div class="empty"><div class="big">'+BB.icon('flask')+'</div>No soil samples here yet.</div></td></tr>';
  }

  shown.forEach(function(s){
    var f=d.farmer(s.farmer), b=d.by('blocks',s.block)||{name:'—'};
    var isInterp = s.status==='Interpreted';
    html += '<tr class="click'+(openId===s.id?' open':'')+'" data-id="'+esc(s.id)+'">'+
      '<td style="white-space:nowrap;">'+BB.date(s.date)+'</td>'+
      '<td style="min-width:150px;"><b>'+esc(f.name)+'</b><div class="faint" style="font-size:.72rem;">'+esc(b.name)+'</div></td>'+
      '<td class="num">'+(isInterp?esc(s.ph):'<span class="faint">—</span>')+'</td>'+
      '<td class="num">'+(isInterp?esc(s.ca_mg):'<span class="faint">—</span>')+'</td>'+
      '<td>'+(isInterp?microBadge(s.microbial):'<span class="faint">—</span>')+'</td>'+
      '<td>'+BB.statusBadge(s.status)+'</td>'+
    '</tr>';
    if(openId===s.id){
      html += '<tr class="detail-row"><td colspan="6">'+detailPanel(s)+'</td></tr>';
    }
  });

  html += '</tbody></table></div></div>';

  html += logForm();
  html += '</div>';
  html += '<div style="height:20px;"></div>';

  document.getElementById('soilMain').innerHTML=html;
  bind();

  // status split — counted from the rows in view
  try{
    if(rows.length){
      var ST=[['New','#7d4f9a'],['Awaiting lab','#c77d17'],['Interpreted','#3f6b28']];
      var stRows = ST.map(function(x){ return { label:x[0], value:rows.filter(function(s){ return s.status===x[0]; }).length, color:x[1] }; });
      var other = rows.filter(function(s){ return ST.every(function(x){ return x[0]!==s.status; }); }).length;
      if(other) stRows.push({ label:'Other', value:other, color:'#6b7a5e' });
      BB.chart.donut('#chStatus', { rows:stRows, centreLabel:'samples', valueLabel:'Samples',
        // the samples in that state
        detail:function(ctx){ var lbl=ctx.row.label;
          return sampleDetail(rows.filter(function(s){ return lbl==='Other' ? ST.every(function(x){ return x[0]!==s.status; }) : s.status===lbl; })); } });
    }
  }catch(e){ console.warn('chart', e); }
}

function bind(){
  var main=document.getElementById('soilMain');
  Array.prototype.forEach.call(main.querySelectorAll('tr[data-reading]'), function(row){
    row.onclick=function(){ var s=d.by('soil', this.dataset.reading); if(s) BB.popup(samplePopup(s)); };
  });
  Array.prototype.forEach.call(main.querySelectorAll('tr.click[data-id]'), function(row){
    row.onclick=function(){ var rid=this.dataset.id; openId = openId===rid ? null : rid; render(); };
  });
  Array.prototype.forEach.call(main.querySelectorAll('[data-interp]'), function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var sid=this.dataset.interp, undo=BB.snapshot('soil', sid);
      d.update('soil', sid, { status:'Interpreted' });
      BB.toast('Marked as interpreted', { undo:function(){ undo(); render(); }, undone:'Back to waiting for interpretation' });
      render();
    };
  });
  var save=document.getElementById('fSave');
  if(save){
    save.onclick=function(){
      var blockId=document.getElementById('fBlock').value;
      var block=d.by('blocks',blockId);
      if(!block){ BB.toast('Choose a block first'); return; }
      var rec={
        block:blockId, farmer:block.farmer, date:document.getElementById('fDate').value||'2026-07-28',
        status:document.getElementById('fStatus').value, ph:null, om:null, ca_mg:null, microbial:null, p:null,
        flag:document.getElementById('fNote').value||'Sampled — pending interpretation', advisor:(u.rep||block.rep||null)
      };
      d.add('soil', rec);
      BB.toast('Soil sample saved');
      openId=null; render();
    };
  }
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="soilMain"></div></main>');
render();
// ?open=<sample id>: another page sent you to one sample — open its card (only one this seat may see)
(function(){ var oid=new URLSearchParams(location.search).get('open'), s=oid && baseRows().filter(function(x){ return x.id===oid; })[0]; if(s) setTimeout(function(){ BB.popup(samplePopup(s)); }, 200); })();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
