<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioBrix OS — Home</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BioBrix">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<script src="bb-intel.js?v=redesign1"></script>
<style>
/* ── Insights (moved from the Intelligence page) ── */
.alert-list{max-height:440px;overflow:auto;}
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 20px;border-top:1px solid var(--line-soft);color:inherit;transition:background .12s;}
.alert:first-child{border-top:0;}
.alert:hover{background:#fafcf7;}
.alert .sv{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;}
.alert .tx{flex:1;min-width:0;font-size:.86rem;line-height:1.45;}
.alert .badge{flex:none;}
/* rows that open a preview over the page */
.pop-row{cursor:pointer;transition:background .12s;}
.pop-row:hover{background:#fafcf7;}
.health-list{max-height:440px;overflow:auto;}
.cover .bar-cell{min-width:150px;}
.cover .bar-cell span{font-size:.8rem;white-space:nowrap;min-width:64px;text-align:right;}
@media(max-width:560px){ .alert{padding:11px 14px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'home' });

var d = BB.data, u = BB.user;
// the accounting snapshot, read once — several sections below decide what to show from it
var sage = d.sage && d.sage();
var isDir = u.roleKey==='director', isAdvisor=u.roleKey==='advisor',
    isOps=u.roleKey==='operations', isWh=u.roleKey==='warehouse', isFin=u.roleKey==='finance';
var hour = new Date().getHours();
var greet = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
var first = u.name.split(' ')[0];

// ---- live pulse numbers ----
var orders = d.all('orders');
var openForecast = orders.filter(function(o){return o.status==='Forecast'||o.status==='Pending';});
var forecastVal = openForecast.reduce(function(s,o){return s+d.orderValue(o);},0);
var confirmedVal = orders.filter(function(o){return o.status==='Confirmed'||o.status==='Delivered';}).reduce(function(s,o){return s+d.orderValue(o);},0);
var lowStock = d.all('inventory').filter(function(i){return i.qty<i.reorder;}).length;
var newSoil = d.all('soil').filter(function(s){return s.status==='New'||s.status==='Awaiting lab';}).length;
var newLeaf = d.all('leaf').filter(function(l){return l.status==='New';}).length;
var awaitingStock = orders.filter(function(o){return o.status==='Awaiting stock';}).length;
var myFarmers = u.rep ? d.where('farmers',function(f){return f.rep===u.rep;}).length : d.all('farmers').length;

var fhSeat = /@freedomhub\.io$/i.test(u.email||'');
var clientLive = !!(BB.auth && BB.auth.tenantLive ? BB.auth.tenantLive() : (sage && sage.live));

// ---- Popups: the records behind a figure, a chart part or a row (CONVENTIONS: clicks open popups) ----
// Built only from what this page already reads; a page a seat may not open is never offered.
var canGo = function(href){ try{ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }catch(e){ return true; } };
var farmHref = function(id){ return id && canGo('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(id) : null; };
var bold = function(t){ return { html:'<b>'+BB.esc(t)+'</b>' }; };
var POP_CAP = 100;
var capNote = function(n){ return n>POP_CAP ? 'Showing the first '+POP_CAP+' of '+n+'. The totals count all '+n+'.' : null; };
// the same markup BB.popup draws, for popups that carry more than one table
var popTableHtml = function(title, t){
  var nc=t.num||[];
  return (title?'<div class="eyebrow" style="margin:14px 0 6px;">'+BB.esc(title)+'</div>':'')+
    '<div class="scroll"><table class="bb" data-nofilter="1"><thead><tr>'+t.columns.map(function(c,i){ return '<th'+(nc.indexOf(i)>=0?' class="num"':'')+'>'+BB.esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    (t.rows.length? t.rows.map(function(r){ return '<tr'+(r.href?' class="click" data-href="'+BB.esc(r.href)+'"':'')+'>'+r.cells.map(function(c,i){ return '<td'+(nc.indexOf(i)>=0?' class="num"':'')+'>'+(c&&c.html!=null?c.html:BB.esc(c==null?'—':c))+'</td>'; }).join('')+'</tr>'; }).join('')
      : '<tr><td colspan="'+t.columns.length+'"><div class="empty">Nothing to show.</div></td></tr>')+'</tbody></table></div>';
};
// Orders: ref, farmer, rep, status, value — biggest first, with a total.
var orderTable = function(list){
  var href = canGo('orders.html') ? 'orders.html' : null, tot=0;
  var rows = list.slice().sort(function(a,b){ return d.orderValue(b)-d.orderValue(a); }).map(function(o){
    var f=d.farmer(o.farmer), v=d.orderValue(o); tot+=v;
    return { cells:[o.ref||'—', f.name+(f.farm&&f.farm!==f.name?' · '+f.farm:''), d.rep(o.rep).name, { html:BB.statusBadge(o.status) }, BB.money(v)], href:href };
  });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' orders'),'','','',bold(BB.money(tot))] });
  return { columns:['Order','Farmer','Rep','Status','Value'], rows:rows, num:[4] };
};
// Invoices, from either source: the portal store (farmer id) or the raw ledger snapshot (customer id).
var sgCust = {}, sgFarm = {};
if(sage && sage.live){ (sage.customers||[]).forEach(function(c){ sgCust[c.id]=c; }); d.all('farmers').forEach(function(f){ if(f.sageId!=null) sgFarm[f.sageId]=f.id; }); }
var openAmt = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
var invFromStore = function(i){ var f=d.farmer(i.farmer); return { ref:i.label||i.ref, who:f.name, farmer:i.farmer, date:i.date, due:i.dueDate, amount:i.amount||0, open:openAmt(i), status:i.status }; };
var invFromSage = function(i){ var c=sgCust[i.customer]||{}; return { ref:i.label||i.ref, who:c.name||'—', farmer:sgFarm[i.customer]||null, date:i.date, due:i.dueDate, amount:i.amount||0, open:openAmt(i), status:i.status }; };
var invTable = function(list, oneCust){
  var t0=new Date(new Date().toISOString().slice(0,10)), ta=0, to=0;
  list.forEach(function(x){ ta+=x.amount; to+=x.open; });
  var rows = list.slice(0,POP_CAP).map(function(x){
    var dd = x.due ? Math.round((t0-new Date(x.due))/86400000) : 0;
    return { cells:[x.ref||'—', x.who, BB.date(x.date), { html:BB.esc(BB.date(x.due))+(x.open>0.5&&dd>0?' <span class="faint">· '+dd+' d over</span>':'') }, BB.money(x.amount), x.open>0.5?BB.money(x.open):'—', { html:BB.statusBadge(x.status) }], href:farmHref(x.farmer) };
  });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' invoices'),'','','',bold(BB.money(ta)),bold(BB.money(to)),''] });
  var t = { columns:['Invoice','Customer','Date','Due','Amount','Outstanding','Status'], rows:rows, num:[4,5] };
  // one customer's invoices: the name is in the title, not on every line
  if(oneCust){ t.columns.splice(1,1); t.rows.forEach(function(r){ r.cells.splice(1,1); }); t.num=[3,4]; }
  return t;
};
var receiptTable = function(list){
  var tot=0; list.forEach(function(x){ tot+=(x.amount||0); });
  var rows = list.slice(0,POP_CAP).map(function(x){ var c=sgCust[x.customer]||d.farmer(x.farmer)||{}; return { cells:[x.ref||'—', c.name||'—', BB.date(x.date), BB.money(x.amount||0)], href:farmHref(sgFarm[x.customer]||x.farmer) }; });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' receipts'),'','',bold(BB.money(tot))] });
  return { columns:['Receipt','Customer','Date','Amount'], rows:rows, num:[3] };
};
// Ledger customers: balance against limit.
var custTable = function(list){
  return { columns:['Customer','Town','Balance','Limit','Over by'], num:[2,3,4], rows:list.slice(0,POP_CAP).map(function(c){
    var over = c.creditLimit>0 ? (c.balance||0)-c.creditLimit : 0;
    return { cells:[{ html:BB.esc(c.name||'—')+(c.onHold?' <span class="badge b-bad">On hold</span>':'') }, c.town||'—', BB.money(c.balance||0), c.creditLimit>0?BB.money(c.creditLimit):'—', over>0?BB.money(over):'—'], href:farmHref(sgFarm[c.id]) }; }) };
};
var sampleTable = function(soil, leaf){
  var bl=function(id){ return (d.by('blocks',id)||{name:'—'}).name; };
  var rows = soil.map(function(s){ return { cells:['Soil', d.farmer(s.farmer).farm, bl(s.block), BB.date(s.date), { html:BB.statusBadge(s.status) }], href:canGo('bioanalyze-soil.html')?'bioanalyze-soil.html?block='+s.block:null }; })
    .concat(leaf.map(function(l){ return { cells:['Leaf', d.farmer(l.farmer).farm, bl(l.block), BB.date(l.date), { html:BB.statusBadge(l.status) }], href:canGo('bioanalyze-leaf.html')?'bioanalyze-leaf.html?block='+l.block:null }; }));
  return { columns:['Sample','Farm','Block','Taken','Status'], rows:rows };
};
var stockTable = function(list){
  return { columns:['Product','Depot','On hand','Reorder at'], num:[2,3], rows:list.map(function(i){ return { cells:[d.product(i.prod).name, d.depot(i.depot).name, BB.num(i.qty), BB.num(i.reorder)] }; }) };
};

// ---- pulse tiles per role ----
// Each tile that counts a list carries `href` (the page that holds the list) and `pop` (that list, in a popup).
var awaitingQ = orders.filter(function(o){return d.quoteStatus(o)==='Awaiting approval';});
var confirmedO = orders.filter(function(o){return o.status==='Confirmed'||o.status==='Delivered';});
var soilIn = d.all('soil').filter(function(s){return s.status==='New'||s.status==='Awaiting lab';}), leafIn = d.all('leaf').filter(function(l){return l.status==='New';});
var lowInv = d.all('inventory').filter(function(i){return i.qty<i.reorder;});
var transitD = d.where('deliveries',function(x){return x.status==='In transit';});
var uninvO = orders.filter(function(o){return (o.status==='Delivered'||o.status==='Confirmed') && !d.orderInvoiced(o.id);});
var chainO = orders.filter(function(o){return !!d.quoteStatus(o) && !d.orderInvoiced(o.id);});
var draftsO = d.all('outbox').filter(function(x){return x.status==='Draft';});
var unpaidI = d.all('invoices').filter(function(i){return i.status!=='Paid';});
var myOrders = orders.filter(function(o){return o.rep===u.rep;});
var myProgs = d.where('programs',function(p){return p.advisor===u.rep&&p.status==='Active';});
var blendHref = canGo('operations.html') ? 'operations.html' : 'depots.html';
var popOrders = function(list, sub){ return function(){ return { sub:sub, wide:true, table:orderTable(list) }; }; };
var popSamples = function(){ return { sub:'soil and leaf samples waiting for a person', table:sampleTable(soilIn, leafIn) }; };
var popStock = function(){ return { sub:'below the reorder level, per depot', table:stockTable(lowInv) }; };
var popBlend = function(list){ return function(){ return { sub:'blending and mixing jobs', table:{ columns:['Recipe','Depot','Batch','For','Due','Status'], rows:list.map(function(b){ return { cells:[b.recipe, d.depot(b.depot).name, b.batch, d.farmer(b.for).farm, BB.date(b.due), { html:BB.statusBadge(b.status) }] }; }) } }; }; };
var popDeliv = function(){ return { sub:'on the road now', table:{ columns:['Order','Farm','Depot','ETA','Transport'], rows:transitD.map(function(x){ var o=d.by('orders',x.order)||{}; return { cells:[o.ref||'—', d.farmer(x.farmer).farm, d.depot(x.depot).name, BB.date(x.eta), x.transport||'—'], href:canGo('deliveries.html')?'deliveries.html':null }; }) } }; };
var PULSE = {
  director: [
    {l:'Pipeline (forecast)', v:BB.money(forecastVal), s:openForecast.length+' open orders', href:canGo('forecast.html')?'forecast.html':'orders.html', pop:popOrders(openForecast,'forecast and pending orders')},
    {l:'Confirmed value', v:BB.money(confirmedVal), s:'this season', ok:1, href:'orders.html', pop:popOrders(confirmedO,'confirmed and delivered orders')},
    {l:'Quotes to approve', v:awaitingQ.length, s:'in Orders — tap to approve', warn:awaitingQ.length>0, href:'orders.html', pop:popOrders(awaitingQ,'quotes waiting for your approval')},
    {l:'Samples in', v:(newSoil+newLeaf), s:'soil + leaf to action', warn:(newSoil+newLeaf)>0, href:'bioanalyze-soil.html', pop:popSamples}
  ],
  advisor: [
    {l:'My farmers', v:myFarmers, s:u.region, href:'farms.html', pop:function(){ var fs=u.rep ? d.where('farmers',function(f){return f.rep===u.rep;}) : d.all('farmers');
      return { sub:'the farmers you look after', table:{ columns:['Farmer','Farm','Town','Status'], rows:fs.map(function(f){ return { cells:[f.name, f.farm, f.town||'—', { html:BB.statusBadge(f.status||'') }], href:farmHref(f.id) }; }) } }; }},
    {l:'Samples to interpret', v:(newSoil+newLeaf), s:'soil + leaf', warn:(newSoil+newLeaf)>0, href:'bioanalyze-soil.html', pop:popSamples},
    {l:'Active programmes', v:myProgs.length, s:'BioConsult', href:'bioconsult.html', pop:function(){
      return { sub:'your active BioConsult programmes', table:{ columns:['Farm','Crop','Season','Goal'], rows:myProgs.map(function(p){ return { cells:[d.farmer(p.farmer).farm, p.crop||'—', p.season||'—', p.goal||'—'], href:farmHref(p.farmer) }; }) } }; }},
    {l:'My pipeline', v:BB.money(myOrders.reduce(function(s,o){return s+d.orderValue(o);},0)), s:'this season', href:'orders.html', pop:popOrders(myOrders,'every order you have captured this season')}
  ],
  finance: [
    {l:'Outstanding', v:BB.money(unpaidI.reduce(function(s,i){return s+(i.amount||0);},0)), s:d.all('invoices').filter(function(i){return i.status==='Overdue';}).length+' overdue', warn:d.all('invoices').some(function(i){return i.status==='Overdue';}),
      href:'finance.html?show=open', pop:function(){ return { sub:'invoices not yet paid', table:invTable(unpaidI.map(invFromStore).sort(function(a,b){ return b.open-a.open; })) }; }},
    {l:'Delivered, uninvoiced', v:uninvO.length, s:'reported as sales', warn:uninvO.length>0, href:'finance.html', pop:popOrders(uninvO,'delivered or confirmed, with no invoice yet')},
    {l:'Quotes in the chain', v:chainO.length, s:'awaiting approval → invoice', href:'orders.html', pop:popOrders(chainO,'quoted and not yet invoiced')},
    {l:'Reminders drafted', v:draftsO.length, s:'check & send', warn:draftsO.length>0, href:'finance.html#outbox', pop:function(){
      return { sub:'drafts waiting in the Finance outbox', table:{ columns:['To','Subject','Channel','Drafted'], rows:draftsO.map(function(x){ return { cells:[d.farmer(x.to).name, x.subject||'—', x.channel||'—', BB.date(x.created)] }; }) } }; }}
  ],
  operations: [
    {l:'Orders to action', v:orders.filter(function(o){return o.status==='Pending'||o.status==='Awaiting stock';}).length, s:'new + awaiting', warn:1, href:'orders.html', pop:popOrders(orders.filter(function(o){return o.status==='Pending'||o.status==='Awaiting stock';}),'pending or awaiting stock')},
    {l:'Stock alerts', v:lowStock, s:'below reorder', warn:lowStock>0, href:'stock.html', pop:popStock},
    {l:'Blending jobs', v:d.all('blending').length, s:'across depots', href:blendHref, pop:popBlend(d.all('blending'))},
    {l:'In transit', v:transitD.length, s:'deliveries', href:'deliveries.html', pop:popDeliv}
  ],
  warehouse: [
    {l:'Low stock', v:lowStock, s:'reorder soon', warn:lowStock>0, href:'stock.html', pop:popStock},
    {l:'Blending', v:d.all('blending').filter(function(b){return b.status==='Blending';}).length, s:'in progress', href:blendHref, pop:popBlend(d.all('blending').filter(function(b){return b.status==='Blending';}))},
    {l:'Deliveries out', v:transitD.length, s:'today', href:'deliveries.html', pop:popDeliv},
    {l:'Depots', v:d.all('depots').length, s:'network'}
  ]
};
var pulse = PULSE[u.roleKey] || PULSE.director;

// ---- render ----
// Layout: greeting, then the KPI strip, then a chart beside the work queue. The rail carries every
// page, so Home has no shortcut buttons; the Ask bar (bb-ask.js, loaded by the shell) sits at the bottom of every page.
var html = '';
var today = new Date().toLocaleDateString('en-ZA',{weekday:'long', day:'numeric', month:'long'});
html += '<div class="page-head">'+
  '<div class="eyebrow">'+greet+' · '+BB.esc(today)+'</div>'+
  '<h1>'+BB.esc(first)+', here\'s what needs you.</h1>'+
  '<p>'+BB.esc(u.role)+(u.region?' · '+BB.esc(u.region):'')+'. Everything is saved on this device and syncs when you have signal.</p>'+
'</div>';

// ---- From the accounting system (only when it is actually connected) ----
// Without this the home screen still reads as a demo even after Sage is live, because every tile
// below is built from portal-side orders. These four come straight from the accounting ledger.
// A seat served product movement only has no ledger to show — these tiles would all read zero.
if(sage && sage.live && !sage.productsOnly && (sage.customers||[]).length && (BB.auth.can('finance') || BB.auth.can('sales'))){
  var scust = sage.customers||[], sinv = sage.invoices||[];
  var open_ = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
  var owed = sinv.reduce(function(t,i){ return t+open_(i); },0);
  var od   = sinv.filter(function(i){return i.status==='Overdue';});
  var odVal= od.reduce(function(t,i){ return t+open_(i); },0);
  var overLimit = scust.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; });
  var m = sage.meta||{};
  html += '<div class="sec"><h2>From your accounting system</h2><span class="ln"></span><span class="cnt">read-only · last read '+BB.esc(m.lastSast||'—')+'</span></div>';
  html += BB.staleNote();
  // Each tile opens the list behind it — a number you cannot act on is decoration.
  var tile = function(href, cls, label, value, sub, key){
    // A seat that may not open Finance must not be handed a Finance link that will refuse it.
    if(!canGo(href)) return '<div class="stat'+(cls?' '+cls:'')+'"><div class="l">'+label+'</div><div class="v">'+value+'</div><div class="s">'+sub+'</div></div>';
    return '<a class="stat tap'+(cls?' '+cls:'')+'" href="'+href+'" data-detail="'+key+'"><div class="l">'+label+'</div><div class="v">'+value+'</div><div class="s">'+sub+' ›</div></a>';
  };
  var openSinv = sinv.filter(function(i){return open_(i)>0.5;});
  var byOpen = function(a,b){ return b.open-a.open; };
  BB.statDetail('h-owed', function(){ return { sub:'open invoices, largest first · from your accounting system', wide:true, table:invTable(openSinv.map(invFromSage).sort(byOpen)), note:capNote(openSinv.length) }; });
  BB.statDetail('h-overdue', function(){ return { sub:'past their due date, largest first', wide:true, table:invTable(od.map(invFromSage).sort(byOpen)), note:capNote(od.length) }; });
  BB.statDetail('h-overlimit', function(){ return { sub:'balance above the credit limit in your accounts', table:custTable(overLimit.slice().sort(function(a,b){ return (b.balance-b.creditLimit)-(a.balance-a.creditLimit); })), note:capNote(overLimit.length) }; });
  BB.statDetail('h-customers', function(){ return { sub:'largest balance first', table:custTable(scust.slice().sort(function(a,b){ return (b.balance||0)-(a.balance||0); })), note:capNote(scust.length) }; });
  html += '<div class="grid g4">'+
    tile('finance.html?show=open', '', 'Owed to you', BB.money(owed), openSinv.length+' invoices still open', 'h-owed')+
    tile('finance.html?show=overdue', odVal?'bad':'', 'Overdue', BB.money(odVal), od.length+' invoices past due', 'h-overdue')+
    tile('farms.html?show=overlimit', overLimit.length?'warn':'', 'Over their limit', overLimit.length, 'check before a rep drives out', 'h-overlimit')+
    tile('farms.html?show=accounts', '', 'Customers', scust.length, 'live from '+BB.esc(m.source||'the ledger'), 'h-customers')+
  '</div>';
  if(BB.auth.can('finance')) html += '<div class="pline faint" style="font-size:.78rem;margin-top:8px;">Every figure here comes from your own accounts, refreshed three times a day. <a href="finance.html" style="color:var(--green-dark);">Open Finance ›</a></div>';
}

// live pulse
// A money seat gets a pulse built from the ledger — the month's trading, what is aging, who is
// on hold. Nothing here is invented. Other seats keep the portal-side pulse, which is marked.
var ledgerPulse = null;
if(sage && sage.live && (BB.auth.can('finance') || isDir)){
  var sinv2 = sage.invoices||[], spay2 = sage.payments||[], scust2 = sage.customers||[];
  var open2 = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
  var ym = new Date().toISOString().slice(0,7);
  var prevYm = (function(){ var dte=new Date(); dte.setMonth(dte.getMonth()-1); return dte.toISOString().slice(0,7); })();
  var invM = sinv2.filter(function(i){ return (i.date||'').slice(0,7)===ym; });
  // Compare like with like: the current month is part-finished, so last month is counted only up
  // to the same day. Otherwise a healthy month on the 5th reads as a 90% collapse.
  var dayNow = new Date().getDate();
  var invP = sinv2.filter(function(i){ return (i.date||'').slice(0,7)===prevYm && parseInt((i.date||'').slice(8,10),10) <= dayNow; });
  var payM = spay2.filter(function(x){ return (x.date||'').slice(0,7)===ym; });
  var invMv = invM.reduce(function(t,i){ return t+(i.amount||0); },0);
  var invPv = invP.reduce(function(t,i){ return t+(i.amount||0); },0);
  var payMv = payM.reduce(function(t,x){ return t+(x.amount||0); },0);
  var today0 = new Date(new Date().toISOString().slice(0,10));
  var daysOver = function(i){ return i.dueDate ? Math.round((today0-new Date(i.dueDate))/86400000) : 0; };
  var aged90 = sinv2.filter(function(i){ return open2(i)>0.5 && daysOver(i)>=90; });
  var aged90v = aged90.reduce(function(t,i){ return t+open2(i); },0);
  var held = scust2.filter(function(c){ return c.onHold; });
  var delta = invPv? Math.round((invMv-invPv)/invPv*100) : null;
  ledgerPulse = [

          '<div style="font-size:.86rem;margin-top:2px;">'+BB.esc(fu.what)+' · '+BB.esc(blk.name)+(fu.rate&&fu.rate!=='—'?' · '+BB.esc(fu.rate):'')+' · <span class="faint">'+BB.date(fu.due)+'</span></div>'+
          '<div class="faint" style="font-size:.74rem;margin-top:2px;">Farmer nudge '+(fu.farmerNudge?BB.date(fu.farmerNudge):'3 days before')+' · email + WhatsApp · automated'+(isDir?' · '+BB.esc(r.name):'')+'</div></div>'+
        '<div class="row" style="gap:6px;flex:none;">'+
          (cell?'<a class="btn ghost sm" href="tel:+'+cell+'">'+BB.icon('phone')+'Call</a><a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+cell+'?text='+encodeURIComponent('Hi '+String(f.name).split(' ')[0]+', reminder from BioBrix: '+fu.what+' on '+blk.name+' is due '+BB.date(fu.due)+'. Shall I bring the product through?')+'">'+BB.icon('message')+'WhatsApp</a>':'')+
          '<button class="btn sm" data-fudone="'+fu.id+'">'+BB.icon('check')+'Done</button></div>'+

Array.prototype.forEach.call(document.querySelectorAll('button[data-fudone]'), function(b){

// ---- Row previews: alerts, the chase list and follow-ups open over the page ----
var PAGE_LABEL = { 'finance.html':'Finance', 'farms.html':'Farms & customers', 'stock.html':'Stock', 'bioanalyze-soil.html':'soil analysis', 'orders.html':'Orders', 'biowatch.html':'BioWatch', 'territory.html':'Territory' };
var openLink = function(href, label){ return canGo(href) ? { label:label||('Open '+(PAGE_LABEL[String(href).split('?')[0].split('#')[0]]||'the page')), href:href, primary:true } : null; };
// The intel engine (bb-intel.js) hands each alert only its text and a page. Recognise the record by
// the same names the text was built from; anything unrecognised still gets the text and the page.
function alertPop(a){
  var C = [], sg = (sage && sage.live) ? sage : null, t0=new Date(new Date().toISOString().slice(0,10));
  var custOpen = function(cid){ return ((sg&&sg.invoices)||[]).filter(function(i){ return i.customer===cid && openAmt(i)>0.5; }).map(invFromSage).sort(function(x,y){ return y.open-x.open; }); };
  if(sg){
    (sg.customers||[]).forEach(function(c){
      if(!c.name) return;
      C.push({ to:'finance.html?show=overdue', key:c.name, build:function(){ var l=custOpen(c.id); return { sub:'open invoices on this account', wide:true, table:invTable(l, true), actions:[farmHref(sgFarm[c.id])?{ label:'Open full record', href:farmHref(sgFarm[c.id]) }:null, openLink('finance.html?show=overdue','Overdue invoices')].filter(Boolean).map(function(x,k){ x.primary=!k; return x; }) }; } });
      C.push({ to:'farms.html?show=overlimit', key:c.name, build:function(){ var l=custOpen(c.id); return { sub:'balance against the credit limit', wide:true, html:popTableHtml('', custTable([c]))+popTableHtml('Open invoices', invTable(l, true)) }; } });
    });
    C.push({ to:'farms.html?show=accounts', key:'', build:function(){ return { sub:'on hold in your accounting system', table:custTable((sg.customers||[]).filter(function(c){ return c.onHold; })) }; } });
  }
  d.all('inventory').forEach(function(i){ var pn=d.product(i.prod).name, dn=d.depot(i.depot).name;
    C.push({ to:'stock.html', key:pn+' at '+dn, build:function(){ return { stats:[{l:'On hand',v:BB.num(i.qty)},{l:'Reorder at',v:BB.num(i.reorder)},{l:'Short by',v:BB.num(Math.max(0,i.reorder-i.qty)),cls:'warn'}], table:stockTable(lowInv.filter(function(x){ return x.depot===i.depot; })), note:'Every line below reorder at '+dn+'.' }; } }); });
  soilIn.forEach(function(s){ var fm=d.farmer(s.farmer).farm;
    C.push({ to:'bioanalyze-soil.html', key:fm, build:function(){ return { sub:d.farmer(s.farmer).name, table:sampleTable(soilIn.filter(function(x){ return x.farmer===s.farmer; }), []) }; } }); });
  orders.forEach(function(o){
    C.push({ to:'orders.html', key:o.ref, must:'awaiting stock', build:function(){
      return { sub:d.farmer(o.farmer).name+' · '+d.farmer(o.farmer).farm+' · '+d.depot(o.depot).name,
        stats:[{l:'Status',html:BB.statusBadge(o.status)},{l:'Value',v:BB.money(d.orderValue(o))},{l:'Delivery',v:BB.monthName(o.deliverMonth)}],
        table:{ columns:['Product','Qty','Value'], num:[1,2], rows:(o.lines||[]).map(function(l){ var p=d.product(l.prod); return { cells:[p.name, BB.num(l.qty), BB.money((p.price||0)*(l.qty||0))] }; }) } }; } }); });
  d.all('watch').forEach(function(w){ var fm=d.farmer(w.farmer).farm;
    C.push({ to:'biowatch.html', key:fm, build:function(){ return { sub:d.farmer(w.farmer).name+' · '+blk(w.block)+' · '+BB.date(w.date),
      stats:[{l:'Vigour',v:w.vigour||'—',cls:(w.vigour==='Poor'||w.vigour==='Fair')?'warn':''},{l:'Stage',v:w.stage||'—'},{l:'Soil moisture',v:w.soilMoist||'—'},{l:'Pests',v:w.pest||'—'}],
      html:w.note?'<div style="font-size:.88rem;line-height:1.5;">'+BB.esc(w.note)+'</div>':'' }; } }); });
  d.all('farmers').forEach(function(f){
    var facts = function(){ return [{l:'Balance',v:BB.money(d.accountBalance(f.id))},{l:'Credit limit',v:d.creditLimit(f.id)?BB.money(d.creditLimit(f.id)):'—'},{l:'Rep',v:d.rep(f.rep).name}]; };
    var invs = function(){ return invTable(d.where('invoices',function(i){ return i.farmer===f.id && openAmt(i)>0.5; }).map(invFromStore), true); };
    C.push({ to:'territory.html', key:f.farm, build:function(){ return { sub:f.name+(f.town?' · '+f.town:'')+(f.region?' · '+f.region:''), stats:[{l:'Status',v:f.status||'—'},{l:'Hectares',v:f.ha?BB.num(f.ha):'—'},{l:'Crops',v:(f.crops||[]).join(', ')||'—'},{l:'Rep',v:d.rep(f.rep).name}] }; } });
    C.push({ to:'orders.html', key:f.farm, must:'account overdue', build:function(){ return { sub:f.name, stats:facts(), table:invs(), wide:true }; } });
    C.push({ to:'orders.html', key:f.farm, must:'over credit limit', build:function(){ return { sub:f.name, stats:facts(), table:invs(), wide:true }; } });
  });
  var hit = null;
  C.forEach(function(c){ if(c.to===a.to && a.txt.indexOf(c.key)>=0 && (!c.must || a.txt.indexOf(c.must)>=0) && (!hit || c.key.length>hit.key.length)) hit=c; });
  var s = SEV[a.sev]||SEV.low, p = {};
  try{ if(hit) p = hit.build()||{}; }catch(e){ console.warn('alert', e); }
  var out = { eyebrow:'What needs you today · '+s.t+' priority', title:a.txt, color:a.sev==='high'?'#b8382a':a.sev==='med'?'#c77d17':null, actions:[openLink(a.to)].filter(Boolean) };
  Object.keys(p).forEach(function(k){ out[k]=p[k]; });
  if(!out.actions || !out.actions.length) out.actions=[openLink(a.to)].filter(Boolean);
  return out;
}
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var al = e.target.closest('a.alert[data-al]');
  if(al && typeof alShown!=='undefined'){ var a=alShown[+al.getAttribute('data-al')]; if(!a) return; e.preventDefault(); BB.popup(alertPop(a)); return; }
  var ch = e.target.closest('[data-chase]');
  if(ch && typeof chase!=='undefined'){
    var hitA = e.target.closest('a,button'); if(hitA && !hitA.hasAttribute('data-chase')) return;   // Call / WhatsApp stay as they are
    var x = chase[+ch.getAttribute('data-chase')]; if(!x) return; e.preventDefault();
    var cid = x.i.customer, all = (sage.invoices||[]).filter(function(i){ return i.customer===cid && openAmt(i)>0.5; }).map(invFromSage).sort(function(p,q){ return q.open-p.open; });
    var tot = all.reduce(function(t,y){ return t+y.open; },0), rec = farmHref(sgFarm[cid]);
    var tel = String(x.c.phone||'').replace(/\D/g,'').replace(/^0/,'27');
    BB.popup({ eyebrow:'Chase these first', title:x.c.name||'—', sub:(x.i.label||x.i.ref||'')+' · due '+BB.date(x.i.dueDate)+(x.c.phone?' · '+x.c.phone:''), color:'#b8382a', wide:true,
      stats:[{l:'This invoice',v:BB.money(x.v),s:x.d+' days over',cls:'bad'},{l:'Open on the account',v:BB.money(tot),s:all.length+' invoice'+(all.length===1?'':'s')},{l:'Credit limit',v:x.c.creditLimit?BB.money(x.c.creditLimit):'—',s:x.c.onHold?'on hold':null}],
      table:invTable(all, true),
      actions:[ rec?{ label:'Open full record', href:rec, primary:true }:openLink('finance.html?show=overdue','Open overdue invoices'),
        rec&&canGo('finance.html')?{ label:'Overdue invoices', href:'finance.html?show=overdue' }:null,
        tel?{ label:'Call', href:'tel:+'+tel }:null ].filter(Boolean) });
    return;
  }
  var fr = e.target.closest('[data-fu]');
  if(fr && typeof fups!=='undefined'){
    if(e.target.closest('a,button')) return;   // Call / WhatsApp / Done keep their own jobs
    var fu = fups[+fr.getAttribute('data-fu')]; if(!fu) return;
    var f=d.farmer(fu.farmer), b=d.by('blocks',fu.block)||{name:'—'}, days=Math.round((new Date(fu.due)-new Date(new Date().toISOString().slice(0,10)))/86400000);
    var more = d.all('followups').filter(function(y){ return y.farmer===fu.farmer && y.status!=='Done'; }).sort(function(p,q){ return (p.due||'').localeCompare(q.due||''); });
    var prog = d.all('programs').filter(function(pr){ return pr.farmer===fu.farmer && pr.block===fu.block; })[0];
    BB.popup({ eyebrow:'Follow-up', title:fu.what, sub:f.name+' · '+f.farm+' · '+b.name+' · '+d.product(fu.prod).name+(prog?' · programme: '+prog.goal:''), wide:true,
      stats:[{l:'Due',v:BB.shortDate(fu.due),s:days<0?'overdue':days===0?'today':'in '+days+' day'+(days===1?'':'s'),cls:days<=3?'warn':''},{l:'Rate',v:fu.rate&&fu.rate!=='—'?fu.rate:'—'},{l:'Farmer nudge',v:fu.farmerNudge?BB.shortDate(fu.farmerNudge):'3 days before',s:'email + WhatsApp'},{l:'Advisor',v:d.rep(fu.rep).name}],
      html:'<div class="eyebrow" style="margin:0 0 6px;">Open follow-ups on this farm</div>',
      table:{ columns:['What','Block','Due','Rate'], rows:more.map(function(y){ return { cells:[y.what, (d.by('blocks',y.block)||{name:'—'}).name, BB.date(y.due), y.rate||'—'] }; }) },
      actions:[ farmHref(fu.farmer)?{ label:'Open full record', href:farmHref(fu.farmer), primary:true }:null,
        { label:'Mark done', onClick:function(){ BB.closePopup(); var btn=document.querySelector('button[data-fudone="'+fu.id+'"]'); if(btn) btn.click(); } } ].filter(Boolean) });
  }
});
