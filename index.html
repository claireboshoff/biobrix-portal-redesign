<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioBrix OS — Home</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BioBrix">
<script src="bb-config.js?v=redesign3"></script><script src="guard.js?v=redesign3"></script>
<script src="bb-data.js?v=redesign3"></script>
<script src="bb-shell.js?v=redesign3"></script>
<script src="bb-intel.js?v=redesign3"></script>
<style>
/* ── Insights (moved from the Intelligence page) ── */
.alert-list{max-height:440px;overflow:auto;}
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 20px;border-top:1px solid var(--line-soft);color:inherit;transition:background .12s;}
.alert:first-child{border-top:0;}
.alert:hover{background:#fafcf7;}
.alert .sv{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;}
.alert .tx{flex:1;min-width:0;font-size:.86rem;line-height:1.45;}
.alert .badge{flex:none;}
.alert .chev{flex:none;color:var(--faint);margin-top:2px;display:inline-flex;transition:transform .12s,color .12s;}.alert .chev svg{width:15px;height:15px;}
.alert:hover .chev{color:var(--green);transform:translateX(2px);}
/* rows that open a preview over the page */
.pop-row{cursor:pointer;transition:background .12s;}
.pop-row:hover{background:#fafcf7;}
.health-list{max-height:440px;overflow:auto;}
.cover .bar-cell{min-width:150px;}
.cover .bar-cell span{font-size:.8rem;white-space:nowrap;min-width:64px;text-align:right;}
@media(max-width:560px){ .alert{padding:11px 14px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ active:'home' });

var d = BB.data, u = BB.user;
// the accounting snapshot, read once — several sections below decide what to show from it
var sage = d.sage && d.sage();
var isDir = u.roleKey==='director', isAdvisor=u.roleKey==='advisor',
    isOps=u.roleKey==='operations', isWh=u.roleKey==='warehouse', isFin=u.roleKey==='finance';
var hour = new Date().getHours();
var greet = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
var first = u.name.split(' ')[0];

// ---- live pulse numbers ----
var orders = d.all('orders');
var openForecast = orders.filter(function(o){return o.status==='Forecast'||o.status==='Pending';});
var forecastVal = openForecast.reduce(function(s,o){return s+d.orderValue(o);},0);
var confirmedVal = orders.filter(function(o){return o.status==='Confirmed'||o.status==='Delivered';}).reduce(function(s,o){return s+d.orderValue(o);},0);
var lowStock = d.all('inventory').filter(function(i){return i.qty<i.reorder;}).length;
var newSoil = d.all('soil').filter(function(s){return s.status==='New'||s.status==='Awaiting lab';}).length;
var newLeaf = d.all('leaf').filter(function(l){return l.status==='New';}).length;
var awaitingStock = orders.filter(function(o){return o.status==='Awaiting stock';}).length;
var myFarmers = u.rep ? d.where('farmers',function(f){return f.rep===u.rep;}).length : d.all('farmers').length;

var fhSeat = /@freedomhub\.io$/i.test(u.email||'');
var clientLive = !!(BB.auth && BB.auth.tenantLive ? BB.auth.tenantLive() : (sage && sage.live));

// ---- Popups: the records behind a figure, a chart part or a row (CONVENTIONS: clicks open popups) ----
// Built only from what this page already reads; a page a seat may not open is never offered.
var canGo = function(href){ try{ return !(BB.auth && typeof BB.auth.canPage==='function') || BB.auth.canPage(href); }catch(e){ return true; } };
var farmHref = function(id){ return id && canGo('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(id) : null; };
var bold = function(t){ return { html:'<b>'+BB.esc(t)+'</b>' }; };
var POP_CAP = 100;
var capNote = function(n){ return n>POP_CAP ? 'Showing the first '+POP_CAP+' of '+n+'. The totals count all '+n+'.' : null; };
// ---- record cards (CONVENTIONS: the card pattern) — the identity bits every card shares ----
var initialsOf = function(n){ return String(n||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(); };
var repMeta = function(r, tip){ return r && r.name && r.name!=='—' ? { initials:initialsOf(r.name), color:r.colour||'#3f6b28', text:r.name, tip:tip||'Rep' } : null; };
var intlNum = function(p){ return String(p||'').replace(/\D/g,'').replace(/^0/,'27'); };
// a phone line: call it, or open WhatsApp with a message ready
var phoneMeta = function(phone, msg){ var t=intlNum(phone); if(!t) return null;
  return { icon:'phone', tip:'Phone', html:'<a href="tel:+'+t+'">'+BB.esc(phone)+'</a> <small>·</small> <a target="_blank" rel="noopener" href="https://wa.me/'+t+(msg?'?text='+encodeURIComponent(msg):'')+'">WhatsApp</a>' }; };
var alertLine = function(txt, sev){ return txt ? '<div class="bbp-alert'+(sev==='high'?'':' warn')+'">'+BB.icon('alert')+'<span>'+BB.esc(txt)+'</span></div>' : ''; };
var placeOf = function(f){ return [f.town, f.region].filter(function(x,i,a){ return x && a.indexOf(x)===i; }).join(', '); };
// an order lives on Orders: the row opens its own card there
var orderHref = function(o){ return o && o.id && canGo('orders.html') ? 'orders.html?open='+encodeURIComponent(o.id) : null; };
// Orders: ref, farmer, rep, status, value — biggest first, with a total.
var orderTable = function(list){
  var tot=0;
  var rows = list.slice().sort(function(a,b){ return d.orderValue(b)-d.orderValue(a); }).map(function(o){
    var f=d.farmer(o.farmer), v=d.orderValue(o); tot+=v;
    return { cells:[o.ref||'—', f.name+(f.farm&&f.farm!==f.name?' · '+f.farm:''), d.rep(o.rep).name, { html:BB.statusBadge(o.status) }, BB.money(v)], href:orderHref(o) };
  });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' orders'),{html:''},{html:''},{html:''},bold(BB.money(tot))] });
  return { columns:['Order','Farmer','Rep','Status','Value'], rows:rows, num:[4] };
};
// Invoices, from either source: the portal store (farmer id) or the raw ledger snapshot (customer id).
var sgCust = {}, sgFarm = {};
if(sage && sage.live){ (sage.customers||[]).forEach(function(c){ sgCust[c.id]=c; }); d.all('farmers').forEach(function(f){ if(f.sageId!=null) sgFarm[f.sageId]=f.id; }); }
var openAmt = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
var invFromStore = function(i){ var f=d.farmer(i.farmer); return { ref:i.label||i.ref, who:f.name, farmer:i.farmer, date:i.date, due:i.dueDate, amount:i.amount||0, open:openAmt(i), status:i.status }; };
var invFromSage = function(i){ var c=sgCust[i.customer]||{}; return { ref:i.label||i.ref, who:c.name||'—', cid:i.customer, farmer:sgFarm[i.customer]||null, date:i.date, due:i.dueDate, amount:i.amount||0, open:openAmt(i), status:i.status }; };
// a row in a list opens that customer's card on this page (ledger customer, else the portal farm)
var custRow = function(cid, fid){
  if(cid!=null && sgCust[cid]) return { onClick:function(){ BB.popup(custCard(cid)); } };
  if(fid && d.by('farmers', fid)) return { onClick:function(){ BB.popup(farmCard(fid)); } };
  return {};
};
var nowrap = function(t){ return { html:'<span style="white-space:nowrap">'+BB.esc(t)+'</span>' }; };
var invTable = function(list, oneCust){
  var t0=new Date(new Date().toISOString().slice(0,10)), ta=0, to=0;
  list.forEach(function(x){ ta+=x.amount; to+=x.open; });
  // one customer's open invoices, inside their card: short and narrow (the status is in the due date)
  if(oneCust){
    var rs = list.slice(0,POP_CAP).map(function(x){ var dd = x.due ? Math.round((t0-new Date(x.due))/86400000) : 0;
      return { cells:[x.ref||'—', nowrap(BB.shortDate(x.date)), { html:'<span style="white-space:nowrap">'+BB.esc(BB.shortDate(x.due))+'</span>'+(x.open>0.5&&dd>0?'<div style="font-size:.72rem;color:var(--red);font-weight:600;white-space:nowrap">'+dd+' days over</div>':'') }, BB.money(x.amount), x.open>0.5?BB.money(x.open):'—'] }; });
    return { columns:['Invoice','Date','Due','Amount','Outstanding'], rows:rs, num:[3,4], foot:list.length>1?['Total · '+list.length,{html:''},{html:''},BB.money(ta),BB.money(to)]:null };
  }
  var rows = list.slice(0,POP_CAP).map(function(x){
    var dd = x.due ? Math.round((t0-new Date(x.due))/86400000) : 0;
    var r = { cells:[x.ref||'—', x.who, BB.date(x.date), { html:BB.esc(BB.date(x.due))+(x.open>0.5&&dd>0?' <span class="faint">· '+dd+' d over</span>':'') }, BB.money(x.amount), x.open>0.5?BB.money(x.open):'—', { html:BB.statusBadge(x.status) }] };
    // one customer's own card lists its invoices — those rows have nowhere further to go
    if(!oneCust) r.onClick = custRow(x.cid, x.farmer).onClick;
    return r;
  });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' invoices'),{html:''},{html:''},{html:''},bold(BB.money(ta)),bold(BB.money(to)),{html:''}] });
  var t = { columns:['Invoice','Customer','Date','Due','Amount','Outstanding','Status'], rows:rows, num:[4,5] };
  // one customer's invoices: the name is in the title, not on every line
  if(oneCust){ t.columns.splice(1,1); t.rows.forEach(function(r){ r.cells.splice(1,1); }); t.num=[3,4]; }
  return t;
};
var receiptTable = function(list){
  var tot=0; list.forEach(function(x){ tot+=(x.amount||0); });
  var rows = list.slice(0,POP_CAP).map(function(x){ var c=sgCust[x.customer]||d.farmer(x.farmer)||{}; return { cells:[x.ref||'—', c.name||'—', BB.date(x.date), BB.money(x.amount||0)], onClick:custRow(x.customer, sgFarm[x.customer]||x.farmer).onClick }; });
  if(list.length>1) rows.push({ cells:[bold('Total · '+list.length+' receipts'),{html:''},{html:''},bold(BB.money(tot))] });
  return { columns:['Receipt','Customer','Date','Amount'], rows:rows, num:[3] };
};
// Ledger customers: balance against limit.
var custTable = function(list){
  return { columns:['Customer','Town','Balance','Limit','Over by'], num:[2,3,4], rows:list.slice(0,POP_CAP).map(function(c){
    var over = c.creditLimit>0 ? (c.balance||0)-c.creditLimit : 0;
    return { cells:[{ html:BB.esc(c.name||'—')+(c.onHold?' <span class="badge b-bad">On hold</span>':'') }, c.town||'—', BB.money(c.balance||0), c.creditLimit>0?BB.money(c.creditLimit):'—', over>0?BB.money(over):'—'], onClick:custRow(c.id).onClick }; }) };
};
var sampleTable = function(soil, leaf){
  var bl=function(id){ return (d.by('blocks',id)||{name:'—'}).name; };
  var rows = soil.map(function(s){ return { cells:['Soil', d.farmer(s.farmer).farm, bl(s.block), BB.date(s.date), { html:BB.statusBadge(s.status) }], href:canGo('bioanalyze-soil.html')?'bioanalyze-soil.html?block='+s.block:null }; })
    .concat(leaf.map(function(l){ return { cells:['Leaf', d.farmer(l.farmer).farm, bl(l.block), BB.date(l.date), { html:BB.statusBadge(l.status) }], href:canGo('bioanalyze-leaf.html')?'bioanalyze-leaf.html?block='+l.block:null }; }));
  return { columns:['Sample','Farm','Block','Taken','Status'], rows:rows };
};
var stockTable = function(list){
  return { columns:['Product','Depot','On hand','Reorder at'], num:[2,3], rows:list.map(function(i){ return { cells:[d.product(i.prod).name, d.depot(i.depot).name, BB.num(i.qty), BB.num(i.reorder)] }; }) };
};

// ---- pulse tiles per role ----
// Each tile that counts a list carries `href` (the page that holds the list) and `pop` (that list, in a popup).
var awaitingQ = orders.filter(function(o){return d.quoteStatus(o)==='Awaiting approval';});
var confirmedO = orders.filter(function(o){return o.status==='Confirmed'||o.status==='Delivered';});
var soilIn = d.all('soil').filter(function(s){return s.status==='New'||s.status==='Awaiting lab';}), leafIn = d.all('leaf').filter(function(l){return l.status==='New';});
var lowInv = d.all('inventory').filter(function(i){return i.qty<i.reorder;});
var transitD = d.where('deliveries',function(x){return x.status==='In transit';});
var uninvO = orders.filter(function(o){return (o.status==='Delivered'||o.status==='Confirmed') && !d.orderInvoiced(o.id);});
var chainO = orders.filter(function(o){return !!d.quoteStatus(o) && !d.orderInvoiced(o.id);});
var draftsO = d.all('outbox').filter(function(x){return x.status==='Draft';});
var unpaidI = d.all('invoices').filter(function(i){return i.status!=='Paid';});
var myOrders = orders.filter(function(o){return o.rep===u.rep;});
var myProgs = d.where('programs',function(p){return p.advisor===u.rep&&p.status==='Active';});
var blendHref = canGo('operations.html') ? 'operations.html' : 'depots.html';
var popOrders = function(list){ return function(){ return { wide:true, table:orderTable(list) }; }; };
// Quotes waiting for Rudie: the quoted price (list + markup), approved or declined right here.
var popQuotes = function(){
  var list = d.all('orders').filter(function(o){ return d.quoteStatus(o)==='Awaiting approval'; });
  var tot = list.reduce(function(t,o){ return t+d.quoteTotal(o); },0);
  var act = function(o, yes){
    var undo=BB.snapshot('orders', o.id), q=Object.assign({}, o.quote, yes? { status:'Approved', approvedBy:u.name, approvedAt:new Date().toISOString().slice(0,10), approvedPct:d.quotePct(o) } : { status:'Declined', declinedBy:u.name });
    d.update('orders', o.id, { quote:q });
    BB.toast(o.ref+(yes?' approved — back to '+String(d.rep(o.rep).name).split(' ')[0]+' to send':' declined'), { undo:function(){ undo(); BB.popup(popQuotes()); }, undone:o.ref+' is waiting for approval again' });
    BB.popup(popQuotes());
  };
  return { wide:true, eyebrow:'Orders', title:'Quotes to approve', sub: list.length? list.length+' waiting · '+BB.money(tot)+' quoted' : 'Nothing waiting — all quotes are dealt with.',
    table: list.length? { columns:['Order','Farmer','Rep','Markup','Quoted','' ], num:[3,4],
      rows:list.map(function(o){ var f=d.farmer(o.farmer);
        return { cells:[o.ref, f.name+(f.farm&&f.farm!==f.name?' · '+f.farm:''), d.rep(o.rep).name, d.quotePct(o)+'%'+(o.quote.raisedFrom!=null?' (was '+o.quote.raisedFrom+'%)':''), { html:'<b>'+BB.money(d.quoteTotal(o))+'</b><div class="faint" style="font-size:.72rem;">list '+BB.money(d.orderValue(o))+'</div>' },
          { html: isDir? '<span style="display:inline-flex;gap:6px;"><button class="btn sm" data-qa="'+o.id+'">'+BB.icon('check')+'Approve</button><button class="btn ghost sm" data-qd="'+o.id+'">Decline</button></span>' : '<span class="faint">waiting for Rudie</span>' }],
          href:orderHref(o) }; }) } : null,
    actions:[ canGo('orders.html')? { label:'Open Orders', href:'orders.html' } : null ].filter(Boolean),
    onOpen:function(body){
      body.querySelectorAll('button[data-qa],button[data-qd]').forEach(function(b){ b.onclick=function(e){ e.preventDefault(); e.stopPropagation();
        var o=d.by('orders', b.dataset.qa||b.dataset.qd); if(o) act(o, !!b.dataset.qa); }; }); } };
};
var popSamples = function(){ return { table:sampleTable(soilIn, leafIn) }; };
var popStock = function(){ return { table:stockTable(lowInv) }; };
var popBlend = function(list){ return function(){ return { table:{ columns:['Recipe','Depot','Batch','For','Due','Status'], rows:list.map(function(b){ return { cells:[b.recipe, d.depot(b.depot).name, b.batch, d.farmer(b.for).farm, BB.date(b.due), { html:BB.statusBadge(b.status) }] }; }) } }; }; };
var popDeliv = function(){ return { table:{ columns:['Order','Farm','Depot','ETA','Transport'], rows:transitD.map(function(x){ var o=d.by('orders',x.order)||{}; return { cells:[o.ref||'—', d.farmer(x.farmer).farm, d.depot(x.depot).name, { html:BB.etaHtml(x) }, x.transport||'—'], href:canGo('deliveries.html')?'deliveries.html':null }; }) } }; };
var PULSE = {
  director: [
    {l:'Pipeline (forecast)', v:BB.money(forecastVal), s:openForecast.length+' open orders', href:canGo('forecast.html')?'forecast.html':'orders.html', pop:popOrders(openForecast)},
    {l:'Confirmed value', v:BB.money(confirmedVal), s:'this season', ok:1, href:'orders.html', pop:popOrders(confirmedO)},
    {l:'Quotes to approve', v:awaitingQ.length, s:'in Orders — tap to approve', warn:awaitingQ.length>0, href:'orders.html', pop:popQuotes},
    {l:'Samples in', v:(newSoil+newLeaf), s:'soil + leaf to action', warn:(newSoil+newLeaf)>0, href:'bioanalyze-soil.html', pop:popSamples}
  ],
  advisor: [
    {l:'My farmers', v:myFarmers, s:u.region, href:'farms.html', pop:function(){ var fs=u.rep ? d.where('farmers',function(f){return f.rep===u.rep;}) : d.all('farmers');
      return { table:{ columns:['Farmer','Farm','Town','Status'], rows:fs.map(function(f){ return { cells:[f.name, f.farm, f.town||'—', { html:BB.farmBadge(f) }], onClick:custRow(null, f.id).onClick }; }) } }; }},
    {l:'Samples to interpret', v:(newSoil+newLeaf), s:'soil + leaf', warn:(newSoil+newLeaf)>0, href:'bioanalyze-soil.html', pop:popSamples},
    {l:'Active programmes', v:myProgs.length, s:'BioConsult', href:'bioconsult.html', pop:function(){
      return { table:{ columns:['Farm','Crop','Season','Goal'], rows:myProgs.map(function(p){ return { cells:[d.farmer(p.farmer).farm, p.crop||'—', p.season||'—', p.goal||'—'], onClick:custRow(null, p.farmer).onClick }; }) } }; }},
    {l:'My pipeline', v:BB.money(myOrders.reduce(function(s,o){return s+d.orderValue(o);},0)), s:'this season', href:'orders.html', pop:popOrders(myOrders)}
  ],
  finance: [
    {l:'Outstanding', v:BB.money(unpaidI.reduce(function(s,i){return s+(i.amount||0);},0)), s:d.all('invoices').filter(function(i){return i.status==='Overdue';}).length+' overdue', warn:d.all('invoices').some(function(i){return i.status==='Overdue';}),
      href:'finance.html?show=open', pop:function(){ return { wide:true, table:invTable(unpaidI.map(invFromStore).sort(function(a,b){ return b.open-a.open; })) }; }},
    {l:'Delivered, uninvoiced', v:uninvO.length, s:'reported as sales', warn:uninvO.length>0, href:'finance.html', pop:popOrders(uninvO)},
    {l:'Quotes in the chain', v:chainO.length, s:'awaiting approval → invoice', href:'orders.html', pop:popOrders(chainO)},
    {l:'Reminders drafted', v:draftsO.length, s:'check & send', warn:draftsO.length>0, href:'finance.html#outbox', pop:function(){
      return { table:{ columns:['To','Subject','Channel','Drafted'], rows:draftsO.map(function(x){ return { cells:[d.farmer(x.to).name, x.subject||'—', x.channel||'—', BB.date(x.created)] }; }) } }; }}
  ],
  operations: [
    {l:'Orders to action', v:orders.filter(function(o){return o.status==='Pending'||o.status==='Awaiting stock';}).length, s:'new + awaiting', warn:1, href:'orders.html', pop:popOrders(orders.filter(function(o){return o.status==='Pending'||o.status==='Awaiting stock';}))},
    {l:'Stock alerts', v:lowStock, s:'below reorder', warn:lowStock>0, href:'stock.html', pop:popStock},
    {l:'Blending jobs', v:d.all('blending').length, s:'across depots', href:blendHref, pop:popBlend(d.all('blending'))},
    {l:'In transit', v:transitD.length, s:'deliveries', href:'deliveries.html', pop:popDeliv}
  ],
  warehouse: [
    {l:'Low stock', v:lowStock, s:'reorder soon', warn:lowStock>0, href:'stock.html', pop:popStock},
    {l:'Blending', v:d.all('blending').filter(function(b){return b.status==='Blending';}).length, s:'in progress', href:blendHref, pop:popBlend(d.all('blending').filter(function(b){return b.status==='Blending';}))},
    {l:'Deliveries out', v:transitD.length, s:'today', href:'deliveries.html', pop:popDeliv},
    {l:'Depots', v:d.all('depots').length, s:'network'}
  ]
};
var pulse = PULSE[u.roleKey] || PULSE.director;

// ---- render ----
// Layout: greeting, then the KPI strip, then a chart beside the work queue. The rail carries every
// page, so Home has no shortcut buttons; the Ask bar (bb-ask.js, loaded by the shell) sits at the bottom of every page.
var html = '';
var today = new Date().toLocaleDateString('en-ZA',{weekday:'long', day:'numeric', month:'long'});
html += '<div class="page-head">'+
  '<div class="eyebrow">'+greet+' · '+BB.esc(today)+'</div>'+
  '<h1>'+BB.esc(first)+', here\'s what needs you.</h1>'+
  '<p>'+BB.esc(u.role)+(u.region?' · '+BB.esc(u.region):'')+'. Everything is saved on this device and syncs when you have signal.</p>'+
'</div>';

// ---- From the accounting system (only when it is actually connected) ----
// Without this the home screen still reads as a demo even after Sage is live, because every tile
// below is built from portal-side orders. These four come straight from the accounting ledger.
// A seat served product movement only has no ledger to show — these tiles would all read zero.
if(sage && sage.live && !sage.productsOnly && (sage.customers||[]).length && (BB.auth.can('finance') || BB.auth.can('sales'))){
  var scust = sage.customers||[], sinv = sage.invoices||[];
  var open_ = function(i){ return i.outstanding!=null ? i.outstanding : (i.status==='Paid'?0:(i.amount||0)); };
  var owed = sinv.reduce(function(t,i){ return t+open_(i); },0);
  var od   = sinv.filter(function(i){return i.status==='Overdue';});
  var odVal= od.reduce(function(t,i){ return t+open_(i); },0);
  var overLimit = scust.filter(function(c){ return c.creditLimit>0 && c.balance>c.creditLimit; });
  var m = sage.meta||{};
  html += '<div class="sec"><h2>From your accounting system</h2><span class="ln"></span><span class="cnt">read-only · last read '+BB.esc(m.lastSast||'—')+'</span></div>';
  html += BB.staleNote();
  // Each tile opens the list behind it — a number you cannot act on is decoration.
  var tile = function(href, cls, label, value, sub, key){
    // A seat that may not open Finance must not be handed a Finance link that will refuse it.

  C.forEach(function(c){ if(c.to===a.to && a.txt.indexOf(c.key)>=0 && (!c.must || a.txt.indexOf(c.must)>=0) && (!hit || c.key.length>hit.key.length)) hit=c; });
  var s = SEV[a.sev]||SEV.low, p = {};
  try{ if(hit) p = hit.build()||{}; }catch(e){ console.warn('alert', e); }
  var out = { eyebrow:'What needs you today · '+s.t+' priority', title:a.txt, color:a.sev==='high'?'#b8382a':a.sev==='med'?'#c77d17':null, actions:[openLink(a.to)].filter(Boolean) };
  // a recognised record is a card: its own title and kind, the alert as its warning line
  if(p.title) out.color=null;
  Object.keys(p).forEach(function(k){ out[k]=p[k]; });
  if(!out.actions || !out.actions.length) out.actions=[openLink(a.to)].filter(Boolean);
  return out;
}
// a follow-up: due date, farmer, farm, block, product, advisor · due, rate, nudge · the farm's other follow-ups
function followupCard(fu){
  var f=d.farmer(fu.farmer), b=d.by('blocks',fu.block)||{name:'—'}, days=-dayGap(fu.due), pd=d.product(fu.prod);
  var more = d.all('followups').filter(function(y){ return y.farmer===fu.farmer && y.status!=='Done'; }).sort(function(p,q){ return (p.due||'').localeCompare(q.due||''); });
  var prog = d.all('programs').filter(function(pr){ return pr.farmer===fu.farmer && pr.block===fu.block; })[0];
  return { eyebrow:'Follow-up', title:fu.what, wide:true, layout:'split',
    meta:[ { icon:'user', text:f.name, tip:'Farmer' }, { icon:'farm', text:f.farm, tip:'Farm', href:farmHref(fu.farmer) }, { icon:'leaf', text:b.name, tip:'Block' },
      pd&&pd.name&&pd.name!=='—'?{ icon:'package', text:pd.name, tip:'Product' }:null, prog&&prog.goal?{ icon:'target', text:prog.goal, tip:'Programme' }:null,
      phoneMeta(f.cell, 'Hi '+String(f.name).split(' ')[0]+', reminder from BioBrix: '+fu.what+' on '+b.name+' is due '+BB.date(fu.due)+'. Shall I bring the product through?'),
      isDir? repMeta(d.rep(fu.rep), 'Advisor') : null ],
    stats:[{l:'Due',v:BB.shortDate(fu.due),s:days<0?'overdue':days===0?'today':'in '+days+' day'+(days===1?'':'s'),cls:days<=3?'warn':''},{l:'Rate',v:fu.rate&&fu.rate!=='—'?fu.rate:'—'},{l:'Farmer nudge',v:fu.farmerNudge?BB.shortDate(fu.farmerNudge):'3 days before',s:'email + WhatsApp'},{l:'On this farm',v:BB.num(more.length),s:'open follow-up'+(more.length===1?'':'s')}],
    table:{ title:'Open follow-ups on this farm', columns:['What','Block','Due','Rate'], rows:more.map(function(y){ return { cells:[y.id===fu.id?{ html:'<b>'+BB.esc(y.what)+'</b>' }:y.what, (d.by('blocks',y.block)||{name:'—'}).name, nowrap(BB.shortDate(y.due)), y.rate||'—'], onClick:y.id===fu.id?null:function(){ BB.popup(followupCard(y)); } }; }) },
    actions:[ farmHref(fu.farmer)?{ label:'Farm record', href:farmHref(fu.farmer) }:null,
      { label:'Mark done', primary:true, onClick:function(){ BB.closePopup(); var btn=document.querySelector('button[data-fudone="'+fu.id+'"]'); if(btn) btn.click(); else { d.update('followups', fu.id, { status:'Done', doneAt:new Date().toISOString().slice(0,10) }); BB.toast('Follow-up done · '+f.name); location.reload(); } } } ].filter(Boolean) };
}
document.addEventListener('click', function(e){
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  var al = e.target.closest('a.alert[data-al]');
  if(al && typeof alShown!=='undefined'){ var a=alShown[+al.getAttribute('data-al')]; if(!a) return; e.preventDefault(); BB.popup(alertPop(a)); return; }
  var ch = e.target.closest('[data-chase]');
  if(ch && typeof chase!=='undefined'){
    var hitA = e.target.closest('a,button'); if(hitA && !hitA.hasAttribute('data-chase')) return;   // Call / WhatsApp stay as they are
    var x = chase[+ch.getAttribute('data-chase')]; if(!x) return; e.preventDefault();
    BB.popup(custCard(x.i.customer, { eyebrow:'Customer · chase first', sev:'high',
      alert:(x.i.label||x.i.ref||'An invoice')+' is '+x.d+' days over · '+BB.money(x.v)+' outstanding'+(x.i.dueDate?', due '+BB.date(x.i.dueDate):'') }));
    return;
  }
  var fr = e.target.closest('[data-fu]');
  if(fr && typeof fups!=='undefined'){
    if(e.target.closest('a,button')) return;   // Call / WhatsApp / Done keep their own jobs
    var fu = fups[+fr.getAttribute('data-fu')]; if(!fu) return;
    BB.popup(followupCard(fu));
  }
});
// These two only exist on a demonstration seat — a live client seat gets a plain Sign out instead.
var swBtn = document.getElementById('switch');
if(swBtn) swBtn.onclick=function(){ BB.auth.logout(); };
var rsBtn = document.getElementById('reset');
if(rsBtn) rsBtn.onclick=function(){ BB.confirm('Every change made on this device goes, and the seeded example comes back.', { title:'Reset the demo data?', ok:'Reset demo data' }).then(function(yes){ if(!yes) return; BB.data.reset(); BB.toast('Demo data reset'); setTimeout(function(){location.reload();},600); }); };


// On a first sign-in there is no cached snapshot yet, so this page draws before the accounting
// data arrives — and would sit there showing sample figures until the next navigation. When the
// data lands, draw it again. Once only.
window.addEventListener('bb:sage', function(){
  try{ if(sessionStorage.getItem('bb_sage_drawn')) return; sessionStorage.setItem('bb_sage_drawn','1'); }catch(e){}
  location.reload();
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
