<!DOCTYPE html>

</head>
<body>
<script>
BB.renderHeader({ active:'sales', back:'index.html' });

var d = BB.data, u = BB.user;

var css=''+
'.pbar{background:#eef2e7;border-radius:6px;height:8px;overflow:hidden;min-width:70px;}'+
'.pbar i{display:block;height:100%;background:var(--green-bright);}'+
'.readout{background:#f7faf1;border:1px solid var(--line);border-left:3px solid var(--green-bright);border-radius:11px;padding:14px 16px;margin-top:12px;}'+
'.readout.warn{border-left-color:var(--amber);background:var(--amber-bg);}'+
'.map-card{position:relative;padding:0;}'+
'.map-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-soft);}'+
'.map-tools .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}'+
'.map-tools .lbl{font-size:.64rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-right:2px;}'+
'.map-tools .sp{flex:1;}'+
'.chip.tog{cursor:pointer;user-select:none;}'+
'#vmap{height:calc(100vh - var(--top) - 36px);min-height:560px;width:100%;background:#eef2e7;position:relative;z-index:0;border-radius:var(--radius);}'+
'.t-col{display:grid;gap:16px;align-content:start;}'+
'.rep{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:.84rem;} .rep i{width:8px;height:8px;border-radius:50%;flex:none;}'+
'.crop-chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap;color:var(--muted);}'+
'.map-fallback .ico{width:30px;height:30px;color:var(--green-mid);}'+
'@media(max-width:700px){#vmap{height:72vh;min-height:420px;}}'+
'.map-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:11px 14px;font-size:.74rem;color:var(--muted);border-top:1px solid var(--line-soft);}'+
'.map-legend .k{display:inline-flex;align-items:center;gap:6px;}'+
'.map-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}'+
'.map-legend .sq{width:10px;height:10px;border-radius:3px;background:var(--green-darkest);display:inline-block;}'+
'.map-legend .ring{width:14px;height:14px;border-radius:50%;border:2px solid var(--green-mid);background:rgba(104,165,62,.35);display:inline-block;}'+
'.map-fallback{padding:34px 20px;text-align:center;color:var(--muted);font-size:.9rem;}'+
'.map-fallback .big{margin-bottom:6px;}'+
'.rep-pin{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(20,41,12,.35);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.72rem;color:#fff;letter-spacing:.3px;}'+
'.rep-pin-wrap{background:none;border:none;}'+
'.depot-pin{width:22px;height:22px;border-radius:6px;background:var(--green-darkest);border:2px solid #fff;box-shadow:0 2px 8px rgba(20,41,12,.35);display:flex;align-items:center;justify-content:center;color:var(--lime);font-size:.62rem;font-weight:800;}'+
'.depot-pin.comm{background:var(--amber);color:#fff;}'+
'.depot-pin-wrap{background:none;border:none;}'+
'.leaflet-container{font-family:var(--body);font-size:.82rem;}'+
'.leaflet-tile-pane{filter:saturate(.45) contrast(.92) brightness(1.04);}'+
'.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow-lg);padding:2px;}'+
'.leaflet-popup-content{margin:12px 14px;line-height:1.45;min-width:200px;}'+
'.pp h4{font-family:var(--display);font-size:.98rem;font-weight:600;color:var(--green-dark);margin:0 0 2px;}'+
'.pp .sub{font-size:.72rem;color:var(--faint);margin-bottom:8px;}'+
'.pp .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.78rem;}'+
'.pp .kv b{color:var(--ink);font-weight:600;text-align:right;}'+
'.pp .kv span{color:var(--muted);}'+
'.pp .pbar{margin-top:7px;}'+
'.pp .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}'+
'.pp .act a,.pp .act button{font-size:.74rem;font-weight:600;color:var(--green-mid);background:#f1f7e6;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-family:inherit;}'+
'.leaflet-control-attribution{font-size:.6rem;background:rgba(255,255,255,.7)!important;}'+
'table.bb tr.hl td{background:#eef6dc;}'+
'table.bb tr.hv td{background:#f3f8ec;}'+
'table.bb tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--green-bright);}'+
'table.bb tr.hl b{color:var(--green-darkest);}'+
'table.bb tr.flash td{animation:tflash 1.2s ease;}'+
'@keyframes tflash{0%{background:#d6eab3}100%{background:#eef6dc}}'+
'.terr-split{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start;margin-top:16px;}'+
'.terr-split .map-card{position:sticky;top:calc(var(--top) + 12px);}'+
'.mo{position:absolute;z-index:500;}'+
'.mo-panel{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px -8px rgba(18,33,12,.28);}'+
'.mo-search{top:12px;left:12px;width:300px;max-width:calc(100% - 24px);}'+
'.mo-search .in{display:flex;align-items:center;gap:8px;padding:9px 11px;}'+
'.mo-search .in .ico{width:16px;height:16px;color:var(--faint);}'+
'.mo-search input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;font-size:.86rem;color:var(--ink);}'+
'.mo-search .x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:1.05rem;line-height:1;display:none;}'+
'.mo-search.has .x{display:block;}'+
'.mo-search .res{display:none;max-height:340px;overflow:auto;border-top:1px solid var(--line-soft);}'+
'.mo-search.open .res{display:block;}'+
'.mo-search .r{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:.84rem;}'+
'.mo-search .r:hover,.mo-search .r.on{background:var(--panel-2);}'+
'.mo-search .r .ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.62rem;font-weight:800;font-family:var(--display);}'+
'.mo-search .r .ic .ico{width:14px;height:14px;}'+
'.mo-search .r .t{flex:1;min-width:0;} .mo-search .r .t b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'+
'.mo-search .r .t small{color:var(--faint);font-size:.72rem;}'+
'.mo-search .r .k{font-size:.6rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);}'+
'.mo-search .none{padding:12px;font-size:.8rem;color:var(--faint);}'+
'.mo-kpis{top:12px;right:12px;display:grid;grid-template-columns:repeat(2,96px);gap:8px;}'+
'.mo-kpi{padding:9px 10px;text-align:left;}'+
'.mo-kpi .l{font-size:.56rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);line-height:1.2;}'+
'.mo-kpi .v{font-family:var(--display);font-weight:600;font-size:1.02rem;color:var(--green-darkest);margin-top:3px;line-height:1.1;white-space:nowrap;}'+
'.mo-kpi.warn .v{color:var(--amber);}'+
'.mo-key{left:12px;bottom:12px;width:300px;'+'transition:none;max-width:calc(100% - 24px);padding:10px 12px;}'+
'.mo-key .row2{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}'+
'.mo-key .lbl{font-size:.58rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);width:100%;margin:2px 0 3px;}'+
'.mo-key .chip{padding:3px 9px;font-size:.72rem;}'+
'.mo-key .sep{height:1px;background:var(--line-soft);margin:8px 0;}'+
'.mo-key .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.7rem;color:var(--muted);}'+
'.mo-key .lg .k{display:inline-flex;align-items:center;gap:5px;}'+
'.mo-key .lg .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}'+
'.mo-key .lg .sq{width:9px;height:9px;border-radius:3px;background:var(--green-darkest);display:inline-block;}'+
'.mo-key .lg .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--green-mid);background:rgba(104,165,62,.35);display:inline-block;}'+
'.mo-key .tog-key{border:0;background:none;font:inherit;font-size:.72rem;font-weight:600;color:var(--green);cursor:pointer;padding:0;margin-left:auto;}'+
'.mo-key.min .body{display:none;}'+
'.mo-key .hd{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;color:var(--green-darkest);}'+
'.mo-key .body{margin-top:8px;}'+
'.mo-count{font-size:.7rem;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line-soft);}'+
'.mo-card{top:12px;left:12px;width:320px;max-width:calc(100% - 24px);display:none;max-height:calc(100% - 84px);overflow:auto;padding:14px 16px 12px;}'+
'.mo-card.show{display:block;}'+
'body.has-ask #vmap{height:calc(100vh - var(--top) - 160px);min-height:520px;}'+
'.mo-card .cx{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--faint);font-size:1.15rem;cursor:pointer;}'+
'.mo-card .cx:hover{background:var(--panel-2);color:var(--ink);}'+
'.mo-card .pp{padding-right:18px;}'+
'.mo-card .back{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--green);background:none;border:0;cursor:pointer;padding:0;margin-bottom:8px;}'+
'.mo-card .back .ico{width:13px;height:13px;transform:rotate(180deg);}'+
'.map-card.carding .mo-search{display:none;}'+
'.map-card.carding .mo-key{display:none;}'+
'.sel-pin{outline:3px solid var(--lime);outline-offset:2px;}'+
'@media(max-width:700px){.mo-kpis{grid-template-columns:repeat(2,84px);top:auto;bottom:12px;right:12px;} .mo-key{bottom:auto;top:62px;width:calc(100% - 24px);} .mo-key:not(.open-m) .body{display:none;}}'+
'.terr-split .t-table .town small{display:block;font-size:.72rem;color:var(--faint);font-weight:400;}'+
'.terr-split .t-table td,.terr-split .t-table th{padding-left:10px;padding-right:10px;}'+
'.terr-split .t-table .bar-cell{min-width:64px !important;}'+
'.terr-split .t-table .bar-cell .trk{min-width:30px;}'+
'@media(max-width:1100px){.terr-split{grid-template-columns:minmax(0,1fr);} .terr-split .map-card{position:relative;top:auto;}}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

var territory = d.all('territory');
var regions = territory.map(function(t){ return t.region; }).filter(function(v,i,a){ return a.indexOf(v)===i; });

var totPotential = territory.reduce(function(s,t){ return s+(t.potential||0); },0);
var totFarms = territory.reduce(function(s,t){ return s+(t.farms||0); },0);
var totHa = territory.reduce(function(s,t){ return s+(t.ha||0); },0);
var avgPen = territory.length ? Math.round(territory.reduce(function(s,t){ return s+(t.penetration||0); },0)/territory.length) : 0;

var html='';
html += '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Sales</div><h1>Territory potential</h1><p>The whole country in one view: where the next farmer is, who covers it, and how much is still open.</p></div>'+
  '<div class="row" style="gap:8px;"><a class="btn" href="#funnel" id="toFunnel">'+BB.icon('plus')+'Funnel a new farmer</a></div></div>';

// the headline figures now sit inside the map (top-right), as on 9five's area map

// ---- vision map beside the region & town table: click a point, its row lights up (and back) ----
var tRows = territory.slice().sort(function(a,b){ return b.potential-a.potential; });
html += '<div class="terr-split">';
html += '<div class="card map-card">';
html += '<div id="vmap"></div>';
html += '<div class="mo mo-panel mo-card" id="moCard" role="dialog" aria-live="polite"><button type="button" class="cx" id="moCardX" aria-label="Close">×</button><button type="button" class="back" id="moCardBack">'+BB.icon('chevron')+'Back to search</button><div id="moCardBody"></div></div>';
// search (top-left): towns, farmers, depots, team
html += '<div class="mo mo-panel mo-search" id="moSearch"><div class="in">'+BB.icon('search')+'<input id="moQ" placeholder="Search town, farmer, depot or team…" autocomplete="off" aria-label="Search the map"><button type="button" class="x" id="moX" aria-label="Clear">×</button></div><div class="res" id="moRes"></div>'+
  '<div class="mo-count">'+territory.length+' areas · '+d.all('farmers').length+' farmers · '+d.all('depots').length+' depots · '+d.all('reps').length+' team</div></div>';
// headline figures (top-right)
html += '<div class="mo mo-kpis">'+
  '<div class="mo-panel mo-kpi"><div class="l">Potential</div><div class="v">'+BB.chart.moneyCompact(totPotential)+'</div></div>'+
  '<div class="mo-panel mo-kpi"><div class="l">Farms</div><div class="v">'+BB.num(totFarms)+'</div></div>'+
  '<div class="mo-panel mo-kpi"><div class="l">Hectares</div><div class="v">'+BB.chart.compact(totHa)+'</div></div>'+
  '<div class="mo-panel mo-kpi'+(avgPen<25?' warn':'')+'"><div class="l">Avg reach</div><div class="v">'+avgPen+'%</div></div>'+
'</div>';
// layers, region jump and key (bottom-left)
html += '<div class="mo mo-panel mo-key min" id="moKey"><div class="hd">'+BB.icon('map')+'Layers, regions &amp; key<button type="button" class="tog-key" id="moKeyTog">Show</button></div><div class="body">'+
  '<div class="lbl">Show</div><div class="row2">'+
    '<span class="chip tog on" data-layer="territory">Territories</span>'+
    '<span class="chip tog on" data-layer="farmers">Farmers</span>'+
    '<span class="chip tog on" data-layer="depots">Depots</span>'+
    '<span class="chip tog on" data-layer="reps">Team</span></div>'+
  '<div class="lbl" style="margin-top:8px;">Go to</div><div class="row2">'+
    '<span class="chip tog on" data-region="">All of SA</span>'+
    regions.map(function(r){ return '<span class="chip tog" data-region="'+BB.esc(r)+'">'+BB.esc(r)+'</span>'; }).join('')+'</div>'+
  '<div class="sep"></div><div class="lg">'+
    d.all('reps').map(function(r){ return '<span class="k"><span class="dot" style="background:'+r.colour+';"></span>'+BB.esc(r.name.split(' ')[0])+'</span>'; }).join('')+
    '<span class="k"><span class="ring"></span>size = potential, fill = reach</span><span class="k"><span class="sq"></span>depot</span></div>'+
'</div></div>';
html += '</div>';
html += '<div class="card t-table"><div class="card-h"><div><h3>By region &amp; town</h3><div class="sub">'+territory.length+' areas · click a point on the map, or a row here</div></div></div><div class="scroll"><table class="bb"><thead><tr>'+
  '<th>Town</th><th class="num">Potential</th><th>Reach</th><th>Rep</th></tr></thead><tbody>';
tRows.forEach(function(t){
  var r=d.rep(t.rep);
  html += '<tr class="click" id="row-'+t.id+'" data-tid="'+t.id+'" title="Show on the map">'+
    '<td class="town" title="'+BB.esc(t.crop)+'"><b>'+BB.esc(t.town)+'</b><small>'+BB.esc(t.region)+'</small></td>'+
    '<td class="num"><b>'+BB.money(t.potential)+'</b></td>'+
    '<td><div class="bar-cell" style="min-width:90px;"><div class="trk"><i style="width:'+Math.min(100,t.penetration)+'%;"></i></div><span class="faint" style="font-size:.76rem;">'+t.penetration+'%</span></div></td>'+
    '<td><span class="rep" title="'+BB.esc(r.name)+'"><i style="background:'+r.colour+';"></i>'+BB.esc(r.name.split(' ')[0])+'</span></td>'+
  '</tr>';
});
html += '</tbody><tfoot><tr><td>All areas</td><td class="num">'+BB.money(totPotential)+'</td><td>'+avgPen+'% avg</td><td></td></tr></tfoot></table></div></div>';
html += '</div>';

// the breakdowns, side by side under the map
html += '<div class="grid g2" style="margin-top:16px;">'+
  '<div class="card"><div class="card-h"><div><h3>Potential by region</h3><div class="sub">the dark part is already won, at today\'s penetration</div></div></div><div class="card-p"><div id="chRegion"></div></div></div>'+
  '<div class="card"><div class="card-h"><div><h3>Who covers it</h3><div class="sub">potential by rep</div></div></div><div class="card-p"><div id="chRep"></div></div></div>'+
'</div>';

// the funnel on its own row
html += '<div style="margin-top:16px;">';
// funnel a new farmer
html += '<div class="card" id="funnel"><div class="card-h"><div><h3>Funnel a new farmer</h3><div class="sub">is the lead viable, and who should service it, before you drive out</div></div></div><div class="card-p">';
html += '<div class="grid g2" style="gap:0 12px;">';
html += '<div class="fld"><label>Farm / business name</label><input id="pFarm" placeholder="e.g. Bergsig Boerdery"></div>';
html += '<div class="fld"><label>Farmer name</label><input id="pName" placeholder="e.g. Andre Kruger"></div>';
html += '<div class="fld"><label>Region</label><select id="pRegion"><option value="">Select region…</option>'+
  regions.map(function(r){ return '<option>'+BB.esc(r)+'</option>'; }).join('')+'</select></div>';
html += '<div class="fld"><label>Town</label><input id="pTown" placeholder="e.g. Tzaneen"></div>';
html += '<div class="fld"><label>Main crop</label><input id="pCrop" placeholder="e.g. Macadamia"></div>';
html += '<div class="fld"><label>Hectares</label><input id="pHa" type="number" min="0" placeholder="e.g. 220"></div>';
html += '</div>';
html += '<button class="btn" id="check">'+BB.icon('check')+'Check viability</button>';
html += '<div id="readout"></div>';
html += '</div></div>';
html += '</div>';

// crop intelligence — hectares by crop & area + the right questions (data-set style prep)
var cropRows={};
territory.forEach(function(t){ String(t.crop||'').split('/').forEach(function(c){ c=c.trim(); if(!c) return; var k=c==='Avo'?'Avocado':c==='Mac'?'Macadamia':c==='Cane'?'Sugarcane':c==='Veg'?'Vegetables':c==='Pome'?'Apple':c; cropRows[k]=cropRows[k]||{crop:k, regions:{}, ha:0, potential:0, farms:0}; var share=1/String(t.crop).split('/').length; cropRows[k].ha+=Math.round((t.ha||0)*share); cropRows[k].potential+=Math.round((t.potential||0)*share); cropRows[k].farms+=Math.round((t.farms||0)*share); cropRows[k].regions[t.region]=(cropRows[k].regions[t.region]||0)+Math.round((t.ha||0)*share); }); });
var cropList=Object.keys(cropRows).map(function(k){return cropRows[k];}).sort(function(a,b){return b.potential-a.potential;});
var maxCropHa = Math.max.apply(null, cropList.map(function(c){ return c.ha; }).concat([1]));
html += '<div class="card" style="margin-top:16px;"><div class="card-h"><div><h3>Crop intelligence</h3><div class="sub">hectares by crop &amp; area · what to ask before the visit</div></div><span class="badge b-grey">'+cropList.length+' crops</span></div>';
html += '<div class="scroll"><table class="bb" id="cropTbl"><thead><tr><th>Crop</th><th>Where</th><th class="num">Hectares in reach</th><th></th><th class="num">Farms</th><th class="num">Potential</th></tr></thead><tbody>';
cropList.forEach(function(c){
  var prep=d.cropPrep(c.crop);
  html += '<tr class="click" data-crop="'+BB.esc(c.crop)+'" title="What to ask before the visit"><td><b>'+BB.esc(c.crop)+'</b>'+(prep?'':'<div class="faint" style="font-size:.72rem;">data set to load</div>')+'</td><td>'+Object.keys(c.regions).map(function(r){return '<span class="crop-chip">'+BB.esc(r)+' · '+BB.num(c.regions[r])+' ha</span>';}).join('')+'</td>'+
    '<td class="num">'+BB.num(c.ha)+'</td><td><div class="bar-cell" style="min-width:90px;"><div class="trk"><i style="width:'+Math.round(c.ha/maxCropHa*100)+'%;"></i></div></div></td>'+
    '<td class="num">'+c.farms+'</td><td class="num">'+BB.money(c.potential)+'</td></tr>';
});
html += '</tbody></table></div>';
html += '<div class="card-f">Click a crop for what to watch for and the questions to ask before the visit. Point us at your data sources (industry hectares, problem maps per area) and this table reads from them instead of the seeded figures.</div></div>';

document.body.insertAdjacentHTML('beforeend','<main class="wrap">'+html+'</main>');
// crop rows: what to watch for, the questions to ask and BioBrix's answer, in a popup
document.querySelectorAll('#cropTbl tr[data-crop]').forEach(function(tr){
  tr.addEventListener('click', function(){
    var c=cropList.filter(function(x){ return x.crop===tr.getAttribute('data-crop'); })[0]; if(!c) return;
    var prep=d.cropPrep(c.crop);
    BB.popup({ eyebrow:'Crop intelligence', title:c.crop, sub:Object.keys(c.regions).join(' · '),
      stats:[{ l:'Hectares in reach', v:BB.num(c.ha) }, { l:'Farms', v:BB.num(c.farms) }, { l:'Potential', v:BB.money(c.potential) }],

function areaDetail(ts, o){

  var cols=['Town'].concat(o.region?['Region']:[]).concat(['Crop','Farms','Hectares','Potential','Reach']).concat(o.rep?['Rep']:[]);
  var tp=0, tf=0, th=0;
  var rows=ts.map(function(t){ var r=d.rep(t.rep); tp+=(t.potential||0); tf+=(t.farms||0); th+=(t.ha||0);
    return { cells:[{ html:'<b>'+BB.esc(t.town)+'</b>' }].concat(o.region?[t.region]:[]).concat([t.crop||'—', BB.num(t.farms||0), BB.num(t.ha||0), BB.money(t.potential||0), (t.penetration||0)+'%'])
      .concat(o.rep?[{ html:'<span class="rep"><i style="background:'+r.colour+';"></i>'+BB.esc(r.name)+'</span>' }]:[]) }; });
  if(ts.length>1){ var pen=Math.round(ts.reduce(function(s,t){ return s+(t.penetration||0); },0)/ts.length);
    rows.push({ cells:[{ html:'<b>'+ts.length+' areas</b>' }].concat(o.region?['']:[]).concat(['', { html:'<b>'+BB.num(tf)+'</b>' }, { html:'<b>'+BB.num(th)+'</b>' }, { html:'<b>'+BB.money(tp)+'</b>' }, pen+'% avg']).concat(o.rep?['']:[]) }); }
  var numAt=o.region?[3,4,5,6]:[2,3,4,5];
  return { sub:o.sub, wide:true, table:{ columns:cols, rows:rows, num:numAt }, actions:o.actions||[],

var CARD_M=null;
function openCard(m){
  if(!MAP||!m) return;

  CARD_M=m;
  document.getElementById('moCardBody').innerHTML=m._cardHtml||'';
  document.querySelector('.map-card').classList.add('carding');
  document.getElementById('moCard').classList.add('show');
  if(m.setStyle){ m._w=m.options.weight; m.setStyle({ weight:5 }); } else if(m._icon){ var pin=m._icon.firstChild; if(pin) pin.classList.add('sel-pin'); }
  // keep the point clear of the card: if it sits under the card, slide the map right
  var pt=MAP.latLngToContainerPoint(m.getLatLng()), card=document.getElementById('moCard');
  if(pt.x < card.offsetWidth+40) MAP.panBy([pt.x-(card.offsetWidth+90), 0], {animate:true});
  m.fire('popupopen');
}
function closeCard(quiet){
  var m=CARD_M; CARD_M=null;
  document.getElementById('moCard').classList.remove('show');
  document.querySelector('.map-card').classList.remove('carding');
  if(m){ if(m.setStyle) m.setStyle({ weight:m._w||2 }); else if(m._icon && m._icon.firstChild) m._icon.firstChild.classList.remove('sel-pin'); if(!quiet) m.fire('popupclose'); }
}
// a marker built with bindPopup becomes a card marker: same content, same open/close hooks
function cardify(m){
  if(!m || m._carded) return m; var p=m.getPopup && m.getPopup(); if(!p) return m;
  m._cardHtml=p.getContent(); m.unbindPopup(); m._carded=true;
  m.options.bubblingMouseEvents=false;   // a click on a point must not also count as a click on the map (which closes the card)
  m.openPopup=function(){ openCard(m); return m; };
  m.closePopup=function(){ if(CARD_M===m) closeCard(); return m; };
  m.on('click', function(ev){ if(ev && ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent); openCard(m); });
  return m;
}

(function wirePanels(){
  var box=document.getElementById('moSearch'), q=document.getElementById('moQ'), res=document.getElementById('moRes'), x=document.getElementById('moX'), hits=[], cur=-1;
  function draw(){
    var t=q.value.trim().toLowerCase(); box.classList.toggle('has', !!t);
    if(!t){ box.classList.remove('open'); res.innerHTML=''; return; }
    hits=SEARCH.filter(function(e){ return (e.label+' '+e.sub+' '+e.kind).toLowerCase().indexOf(t)>=0; }).slice(0,12); cur=hits.length?0:-1;
    res.innerHTML=hits.length? hits.map(function(e,i){ return '<div class="r'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="ic" style="background:'+e.color+'">'+(e.txt?BB.esc(e.txt):BB.icon(e.ic))+'</span><span class="t"><b>'+BB.esc(e.label)+'</b><small>'+BB.esc(e.sub)+'</small></span><span class="k">'+e.kind+'</span></div>'; }).join('')
      : '<div class="none">Nothing on the map matches “'+BB.esc(q.value.trim())+'”.</div>';
    box.classList.add('open');
  }
  function pick(i){ var e=hits[i]; if(!e) return; box.classList.remove('open'); q.blur(); goTo(e); }
  q.addEventListener('input', draw);
  q.addEventListener('focus', function(){ if(q.value.trim()) draw(); });
  q.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!hits.length) return; cur=(cur+(e.key==='ArrowDown'?1:hits.length-1))%hits.length; [].forEach.call(res.querySelectorAll('.r'),function(r,i){ r.classList.toggle('on',i===cur); }); }
    else if(e.key==='Enter'){ e.preventDefault(); pick(cur<0?0:cur); }
    else if(e.key==='Escape'){ q.value=''; draw(); q.blur(); }
  });
  res.addEventListener('click', function(e){ var r=e.target.closest('.r'); if(r) pick(+r.getAttribute('data-i')); });
  x.onclick=function(){ q.value=''; draw(); q.focus(); };
  document.addEventListener('click', function(e){ if(!e.target.closest('#moSearch')) box.classList.remove('open'); });
  // stop map drag/zoom when working inside a panel
  if(typeof L!=='undefined') document.querySelectorAll('.mo').forEach(function(p){ L.DomEvent.disableClickPropagation(p); L.DomEvent.disableScrollPropagation(p); });
  var key=document.getElementById('moKey'), kt=document.getElementById('moKeyTog');

    if(phone){ var o=key.classList.toggle('open-m'); kt.textContent=o?'Hide':'Show'; } else { var m=key.classList.toggle('min'); kt.textContent=m?'Show':'Hide'; } };
  kt.textContent='Show';
})();

function addFarmerMarker(f){
  if(!MAP || !layers.farmers) return;
  var c=coords(f.town,f.region); if(!c) return;
  var r=d.rep(f.rep);
  var prospect=/prospect/i.test(f.status||'');
  // small deterministic offset so a farmer doesn't sit dead-centre on the territory ring
  var h=0; String(f.id||f.name).split('').forEach(function(ch){h=(h*31+ch.charCodeAt(0))%997;});
  var la=c[0]+0.09*Math.cos(h), ln=c[1]+0.12*Math.sin(h);
  var m=L.circleMarker([la,ln],{ pane:'farm', radius:6, color:'#fff', weight:2, fillColor:prospect?'#9aa88f':r.colour, fillOpacity:1, dashArray:prospect?'2,2':null });
  m.bindPopup('<div class="pp"><h4>'+BB.esc(f.farm||f.name)+'</h4><div class="sub">'+BB.esc(f.name)+' · '+BB.esc(f.town||f.region)+'</div>'+
    '<div class="kv"><span>Status</span><b>'+BB.esc(f.status||'')+'</b><span>Crops</span><b>'+BB.esc((f.crops||[]).join(', ')||'—')+'</b><span>Hectares</span><b>'+BB.num(f.ha||0)+'</b><span>Rep</span><b style="color:'+r.colour+';">'+BB.esc(r.name)+'</b></div>'+
    '<div class="act"><a href="farm-detail.html?farmer='+encodeURIComponent(f.id)+'">Farm file</a><a href="voice-order.html">Capture order</a></div></div>', POP);
  layers.farmers.addLayer(m);
  if(MAP && MAP.closePopup && layers.farmers) cardify(m);
  SEARCH.push({ kind:'Farmer', layer:'farmers', label:f.farm||f.name, sub:f.name+' · '+(f.town||f.region||''), color:r.colour, ic:'farm', m:m });
  return m;
}
function highlightRow(id, fromMap){
  document.querySelectorAll('tr.hl').forEach(function(x){x.classList.remove('hl','flash');});
  if(!id) return; var tr=document.getElementById('row-'+id); if(!tr) return;
  tr.classList.add('hl');
  if(fromMap){
    // a column filter may be hiding the row: say so instead of pointing at nothing
    if(tr.style.display==='none'){ BB.toast(tr.querySelector('b').textContent+' is hidden by a filter on the table'); return; }
    void tr.offsetWidth; tr.classList.add('flash');
    var r=tr.getBoundingClientRect(), top=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--top'))||60;
    if(r.top < top+50 || r.bottom > window.innerHeight-130) window.scrollBy({ top:r.top-(window.innerHeight/2)+r.height/2, behavior:'smooth' });
  }
}
// hovering a row rings its point on the map
document.querySelectorAll('tr[data-tid]').forEach(function(tr){
  tr.addEventListener('mouseenter', function(){ var m=tMarkers[tr.getAttribute('data-tid')]; if(m) m.setStyle({ weight:5 }); });
  tr.addEventListener('mouseleave', function(){ var m=tMarkers[tr.getAttribute('data-tid')]; if(m) m.setStyle({ weight:2 }); });
});
window.prefillFunnel=function(region,town){
  var r=document.getElementById('pRegion'), t=document.getElementById('pTown');
  if(r) r.value=region; if(t) t.value=town;
  if(MAP) MAP.closePopup();
  var card=document.getElementById('pFarm'); if(card){ card.closest('.card').scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(function(){ card.focus(); },500); }
};
buildMap();

// ---- viability logic ----
function repForRegion(region){
  // rep whose territory sits in that region (most potential there)
  var inRegion = territory.filter(function(t){ return t.region===region; });
  if(inRegion.length){
    inRegion.sort(function(a,b){ return b.potential-a.potential; });
    return d.rep(inRegion[0].rep);
  }
  // fall back: rep whose base region matches
  var byBase = d.all('reps').find(function(r){ return r.region===region; });
  if(byBase) return byBase;
  // else Rudie
  return d.rep('rep_rudie');
}
function regionStats(region){
  var inR = territory.filter(function(t){ return t.region===region; });
  var pot = inR.reduce(function(s,t){ return s+(t.potential||0); },0);
  var pen = inR.length ? Math.round(inR.reduce(function(s,t){ return s+(t.penetration||0); },0)/inR.length) : 0;
  return { potential:pot, pen:pen };
}

var lastProspect=null;

document.getElementById('check').onclick=function(){
  var farm=document.getElementById('pFarm').value.trim();
  var name=document.getElementById('pName').value.trim();
  var region=document.getElementById('pRegion').value;
  var town=document.getElementById('pTown').value.trim();
  var crop=document.getElementById('pCrop').value.trim();
  var ha=Number(document.getElementById('pHa').value)||0;
  var out=document.getElementById('readout');

  if(!name || !region){ out.innerHTML='<div class="readout warn">Add at least a farmer name and a region to check viability.</div>'; return; }

  var rep=repForRegion(region);
  var rs=regionStats(region);
  var viable = rs.pen < 85; // room to grow
  var msg='<b>'+(viable?'Viable':'Territory near saturated')+'</b> — '+BB.esc(rep.name)+' services '+BB.esc(region)+
    '; territory penetration '+rs.pen+'%, '+BB.money(rs.potential)+' potential in this region.';
  if(ha) msg += ' '+BB.num(ha)+' ha adds real volume.';

  out.innerHTML='<div class="readout'+(viable?'':' warn')+'">'+msg+
    '<div class="row" style="margin-top:12px;">'+
    (viable?'<button class="btn sm" id="addProspect">Add as prospect</button>':'')+
    '</div></div>';

  lastProspect={ farm:farm, name:name, region:region, town:town, crop:crop, ha:ha, rep:rep };

  var btn=document.getElementById('addProspect');
  if(btn) btn.onclick=addProspect;
};

function addProspect(){
  if(!lastProspect) return;
  var p=lastProspect;
  var rec=d.add('farmers', {
    name: p.name || 'New prospect',
    farm: p.farm || (p.name+' farm'),
    region: p.region,
    town: p.town || '',
    rep: p.rep.id,
    crops: p.crop ? [p.crop] : [],
    ha: p.ha || 0,
    cell: '',
    status: 'Prospect'
  });
  BB.toast('Prospect added — assigned to '+p.rep.name);
  try{ var nm=addFarmerMarker(rec); if(nm){ MAP.flyTo(nm.getLatLng(), 8, {duration:0.9}); setTimeout(function(){ nm.openPopup(); }, 950); } }catch(e){}
  document.getElementById('readout').innerHTML='<div class="readout"><b>'+BB.esc(rec.name)+'</b> is now a prospect, assigned to <b>'+BB.esc(p.rep.name)+'</b> ('+BB.esc(p.region)+'). '+
    'They will see it on their farms list. <a href="voice-order.html" style="color:var(--green-mid);font-weight:600;">Capture their first order</a></div>';
  lastProspect=null;
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
