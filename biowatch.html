<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>BioWatch · BioBrix OS</title>
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
</head>
<body>
<script>
BB.renderHeader({ active:'tech', back:'bioservices.html' });

var d = BB.data, u = BB.user;
var params = new URLSearchParams(location.search);
var blockFilter = params.get('block') || '';

var css=''+
'.report{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}'+
'.report .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);}'+
'.report .rb{padding:20px 22px;}'+
'.report .rf{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line-soft);font-size:.76rem;color:var(--faint);}'+
'.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}'+
'@media(max-width:860px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}'+
'@media(max-width:480px){.rgrid{grid-template-columns:minmax(0,1fr);}}'+
'.rgrid .cell{padding:12px 14px;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);margin:0 -1px -1px 0;}'+
'.rgrid .cell .k{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);}'+
'.rgrid .cell .val{font-size:.95rem;color:var(--ink);margin-top:2px;}'+
'.klabel{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);}'+
'.note{margin-top:16px;padding:14px 16px;border-left:3px solid var(--green-bright);background:#f7faf1;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}'+
'.note p{font-size:.95rem;line-height:1.6;margin-top:4px;}'+
'.rec-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-family:inherit;font-weight:600;font-size:.78rem;color:var(--green-dark);cursor:pointer;}'+
'.rec-btn .ico{width:15px;height:15px;}'+
'.rec-btn.live{background:var(--red-bg);border-color:var(--red);color:var(--red);}'+
'.fld-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px;}'+
'.fld-head label{margin:0 !important;}'+
'.wlist .wi{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line-soft);}'+
'.wlist .wi:first-child{border-top:0;}'+
'.wlist .wi .t{font-weight:600;font-size:.86rem;color:var(--ink);}'+
'.wlist .wi .m{font-size:.76rem;color:var(--faint);margin-top:1px;}'+
'.wlist a.wi:hover,.wlist .wi.click:hover{background:#f7faf1;cursor:pointer;}'+
'.filt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 16px;border:1px solid var(--line);border-left:3px solid var(--green-bright);border-radius:var(--radius-sm);background:var(--panel);font-size:.86rem;}'+
'@media print{#bbNav,.bb-top,.bb-nav,.bb-scope,.noprint{display:none!important;}body{padding:0!important;}.split{display:block!important;}}';
document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');

function vigourBadge(v){
  var m={ 'Excellent':'b-ok','Good':'b-lime','Fair':'b-warn','Poor':'b-bad' };
  return '<span class="badge '+(m[v]||'b-grey')+'">'+BB.esc(v||'—')+'</span>';
}
function today(){ return new Date().toISOString().slice(0,10); }
function inMyScope(w){
  if(u.roleKey==='director' || !u.rep) return true;
  return w.advisor===u.rep;
}
function blockLabel(id){
  var b=d.by('blocks',id); if(!b) return '—';
  var f=d.farmer(b.farmer);
  return { block:b, farmer:f };
}
// a pest note that is not "None" is something to keep an eye on
function hasPest(w){ var p=String(w.pest||'').trim().toLowerCase(); return !!p && p!=='none' && p!=='—'; }

var state = { view:'list', open:null };
var chartJobs = [];

// ---- popups: the visits behind a figure or a chart part. A row opens that visit's field report here. ----
function openVisit(id){ BB.closePopup(); state.view='report'; state.open=id; paint(); window.scrollTo(0,0); }
function visitDetail(list){
  list=list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  return { color:null, sub:null, table:{ columns:['Date','Farm · block','Stage','Vigour','Pest & disease'], rows:list.map(function(w){ var b=d.by('blocks',w.block)||{name:'—'}, f=d.farmer(w.farmer);
      return [{ html:'<span style="white-space:nowrap;">'+BB.shortDate(w.date)+'</span>' }, { html:'<b>'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(b.name)+'</div>' }, w.stage||'—', { html:vigourBadge(w.vigour) }, { html:hasPest(w)?'<span style="color:var(--amber);font-weight:600;">'+BB.esc(w.pest)+'</span>':'<span class="faint">'+BB.esc(w.pest||'—')+'</span>' }]; }) },
    onOpen:function(body){ body.querySelectorAll('tbody tr').forEach(function(tr,i){ var w=list[i]; if(!w) return; tr.classList.add('click'); tr.onclick=function(){ openVisit(w.id); }; }); } };
}
function toVisits(){ BB.closePopup(); var el=document.getElementById('visitList'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
var TILE = {};
['bwWeek','bwWeak'].forEach(function(k){
  BB.statDetail(k, function(){ return Object.assign(visitDetail(TILE[k]||[]), { actions:[{ label:'Open the full list', primary:true, onClick:toVisits }] }); });
});
BB.statDetail('bwFarms', function(){
  var list=TILE.bwFarms||[], by={};
  list.forEach(function(w){ var k=w.farmer; if(!by[k]) by[k]={ n:0, last:null }; by[k].n++; if(!by[k].last || (w.date||'')>(by[k].last.date||'')) by[k].last=w; });
  var ids=Object.keys(by).sort(function(a,b){ return by[b].n-by[a].n; });
  var go=function(h){ try{ return BB.auth.canPage(h); }catch(e){ return true; } };
  return { table:{ columns:['Farm','Visits','Last check','Vigour'], rows:ids.map(function(id){ var f=d.farmer(id), x=by[id];
      return { cells:[{ html:'<b>'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.72rem;">'+BB.esc(f.name)+'</div>' }, String(x.n), BB.shortDate(x.last.date), { html:vigourBadge(x.last.vigour) }],
        href: go('farm-detail.html') ? 'farm-detail.html?farmer='+encodeURIComponent(id) : null }; }), num:[1] },
    actions:[{ label:'Open the full list', primary:true, onClick:toVisits }] };
});

function visits(){
  var list = d.all('watch').filter(inMyScope);
  if(blockFilter) list = list.filter(function(w){ return w.block===blockFilter; });
  return list.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}

function statRow(){
  var list = d.all('watch').filter(inMyScope);
  var farms = list.map(function(w){ return w.farmer; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).length;
  var now = new Date(); var weekAgo = new Date(now.getTime()-7*864e5).toISOString().slice(0,10);
  var thisWeek = list.filter(function(w){ return (w.date||'') >= weekAgo; }).length;
  var weakL = list.filter(function(w){ return w.vigour==='Fair' || w.vigour==='Poor'; }), weak = weakL.length;
  TILE = { bwWeek:list.filter(function(w){ return (w.date||'') >= weekAgo; }), bwWeak:weakL, bwFarms:list };
  return '<div class="grid g4" style="margin-top:14px;">'+
    '<div class="stat"><div class="l">Visits logged</div><div class="v">'+list.length+'</div><div class="s">field checks captured</div></div>'+
    '<a class="stat tap" href="#visitList" data-detail="bwFarms"><div class="l">Farms monitored</div><div class="v">'+farms+'</div><div class="s">under your watch</div></a>'+
    '<a class="stat tap" href="#visitList" data-detail="bwWeek"><div class="l">Checks this week</div><div class="v">'+thisWeek+'</div><div class="s">last 7 days</div></a>'+
    '<a class="stat tap'+(weak?' warn':'')+'" href="#visitList" data-detail="bwWeak"><div class="l">Fair or poor vigour</div><div class="v">'+weak+'</div><div class="s">visits to follow up</div></a>'+
  '</div>';
}

// Monday of the week a date falls in, as YYYY-MM-DD
function weekOf(iso){ var t=new Date((iso||'').slice(0,10)+'T00:00:00'); if(isNaN(t)) return null; var dw=(t.getDay()+6)%7; t.setDate(t.getDate()-dw); return t.toISOString().slice(0,10); }

function renderList(){
  var list = visits();
  var html='';
  html += '<div class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">BioServices · BioWatch</div><h1>Seasonal monitoring</h1>'+
    '<p>Every orchard walk captured in the field: growth stage, weather, soil, pest pressure and vigour, turned into a report you can send the farmer.</p></div>'+
    '<div class="row"><button class="btn" id="newBtn">'+BB.icon('plus')+'New field check</button></div></div>';

  if(blockFilter){
    var bl=blockLabel(blockFilter);
    if(bl && bl.block){
      html += '<div class="filt"><div><span class="eyebrow" style="margin:0 8px 0 0;">Filtered to one block</span>'+
        '<b style="color:var(--green-dark);">'+BB.esc(bl.block.name)+'</b> · '+BB.esc(bl.farmer.farm)+'</div>'+
        '<a class="btn ghost sm" href="biowatch.html">Show all visits</a></div>';
    }
  }

  html += statRow();

  // visits per week, only when there are enough weeks to make a trend
  var weeks = {};
  list.forEach(function(w){ var k=weekOf(w.date); if(k) weeks[k]=(weeks[k]||0)+1; });
  var wk = Object.keys(weeks).sort(), weekLabels=[], weekVals=[], weekKeys=[];
  if(wk.length){
    var cur=new Date(wk[0]+'T00:00:00'), last=new Date(wk[wk.length-1]+'T00:00:00'), guard=0;
    while(cur<=last && guard<60){ var key=cur.toISOString().slice(0,10); weekLabels.push(BB.shortDate(key)); weekVals.push(weeks[key]||0); weekKeys.push(key); cur.setDate(cur.getDate()+7); guard++; }
  }
  var showTrend = weekLabels.length>=3;

  var vig = { Excellent:0, Good:0, Fair:0, Poor:0 };
  list.forEach(function(w){ if(vig[w.vigour]!=null) vig[w.vigour]++; });
  var vigRows = [{label:'Excellent',value:vig.Excellent,color:'#22431a'},{label:'Good',value:vig.Good,color:'#68a53e'},{label:'Fair',value:vig.Fair,color:'#c77d17'},{label:'Poor',value:vig.Poor,color:'#a3533f'}];
  var pests = list.filter(hasPest);

  // left: the visits; right: vigour mix + what to keep an eye on
  html += '<div class="split" style="margin-top:16px;align-items:start;">';
  html += '<div style="display:grid;gap:16px;min-width:0;">';
  if(showTrend){
    html += '<div class="card"><div class="card-h"><div><h3>Field checks per week</h3><div class="sub">visits logged'+(blockFilter?' on this block':'')+'</div></div></div><div class="card-p"><div id="chWeeks"></div></div></div>';
    chartJobs.push(function(){ BB.chart.bar('#chWeeks',{ labels:weekLabels, height:200, table:true, series:[{name:'Visits', values:weekVals, color:'#3f6b28'}],
      // the visits logged that week
      detail:function(ctx){ var k=weekKeys[ctx.index]; return Object.assign(visitDetail(list.filter(function(w){ return weekOf(w.date)===k; })), { title:'Week of '+BB.date(k) }); } }); });
  }
  html += '<div class="card" id="visitList" style="scroll-margin-top:80px;"><div class="card-h"><div><h3>Monitoring visits</h3><div class="sub">newest first · tap a visit for the field report</div></div><span class="badge b-grey">'+list.length+'</span></div>';
  if(!list.length){
    html += '<div class="empty">No monitoring visits yet. Log the first field check.</div>';
  } else {
    html += '<div class="scroll'+(list.length>12?' tall':'')+'"><table class="bb"><thead><tr><th>Date</th><th>Farm · block</th><th>Stage</th><th>Vigour</th><th>Pest &amp; disease</th><th class="num">Photos</th></tr></thead><tbody>';
    list.forEach(function(w){
      var b=d.by('blocks',w.block)||{name:'—'};
      var f=d.farmer(w.farmer);
      html += '<tr class="click" data-open="'+w.id+'">'+
        '<td class="muted" style="white-space:nowrap;">'+BB.shortDate(w.date)+'</td>'+
        '<td><b style="color:var(--green-dark);">'+BB.esc(f.farm)+'</b><div class="faint" style="font-size:.74rem;">'+BB.esc(b.name)+'</div></td>'+
        '<td class="muted">'+BB.esc(w.stage||'—')+'</td>'+
        '<td>'+vigourBadge(w.vigour)+'</td>'+
        '<td style="font-size:.8rem;">'+(hasPest(w)?'<span style="color:var(--amber);font-weight:600;">'+BB.esc(w.pest)+'</span>':'<span class="faint">'+BB.esc(w.pest||'—')+'</span>')+'</td>'+
        '<td class="num muted">'+(w.photos||0)+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  // who is walking the orchards — only worth drawing when more than one advisor is in view
  var byAdv = {};
  list.forEach(function(w){ byAdv[w.advisor]=(byAdv[w.advisor]||0)+1; });
  var advKeys = Object.keys(byAdv);
  if(advKeys.length>1){
    html += '<div class="card"><div class="card-h"><div><h3>Visits by advisor</h3><div class="sub">field checks logged</div></div></div><div class="card-p"><div id="chAdv"></div></div></div>';
    var advRows = advKeys.map(function(k){ var r=d.rep(k); return { id:k, label:r.name, sub:r.region||'', value:byAdv[k], color:r.colour||'#3f6b28' }; }).sort(function(a,b){ return b.value-a.value; });
    chartJobs.push(function(){ BB.chart.hbar('#chAdv',{ rows:advRows, valueLabel:'Visits',
      detail:function(ctx){ return visitDetail(list.filter(function(w){ return w.advisor===ctx.row.id; })); } }); });
  }
  html += '</div>';

  html += '<div style="display:grid;gap:16px;min-width:0;">';
  html += '<div class="card"><div class="card-h"><div><h3>Crop vigour</h3><div class="sub">across the visits shown</div></div></div><div class="card-p">'+
    (list.length? '<div id="chVigour"></div>' : '<div class="empty" style="padding:20px;">Nothing logged yet.</div>')+'</div></div>';
  if(list.length) chartJobs.push(function(){ BB.chart.donut('#chVigour',{ rows:vigRows, centreLabel:'visits', size:136, valueLabel:'Visits',
    detail:function(ctx){ return visitDetail(list.filter(function(w){ return w.vigour===ctx.row.label; })); } }); });

  html += '<div class="card"><div class="card-h"><div><h3>Pest watch</h3><div class="sub">pressure noted on the walk</div></div><span class="badge '+(pests.length?'b-warn':'b-ok')+'">'+pests.length+'</span></div>';
  if(!pests.length){
    html += '<div class="empty" style="padding:22px;">No pest or disease pressure noted.</div>';
  } else {
    html += '<div class="wlist">';
    pests.slice(0,6).forEach(function(w){
      var b=d.by('blocks',w.block)||{name:'—'}; var f=d.farmer(w.farmer);
      html += '<div class="wi click" data-open="'+w.id+'"><div style="min-width:0;"><div class="t">'+BB.esc(w.pest)+'</div><div class="m">'+BB.esc(f.farm)+' · '+BB.esc(b.name)+'</div></div><span class="faint" style="font-size:.76rem;white-space:nowrap;">'+BB.shortDate(w.date)+'</span></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '</div></div>';
  return html;
}

function renderReport(id){
  var w=d.by('watch',id); if(!w) return renderList();
  var b=d.by('blocks',w.block)||{name:'—',crop:'—'};
  var f=d.farmer(w.farmer);
  var adv=d.rep(w.advisor);

  var html='';
  html += '<div class="page-head row between noprint" style="gap:16px;">'+
    '<div><div class="eyebrow">BioWatch · field report</div><h1>'+BB.esc(f.farm)+'</h1>'+
    '<p>'+BB.esc(b.name)+(b.crop?' · '+BB.esc(b.crop):'')+' · visited '+BB.date(w.date)+'</p></div>'+
    '<div class="row"><button class="btn ghost" id="backList">All visits</button>'+
      '<a class="btn ghost" href="bioconsult.html?farmer='+encodeURIComponent(w.farmer)+'&block='+encodeURIComponent(w.block)+'">'+BB.icon('clipboard')+'Build a recommendation</a>'+
      '<button class="btn" id="genReport">'+BB.icon('file')+'Generate report</button></div></div>';

  html += '<div class="split" style="margin-top:14px;align-items:start;">';
  html += '<div class="report" id="reportCard">';
  html += '<div class="rh">'+
    '<div><div class="eyebrow">BioWatch field report</div>'+
      '<div style="font-family:var(--display);font-size:1.3rem;font-weight:600;color:var(--green-darkest);">'+BB.esc(f.farm)+'</div>'+
      '<div class="muted" style="font-size:.85rem;">'+BB.esc(f.name)+' · '+BB.esc(b.name)+(b.crop?' · '+BB.esc(b.crop):'')+'</div></div>'+
    '<div style="text-align:right;"><div class="faint" style="font-size:.74rem;margin-bottom:4px;">'+BB.date(w.date)+'</div>'+vigourBadge(w.vigour)+'</div>'+
  '</div>';
  html += '<div class="rb"><div class="rgrid">'+
    cell('Growth stage', w.stage)+
    cell('Weather', w.weather)+
    cell('Soil moisture', w.soilMoist)+
    cell('Pest &amp; disease', w.pest)+
    cell('Vigour', w.vigour)+
    cell('Photos on file', (w.photos||0)+' image'+((w.photos||0)===1?'':'s'))+
  '</div>';
  html += '<div class="note"><div class="klabel">Advisor note</div><p>'+BB.esc(w.note||'—')+'</p></div></div>';
  html += '<div class="rf"><span>Reported by '+BB.esc(adv.name)+' · '+BB.esc(adv.role||'Crop Advisor')+'</span><span>BioBrix · The Biological Way</span></div>';
  html += '</div>';

  // the same block's other visits, so the report reads in context
  var hist = d.all('watch').filter(inMyScope).filter(function(x){ return x.block===w.block && x.id!==w.id; })
    .sort(function(a,c){ return (c.date||'').localeCompare(a.date||''); });
  html += '<div class="card noprint"><div class="card-h"><div><h3>Earlier checks on this block</h3><div class="sub">'+BB.esc(b.name)+'</div></div><span class="badge b-grey">'+hist.length+'</span></div>';
  if(!hist.length){
    html += '<div class="empty" style="padding:22px;">This is the first check logged on this block.</div>';
  } else {
    html += '<div class="wlist">';
    hist.slice(0,8).forEach(function(x){
      html += '<div class="wi click" data-open="'+x.id+'"><div style="min-width:0;"><div class="t">'+BB.esc(x.stage||'Field check')+'</div><div class="m">'+BB.esc(x.pest||'—')+'</div></div>'+
        '<div style="text-align:right;flex:none;">'+vigourBadge(x.vigour)+'<div class="faint" style="font-size:.72rem;margin-top:3px;">'+BB.shortDate(x.date)+'</div></div></div>';
    });
    html += '</div>';
  }
  html += '<div class="card-f"><a href="biowatch.html?block='+encodeURIComponent(w.block)+'" style="color:var(--green-dark);font-weight:600;">All visits on this block ›</a></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function cell(k,v){
  return '<div class="cell"><div class="k">'+k+'</div><div class="val">'+BB.esc(v||'—')+'</div></div>';
}

function renderForm(){
  var blocks=d.all('blocks');
  var html='';
  html += '<div class="page-head row between" style="gap:16px;">'+
    '<div><div class="eyebrow">BioWatch · new visit</div><h1>New field check</h1><p>Capture what you see in the orchard. It saves on this device and syncs when you have signal.</p></div>'+
    '<div class="row"><button class="btn ghost" id="backList2">All visits</button></div></div>';
  html += '<div class="card" style="margin-top:14px;"><div class="card-h"><div><h3>The visit</h3><div class="sub">block, date and what you saw</div></div></div><div class="card-p">';
  html += '<div class="grid g4">';
  html += '<div class="fld span2"><label>Block</label><select id="fBlock">'+
    blocks.map(function(b){ var f=d.farmer(b.farmer); return '<option value="'+b.id+'"'+(b.id===blockFilter?' selected':'')+'>'+BB.esc(f.farm)+' — '+BB.esc(b.name)+'</option>'; }).join('')+
    '</select></div>';
  html += '<div class="fld"><label>Date</label><input id="fDate" type="date" value="'+today()+'"></div>';
  html += '<div class="fld"><label>Growth stage</label><input id="fStage" placeholder="e.g. Nut fill, Flowering"></div>';
  html += '<div class="fld"><label>Weather</label><input id="fWeather" placeholder="e.g. Dry, 24°C"></div>';
  html += '<div class="fld"><label>Soil moisture</label><select id="fMoist"><option>Dry</option><option>Moderate</option><option selected>Good</option><option>Wet</option></select></div>';
  html += '<div class="fld"><label>Pest &amp; disease</label><input id="fPest" placeholder="e.g. Stink bug – low, or None"></div>';
  html += '<div class="fld"><label>Vigour</label><select id="fVigour"><option>Excellent</option><option selected>Good</option><option>Fair</option><option>Poor</option></select></div>';
  html += '</div>';
  html += '<div class="grid g4">';
  html += '<div class="fld"><label>Photos</label><input id="fPhotos" type="number" min="0" value="0"></div>';
  html += '<div class="fld span2"><label>Attach photos</label><input id="fPhotoFile" type="file" accept="image/*" multiple style="padding:7px;"></div>';
  html += '</div>';

  html += '<div class="fld"><div class="fld-head"><label for="fNote">Advisor note</label><button type="button" id="dictate" class="rec-btn">'+BB.icon('mic')+'Voice note</button></div>'+
    '<textarea id="fNote" rows="4" placeholder="What you saw, what to do next…"></textarea>'+
    '<div id="dictHint" class="faint" style="font-size:.72rem;margin-top:4px;"></div></div>';

  html += '<div class="row" style="justify-content:flex-end;"><button class="btn" id="saveVisit">'+BB.icon('check')+'Save field check</button></div>';
  html += '</div></div>';
  return html;
}

function paint(){
  var html;
  chartJobs = [];
  if(state.view==='report') html=renderReport(state.open);
  else if(state.view==='form') html=renderForm();
  else html=renderList();
  document.querySelector('main.wrap').innerHTML=html;
  chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });
  wire();
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function(tr){
    tr.onclick=function(){ state.view='report'; state.open=tr.getAttribute('data-open'); paint(); window.scrollTo(0,0); };
  });
  var nb=document.getElementById('newBtn'); if(nb) nb.onclick=function(){ state.view='form'; paint(); window.scrollTo(0,0); };
  var bl=document.getElementById('backList'); if(bl) bl.onclick=function(){ state.view='list'; paint(); };
  var bl2=document.getElementById('backList2'); if(bl2) bl2.onclick=function(){ state.view='list'; paint(); };
  var gr=document.getElementById('genReport'); if(gr) gr.onclick=function(){ window.print(); };

  var pf=document.getElementById('fPhotoFile');
  if(pf) pf.onchange=function(){ document.getElementById('fPhotos').value=(pf.files?pf.files.length:0); };

  wireDictation();

  var sv=document.getElementById('saveVisit');
  if(sv) sv.onclick=function(){
    var block=document.getElementById('fBlock').value;
    var b=d.by('blocks',block);
    if(!b){ BB.toast('Pick a block first'); return; }
    var rec=d.add('watch', {
      block: block,
      farmer: b.farmer,
      date: document.getElementById('fDate').value || today(),
      advisor: u.rep || 'rep_juba',
      stage: document.getElementById('fStage').value.trim(),
      weather: document.getElementById('fWeather').value.trim(),
      soilMoist: document.getElementById('fMoist').value,
      pest: document.getElementById('fPest').value.trim(),
      vigour: document.getElementById('fVigour').value,
      note: document.getElementById('fNote').value.trim(),
      photos: Number(document.getElementById('fPhotos').value)||0
    });
    BB.toast('Field check saved for '+d.farmer(b.farmer).farm);
    state.view='report'; state.open=rec.id; paint(); window.scrollTo(0,0);
  };
}

// ---- voice dictation (Web Speech API) ----
function wireDictation(){
  var btn=document.getElementById('dictate'); if(!btn) return;
  var hint=document.getElementById('dictHint');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    btn.disabled=true; btn.style.opacity='.5'; btn.style.cursor='not-allowed';
    hint.textContent='Voice capture is not available on this device — type the note instead.';
    return;
  }
  var rec=null, listening=false;
  btn.onclick=function(){
    if(!navigator.onLine){ hint.textContent='Voice capture needs signal — you are offline right now. Type the note for now.'; return; }
    if(listening && rec){ rec.stop(); return; }
    try{
      rec=new SR(); rec.lang='en-ZA'; rec.interimResults=false; rec.continuous=false;
    }catch(e){ hint.textContent='Voice capture could not start — type the note instead.'; return; }
    rec.onstart=function(){ listening=true; btn.classList.add('live'); btn.textContent='● Listening…'; hint.textContent='Speak your note, then tap again to stop.'; };
    rec.onresult=function(ev){
      var txt='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){ txt+=ev.results[i][0].transcript; }
      var ta=document.getElementById('fNote');
      ta.value=(ta.value ? ta.value.trim()+' ' : '')+txt.trim();
    };
    rec.onerror=function(){ hint.textContent='Could not hear that — try again or type the note.'; };
    rec.onend=function(){ listening=false; btn.classList.remove('live'); btn.innerHTML=BB.icon('mic')+'Voice note'; };
    try{ rec.start(); }catch(e){ hint.textContent='Voice capture is busy — try again.'; }
  };
}

document.body.insertAdjacentHTML('beforeend','<main class="wrap"></main>');
// a visit opened from a popup elsewhere (?open=)
(function(){ var o=params.get('open'); if(o && d.all('watch').filter(inMyScope).some(function(w){ return w.id===o; })){ state.view='report'; state.open=o; } })();
paint();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
