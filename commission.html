<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission · BioBrix OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=live35"></script><script src="guard.js?v=live35"></script>
<script src="bb-data.js?v=live35"></script>
<script src="bb-shell.js?v=live35"></script>
<style>
  .wrap{max-width:1160px;margin:0 auto;padding:0 18px 92px;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  .rate{width:92px;padding:7px 9px;text-align:right;font-size:.88rem;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;}
  .mini{font-size:.72rem;color:var(--faint);}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.86rem;line-height:1.55;}
</style>
</head>
<body>
<script>
BB.renderHeader({ back:'index.html' });
var d = BB.data, u = BB.user;
document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="main"></div></main>');

function money(v){ return BB.money(Math.round(v)); }
function ym(s){ return (s||'').slice(0,7); }

function render(){
  var sg = d.sage && d.sage(), pl = d.plan();
  var host = document.getElementById('main');
  var canEdit = BB.auth.can('finance') || u.roleKey==='director';
  var comm = pl.commission || { default:0, byProduct:{}, byAgent:{} };

  var html = '<div class="page-head"><h1>Commission</h1>'+
    '<p>Set the rate once — per agent, per product, or a house rate for everyone — and it is worked out on every invoice automatically, ready at month end. No spreadsheet, no recalculating by hand.</p></div>';

  if(!canEdit){
    html += '<div class="note">Commission rates are set by finance. Ask Wikus or Nadine if something looks wrong.</div>';
  }

  // ---- house rate ----
  html += '<div class="sec"><h2>House rate</h2><span class="ln"></span><span class="cnt">used when an agent has no rate of their own</span></div>';
  html += '<div class="card card-p"><div class="row" style="gap:12px;align-items:center;">'+
    (canEdit? '<input class="rate" id="defRate" inputmode="decimal" value="'+(comm.default||'')+'" placeholder="0">' : '<b>'+(comm.default||0)+'</b>')+
    '<span>% of what is invoiced</span></div></div>';

  // ---- per agent ----
  var reps = (sg && sg.reps) || [];
  var portalReps = d.allUnscoped('reps');
  var agentList = portalReps.map(function(r){ return {k:r.id, t:r.name, from:'portal'}; })
    .concat(reps.map(function(r){ return {k:'sage_rep_'+r.id, t:r.name, from:'accounts'}; }));
  html += '<div class="sec"><h2>Per agent</h2><span class="ln"></span><span class="cnt">overrides the house rate</span></div>';
  html += '<div class="card"><div class="scroll"><table class="bb"><thead><tr><th>Agent</th><th>Where they come from</th><th class="num">Rate</th></tr></thead><tbody>';
  agentList.forEach(function(a){
    var r = (comm.byAgent&&comm.byAgent[a.k]!=null) ? comm.byAgent[a.k] : '';
    html += '<tr><td><b>'+BB.esc(a.t)+'</b></td><td class="mini">'+(a.from==='accounts'?'your accounting system':'set up in the portal')+'</td>'+
      '<td class="num">'+(canEdit
        ? '<input class="rate" data-agent="'+BB.esc(a.k)+'" inputmode="decimal" value="'+r+'" placeholder="house rate">'
        : (r!==''? r+'%' : '<span class="faint">house rate</span>'))+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // ---- per product ---- (their own products, ranked by what they sell)
  var sageProducts = (sg && sg.products) || [];
  var products = sageProducts.length
    ? sageProducts.slice(0,60).map(function(x){ return { id:'sp_'+x.code, name:x.name, code:x.code, sold:x.value, real:true, src:'sage' }; })
    : d.allUnscoped('products');
  var stock = (sg && sg.stock) || [];
  var realP = products.length && products[0].real;
  html += '<div class="sec"><h2>Per product</h2><span class="ln"></span><span class="cnt">'+(realP? 'your 60 biggest sellers · rate applies to that product on every invoice':'to push the lines you want sold')+'</span>'+(realP?BB.liveChip():'')+'</div>';
  html += '<div class="card"><div class="scroll"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th class="num">Rate</th></tr></thead><tbody>';
  products.forEach(function(p){
    var r = (comm.byProduct&&comm.byProduct[p.id]!=null) ? comm.byProduct[p.id] : '';
    html += '<tr><td><b>'+BB.esc(p.name)+'</b>'+BB.sampleChip(p)+'</td><td class="mini">'+BB.esc(p.code||'')+'</td>'+
      '<td class="num">'+(canEdit? '<input class="rate" data-product="'+BB.esc(p.id)+'" inputmode="decimal" value="'+r+'" placeholder="house rate">' : (r!==''? r+'%':'<span class="faint">house rate</span>'))+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  if(realP){
    html += '<div class="pline faint" style="font-size:.78rem;margin-top:8px;">These are the products on your invoices, biggest first. A rate set here is used for that product wherever it appears.</div>';
  }

  // ---- this month, worked out ----
  if(sg && sg.live){
    var pl2 = pl, byId={}; (sg.customers||[]).forEach(function(c){ byId[c.id]=c; });
    function agentOf(c){ var s=pl2.agents&&pl2.agents['sage_'+c.id]; if(s) return s; return c.sageRep? ('sage_rep_'+c.sageRep):null; }
    function agentName(k){ if(!k) return 'Not allocated'; var m=agentList.find(function(a){return a.k===k;}); return m? m.t : k; }
    var thisMonth = new Date().toISOString().slice(0,7);
    var rows = {};
    (sg.invoices||[]).filter(function(i){ return i.kind!=='opening' && ym(i.date)===thisMonth; }).forEach(function(i){
      var c=byId[i.customer]||{}; var a=agentOf(c)||'none';
      rows[a]=rows[a]||{v:0,n:0}; rows[a].v+=(i.amount||0); rows[a].n++;
    });
    var keys=Object.keys(rows).sort(function(a,b){ return rows[b].v-rows[a].v; });
    var total=0;
    html += '<div class="sec"><h2>This month, worked out</h2><span class="ln"></span><span class="cnt">on what has been invoiced so far</span>'+BB.liveChip()+'</div>';
    if(!keys.length){
      html += '<div class="card card-p"><div class="empty">Nothing invoiced yet this month.</div></div>';
    } else {
      html += '<div class="card"><div class="scroll"><table class="bb"><thead><tr><th>Agent</th><th class="num">Invoiced</th><th class="num">Rate</th><th class="num">Commission</th></tr></thead><tbody>';
      keys.forEach(function(k){
        var rate = k==='none'? 0 : ((comm.byAgent&&comm.byAgent[k]!=null)? comm.byAgent[k] : (comm.default||0));
        var c = rows[k].v*rate/100; total+=c;
        html += '<tr><td><b>'+BB.esc(agentName(k==='none'?null:k))+'</b><div class="mini">'+rows[k].n+' invoices</div></td>'+
          '<td class="num">'+money(rows[k].v)+'</td><td class="num">'+(rate||0)+'%</td>'+
          '<td class="num"><b>'+(rate? money(c) : '<span class="faint">—</span>')+'</b></td></tr>';
      });
      html += '</tbody><tfoot><tr><td colspan="3" class="num"><b>Total for the month</b></td><td class="num"><b>'+money(total)+'</b></td></tr></tfoot></table></div></div>';
      html += '<div class="pline faint" style="font-size:.78rem;margin-top:8px;">Based on invoices, not on orders — so nobody earns commission on something that was never billed. Accounts with no agent are listed so they can be allocated in <a href="sales-report.html?view=customer" style="color:var(--green-dark);">Sales → By customer</a>.</div>';
    }
  }

  host.innerHTML = html;

  function save(patch){ d.savePlan({commission:patch}).then(function(){ BB.toast('Saved — used from the next invoice on'); render(); }).catch(function(){ render(); }); }
  var dr = document.getElementById('defRate');
  if(dr) dr.addEventListener('change', function(){ save({ default: parseFloat(dr.value)||0 }); });
  host.querySelectorAll('input[data-agent]').forEach(function(el){
    el.addEventListener('change', function(){ var o={}; o[el.getAttribute('data-agent')] = el.value===''? null : (parseFloat(el.value)||0); save({ byAgent:o }); });
  });
  host.querySelectorAll('input[data-product]').forEach(function(el){
    el.addEventListener('change', function(){ var o={}; o[el.getAttribute('data-product')] = el.value===''? null : (parseFloat(el.value)||0); save({ byProduct:o }); });
  });
}

render();
window.addEventListener('bb:sage', function(){ render(); });
window.addEventListener('bb:plan', function(){ render(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
