<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission · BioBrix OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign6"></script><script src="guard.js?v=redesign6"></script>
<script src="bb-data.js?v=redesign6"></script>
<script src="bb-shell.js?v=redesign6"></script>
<style>
  .rate{width:96px;padding:7px 9px;text-align:right;font-size:.88rem;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;background:#fff;}
  .rate:focus{border-color:var(--green-bright);outline:none;box-shadow:0 0 0 3px rgba(104,165,62,.15);}
  .mini{font-size:.72rem;color:var(--faint);}
  td.mini{white-space:nowrap;}
  .note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-bg);color:#1f4d70;border-radius:10px;padding:11px 14px;font-size:.84rem;line-height:1.5;margin-top:14px;}
  .note .ico{color:var(--blue);margin-top:1px;}
  .house{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .house .big{font-family:var(--display);font-size:1.6rem;font-weight:600;color:var(--green-darkest);}
  .cm-note{font-size:.78rem;margin-top:10px;}
  .cm-col{display:grid;gap:16px;align-content:start;}
</style>
</head>
<body>
<script>
BB.renderHeader({ back:'index.html' });
var d = BB.data, u = BB.user;
document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="main"></div></main>');

function money(v){ return BB.money(Math.round(v)); }
function ym(s){ return (s||'').slice(0,7); }

function render(){
  var sg = d.sage && d.sage(), pl = d.plan();
  var host = document.getElementById('main');
  var canEdit = BB.auth.can('finance') || u.roleKey==='director';
  var comm = pl.commission || { default:0, byProduct:{}, byAgent:{} };

  var reps = (sg && sg.reps) || [];
  var portalReps = d.allUnscoped('reps');
  var agentList = portalReps.map(function(r){ return {k:r.id, t:r.name, from:'portal'}; })
    .concat(reps.map(function(r){ return {k:'sage_rep_'+r.id, t:r.name, from:'accounts'}; }));
  var sageProducts = (sg && sg.products) || [];
  var products = sageProducts.length
    ? sageProducts.slice(0,60).map(function(x){ return { id:'sp_'+x.code, name:x.name, code:x.code, sold:x.value, real:true, src:'sage' }; })
    : d.allUnscoped('products');
  var stock = (sg && sg.stock) || [];
  var realP = products.length && products[0].real;
  var nAgentRates = Object.keys(comm.byAgent||{}).filter(function(k){ return comm.byAgent[k]!=null; }).length;
  var nProdRates = Object.keys(comm.byProduct||{}).filter(function(k){ return comm.byProduct[k]!=null; }).length;

  // ---- this month, worked out (ledger only) ----
  var live = !!(sg && sg.live), keys=[], rows={}, total=0, invTotal=0, chartJob=null, agentName=null, monthInv=[], akeyOf=null, custOf=null;
  if(live){
    var pl2 = pl, byId={}; (sg.customers||[]).forEach(function(c){ byId[c.id]=c; });
    var agentOf = function(c){ var s=pl2.agents&&pl2.agents['sage_'+c.id]; if(s) return s; return c.sageRep? ('sage_rep_'+c.sageRep):null; };
    agentName = function(k){ if(!k) return 'Not allocated'; var m=agentList.find(function(a){return a.k===k;}); return m? m.t : k; };
    var thisMonth = new Date().toISOString().slice(0,7);
    monthInv = (sg.invoices||[]).filter(function(i){ return i.kind!=='opening' && ym(i.date)===thisMonth; });
    akeyOf = function(i){ return agentOf(byId[i.customer]||{})||'none'; };
    custOf = function(i){ return byId[i.customer]||{}; };
    monthInv.forEach(function(i){
      var c=byId[i.customer]||{}; var a=agentOf(c)||'none';
      rows[a]=rows[a]||{v:0,n:0}; rows[a].v+=(i.amount||0); rows[a].n++;
    });
    keys=Object.keys(rows).sort(function(a,b){ return rows[b].v-rows[a].v; });
    keys.forEach(function(k){
      var rate = k==='none'? 0 : ((comm.byAgent&&comm.byAgent[k]!=null)? comm.byAgent[k] : (comm.default||0));
      rows[k].rate = rate; rows[k].c = rows[k].v*rate/100; total += rows[k].c; invTotal += rows[k].v;
    });
  }

  var html = '<div class="page-head"><div class="eyebrow">Sales</div><h1>Commission</h1>'+
    '<p>Set the rate once, per agent, per product or a house rate for everyone, and it is worked out on every invoice, ready at month end.</p></div>';

  if(!canEdit){
    html += '<div class="note">'+BB.icon('alert')+'<div>Commission rates are set by finance. Ask Wikus or Nadine if something looks wrong.</div></div>';
  }

  html += '<div class="grid g4" style="margin-top:16px;">'+
    '<div class="stat"><div class="l">House rate</div><div class="v">'+(comm.default||0)+'%</div><div class="s">when an agent has no rate of their own</div></div>'+
    '<div class="stat"><div class="l">Agents with their own rate</div><div class="v">'+nAgentRates+' <span style="font-size:.9rem;color:var(--faint);">of '+agentList.length+'</span></div><div class="s">the rest use the house rate</div></div>'+
    '<div class="stat"><div class="l">Products with a rate</div><div class="v">'+nProdRates+'</div><div class="s">'+(realP?'of your '+products.length+' biggest sellers':'to push the lines you want sold')+'</div></div>'+
    (live? '<a class="stat tap" href="sales-report.html?view=agent" data-detail="cmMonth">' : '<div class="stat">')+'<div class="l">Commission this month</div><div class="v">'+(live? money(total) : '—')+'</div><div class="s">'+(live? 'on '+money(invTotal)+' invoiced so far' : 'worked out once your accounting system is read')+'</div>'+(live?'</a>':'</div>')+
  '</div>';

  // ---- this month, worked out ----
  if(live){
    var tb;
    if(!keys.length){
      tb = '<div class="empty">Nothing invoiced yet this month.</div>';
    } else {
      tb = '<div class="scroll"><table class="bb"><thead><tr><th>Agent</th><th class="num">Invoiced</th><th class="num">Rate</th><th class="num">Commission</th></tr></thead><tbody>';
      keys.forEach(function(k){
        var r = rows[k];
        tb += '<tr><td><b>'+BB.esc(agentName(k==='none'?null:k))+'</b><div class="mini">'+r.n+' invoices</div></td>'+
          '<td class="num">'+money(r.v)+'</td><td class="num">'+(r.rate||0)+'%</td>'+
          '<td class="num"><b>'+(r.rate? money(r.c) : '<span class="faint">—</span>')+'</b></td></tr>';
      });
      tb += '</tbody><tfoot><tr><td>Total for the month</td><td class="num">'+money(invTotal)+'</td><td></td><td class="num">'+money(total)+'</td></tr></tfoot></table></div>';
    }
    html += '<div class="split" style="margin-top:16px;">'+
      '<div class="card"><div class="card-h"><div><h3>This month, worked out</h3><div class="sub">on what has been invoiced so far</div></div>'+BB.liveChip()+'</div>'+tb+'</div>'+
      '<div class="card"><div class="card-h"><div><h3>Invoiced this month, by agent</h3><div class="sub">the dark part is what they earn on it</div></div></div><div class="card-p"><div id="chComm"></div></div></div>'+
    '</div>';
    if(keys.length) chartJob = function(){ BB.chart.hbar('#chComm',{ money:true,
      rows:keys.map(function(k){ var r=rows[k]; return { label:agentName(k==='none'?null:k), sub:r.rate? r.rate+'%' : 'no rate', value:r.v,
        parts:[{name:'Commission',value:r.c,color:'#22431a'},{name:'Rest of the invoice',value:r.v-r.c,color:'#8fbf5a'}] }; }),
      legend:[{name:'Commission',color:'#22431a'},{name:'Rest of the invoice',color:'#8fbf5a'}],
      detail:function(ctx){ var k=keys[ctx.index]; return k==='none'? noneDetail() : agentCard(k); } }); };
    else chartJob = function(){ var el=document.getElementById('chComm'); if(el) el.innerHTML='<div class="empty">Nothing invoiced yet this month.</div>'; };
    if(keys.length) html += '<div class="cm-note faint">Based on invoices, not on orders, so nobody earns commission on something that was never billed. Accounts with no agent are listed so they can be allocated in <a href="sales-report.html?view=customer" style="color:var(--green-dark);">Sales, by customer</a>.</div>';
  }

  // ---- the rates: house + per agent beside per product ----
  var left = '<div class="cm-col">';
  left += '<div class="card"><div class="card-h"><div><h3>House rate</h3><div class="sub">used when an agent has no rate of their own</div></div></div><div class="card-p"><div class="house">'+
    (canEdit? '<input class="rate" id="defRate" inputmode="decimal" value="'+(comm.default||'')+'" placeholder="0">' : '<span class="big">'+(comm.default||0)+'</span>')+
    '<span class="muted">% of what is invoiced</span></div></div></div>';

  left += '<div class="card"><div class="card-h"><div><h3>Per agent</h3><div class="sub">overrides the house rate</div></div><span class="badge b-grey">'+agentList.length+'</span></div>';
  left += '<div class="scroll"><table class="bb"><thead><tr><th>Agent</th><th>Where they come from</th><th class="num">Rate %</th></tr></thead><tbody>';
  agentList.forEach(function(a){
    var r = (comm.byAgent&&comm.byAgent[a.k]!=null) ? comm.byAgent[a.k] : '';
    left += '<tr><td><b>'+BB.esc(a.t)+'</b></td><td class="mini">'+(a.from==='accounts'?'your accounting system':'set up in the portal')+'</td>'+
      '<td class="num">'+(canEdit
        ? '<input class="rate" data-agent="'+BB.esc(a.k)+'" inputmode="decimal" value="'+r+'" placeholder="house rate">'
        : (r!==''? r+'%' : '<span class="faint">house rate</span>'))+'</td></tr>';
  });
  left += '</tbody></table></div></div></div>';

  // per product (their own products, ranked by what they sell)
  var right = '<div class="card"><div class="card-h"><div><h3>Per product</h3><div class="sub">'+(realP? 'your 60 biggest sellers · the rate applies to that product on every invoice':'to push the lines you want sold')+'</div></div>'+(realP?BB.liveChip():'<span class="badge b-grey">'+products.length+'</span>')+'</div>';
  right += '<div class="scroll tall"><table class="bb"><thead><tr><th>Product</th><th>Code</th><th class="num">Rate %</th></tr></thead><tbody>';
  products.forEach(function(p){
    var r = (comm.byProduct&&comm.byProduct[p.id]!=null) ? comm.byProduct[p.id] : '';
    right += '<tr><td><b>'+BB.esc(p.name)+'</b>'+BB.sampleChip(p)+'</td><td class="mini">'+BB.esc(p.code||'')+'</td>'+
      '<td class="num">'+(canEdit? '<input class="rate" data-product="'+BB.esc(p.id)+'" inputmode="decimal" value="'+r+'" placeholder="house rate">' : (r!==''? r+'%':'<span class="faint">house rate</span>'))+'</td></tr>';
  });
  right += '</tbody></table></div>';
  if(realP) right += '<div class="card-f">These are the products on your invoices, biggest first. A rate set here is used for that product wherever it appears.</div>';
  right += '</div>';

  html += '<div class="grid g2" style="margin-top:16px;align-items:start;">'+left+right+'</div>';

  // ---- popups: the invoices commission is worked out on ----
  function merge(a,b){ Object.keys(b).forEach(function(k){ a[k]=b[k]; }); return a; }
  function rateFor(k){ return k==='none'? 0 : ((comm.byAgent&&comm.byAgent[k]!=null)? comm.byAgent[k] : (comm.default||0)); }
  function invoiceDetail(list, withAgent){
    var farmOf={}; try{ d.allUnscoped('farmers').forEach(function(f){ if(f.sageId!=null) farmOf[f.sageId]=f.id; }); }catch(e){}
    list=list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    var cols=['Date','Invoice','Customer'].concat(withAgent?['Agent']:[]).concat(['Invoiced','Commission']), tv=0, tc=0;
    var out=list.map(function(i){ var k=akeyOf(i), c=(i.amount||0)*rateFor(k)/100; tv+=(i.amount||0); tc+=c;
      return { href:farmOf[i.customer]? 'farm-detail.html?farmer='+encodeURIComponent(farmOf[i.customer]) : null,
        cells:[BB.date(i.date), i.label||i.ref||'—', custOf(i).name||'—'].concat(withAgent?[agentName(k==='none'?null:k)]:[]).concat([money(i.amount||0), c? money(c) : '—']) }; });
    if(list.length>1) out.push({ cells:[{ html:'<b>'+list.length+' invoices</b>' }].concat(cols.slice(1,-2).map(function(){ return {html:''}; })).concat([{ html:'<b>'+money(tv)+'</b>' }, { html:'<b>'+money(tc)+'</b>' }]) });
    return { wide:true, table:{ columns:cols, rows:out, num:[cols.length-2, cols.length-1] },
      note:'Worked out per invoice at the agent\u2019s rate, or the house rate when they have none.'+(Object.keys(farmOf).length? ' Tap an invoice to open the farm file.' : '') };
  }
  // an agent, as its card: who they are and where they come from · the month in figures · the invoices it is worked out on
  function agentCard(k){
    var r=rows[k]||{v:0,n:0,rate:rateFor(k),c:0}, a=agentList.find(function(x){ return x.k===k; })||{t:agentName(k), from:'accounts'};
    var pr=a.from==='portal'? d.rep(k) : null, list=monthInv.filter(function(i){ return akeyOf(i)===k; }), nc={};
    list.forEach(function(i){ nc[i.customer]=1; });
    var own=comm.byAgent&&comm.byAgent[k]!=null, x=invoiceDetail(list, false); x.table.title='Invoices this month';
    var mon=new Date(); mon=BB.monthName(mon.getMonth())+' '+mon.getFullYear();
    return merge(x, { eyebrow:'Agent · commission', title:a.t, color:null, layout:'split',
      meta:[ { initials:String(a.t||'').split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase(), color:(pr&&pr.colour)||'#3f6b28', text:a.from==='portal'?'Set up in the portal':'From your accounting system', tip:'Where they come from' },
        pr&&pr.region?{ icon:'map', text:pr.region, tip:'Region' }:null,
        { icon:'calendar', text:mon+', so far', tip:'Period' } ],
      stats:[{ l:'Invoiced', v:money(r.v), s:r.n+' invoice'+(r.n===1?'':'s') }, { l:'Rate', v:(r.rate||0)+'%', s:own?'their own rate':'the house rate' },
        { l:'Commission', v:r.rate? money(r.c) : '—', s:'this month' }, { l:'Customers', v:BB.num(Object.keys(nc).length), s:'invoiced' }],
      actions:[ { label:'Sales by agent', href:'sales-report.html?view=agent' },
        canEdit? { label:'Change the rate', primary:true, onClick:function(){ BB.closePopup(); var el=host.querySelector('input[data-agent="'+String(k).replace(/"/g,'\\"')+'"]'); if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); setTimeout(function(){ el.focus(); el.select(); }, 400); } } } : null ].filter(Boolean) });
  }
  // accounts with no agent: a list, not a person
  function noneDetail(){ var r=rows.none||{v:0,n:0}, x=invoiceDetail(monthInv.filter(function(i){ return akeyOf(i)==='none'; }), false);
    return merge(x, { title:'Not allocated', stats:[{ l:'Invoiced', v:money(r.v), s:r.n+' invoice'+(r.n===1?'':'s') }, { l:'Commission', v:'—', s:'no agent, no rate' }],
      actions:[{ label:'Allocate them', href:'sales-report.html?view=customer', primary:true }] }); }
  if(live) BB.statDetail('cmMonth', function(){ var x=invoiceDetail(monthInv, true);
    return merge(x, { stats:[{ l:'Commission', v:money(total) }, { l:'Invoiced', v:money(invTotal), s:monthInv.length+' invoices' }],
      actions:[{ label:'Open the full list', href:'sales-report.html?view=agent', primary:true }] }); });
  host.innerHTML = html;
  if(chartJob){ try{ chartJob(); }catch(e){ console.warn('chart', e); } }

  function save(patch){ d.savePlan({commission:patch}).then(function(){ BB.toast('Saved — used from the next invoice on'); render(); }).catch(function(){ render(); }); }
  var dr = document.getElementById('defRate');
  if(dr) dr.addEventListener('change', function(){ save({ default: parseFloat(dr.value)||0 }); });
  host.querySelectorAll('input[data-agent]').forEach(function(el){
    el.addEventListener('change', function(){ var o={}; o[el.getAttribute('data-agent')] = el.value===''? null : (parseFloat(el.value)||0); save({ byAgent:o }); });
  });
  host.querySelectorAll('input[data-product]').forEach(function(el){
    el.addEventListener('change', function(){ var o={}; o[el.getAttribute('data-product')] = el.value===''? null : (parseFloat(el.value)||0); save({ byProduct:o }); });
  });
}

render();
window.addEventListener('bb:sage', function(){ render(); });
window.addEventListener('bb:plan', function(){ render(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
