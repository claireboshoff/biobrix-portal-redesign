<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast &amp; actual · BioBrix OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22431a">
<script src="bb-config.js?v=redesign1"></script><script src="guard.js?v=redesign1"></script>
<script src="bb-data.js?v=redesign1"></script>
<script src="bb-shell.js?v=redesign1"></script>
<style>
  .qty{width:96px;padding:7px 9px;text-align:right;font-size:.88rem;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;background:#fff;}
  .qty:focus{border-color:var(--green-bright);outline:none;box-shadow:0 0 0 3px rgba(104,165,62,.15);}
  .qty.proposed{border-style:dashed;border-color:var(--green-bright);background:#f6fbef;}
  .mini{font-size:.72rem;color:var(--faint);}
  .pick{padding:8px 11px;font-size:.85rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;max-width:100%;}
  .seg a{display:inline-flex;align-items:center;white-space:nowrap;}
  .toolbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .season{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;}
  .ico.flip{transform:rotate(180deg);}
  .fp-table td:first-child,.fp-table th:first-child{position:sticky;left:0;z-index:2;background:#fff;min-width:190px;}
  .fp-table th:first-child{background:var(--panel-2);z-index:3;} .fp-table tfoot td:first-child{background:var(--panel-2);}
  .fp-table td{vertical-align:top;}
  .trk-bar{height:8px;border-radius:5px;background:var(--line-soft);overflow:hidden;width:150px;} .trk-bar > i{display:block;height:100%;}
  .fp-note{font-size:.78rem;margin-top:10px;}
  .fp-val td:first-child{white-space:nowrap;}
  @media(max-width:560px){ .fp-table td:first-child,.fp-table th:first-child{min-width:140px;} }
</style>
</head>
<body>
<script>
BB.renderHeader({ back:'index.html' });
var d = BB.data, u = BB.user;
document.body.insertAdjacentHTML('beforeend','<main class="wrap"><div id="main"></div></main>');

function money(v){ return BB.money(Math.round(v)); }
function ym(s){ return (s||'').slice(0,7); }
function monthLabel(k){ var p=k.split('-'); return BB.monthName(parseInt(p[1],10)-1)+' '+p[0].slice(2); }
// The season BioBrix plans against: 12 months from the month we are in.
function seasonMonths(startYm){
  var out=[], p=startYm.split('-'), y=parseInt(p[0],10), m=parseInt(p[1],10);
  for(var i=0;i<12;i++){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} }
  return out;
}

function render(){
  var sg = d.sage && d.sage(), pl = d.plan();
  var host = document.getElementById('main');
  var canEdit = BB.auth.can('finance') || u.roleKey==='director' || u.roleKey==='advisor';
  // Their own products, ranked by what they actually sell, come from the accounting system.
  // The demo list is only used until that arrives.
  var sageProducts = (sg && sg.products) || [];
  var products = sageProducts.length
    ? sageProducts.map(function(x){ return { id:'sp_'+x.code, name:x.name, code:x.code, pack:x.pack||'', months:x.months||{}, sold:x.qty, real:true }; })
    : d.allUnscoped('products');
  var q = new URLSearchParams(location.search);
  var startYm = q.get('from') || new Date().toISOString().slice(0,7);
  var months = seasonMonths(startYm);
  var view = (q.get('view')||'product').toLowerCase();
  var fc = pl.forecasts || {};

  var prevFrom = seasonMonths(startYm)[0].replace(/^(\d{4})-(\d{2})$/,function(_,y,m){var mm=parseInt(m,10)-1,yy=+y;if(mm<1){mm=12;yy--;}return yy+'-'+String(mm).padStart(2,'0');});
  var html = '<div class="page-head row between" style="gap:16px;"><div><div class="eyebrow">Sales</div><h1>Forecast &amp; actual</h1>'+
    '<p>Plan the year in litres and kilograms, product by product, and watch it against what is actually invoiced. A new customer or product simply joins the plan.</p></div>'+
    '<div class="row" style="gap:8px;"><a class="btn ghost sm" href="forecast-plan.html?view='+view+'&from='+prevFrom+'">'+BB.icon('chevron','flip')+'Earlier</a>'+
    '<span class="season">'+monthLabel(months[0])+' – '+monthLabel(months[11])+'</span>'+
    '<a class="btn ghost sm" href="forecast-plan.html?view='+view+'&from='+months[1]+'">Later'+BB.icon('chevron')+'</a></div></div>';

  html += BB.staleNote();
  html += '<div class="toolbar"><div class="seg">'+
    ['product|By product','customer|By customer','value|Value vs invoiced'].map(function(o){
      var k=o.split('|')[0],t=o.split('|')[1];
      return '<a class="'+(view===k?'on':'')+'" href="forecast-plan.html?view='+k+'&from='+startYm+'">'+t+'</a>';
    }).join('')+'</div></div>';
  var chartJobs = [];
  // ---- popups: what sits behind a chart part ----
  function merge(a,b){ Object.keys(b).forEach(function(k){ a[k]=b[k]; }); return a; }
  // a ledger customer's farm file, when the accounts have been laid over the farm list
  var farmOf = {}; try{ d.allUnscoped('farmers').forEach(function(f){ if(f.sageId!=null) farmOf[f.sageId]=f.id; }); }catch(e){}
  function custHref(id){ return farmOf[id]? 'farm-detail.html?farmer='+encodeURIComponent(farmOf[id]) : null; }
  var custName = {}; ((sg && sg.customers)||[]).forEach(function(c){ custName[c.id]=c.name; });
  // invoices (ledger) behind a month or a customer: date, number, customer, amount, with a total
  function invoiceTable(list, showCust){
    list=list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    var tot=0, cols=['Date','Invoice'].concat(showCust?['Customer']:[]).concat(['Amount']);
    var rows=list.slice(0,200).map(function(i){ tot+=(i.amount||0);
      return { onClick:showCust? custRow(i.customer) : null, cells:[BB.date(i.date), i.label||i.ref||'—'].concat(showCust?[custName[i.customer]||'—']:[]).concat([money(i.amount||0)]) }; });
    var all=list.reduce(function(t,i){ return t+(i.amount||0); },0);
    if(list.length>1) rows.push({ cells:[{ html:'<b>'+list.length+' invoices</b>' }].concat(cols.slice(1,-1).map(function(){ return {html:''}; })).concat([{ html:'<b>'+money(all)+'</b>' }]) });
    return { table:{ columns:cols, rows:rows, num:[cols.length-1] }, note: list.length>200? 'Showing the 200 newest of '+list.length+'.' : null };
  }
  // ---- record cards (CONVENTIONS: the card pattern): a ledger customer, a product ----
  var custById = {}; ((sg && sg.customers)||[]).forEach(function(c){ custById[c.id]=c; });
  var custRow = function(id){ return custById[id]? function(){ BB.popup(custCard(id)); } : null; };
  var planCell = function(sel){ var el=host.querySelector(sel); if(!el) return null;
    return function(){ BB.closePopup(); el.scrollIntoView({ behavior:'smooth', block:'center' }); setTimeout(function(){ el.focus(); }, 400); }; };
  // a customer: account, town, farm file · invoiced, invoices, last invoice, planned · its invoices
  function custCard(id){
    var c=custById[id]||{ name:custName[id]||'—' }, list=ledgerInv.filter(function(i){ return i.customer===id; }), x=invoiceTable(list, false);
    var tot=list.reduce(function(t,i){ return t+(i.amount||0); },0), last=list.reduce(function(m,i){ return (i.date||'')>m? i.date : m; }, '');
    var plan=0; months.slice(0,6).forEach(function(m){ plan += Number(((fc[d.fKey(m, null, 'sage_'+id)]||{}).value)||0); });
    var rec=custHref(id), go=canEdit && view==='customer'? planCell('input[data-fv="'+d.fKey(months[0], null, 'sage_'+id)+'"]') : null;
    x.table.title='Invoices to date';
    return merge(x, { eyebrow:'Customer', title:c.name||'—', color:null, wide:true, layout:'split',
      meta:[ c.code?{ icon:'tag', text:c.code, tip:'Account' }:null, c.town?{ icon:'map', text:c.town, tip:'Town' }:null, rec?{ icon:'farm', text:'Farm file', href:rec, tip:'Farm file' }:null ],
      stats:[{ l:'Invoiced to date', v:money(tot), s:'excl. opening balance' }, { l:'Invoices', v:BB.num(list.length) }, { l:'Last invoice', v:last? BB.shortDate(last) : '—' },
        { l:'Planned', v:plan? money(plan) : '—', s:'next six months' }],
      actions:[ rec?{ label:'Farm file', href:rec }:null, go?{ label:'Plan this customer', primary:true, onClick:go }:null ].filter(Boolean) });
  }
  // a product: code, pack · planned, last year, sold · month by month
  function productCard(p){
    var tp=0, tl=0;
    var cells=months.map(function(m){
      var v=Number(((fc[d.fKey(m, p.id, null)]||{}).qty)||0), ly=(parseInt(m.slice(0,4),10)-1)+m.slice(4), w=(p.months&&p.months[ly])? Number(p.months[ly].qty)||0 : 0;
      tp+=v; tl+=w; return { cells:[monthLabel(m), v? BB.num(v) : '—', w? BB.num(w) : '—', { html:(v&&w)? BB.delta(v,w)||'—' : '—' }] }; });
    var go=canEdit && view==='product'? planCell('input[data-f="'+d.fKey(months[0], p.id, null)+'"]') : null;
    return { eyebrow:'Product', title:p.name, color:null, wide:true, layout:'split',
      meta:[ p.code?{ icon:'tag', text:p.code, tip:'Code' }:null, { icon:'package', text:'Counted in '+(p.pack||'L'), tip:'Unit' }, p.real?{ icon:'link', text:'From your accounting system', tip:'Source' }:null ],
      stats:[{ l:'Planned', v:tp? BB.num(Math.round(tp)) : '—', s:'this season' }, { l:'Last year', v:tl? BB.num(Math.round(tl)) : '—', s:'the same months' }, { l:'Change', html:(tp&&tl)? BB.delta(tp,tl)||'—' : '—' },
        p.sold? { l:'Sold to date', v:BB.num(p.sold) } : { l:'Months planned', v:BB.num(months.filter(function(m){ return Number(((fc[d.fKey(m, p.id, null)]||{}).qty)||0); }).length), s:'of 12' }],
      table:{ title:'Month by month, units', columns:['Month','Plan','Last year','Change'], rows:cells, num:[1,2,3], foot:['The season', tp? BB.num(Math.round(tp)) : '—', tl? BB.num(Math.round(tl)) : '—', ''] },
      actions:[ go?{ label:'Edit the plan', primary:true, onClick:go }:null ].filter(Boolean) };
  }
  function prevMonthsAll(){ var out=[], p=startYm.split('-'), y=parseInt(p[0],10), m=parseInt(p[1],10); for(var i=0;i<12;i++){ m--; if(m<1){m=12;y--;} out.unshift(y+'-'+String(m).padStart(2,'0')); } return out; }
  var ledgerInv = (sg && sg.live) ? (sg.invoices||[]).filter(function(i){ return i.kind!=='opening'; }) : [];
  function emptyChart(sel, msg){ chartJobs.push(function(){ var el=document.querySelector(sel); if(el) el.innerHTML='<div class="empty">'+msg+'</div>'; }); }
  function stat(l, v, sub, cls){ return '<div class="stat'+(cls?' '+cls:'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+sub+'</div></div>'; }
  // a figure that is a list of invoices opens that list over the page
  function tapStat(key, href, l, v, sub){ return '<a class="stat tap" href="'+href+'" data-detail="'+key+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+sub+'</div></a>'; }

  // ---------- actuals from the ledger ----------
  var actualByMonth = {}, actualByCustomerMonth = {};
  if(sg && sg.live){
    (sg.invoices||[]).filter(function(i){ return i.kind!=='opening'; }).forEach(function(i){
      var k=ym(i.date); if(!k) return;
      actualByMonth[k]=(actualByMonth[k]||0)+(i.amount||0);
      var ck=i.customer+'|'+k; actualByCustomerMonth[ck]=(actualByCustomerMonth[ck]||0)+(i.amount||0);
    });
  }

  // ---------- by product: quantity plan ----------
  if(view==='product'){
    var real = products.length && products[0].real;
    // what the page already holds, added up: the plan per month and the same month last year
    var planM = months.map(function(){ return 0; }), lyM = months.map(function(){ return 0; }), setCells = 0, perProd = [];
    products.forEach(function(p){
      var pt=0, lt=0;
      months.forEach(function(m, mi){
        var v = Number(((fc[d.fKey(m, p.id, null)]||{}).qty)||0); if(v){ planM[mi]+=v; pt+=v; setCells++; }
        if(p.months){ var ly=(parseInt(m.slice(0,4),10)-1)+m.slice(4); if(p.months[ly]){ var q=Number(p.months[ly].qty)||0; lyM[mi]+=q; lt+=q; } }
      });
      perProd.push({ label:p.name, sub:p.pack||'', value:pt, ly:lt });
    });
    var planTot = planM.reduce(function(a,b){return a+b;},0), lyTot = lyM.reduce(function(a,b){return a+b;},0);
    // with nothing planned yet, rank by the same months last year so the panel still says something true
    var rankByLy = !planTot && lyTot;
    html += '<div class="grid g4">'+
      stat('Products in the plan', products.length, real? 'the lines you actually sell' : 'sample products')+
      stat('Planned this season', BB.num(Math.round(planTot)), 'units across '+months.length+' months')+
      stat('Same months last year', lyTot? BB.num(Math.round(lyTot)) : '—', lyTot? 'units invoiced' : 'needs your accounting system')+
      stat('Months set', setCells+' <span style="font-size:.9rem;color:var(--faint);">of '+(products.length*months.length)+'</span>', 'product-months with a figure', (products.length && !setCells)?'warn':'')+
    '</div>';
    // nothing planned and no history: two empty panels would only push the table down
    if(planTot || lyTot) html += '<div class="split" style="margin-top:16px;">'+
      '<div class="card"><div class="card-h"><div><h3>Plan against last year</h3><div class="sub">units per month, all products</div></div>'+(real?BB.liveChip():'')+'</div><div class="card-p"><div id="chPlan"></div></div></div>'+
      '<div class="card"><div class="card-h"><div><h3>Biggest lines '+(rankByLy?'last year':'in the plan')+'</h3><div class="sub">'+(rankByLy?'units invoiced in these months last year':'planned units this season')+'</div></div></div><div class="card-p"><div id="chProd"></div></div></div>'+
    '</div>';
    if(planTot || lyTot) chartJobs.push(function(){ BB.chart.bar('#chPlan',{ labels:months.map(monthLabel), height:230, table:true,
      series:[{name:'Plan',values:planM,color:'#3f6b28'},{name:'Last year',values:lyM,color:'#c77d17'}],
      // the product lines that make up the month: planned units beside the same month last year
      detail:function(ctx){
        var m=months[ctx.index], ly=(parseInt(m.slice(0,4),10)-1)+m.slice(4), tp=0, tl=0;
        var rows=products.map(function(p){
          var v=Number(((fc[d.fKey(m, p.id, null)]||{}).qty)||0), w=(p.months&&p.months[ly])? Number(p.months[ly].qty)||0 : 0;
          return { p:p, v:v, w:w };
        }).filter(function(x){ return x.v||x.w; }).sort(function(a,b){ return (b.v-a.v)||(b.w-a.w); });
        rows.forEach(function(x){ tp+=x.v; tl+=x.w; });
        var cells=rows.map(function(x){ return { onClick:function(){ BB.popup(productCard(x.p)); }, cells:[{ html:'<b>'+BB.esc(x.p.name)+'</b>' }, x.p.pack||'L', x.v? BB.num(x.v) : '—', x.w? BB.num(x.w) : '—',
          { html:(x.v&&x.w)? BB.delta(x.v,x.w)||'—' : '—' }] }; });
        if(rows.length>1) cells.push({ cells:[{ html:'<b>'+rows.length+' products</b>' }, {html:''}, { html:'<b>'+BB.num(Math.round(tp))+'</b>' }, { html:'<b>'+BB.num(Math.round(tl))+'</b>' }, {html:''}] });
        return { stats:[{ l:'Plan', v:tp? BB.num(Math.round(tp)) : '—', s:'units' }, { l:'Last year', v:tl? BB.num(Math.round(tl)) : '—', s:'units invoiced' }, { l:'Products', v:BB.num(rows.length), s:'planned or sold' }],
          table:{ columns:['Product','Unit','Plan','Last year','Change'], rows:cells, num:[2,3,4] },
          note:rows.length? null : 'Nothing planned or sold in '+ctx.label+'.' };
      } }); });
    else emptyChart('#chPlan','Nothing planned yet. Type a figure in the table below and it shows here.');
    var topP = perProd.map(function(x){ return { label:x.label, sub:x.sub, value:rankByLy? x.ly : x.value }; })
      .filter(function(x){ return x.value>0; }).sort(function(a,b){ return b.value-a.value; }).slice(0,8);
    if(topP.length) chartJobs.push(function(){ BB.chart.hbar('#chProd',{ rows:topP,
      // one product, month by month: plan beside last year
      detail:function(ctx){
        var p=products.filter(function(x){ return x.name===ctx.row.label; })[0]; if(!p) return null;
        return productCard(p);
      } }); });
    else emptyChart('#chProd','No product has a planned figure yet.');

    // Counting what we could propose lets the button say something true rather than "fill".
    var canFill=0, wouldChange=0;
    if(real){
      products.forEach(function(p2){
        months.forEach(function(m){
          var ly=(parseInt(m.slice(0,4),10)-1)+m.slice(4);
          if(p2.months && p2.months[ly] && p2.months[ly].qty){
            canFill++;
            if(!((fc[d.fKey(m,p2.id,null)]||{}).qty)) wouldChange++;
          }
        });
      });
    }
    html += '<div class="card" style="margin-top:16px;"><div class="card-h"><div><h3>The year in litres and kilograms</h3><div class="sub">'+
      (real? products.length+(products.length===1?' product':' products')+' you actually sell, ranked by what you sold · last year in grey under each box' : 'type a number and it saves for everyone')+'</div></div>'+
      '<div class="row" style="gap:8px;">'+(real?BB.liveChip():'')+
      (canEdit && wouldChange? '<button class="btn sm" id="fillYear">'+BB.icon('refresh')+'Start from last year ('+wouldChange+' months)</button>' : '')+'</div></div>';
    html += '<div class="scroll"><table class="bb fp-table"><thead><tr><th>Product</th><th>Unit</th>'+
      months.map(function(m){ return '<th class="num">'+monthLabel(m)+'</th>'; }).join('')+'<th class="num">Year</th></tr></thead><tbody>';
    products.forEach(function(p){
      var rowTotal=0;
      var cells = months.map(function(m){
        var key = d.fKey(m, p.id, null);
        var v = (fc[key]&&fc[key].qty)||'';
        if(v) rowTotal += Number(v)||0;
        // the same month a year ago, so the plan starts from evidence rather than a blank box
        var lastYear = null;
        if(p.months){ var ly = (parseInt(m.slice(0,4),10)-1)+m.slice(4); if(p.months[ly]) lastYear = p.months[ly].qty; }
        var proposed = (fc[key]||{}).from==='last year';
        return '<td class="num">'+(canEdit
          ? '<input class="qty'+(proposed?' proposed':'')+'" inputmode="decimal" data-f="'+key+'" value="'+v+'" placeholder="'+(lastYear? BB.num(lastYear) : '—')+'" title="'+(proposed?'taken from last year — change it if it should differ':'')+'">'
          : (v||'<span class="faint">—</span>'))+
          (lastYear? '<div class="mini">was '+BB.num(lastYear)+'</div>' : '')+'</td>';
      }).join('');
      html += '<tr><td><b>'+BB.esc(p.name)+'</b><div class="mini">'+BB.esc(p.code||'')+(p.sold? ' · '+BB.num(p.sold)+' sold to date':'')+'</div></td>'+
        '<td class="mini" style="white-space:nowrap;">'+BB.esc(p.pack||'L')+'</td>'+cells+
        '<td class="num"><b>'+(rowTotal? BB.num(rowTotal) : '—')+'</b></td></tr>';
    });
    html += '</tbody><tfoot><tr><td>All products</td><td></td>'+planM.map(function(v){ return '<td class="num">'+(v?BB.num(Math.round(v)):'—')+'</td>'; }).join('')+
      '<td class="num">'+(planTot?BB.num(Math.round(planTot)):'—')+'</td></tr></tfoot></table></div></div>';
    if(!real) html += '<div class="fp-note faint">Showing sample products until the next read of your accounting system.</div>';
  }

  // ---------- by customer ----------
  if(view==='customer'){
    var customers = (sg && sg.customers) || [];
    var top = customers.map(function(c){
      var t=0; months.forEach(function(m){ t += actualByCustomerMonth[c.id+'|'+m]||0; });
      var last12=0; (sg.invoices||[]).forEach(function(i){ if(i.customer===c.id && i.kind!=='opening') last12+=(i.amount||0); });
      return {c:c, last12:last12};
    }).sort(function(a,b){ return b.last12-a.last12; }).slice(0,40);
    // the plan typed against these customers for the six months shown
    var planCust = 0;
    top.forEach(function(r){ months.slice(0,6).forEach(function(m){ planCust += Number(((fc[d.fKey(m, null, 'sage_'+r.c.id)]||{}).value)||0); }); });
    var invTop = top.reduce(function(t,r){ return t+r.last12; },0);
    // the twelve months before the season, invoiced — the evidence the plan starts from
    var prevMonths = (function(){ var out=[], p=startYm.split('-'), y=parseInt(p[0],10), m=parseInt(p[1],10); for(var i=0;i<12;i++){ m--; if(m<1){m=12;y--;} out.unshift(y+'-'+String(m).padStart(2,'0')); } return out; })();
    var prevVals = prevMonths.map(function(m){ return actualByMonth[m]||0; });
    html += '<div class="grid g4">'+
      stat('Customers shown', top.length, top.length? 'your biggest, by invoiced to date' : 'from your accounting system')+
      stat('Invoiced to date', money(invTop), 'these customers, all time')+
      stat('Planned, next six months', planCust? money(planCust) : '—', planCust? 'typed against these customers' : 'type it in the table below')+
      tapStat('fpLast12', 'sales-report.html?view=monthly', 'Last 12 months', money(prevVals.reduce(function(a,b){return a+b;},0)), 'invoiced, every customer')+
    '</div>';
    html += '<div class="split" style="margin-top:16px;">'+
      '<div class="card"><div class="card-h"><div><h3>Invoiced, the 12 months before</h3><div class="sub">what the plan starts from</div></div>'+BB.liveChip()+'</div><div class="card-p"><div id="chBack"></div></div></div>'+
      '<div class="card"><div class="card-h"><div><h3>Biggest customers</h3><div class="sub">invoiced to date</div></div></div><div class="card-p"><div id="chCust"></div></div></div>'+
    '</div>';
    if(prevVals.some(function(v){ return v>0; })) chartJobs.push(function(){ BB.chart.bar('#chBack',{ labels:prevMonths.map(monthLabel), money:true, height:290, table:true, series:[{name:'Invoiced',values:prevVals,color:'#3f6b28'}],
      detail:function(ctx){ var m=prevMonths[ctx.index], list=ledgerInv.filter(function(i){ return ym(i.date)===m; });
        var nc={}; list.forEach(function(i){ nc[i.customer]=1; });
        return merge(invoiceTable(list, true), { wide:true, stats:[{ l:'Invoiced', v:money(ctx.total), s:'opening balances left out' }, { l:'Invoices', v:BB.num(list.length) }, { l:'Customers', v:BB.num(Object.keys(nc).length) }] }); } }); });
    else emptyChart('#chBack','This fills in from your accounting system.');
    var topRows = top.filter(function(r){ return r.last12>0; }).slice(0,8).map(function(r){ return { label:r.c.name, sub:r.c.town||'', value:r.last12, cid:r.c.id, href:custHref(r.c.id) }; });
    if(topRows.length) chartJobs.push(function(){ BB.chart.hbar('#chCust',{ money:true, rows:topRows, openLabel:'Open farm file',
      detail:function(ctx){ return custCard(ctx.row.cid); } }); });
    else emptyChart('#chCust','No customer figures yet.');

    html += '<div class="card" style="margin-top:16px;"><div class="card-h"><div><h3>By customer</h3><div class="sub">your 40 biggest · last year invoiced shown as the starting point · amounts in rands</div></div>'+BB.liveChip()+'</div>';
    html += '<div class="scroll"><table class="bb fp-table"><thead><tr><th>Customer</th><th class="num">Invoiced to date</th>'+
      months.slice(0,6).map(function(m){ return '<th class="num">'+monthLabel(m)+'</th>'; }).join('')+'</tr></thead><tbody>';
    if(!top.length) html += '<tr><td colspan="8"><div class="empty">Your customers come from your accounting system. They appear here once it has been read.</div></td></tr>';
    top.forEach(function(r){
      var cells = months.slice(0,6).map(function(m){
        var key = d.fKey(m, null, 'sage_'+r.c.id);
        var v = (fc[key]&&fc[key].value)||'';
        return '<td class="num">'+(canEdit? '<input class="qty" inputmode="decimal" data-fv="'+key+'" value="'+v+'" placeholder="—">' : (v? money(v):'<span class="faint">—</span>'))+'</td>';
      }).join('');
      html += '<tr><td><b>'+BB.esc(r.c.name)+'</b><div class="mini">'+BB.esc(r.c.town||'')+'</div></td>'+
        '<td class="num">'+money(r.last12)+'</td>'+cells+'</tr>';
    });
    html += '</tbody></table></div></div>';
    html += '<div class="fp-note faint">A customer who only starts in August simply gets a figure from August. Nothing has to be rebuilt.</div>';
  }

  // ---------- value vs invoiced ----------
  if(view==='value'){
    var rowsV = months.map(function(m){
      // a month's forecast = the month total typed here, else the sum of the per-customer figures
      var mk = d.fKey(m, null, null);
      var typed = (fc[mk]&&fc[mk].value)||0;
      var fromCustomers = Object.keys(fc).filter(function(k){ return k.indexOf(m+'|all|')===0 && k!==mk; })
        .reduce(function(t,k){ return t+(Number(fc[k].value)||0); },0);
      return { m:m, mk:mk, typed:typed, fromCustomers:fromCustomers, f:(typed || fromCustomers), a:(actualByMonth[m]||0) };
    });
    var fTot=0, aTot=0;
    rowsV.forEach(function(r){ fTot+=Number(r.f)||0; aTot+=r.a; });
    // tracking is only fair over the months that have both a forecast and something invoiced
    var fSoFar=0, aSoFar=0; rowsV.forEach(function(r){ if(r.f && r.a){ fSoFar+=Number(r.f)||0; aSoFar+=r.a; } });
    var trk = fSoFar? Math.round(aSoFar/fSoFar*100) : null;
    html += '<div class="grid g4">'+
      stat('Forecast for the year', fTot? money(fTot) : '—', fTot? 'typed or added up from customers' : 'set a month below')+
      tapStat('fpSoFar', 'sales-report.html?view=monthly', 'Invoiced so far', money(aTot), 'this season, opening balances left out')+
      stat('Left to reach forecast', (fTot? money(Math.max(0,fTot-aTot)) : '—'), fTot? (aTot>=fTot?'forecast reached, '+money(aTot-fTot)+' over':'for the whole year') : 'set a forecast first')+
      stat('Tracking', trk===null? '—' : trk+'%', trk===null? 'needs a forecast and an invoiced month' : 'of forecast, in months with both', (trk!==null && trk<80)?'warn':'')+
    '</div>';
    html += '<div class="split" style="margin-top:16px;">'+
      '<div class="card"><div class="card-h"><div><h3>Forecast against invoiced</h3><div class="sub">by month</div></div>'+BB.liveChip()+'</div><div class="card-p"><div id="chVal"></div></div></div>'+
      '<div class="card"><div class="card-h"><div><h3>Running total</h3><div class="sub">the year so far, added up</div></div></div><div class="card-p"><div id="chCum"></div></div></div>'+
    '</div>';
    if(fTot || aTot){
      var fv = rowsV.map(function(r){ return Number(r.f)||0; }), av = rowsV.map(function(r){ return r.a; });
      // the invoiced line stops at this month: the months ahead have not happened yet
      var nowYm = new Date().toISOString().slice(0,7);
      var cf=0, ca=0, cfv=fv.map(function(v){ cf+=v; return cf; }), cav=av.map(function(v,i){ ca+=v; return months[i]>nowYm? null : ca; });
      var cumSeries = [{name:'Invoiced',values:cav,color:'#22431a',area:true}];
      if(fTot) cumSeries.unshift({name:'Forecast',values:cfv,color:'#68a53e',dash:true});
      chartJobs.push(function(){ BB.chart.bar('#chVal',{ labels:months.map(monthLabel), money:true, height:230, table:true,
        series:[{name:'Forecast',values:fv,color:'#8fbf5a'},{name:'Invoiced',values:av,color:'#22431a'}],
        // the month: where its forecast comes from, and the invoices that make up the actual
        detail:function(ctx){ var r=rowsV[ctx.index], list=ledgerInv.filter(function(i){ return ym(i.date)===r.m; });
          var x=invoiceTable(list, true);
          var f=Number(r.f)||0;
          return merge(x, { wide:true, stats:[{ l:'Forecast', v:f? money(f) : '—', s:r.typed? 'typed for the month' : r.fromCustomers? 'added up from customers' : 'not set' },
            { l:'Invoiced', v:money(r.a), s:BB.num(list.length)+' invoice'+(list.length===1?'':'s') }, { l:'Difference', v:f? (r.a>=f?'+':'−')+money(Math.abs(r.a-f)) : '—', cls:f&&r.a<f*0.8?'warn':'' }] }); } }); });
      var cumPts = cav.filter(function(v){ return v!=null; }).length;
      if(!fTot && cumPts<3) emptyChart('#chCum','Fills in as the year goes: '+money(aTot)+' invoiced so far.');
      else chartJobs.push(function(){ BB.chart.line('#chCum',{ labels:months.map(monthLabel), money:true, height:230, table:true,
        series:cumSeries,
        // the year up to that month, added up month by month
        detail:function(ctx){ var rf=0, ra=0, cells=[];
          for(var i=0;i<=ctx.index;i++){ rf+=fv[i]; var fut=months[i]>nowYm; if(!fut) ra+=av[i];
            cells.push({ cells:fTot? [monthLabel(months[i]), fv[i]? money(fv[i]) : '—', fut? '—' : (av[i]? money(av[i]) : '—'), money(rf), fut? '—' : money(ra)]
                                   : [monthLabel(months[i]), fut? '—' : (av[i]? money(av[i]) : '—'), fut? '—' : money(ra)] }); }
          // a running total's "share of the chart" means nothing: show where the year stands instead
          var st=[{ l:'Invoiced so far', v:money(ra) }].concat(fTot? [{ l:'Forecast so far', v:money(rf) }, { l:ra>=rf?'Ahead by':'Behind by', v:money(Math.abs(ra-rf)), cls:ra>=rf?'':'warn' }] : []);
          st[0].s='since '+monthLabel(months[0]);
          return { stats:st, table:fTot? { columns:['Month','Forecast','Invoiced','Forecast so far','Invoiced so far'], rows:cells, num:[1,2,3,4] } : { columns:['Month','Invoiced','Invoiced so far'], rows:cells, num:[1,2] }, wide:!!fTot };
        } }); });
    } else { emptyChart('#chVal','No forecast set and nothing invoiced in these months yet.'); emptyChart('#chCum','Fills in as the year goes.'); }

    html += '<div class="card" style="margin-top:16px;"><div class="card-h"><div><h3>Forecast against what was invoiced</h3><div class="sub">actuals straight from your accounting system · type a month\'s forecast to set it</div></div>'+BB.liveChip()+'</div>';
    html += '<div class="scroll"><table class="bb fp-val"><thead><tr><th>Month</th><th class="num">Forecast</th><th class="num">Invoiced</th><th class="num">Difference</th><th>How it is tracking</th></tr></thead><tbody>';
    rowsV.forEach(function(r){
      var f=r.f, a=r.a, pct = f? Math.round(a/f*100) : null;
      html += '<tr><td><b>'+monthLabel(r.m)+'</b></td>'+
        '<td class="num">'+(canEdit? '<input class="qty" style="width:120px;" inputmode="decimal" data-fv="'+r.mk+'" value="'+(r.typed||'')+'" placeholder="'+(r.fromCustomers? Math.round(r.fromCustomers):'set')+'">' : (f? money(f):'<span class="faint">—</span>'))+'</td>'+
        '<td class="num"><b>'+(a? money(a) : '<span class="faint">—</span>')+'</b></td>'+
        '<td class="num">'+(f&&a? '<b style="color:'+(a>=f?'var(--ok)':'var(--red)')+';">'+(a>=f?'+':'')+money(a-f)+'</b>' : '<span class="faint">—</span>')+'</td>'+
        '<td>'+(pct===null? '<span class="faint">no forecast set</span>'
          : '<div class="trk-bar"><i style="width:'+Math.min(pct,100)+'%;background:'+(pct>=100?'var(--ok)':pct>=80?'var(--amber)':'var(--red)')+';"></i></div><div class="mini">'+pct+'% of forecast</div>')+'</td></tr>';
    });
    html += '</tbody><tfoot><tr><td>The year</td><td class="num">'+(fTot?money(fTot):'—')+'</td><td class="num">'+money(aTot)+'</td>'+
      '<td class="num">'+(fTot? '<span style="color:'+(aTot>=fTot?'var(--ok)':'var(--red)')+';">'+(aTot>=fTot?'+':'')+money(aTot-fTot)+'</span>':'—')+'</td><td></td></tr></tfoot></table></div></div>';
    html += '<div class="fp-note faint">Leave a month blank and it adds up the per-customer figures for you. Opening balances carried over from the previous system are left out of the invoiced column; they are not sales.</div>';
  }

  if(pl.updatedAt) html += '<div class="fp-note faint" style="font-size:.76rem;margin-top:14px;">Last change to the plan: '+BB.esc(String(pl.updatedAt).slice(0,16).replace('T',' '))+(pl.updatedBy? ' by '+BB.esc(pl.updatedBy):'')+'.</div>';

  // the invoices behind the two invoiced figures (sales report has them week by week and month by month)
  function invTile(list, sub){ var x=invoiceTable(list, true);
    return merge(x, { wide:true, stats:[{ l:'Invoiced', v:money(list.reduce(function(t,i){ return t+(i.amount||0); },0)) }, { l:'Invoices', v:BB.num(list.length) }],
      actions:[{ label:'Open the full list', href:'sales-report.html?view=monthly', primary:true }] }); }
  BB.statDetail('fpLast12', function(){ var p=prevMonthsAll(); return invTile(ledgerInv.filter(function(i){ return p.indexOf(ym(i.date))>=0; }), 'every customer, '+monthLabel(p[0])+' to '+monthLabel(p[11])); });
  BB.statDetail('fpSoFar', function(){ return invTile(ledgerInv.filter(function(i){ return months.indexOf(ym(i.date))>=0; }), 'this season, '+monthLabel(months[0])+' to '+monthLabel(months[11])); });
  host.innerHTML = html;
  chartJobs.forEach(function(f){ try{ f(); }catch(e){ console.warn('chart', e); } });

  function put(key, field, val){
    var cur = (d.plan().forecasts||{})[key] || {};
    cur[field] = val===''? null : (parseFloat(val)||0);
    var patch = {}; patch[key] = cur;
    // redraw so the difference and the progress bar answer immediately — typing a number and
    // seeing nothing change is what makes people go back to a spreadsheet.
    d.savePlan({ forecasts: patch }).then(function(){ BB.toast('Saved for everyone'); render(); })
      .catch(function(){ render(); });
  }
  var fillBtn = document.getElementById('fillYear');
  if(fillBtn) fillBtn.addEventListener('click', function(){
    var patch={}, n=0;
    products.forEach(function(p2){
      months.forEach(function(m){
        var key=d.fKey(m,p2.id,null);
        if(((d.plan().forecasts||{})[key]||{}).qty) return;          // never overwrite a typed figure
        var ly=(parseInt(m.slice(0,4),10)-1)+m.slice(4);
        var was = p2.months && p2.months[ly] && p2.months[ly].qty;
        if(was){ patch[key]={qty:was, from:'last year'}; n++; }
      });
    });
    if(!n){ BB.toast('Nothing to take — every month already has a figure'); return; }
    fillBtn.disabled=true; fillBtn.textContent='Filling…';
    d.savePlan({forecasts:patch}).then(function(){
      BB.toast(n+' months filled from last year — change anything that should be different');
      render();
    }).catch(function(){ render(); });
  });

  host.querySelectorAll('input[data-f]').forEach(function(el){
    el.addEventListener('change', function(){ put(el.getAttribute('data-f'), 'qty', el.value); });
  });
  host.querySelectorAll('input[data-fv]').forEach(function(el){
    el.addEventListener('change', function(){ put(el.getAttribute('data-fv'), 'value', el.value); });
  });
}

render();
window.addEventListener('bb:sage', function(){ render(); });
window.addEventListener('bb:plan', function(){ render(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
